<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Allemand Unit 2 · à savoir pour le mardi 20 octobre</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap">
<style>
/* Salle de gym : sol vert, lignes de terrain, maillot n° 2, tableau d'affichage pour le score. */
:root{
  --floor:#CFE0DA; --sheet:#FFFFFF; --ink:#14233A; --soft:#53657A; --rule:#B6CCC5;
  --court:#1D6E62; --court-wash:#E2EFEB; --jersey:#2348A8; --score:#F2C230; --board:#14233A;
  --good:#1D6E62; --good-wash:#DDF0E6; --bad:#B8382A; --bad-wash:#F9E2DE; --on-court:#FFFFFF;
  --lines:rgba(255,255,255,.55);
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --floor:#0F1A18; --sheet:#18252B; --ink:#E6EEF0; --soft:#9DB0B8; --rule:#2B3C42;
  --court:#4FC3AE; --court-wash:#173430; --jersey:#7F9CFF; --score:#F2C230; --board:#0A1220;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-court:#0B1A17;
  --lines:rgba(255,255,255,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --floor:#0F1A18; --sheet:#18252B; --ink:#E6EEF0; --soft:#9DB0B8; --rule:#2B3C42;
  --court:#4FC3AE; --court-wash:#173430; --jersey:#7F9CFF; --score:#F2C230; --board:#0A1220;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-court:#0B1A17;
  --lines:rgba(255,255,255,.07); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 50% 230px,transparent 118px,var(--lines) 119px,var(--lines) 122px,transparent 123px),
  linear-gradient(90deg,transparent calc(50% - 1.5px),var(--lines) calc(50% - 1.5px),var(--lines) calc(50% + 1.5px),transparent calc(50% + 1.5px));
  background-attachment:fixed}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--score);outline-offset:2px}

.head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.jersey{width:62px;height:64px;flex:none;background:var(--jersey);display:flex;align-items:center;justify-content:center;padding-top:10px;
  clip-path:polygon(22% 0,38% 0,50% 12%,62% 0,78% 0,100% 18%,88% 36%,80% 30%,80% 100%,20% 100%,20% 30%,12% 36%,0 18%)}
.jersey b{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;color:var(--score)}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:.95;margin:0}
.head p{margin:4px 0 0;color:var(--soft);font-size:14px}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:600;font-size:20px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 8px 8px 0;margin:0}
.note{background:var(--court-wash);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--court);font-weight:700;padding:0;cursor:pointer}

.cta{width:100%;padding:15px;border:0;border-radius:6px;background:var(--court);color:var(--on-court);font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.3px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.entry.open{border-left:5px solid var(--court)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-icon{font-size:19px;width:24px;text-align:center}
.entry-title{flex:1;font-family:var(--display);font-weight:600;font-size:18px}
.entry-count{font-size:12.5px;color:var(--soft)}
.entry-body{padding:0 14px 14px}
.pair{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-de{font-weight:700;color:var(--court)}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:var(--court-wash);font-size:14px}
.astuce b{display:block;color:var(--court);margin-bottom:2px}
.src-date{font-weight:400;color:var(--soft);font-size:13px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1px dashed var(--rule);border-radius:6px;color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}
.tip{margin:0;padding:8px 0 8px 12px;border-left:3px solid var(--score);font-size:15px}

/* paquets */
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.deck.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);background:var(--court-wash)}
.deck-e{font-size:20px}
.deck-t{font-weight:700;font-size:14.5px;line-height:1.25}
.deck-n{font-size:12.5px;color:var(--soft)}
.deck-tick{position:absolute;top:9px;right:10px;color:var(--court);font-weight:800}

/* cartes */
.flash{position:relative;height:230px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--jersey);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;transition:transform .45s}
.face.b{transform:rotateY(180deg);background:var(--court-wash);border-color:var(--court);border-top-color:var(--court)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:12px;font-weight:700;color:var(--soft)}
.face-word{font-family:var(--display);font-weight:600;font-size:28px;text-align:center;line-height:1.15}
.face-mini{font-size:13.5px;color:var(--court);font-weight:700}
.face-hint{position:absolute;bottom:12px;font-size:12px;color:var(--soft)}

/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);background:var(--court-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.paper{background:var(--sheet);border:1px dashed var(--court);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:10px;border-radius:2px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--court);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:15px;background:var(--board);color:var(--score);padding:2px 9px;border-radius:3px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--court-wash);color:var(--court)}
.chip.allemand{background:var(--bad-wash);color:var(--bad)}
.chip.article{background:#FBEBC0;color:#7A5806}
.chip.pluriel{background:#EFE0F2;color:#6E3A7C}
.ref{font-size:12px;color:var(--soft)}
.consigne{margin:0;font-size:14.5px;color:var(--soft)}
.qword{font-family:var(--display);font-weight:600;font-size:clamp(25px,7vw,31px);line-height:1.15;margin:0;overflow-wrap:anywhere}
.qhint{margin:0;font-size:14px;color:var(--soft)}
.choice{padding:14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:16px;font-weight:700;cursor:pointer}
.choice.sel{border-color:var(--court);box-shadow:inset 0 0 0 2px var(--court)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);font:inherit;font-size:18px;font-weight:700;color:var(--ink)}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.fb{padding:14px;border-radius:6px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}

/* résultats : tableau d'affichage */
.scorebox{background:var(--board);border:4px solid #2B3B55;border-radius:8px;padding:18px;text-align:center}
.scorebox.rattr-box{border-color:var(--bad)}
.score-n{font-family:var(--display);font-weight:800;font-size:58px;line-height:1;color:var(--score);font-variant-numeric:tabular-nums}
.score-n small{font-size:30px;color:#B9A256}
.score-note{display:inline-block;margin-top:8px;background:var(--score);color:#14233A;font-weight:800;padding:4px 14px;border-radius:3px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#FF8A78}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}

/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:20px;margin:0}
.bilan-lab{font-size:13px;font-weight:700;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan ul.forts li{color:var(--good)}
.bilan ul.work li{color:var(--bad)}
.bilan-tip{background:var(--court-wash);border-radius:6px;padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px;background:var(--floor);color:var(--ink);font:13px/1.45 var(--body)}

/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--board);border-radius:6px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--score);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#C9D3E0}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.rattr-tag{display:inline-block;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;margin-right:6px}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--on-court)}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:3px solid var(--court);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--soft)}
.tab-e{font-size:18px} .tab-l{font-size:11px;font-weight:700}
.tab.on{color:var(--court);background:var(--court-wash)}

@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}
</style>

</head>

<script>
/* ============================================================
   ALLEMAND — Unit 2 « Fit und sportlich! » : Ich kann über Sport sprechen
   Outil de révision de Livio — 10e HarmoS
   Contenu : livre p. 11 et 12 (tous les blocs). Test : mardi 20 octobre 2026.
   ============================================================ */

const QUIZ_ID = "livio-quiz-allemand-unit2-sport";
const DUE = { iso:"2026-10-20", long:"mardi 20 octobre", short:"20.10" };
/* Dans Claude, window.claude existe ; sur un site web normal (GitHub Pages), non. */
const HAS_CLAUDE = !!(window.claude && window.claude.use);
const INDEX_KEY = QUIZ_ID + "-index";
const ATTEMPT_PREFIX = QUIZ_ID + "-attempt-";
const THEME = "Unit 2 — Fit und sportlich!";
const VERSION = { n:2, date:"16.10.2026" };   /* v1 : 16.10.2026, première publication · v2 : sources visibles, photos dans Claude */

/* ---------- SOURCES : d'où vient le contenu ----------
   Photo 1 — livre p. 11 « Fit und sportlich! / Sportarten » (reçue le 15.10.2026) : paquets schon, sportarten, einrad + 4 phrases.
   Photo 2 — livre p. 12 « Wo machst du Sport? / Was brauchst du? » (reçue le 15.10.2026) : paquets wo, brauchen + 5 phrases.
   Tous les blocs des deux pages sont repris (demande du parent : « tout »). Rien d'écarté, rien d'illisible.
   Les pluriels sont ceux de la notation du livre (¨-e, -n, -s, -). */
const SOURCES = [
  { titre:"Photo 1 — livre p. 11", recue:"15.10.2026", contenu:"Sportarten : bloc gris « Das kennst du schon », Tischtennis, trainieren, Mein Lieblingssport ist …, bloc segeln / boxen / Judo / Bowling, bloc Einrad / Ballett / ausprobieren / Turnier et leurs phrases d'exemple." },
  { titre:"Photo 2 — livre p. 12", recue:"15.10.2026", contenu:"Wo machst du Sport? (Sportplatz, draussen ≠ drinnen, Halle, Verein, Skipiste, Sand) et Was brauchst du? (Ball, Turnschuhe, T-Shirt, Zum … braucht man, Schläger, Netz, Fussballschuhe, Trikot, Helm, Stoppuhr, Kleidung), avec leurs phrases d'exemple." },
];
const SOURCES_NOTE = "Tous les blocs des deux pages sont repris. Rien n'a été ajouté : les pluriels viennent de la notation du livre (¨-e, -n, -s, -). La correction de chaque question indique la page et le bloc d'où elle vient.";
/* Photos : seulement dans la version Claude (privée), jamais sur le site public. url = adresse dans l'espace privé de l'outil. */
const PHOTOS = [
  { titre:"Livre p. 11", url:null },
  { titre:"Livre p. 12", url:"/_blob/40a59b9c724593dac4a1d73368e3066e" },
];

/* ---------- CONTENU : paquets (texte exact du livre, p. 11-12) ----------
   de, alt (autres écritures acceptées), fr (1re = affichée), art, pl, note (Pl./Sg.),
   pp (participe avec auxiliaire), pres, obj + verb (sport + verbe), gap (mot à compléter) */
const DECKS = [
  { key:"schon", title:"Das kennst du schon", emoji:"🛹", src:"p. 11, bloc gris « Das kennst du schon »", items:[
    { de:"Snowboard fahren", obj:"Snowboard", verb:"fahren", fr:["faire du snowboard"] },
    { de:"Ski fahren", obj:"Ski", verb:"fahren", fr:["faire du ski"] },
    { de:"Fahrrad fahren", alt:["Velo fahren","Fahrrad / Velo fahren","Fahrrad/Velo fahren"], obj:"Fahrrad / Velo", verb:"fahren", fr:["faire du vélo"] },
    { de:"Schlitten fahren", obj:"Schlitten", verb:"fahren", fr:["faire de la luge"] },
    { de:"Skateboard fahren", obj:"Skateboard", verb:"fahren", fr:["faire du skateboard"] },
    { de:"Basketball spielen", obj:"Basketball", verb:"spielen", fr:["jouer au basket"] },
    { de:"Volleyball spielen", obj:"Volleyball", verb:"spielen", fr:["jouer au volley"] },
    { de:"Fussball spielen", obj:"Fussball", verb:"spielen", fr:["jouer au foot"] },
    { de:"Tennis spielen", obj:"Tennis", verb:"spielen", fr:["jouer au tennis"] },
    { de:"Hockey spielen", obj:"Hockey", verb:"spielen", fr:["jouer au hockey"] },
    { de:"joggen", pres:"er joggt", pp:"ist gejoggt", fr:["faire du jogging"] },
    { de:"laufen", pres:"er läuft", pp:"ist gelaufen", fr:["courir"] },
    { de:"klettern", pres:"er klettert", pp:"ist geklettert", fr:["faire de l'escalade"] },
  ]},
  { key:"sportarten", title:"Nouvelles disciplines", emoji:"🥊", src:"p. 11, Tischtennis … Lieblingssport + bloc segeln / boxen / Judo / Bowling", items:[
    { de:"Tischtennis (spielen)", alt:["Tischtennis","Tischtennis spielen"], obj:"Tischtennis", verb:"spielen", fr:["(jouer au) ping-pong","ping-pong","jouer au ping-pong"] },
    { de:"trainieren", pres:"er trainiert", pp:"hat trainiert", fr:["s'entraîner","s'entrainer"] },
    { de:"Mein Lieblingssport ist …", fr:["Mon sport préféré est…"] },
    { de:"segeln", pres:"er segelt", pp:"ist gesegelt", fr:["faire de la voile"] },
    { de:"boxen", fr:["boxer"] },
    { de:"Judo (machen)", alt:["Judo","Judo machen"], obj:"Judo", verb:"machen", fr:["(faire du) judo","judo","faire du judo"] },
    { de:"Bowling (spielen)", alt:["Bowling","Bowling spielen"], obj:"Bowling", verb:"spielen", fr:["(jouer au) bowling","bowling","jouer au bowling"] },
  ]},
  { key:"einrad", title:"Einrad, Ballett & Co", emoji:"🏆", src:"p. 11, dernier bloc (Einrad, Ballett, ausprobieren, Turnier)", items:[
    { de:"das Einrad", art:"das", pl:"die Einräder", fr:["le monocycle"] },
    { de:"das Ballett", art:"das", pl:"die Ballette", fr:["le ballet","la danse"] },
    { de:"ausprobieren", pres:"er probiert … aus", pp:"hat ausprobiert", fr:["tester","essayer"] },
    { de:"das Turnier", art:"das", pl:"die Turniere", fr:["le tournoi"] },
  ]},
  { key:"wo", title:"Wo machst du Sport?", emoji:"🏟️", src:"p. 12, « Wo machst du Sport? »", items:[
    { de:"der Sportplatz", art:"der", pl:"die Sportplätze", fr:["le terrain de sport"] },
    { de:"draussen", fr:["dehors"] },
    { de:"drinnen", fr:["dedans"] },

/* ---------- utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s, apoMode){
  return String(s || "").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/…|\.\.\./g," ").replace(/[’'`]/g, apoMode === "del" ? "" : " ")
    .replace(/[.!?;,:«»"()\/\-+]/g," ").replace(/\s+/g," ").trim();
}
const stripFr = s => s.replace(/^(le |la |les |l |un |une |des |du |de la |d )/,"").trim();
const stripArt = s => s.replace(/^(der|die|das)\s+/,"");
function matchAnswer(input, accept, lang, keep){
  return ["sp","del"].some(m => {
    const a = norm(input, m); if (!a) return false;
    return accept.some(raw => { const b = norm(raw, m); if (a === b) return true; if (keep || lang !== "fr") return false; return stripFr(a) === stripFr(b); });
  });
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pickOptions(good, pool, wide, valueFn){
  const out = [], seen = new Set([good]);
  const take = list => shuffle(list).forEach(x => { if (out.length >= 3) return; const v = valueFn(x); if (v && !seen.has(v)){ seen.add(v); out.push(v); } });
  take(pool); if (out.length < 3) take(wide);
  return shuffle([good, ...out]);
}
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");
function dateLabel(ts){ const d = new Date(ts), p = x => String(x).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} · ${p(d.getHours())}h${p(d.getMinutes())}`; }
function explain(it, deck){
  let t = it.de;
  if (it.note) t += " (" + it.note + ")";
  if (it.pl) t += " (pluriel : " + it.pl + ")";
  if (it.pres) t += ", " + it.pres;
  if (it.pp) t += ", " + it.pp;
  return t + " = " + it.fr[0] + " — livre " + (it.src || deck.src) + ".";
}

/* ---------- choix du type de question pour un item ---------- */
function chooseKind(it, difficulty){
  const r = Math.random();
  if (it.gap){
    if (difficulty === "hard") return "type_gap";
    if (difficulty === "normal" && r < 0.6) return "mcq_gap";
    return "mcq_sens";
  }
  if (difficulty === "easy"){
    if (it.verb && r < 0.35) return "mcq_verb";
    if (it.pp && r < 0.35) return "mcq_aux";
    if (it.art && r < 0.3) return "mcq_art";
    return "mcq_sens";
  }
  if (difficulty === "hard"){
    if (it.pp && r < 0.5) return "type_pp";
    if (it.pl && r < 0.25) return "type_pl";
    if (it.art) return "type_art";
    return "type_de";
  }
  if (it.art && r < 0.25) return "mcq_art";
  if (it.pp && r < 0.25) return "mcq_aux";
  if (it.pp && r < 0.5) return "mcq_pp";
  if (it.verb && r < 0.35) return "mcq_verb";
  if (r < 0.75) return "type_sens";
  return "mcq_de";
}

/* ---------- fabrication du test (un exercice par paquet et par consigne, numérotation unique) ---------- */
function buildTest(deckKeys, difficulty){
  const all = DECKS.filter(d => deckKeys.includes(d.key)).flatMap(d => d.items);
  const wide = all.length >= 8 ? all : DECKS.flatMap(d => d.items);
  const allPp = DECKS.flatMap(d => d.items).filter(x => x.pp);
  const allGap = DECKS.flatMap(d => d.items).filter(x => x.gap);
  const qs = []; let num = 0, ex = 0;
  DECKS.filter(d => deckKeys.includes(d.key)).forEach(d => {
    const groups = {}; KIND_ORDER.forEach(k => groups[k] = []);
    shuffle(d.items).forEach(it => groups[chooseKind(it, difficulty)].push(it));
    KIND_ORDER.forEach(kind => {
      if (!groups[kind].length) return;
      ex++; const K = KINDS[kind];
      groups[kind].forEach(it => {
        num++;
        const q = { id:"q"+num, num, ex, exTitle:d.title, deckKey:d.key, kind, type:K.type, tag:K.tag, lang:K.lang, consigne:K.consigne, keep:true, expl:explain(it, d), hint:"" };
        const ppRest = it.pp ? it.pp.split(" ").slice(1).join(" ") : "";
        switch(kind){
          case "mcq_sens": q.word = it.de; q.options = pickOptions(it.fr[0], d.items, wide, x => x.fr[0]); q.answer = it.fr[0]; break;
          case "type_sens": q.word = it.de; q.accept = it.fr; q.answer = it.fr[0]; q.keep = false; break;
          case "mcq_art": q.word = stripArt(it.de); q.hint = it.fr[0] + (it.note === "Pl." ? " (pluriel)" : ""); q.options = ["der","die","das"]; q.answer = it.art; break;
          case "mcq_verb": q.word = it.obj + " ___"; q.hint = it.fr[0]; q.options = ["fahren","spielen","machen"]; q.answer = it.verb; break;
          case "mcq_aux": q.word = "___ " + ppRest + " (" + it.de + ")"; q.hint = it.fr[0]; q.options = ["hat","ist"]; q.answer = it.pp.split(" ")[0]; break;
          case "mcq_pp": q.word = it.de; q.hint = it.fr[0]; q.options = pickOptions(it.pp, allPp, allPp, x => x.pp); q.answer = it.pp; break;
          case "type_pp": q.word = it.de; q.hint = it.fr[0]; q.accept = [it.pp]; q.answer = it.pp; break;
          case "type_pl": q.word = it.de; q.hint = it.fr[0]; q.accept = [it.pl]; q.answer = it.pl; break;
          case "mcq_de": q.word = it.fr[0]; q.options = pickOptions(it.de, d.items, wide, x => x.de); q.answer = it.de; break;
          case "type_art": q.word = it.fr[0]; q.accept = [it.de, ...(it.alt || [])]; q.answer = it.de; break;
          case "type_de": q.word = it.fr[0]; q.accept = [it.de, ...(it.alt || [])]; q.answer = it.de; break;
          case "mcq_gap": q.word = it.de.replace(it.gap, "___"); q.hint = it.fr[0]; q.options = pickOptions(it.gap, allGap, allGap, x => x.gap); q.answer = it.gap; break;
          case "type_gap": q.word = it.de.replace(it.gap, "___"); q.hint = it.fr[0]; q.accept = [it.gap]; q.answer = it.gap; break;
        }
        q.prompt = `${K.consigne} « ${q.word} »`;
        qs.push(q);
      });
    });
  });
  return qs;
}

/* ---------- stockage : db privée de l'utilisateur, sinon navigateur, sinon mémoire ---------- */
const store = {
  mode:"memory", col:null, mem:{},
  async init(){
    try {
      if (window.claude && window.claude.use){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user){ const uid = await user.id(); if (uid){ this.col = db.collection("data/users/" + uid); this.mode = "db"; return; } }
      }
    } catch(e){}
    try { localStorage.setItem(QUIZ_ID + "-probe","1"); localStorage.removeItem(QUIZ_ID + "-probe"); this.mode = "local"; } catch(e){ this.mode = "memory"; }
  },
  async list(){
    if (this.mode === "db"){
      const snap = await this.col.limit(1000).get();
      return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean);
    }
    if (this.mode === "local"){
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]");
      return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean);
    }
    return Object.values(this.mem);
  },
  async save(att){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + att.id).set(att); return; }
    if (this.mode === "local"){
      localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att));
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id);
      localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return;
    }
    this.mem[att.id] = att;
  },
  async remove(id){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + id).delete(); return; }
    if (this.mode === "local"){ localStorage.removeItem(ATTEMPT_PREFIX + id); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]").filter(x => x !== id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }
    delete this.mem[id];
  },
};

    if (HAS_CLAUDE){
      h += `<div class="photos">` + PHOTOS.map(ph => ph.url
        ? `<figure><a href="${esc(ph.url)}" target="_blank" rel="noopener"><img src="${esc(ph.url)}" alt="${esc(ph.titre)}" loading="lazy"></a><figcaption>${esc(ph.titre)}</figcaption></figure>`

}

function viewHome(){

/* ---------- quiz ---------- */
function startQuiz(questions, rattrapage){
  S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, label: rattrapage ? S.rattrLabel : deckLabel(S.selected) };
  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.results.all = false; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function viewQuiz(){
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode === "train";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>
  <div class="badges"><span class="num">N° ${q.num}</span><span class="chip ${q.tag}">${TAG_LABEL[q.tag]}</span><span class="ref">Exercice ${q.ex} · ${esc(q.exTitle)}</span></div>
  <p class="consigne">${esc(q.consigne)}</p><p class="qword">${esc(q.word)}</p>${q.hint ? `<p class="qhint">petit indice : ${esc(q.hint)}</p>` : ""}`;
  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice";
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="${q.lang === "de" ? "Deine Antwort…" : "Ta réponse…"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){
    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? ["Juste !","Bien vu.","Nickel.","Exact.","Tu l'as."][Q.i % 5] : "Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b>${esc(q.answer)}</b></p>`}<p class="fb-x">${esc(q.expl)}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q.accept, q.lang, q.keep); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], correct = isRight(q, val);
  if (S.mode === "train"){ Q.ok = correct; Q.checked = true; render(); }
  else record(val, correct);
}
function record(val, correct){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.exTitle, prompt:q.prompt, user:val || "", answer:q.answer, correct, expl:q.expl, tag:q.tag, question:q });
  if (Q.i + 1 >= Q.questions.length){
    Q.done = true; Q.finishing = true; render();   /* verrou de fin : une seule fois */
    finishQuiz();
  } else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; render(); }
}
async function finishQuiz(){
  const Q = S.quiz, score = Q.detail.filter(x => x.correct).length, total = Q.detail.length, id = String(Date.now());
  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:"Allemand", theme:THEME, deck:Q.label,
    difficulty:DIFFICULTIES[S.difficulty].label, mode:MODES[S.mode].label, rattrapage:S.rattrapage, score, total, note:noteFrom(score/total), questions:Q.detail };
  S.attempts = [att, ...S.attempts.filter(a => a.id !== id)];
  try { await store.save(att); S.storeMsg = store.mode === "memory" ? "Ce résultat est affiché ici, mais il ne sera pas gardé si tu fermes la page. Pense à noter ta note ou à l'exporter." : ""; }
  catch(e){ S.storeMsg = "Je n'ai pas pu enregistrer ce résultat : il disparaîtra si tu fermes la page. Note ta note ou copie-la pour le chat."; }
  S.lastResult = att; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; S.screen = "results"; render(); window.scrollTo(0,0);
}

/* ---------- bilan ---------- */
function bilanState(id){ return S.bilan[id] || (S.bilan[id] = { busy:false, err:"", copied:false, fallback:"" }); }
function bilanBlock(att){
  const b = bilanState(att.id), a = att.analysis;
  const wrong = att.questions.filter(x => !x.correct), canRetry = wrong.some(x => x.question);
  let h = `<div class="bilan">`;
  if (!a && !b.busy && HAS_CLAUDE) h += `<p class="fine">Tu veux savoir ce qui coince vraiment ? Je regarde tes réponses et je te dis quoi travailler.</p><button class="cta" data-act="analyse" data-v="${att.id}">Analyser mes résultats</button>`;
  if (!a && !HAS_CLAUDE) h += `<p class="fine">Pour savoir ce qui coince vraiment, copie tes résultats et colle-les dans le chat de révisions : on les analyse ensemble.</p>`;
  if (b.busy) h += `<p class="fine">Je regarde tes réponses une par une…</p>`;
  if (b.err) h += `<p class="warn">${esc(b.err)}</p>`;
  if (a){
    h += `<h3>Ton bilan</h3>`;
    if (a.points_forts.length) h += `<p class="bilan-lab">Ce qui est acquis</p><ul class="forts">${a.points_forts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (a.a_travailler.length) h += `<p class="bilan-lab">À travailler</p><ul class="work">${a.a_travailler.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (a.conseil) h += `<p class="bilan-tip">${esc(a.conseil)}</p>`;
  }
  h += `<div class="${canRetry?"row":""}">${canRetry ? `<button class="cta" data-act="retryWrong" data-v="${att.id}">Refaire mes erreurs (${wrong.length})</button>` : ""}<button class="ghost" data-act="copy" data-v="${att.id}">${b.copied ? "Copié — colle-le dans le chat" : "Copier pour le chat"}</button></div>`;
  if (b.fallback) h += `<p class="fine">La copie automatique est bloquée ici. Le texte est sélectionné : copie-le à la main.</p><textarea class="exportarea" readonly rows="8" id="fb-${att.id}">${esc(b.fallback)}</textarea>`;
  return h + `</div>`;
}
function findAttempt(id){ return (S.lastResult && S.lastResult.id === id) ? S.lastResult : S.attempts.find(a => a.id === id); }
async function analyse(id){
  const att = findAttempt(id), b = bilanState(id); b.busy = true; b.err = ""; render();
  try {
    const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
    if (!sample) throw new Error("no sample");
    const lignes = att.questions.map(q => `N° ${q.num}. [${q.tag}] (${q.ref}) ${q.prompt} | réponse de l'élève : ${q.user || "(rien)"} | attendu : ${q.answer} | ${q.correct ? "JUSTE" : "FAUX"}`).join("\n");
    const prompt = `Tu es un professeur d'allemand suisse, bienveillant, qui analyse le test d'un élève de 13 ans (10e HarmoS, canton de Neuchâtel). Il révise l'Unit 2 « Fit und sportlich! » (vocabulaire du sport : disciplines, lieux, matériel, pages 11 et 12) pour un test le ${DUE.long}.

Score : ${att.score}/${att.total} (note suisse ${fmtNote(att.note)}/6)${att.rattrapage ? " — RATTRAPAGE : seules les questions ratées d'un test précédent ont été rejouées" : ""}
Paquets : ${att.deck}
Niveau : ${att.difficulty} — Mode : ${att.mode}

Détail (l'étiquette entre crochets donne le type : sens = traduire vers le français, allemand = produire l'allemand, article = der/die/das, pluriel = forme du pluriel, verbe = participe passé, hat/ist ou fahren/spielen/machen avec un sport, phrase = compléter une phrase du livre ; entre parenthèses, le paquet) :
${lignes}

Analyse les ERREURS pour trouver ce qui coince vraiment : le genre des noms, le choix hat/ist, le choix fahren/spielen/machen, un paquet, l'orthographe, une confusion entre deux mots proches ? Cherche le point commun, ne recopie pas la liste. S'il n'y a pas de motif clair, dis-le honnêtement.

Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, exactement dans ce format :
{"points_forts":["..."],"a_travailler":["..."],"conseil":"..."}
- "points_forts" : 1 à 3 points courts et concrets.
- "a_travailler" : 1 à 3 axes de progrès formulés positivement, avec l'exemple précis tiré du test.
- "conseil" : 2 phrases maximum, une action à faire ce soir.
Tu tutoies l'élève. Français de Suisse romande, ton encourageant, pas enfantin.`;
    const parsed = await sample.json(prompt, { modelTier:"default" });
    att.analysis = { points_forts: Array.isArray(parsed.points_forts) ? parsed.points_forts : [], a_travailler: Array.isArray(parsed.a_travailler) ? parsed.a_travailler : [], conseil: parsed.conseil || "" };
    try { await store.save(att); } catch(e){}
  } catch(e){
    b.err = "Le bilan n'a pas pu être calculé ici. Le bouton de copie fonctionne quand même : colle tes résultats dans le chat et je les analyse là.";
  }
  b.busy = false; render();
}
function copyText(att){
  const a = att.analysis, l = [];
  l.push("RÉSULTAT — Allemand, Unit 2 « Fit und sportlich! » (test du " + DUE.short + ")");
  l.push(`${dateLabel(att.date)} · ${att.deck} · ${att.difficulty} · ${att.mode}${att.rattrapage ? " · RATTRAPAGE (questions ratées rejouées)" : ""}`);
  l.push(`Score : ${att.score}/${att.total} — note ${fmtNote(att.note)}/6`, "");
  if (a){ l.push("BILAN"); if (a.points_forts.length) l.push("Acquis : " + a.points_forts.join(" · ")); if (a.a_travailler.length) l.push("À travailler : " + a.a_travailler.join(" · ")); if (a.conseil) l.push("Conseil : " + a.conseil); l.push(""); }
  const wrong = att.questions.filter(q => !q.correct);
  l.push(`ERREURS (${wrong.length}/${att.total})`);
  if (!wrong.length) l.push("Aucune erreur.");
  wrong.forEach(q => l.push(`- N° ${q.num} [${q.tag}] ${q.prompt} → j'ai répondu « ${q.user || "rien"} », attendu : ${q.answer}`));
  return l.join("\n");
}
function copyFor(id){
  const att = findAttempt(id), b = bilanState(id), text = copyText(att);
  const fail = () => { b.fallback = text; render(); setTimeout(() => { const t = document.getElementById("fb-" + id); if (t){ t.focus(); t.select(); } }, 30); };
  try {
    navigator.clipboard.writeText(text).then(() => { b.copied = true; render(); setTimeout(() => { b.copied = false; render(); }, 2500); }, fail);
  } catch(e){ fail(); }
}
function retryWrong(id){
  const att = findAttempt(id);
  const qs = att.questions.filter(x => !x.correct && x.question).map(x => x.question);
  if (!qs.length) return;
  S.rattrLabel = att.deck;
  startQuiz(shuffle(qs), true);
}

function revCard(q, showGoodAlways){
  return `<div class="revcard${q.correct?" ok":""}"><p class="rev-q">N° ${q.num} · ${esc(q.prompt)}</p><p>Ta réponse : ${q.user ? esc(q.user) : "—"}</p>${(!q.correct || showGoodAlways) ? `<p class="${q.correct?"rev-good":""}">Réponse : <b>${esc(q.answer)}</b></p>` : ""}<p class="rev-x">${esc(q.expl)}</p></div>`;
}
function viewResults(){
  const att = S.lastResult, pct = Math.round(att.score/att.total*100), wrong = att.questions.filter(q => !q.correct);
  const msg = pct === 100 ? "Sans faute. Tu es prêt pour mardi." : pct >= 80 ? "Solide. Repasse juste sur les quelques ratés." : pct >= 60 ? "La base est là. Refais tes erreurs, tu vas vite grimper." : pct >= 40 ? "Bon début. Relis la fiche, puis refais un tour en Échauffement." : "C'est le moment de relire la fiche tranquillement, mot par mot. Ça viendra.";
  const shown = S.results.all ? att.questions : wrong;

  <p class="intro">${msg}</p>${S.storeMsg ? `<p class="warn">${esc(S.storeMsg)}</p>` : ""}
  ${bilanBlock(att)}
  <p class="lab">${wrong.length ? `À revoir (${wrong.length})` : "Aucune erreur"}</p>
  <div class="rev">${shown.map(q => revCard(q, false)).join("")}</div>
  <button class="ghost" data-act="toggleAll">${S.results.all ? "Ne montrer que mes erreurs" : "Montrer toutes les questions"}</button>
  <div class="row"><button class="ghost" data-act="start">Refaire le test</button><button class="ghost" data-act="nav" data-v="home">Paquets</button></div>`;
}

function viewScores(){
  if (!S.loaded) return `<p class="lab">Mes scores</p><p class="fine">Je récupère tes résultats…</p>`;
  const list = S.attempts;
  if (!list.length) return `<p class="lab">Mes scores</p>${S.loadErr ? `<p class="warn">${esc(S.loadErr)}</p>` : ""}<p class="intro">Rien pour l'instant. Fais un premier test : la date, la note et le détail de chaque question s'enregistreront ici.</p><button class="cta" data-act="nav" data-v="setup">Faire un test</button>`;
  const best = Math.max(...list.map(a => a.note)), avg = list.reduce((s,a) => s + a.note, 0)/list.length;
  const exportText = list.map(a => `${dateLabel(a.date)} — ${a.deck} (${a.difficulty}, ${a.mode}${a.rattrapage ? ", rattrapage" : ""}) : ${a.score}/${a.total} → note ${fmtNote(a.note)}`).join("\n");
  let h = `<p class="lab">Mes scores</p>${S.loadErr ? `<p class="warn">${esc(S.loadErr)}</p>` : ""}
  ${store.mode === "local" ? `<p class="note">Tes scores sont gardés dans ce navigateur uniquement. Exporte-les de temps en temps.</p>` : ""}
  <div class="stats"><div class="stat"><b>${list.length}</b><span>tests</span></div><div class="stat"><b>${fmtNote(best)}</b><span>meilleure</span></div><div class="stat"><b>${fmtNote(avg)}</b><span>moyenne</span></div></div>
  <div class="rev">`;
  list.forEach(a => {
    const open = S.scores.open === a.id;
    h += `<div class="attempt"><button class="attempt-head" data-act="openAttempt" data-v="${a.id}" aria-expanded="${open}"><span class="attempt-left"><b>${a.rattrapage ? `<span class="rattr-tag">Rattrapage</span>` : ""}${esc(a.deck)}</b><span>${esc(a.difficulty)} · ${esc(a.mode)} · ${dateLabel(a.date)} · ${a.score}/${a.total}</span></span><span class="attempt-note ${a.note >= 4 ? "good" : "low"}">${fmtNote(a.note)}</span></button>`;
    if (open) h += `<div class="attempt-body">${bilanBlock(a)}${a.questions.map(q => revCard(q, true)).join("")}</div>`;
    h += `</div>`;
  });
  h += `</div><button class="ghost" data-act="exportToggle">${S.scores.exportOpen ? "Cacher la sauvegarde" : "💾 Exporter mes scores"}</button>`;
  if (S.scores.exportOpen) h += `<p class="fine">Touche le texte, copie-le et colle-le dans une note ou envoie-le à tes parents.</p><textarea class="exportarea" readonly rows="${Math.min(list.length+1, 8)}" id="export-area">${esc(exportText)}</textarea>`;
  h += S.scores.confirm
    ? `<div class="confirm"><span>Tout effacer, sans retour possible ?</span><button class="mini yes" data-act="clearYes">Effacer</button><button class="mini" data-act="clearNo">Annuler</button></div>`
    : `<button class="ghost danger" data-act="clearAsk">🗑️ Effacer tout l'historique</button>`;
  return h;
}

/* ---------- version papier ---------- */
function paperHtml(qs, part){
  const exercises = []; qs.forEach(q => { let e = exercises[exercises.length-1]; if (!e || e.ex !== q.ex){ e = { ex:q.ex, title:q.exTitle, consigne:q.consigne, qs:[] }; exercises.push(e); } e.qs.push(q); });
  const meta = `${deckLabel(S.selected)} · ${DIFFICULTIES[S.difficulty].label} · ${qs.length} questions`;
  const line = q => `<b>${q.num}.</b> ${esc(q.word)}${q.hint ? ` <span class="hint">(${esc(q.hint)})</span>` : ""}`;
  const sheet = exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2><p class="cons">${esc(e.consigne)}</p>${e.qs.map(q => q.type === "mcq"
    ? `<div class="q">${line(q)}<div class="opts">${q.options.map(o => `<span>☐ ${esc(o)}</span>`).join("")}</div></div>`
    : `<div class="q">${line(q)}<div class="line"></div></div>`).join("")}</section>`).join("");
  const key = `<h1>Corrigé</h1><p class="meta">${esc(meta)}</p>` + exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2>${e.qs.map(q => `<div class="k"><b>${q.num}.</b> ${esc(q.word)} → <b>${esc(q.answer)}</b></div>`).join("")}</section>`).join("");
  const head = `<h1>Allemand — Unit 2 « Fit und sportlich! »</h1><p class="meta">Prénom : Livio · test du ${DUE.long} · ${esc(meta)}</p><p class="meta">Date : ____________ &nbsp; Note : ______ / 6</p>`;
  const body = part === "ex" ? head + sheet : part === "key" ? key : head + sheet + `<div class="pb"></div>` + key;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allemand Unit 2 — ${DUE.short}</title><style>
@page{size:A4 portrait;margin:12mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;max-width:186mm;padding:10px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 2px;border-bottom:1px solid #999}.meta{margin:2px 0;font-size:13px}.cons{font-style:italic;margin:2px 0 6px;font-size:13px}
.ex{break-inside:avoid}.q{margin:8px 0;font-size:14px;break-inside:avoid}.hint{color:#555;font-size:12px}.opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 0 18px}.line{border-bottom:1px solid #444;height:22px;margin:0 0 0 18px}
.k{font-size:13.5px;margin:3px 0}.pb{break-before:page}.print{position:fixed;top:10px;right:10px;padding:8px 14px;font-size:14px}@media print{.print{display:none}}
</style></head><body><button class="print" onclick="window.print()">Imprimer</button>${body}</body></html>`;
}
async function savePaper(part){
  const qs = S.frozen; S.paperMsg = ""; S.paperCopy = "";
  const names = { ex:"exercices", both:"exercices-et-corrige", key:"corrige" };
  const filename = `${DUE.iso}_allemand-unit2-livio-${names[part]}.html`;
  try {
    if (!HAS_CLAUDE){
      const url = URL.createObjectURL(new Blob([paperHtml(qs, part)], { type:"text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.paperMsg = "Fichier téléchargé : ouvre-le, puis touche « Imprimer ».";
      render(); return;
    }
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code:"unavailable" };
    await dl.save({ filename, data:paperHtml(qs, part) });
  } catch(e){
    if (e && e.code === "declined"){ S.paperMsg = "Téléchargement annulé."; }
    else {
      S.paperMsg = "Le téléchargement ne passe pas ici. Copie le texte ci-dessous et colle-le dans le chat : je t'envoie la feuille de ce test exact.";
      S.paperCopy = "#PDF-ALLEMAND-U2\n" + qs.map(q => `${q.num}. [Ex ${q.ex} ${q.exTitle} — ${q.consigne}] ${q.word}${q.options ? " | " + q.options.join(" / ") : ""} → ${q.answer}`).join("\n");
    }
  }
  render();
}

/* ---------- chargement de l'historique ---------- */
async function loadHistory(){
  try {
    await store.init();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  S.loaded = true;
  if (S.screen === "scores") render();
}

/* ---------- événements ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  const Q = S.quiz;
  switch(act){
    case "nav": S.screen = v; S.scores.confirm = false; render(); window.scrollTo(0,0); break;
    case "fiche": S.ficheOpen = S.ficheOpen === +v ? -1 : +v; render(); break;
    case "toggle": S.selected = S.selected.includes(v) ? S.selected.filter(x => x !== v) : DECKS.map(d => d.key).filter(k => k === v || S.selected.includes(k)); S.frozen = null; S.cards.order = []; render(); break;
    case "allDecks": S.selected = S.selected.length === DECKS.length ? [] : DECKS.map(d => d.key); S.frozen = null; S.cards.order = []; render(); break;
    case "toCards": S.screen = "cards"; render(); break;
    case "flip": S.cards.flip = !S.cards.flip; render(); break;
    case "card": { const n = cardItems().length; S.cards.flip = false; S.cards.pos = (S.cards.pos + (+v) + n) % n; render(); break; }
    case "cardShuffle": S.cards.order = shuffle(S.cards.order); S.cards.pos = 0; S.cards.flip = false; render(); break;
    case "diff": S.difficulty = v; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; render(); break;
    case "mode": S.mode = v; render(); break;
    case "freeze": S.frozen = buildTest(S.selected, S.difficulty); render(); break;
    case "unfreeze": S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; render(); break;
    case "paper": savePaper(v); break;
    case "start": startQuiz(S.frozen || buildTest(S.selected, S.difficulty), false); break;
    case "quit": S.screen = "home"; S.quiz = null; render(); break;
    case "pick": { if (Q.checked || Q.done) return; const q = Q.questions[Q.i]; Q.picked = q.options[+v]; if (S.mode === "train") validate(Q.picked); else render(); break; }
    case "validate": { const q = Q.questions[Q.i]; if (q.type === "type"){ const inp = document.getElementById("answer-input"); Q.typed = inp ? inp.value : Q.typed; if (Q.typed.trim()) validate(Q.typed); } else if (Q.picked !== null) validate(Q.picked); break; }
    case "dontknow": { const q = Q.questions[Q.i]; if (S.mode === "train"){ Q.ok = false; Q.checked = true; if (q.type === "mcq") Q.picked = null; render(); } else record("", false); break; }
    case "typo": record(Q.typed, true); break;
    case "next": { const q = Q.questions[Q.i]; record(q.type === "mcq" ? Q.picked : Q.typed, Q.ok); break; }
    case "toggleAll": S.results.all = !S.results.all; render(); break;
    case "analyse": analyse(v); break;
    case "copy": copyFor(v); break;
    case "retryWrong": retryWrong(v); break;
    case "openAttempt": S.scores.open = S.scores.open === v ? null : v; render(); break;
    case "exportToggle": S.scores.exportOpen = !S.scores.exportOpen; render(); break;
    case "clearAsk": S.scores.confirm = true; render(); break;
    case "clearNo": S.scores.confirm = false; render(); break;
    case "clearYes": (async () => {
      const ids = S.attempts.map(a => a.id); S.attempts = []; S.scores = { open:null, exportOpen:false, confirm:false }; render();
      let failed = false; for (const id of ids){ try { await store.remove(id); } catch(e){ failed = true; } }
      if (failed){ S.loadErr = "L'effacement n'a pas pu être enregistré partout. Recharge la page et réessaie."; render(); }
    })(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "answer-input" && S.quiz){ S.quiz.typed = e.target.value; const b = document.getElementById("validate-btn"); if (b) b.disabled = !S.quiz.typed.trim(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });

render();
loadHistory();
</script>

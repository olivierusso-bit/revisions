<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anglais · pour le 22.10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700;7..72,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : une page de dictionnaire — mots-vedettes en gras, onglets d'index en bas, surligneur jaune pour ce qui compte. */
:root{
  --paper:#F2F4F7; --sheet:#FFFFFF; --ink:#18202E; --soft:#5A6577; --rule:#D5DBE4;
  --cobalt:#2546B5; --cobalt-wash:#E6EBFA; --marker:#F6D94A; --marker-ink:#3A2F00;
  --good:#1F7A4D; --good-wash:#E2F2E9; --bad:#B3362B; --bad-wash:#FBE7E4;
  --display:'Literata',Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151D; --sheet:#1A2030; --ink:#E7EBF2; --soft:#9AA5B8; --rule:#2C3446;
  --cobalt:#8EA6FF; --cobalt-wash:#232D4A; --marker:#E8C93A; --marker-ink:#2A2200;
  --good:#5CC892; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151D; --sheet:#1A2030; --ink:#E7EBF2; --soft:#9AA5B8; --rule:#2C3446;
  --cobalt:#8EA6FF; --cobalt-wash:#232D4A; --marker:#E8C93A; --marker-ink:#2A2200;
  --good:#5CC892; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

/* entête */
.head{display:flex;gap:14px;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.head-tab{flex:none;width:52px;height:64px;background:var(--cobalt);color:#fff;border-radius:0 0 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;margin-top:-18px}
.head-tab b{font-family:var(--display);font-size:26px;line-height:1}
.head-tab span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,32px);line-height:1.05;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--soft);font-size:14px}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:700;font-size:17px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 8px 8px 0;margin:0}
.note{background:var(--cobalt-wash);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--cobalt);font-weight:700;padding:0;cursor:pointer}
mark{background:var(--marker);color:var(--marker-ink);padding:0 3px;border-radius:2px}

/* boutons */
.cta{width:100%;padding:15px;border:0;border-radius:10px;background:var(--cobalt);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
:root[data-theme="dark"] .cta{color:#0E1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cta{color:#0E1424}}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.entry.open{border-color:var(--cobalt)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-letter{font-family:var(--display);font-weight:800;font-size:20px;color:var(--cobalt);width:24px;text-align:center}
.entry-title{flex:1;font-weight:700}
.entry-count{font-size:12.5px;color:var(--soft)}
.entry-body{padding:0 14px 14px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-en{font-family:var(--display);font-weight:700}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--cobalt-wash);font-size:14px}
.astuce b{display:block;color:var(--cobalt);margin-bottom:2px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}
.tip{margin:0;padding:8px 0 8px 12px;border-left:3px solid var(--marker);font-size:15px}

/* paquets */
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.deck.on{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt);background:var(--cobalt-wash)}
.deck-t{font-weight:700;font-size:14.5px;line-height:1.25}
.deck-n{font-size:12.5px;color:var(--soft)}
.deck-tick{position:absolute;top:9px;right:10px;color:var(--cobalt);font-weight:700}

/* cartes */
.flash{position:relative;height:230px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;background:var(--sheet);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;transition:transform .45s}
.face.b{transform:rotateY(180deg);background:var(--cobalt-wash);border-color:var(--cobalt)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--soft)}
.face-word{font-family:var(--display);font-weight:700;font-size:26px;text-align:center;line-height:1.2}
.face-hint{position:absolute;bottom:12px;font-size:12px;color:var(--soft)}

/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt);background:var(--cobalt-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.paper{background:var(--sheet);border:1px dashed var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:8px;border-radius:9px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:14px;background:var(--ink);color:var(--paper);padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--cobalt-wash);color:var(--cobalt)}
.chip.anglais{background:var(--marker);color:var(--marker-ink)}
.ref{font-size:12px;color:var(--soft)}
.consigne{margin:0;font-size:14.5px;color:var(--soft)}
.qword{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,30px);line-height:1.2;margin:0;overflow-wrap:anywhere}
.choice{padding:14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:16px;font-weight:700;cursor:pointer}
.choice.sel{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);font:inherit;font-size:18px;font-weight:700;color:var(--ink)}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.fb{padding:14px;border-radius:10px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}

/* résultats */
.scorebox{background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:18px;text-align:center}
.score-n{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.score-n small{font-size:24px;color:var(--soft)}
.score-note{display:inline-block;margin-top:8px;background:var(--marker);color:var(--marker-ink);font-weight:700;padding:4px 14px;border-radius:20px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--bad)}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}

/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:18px;margin:0}
.bilan-lab{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan ul.forts li{color:var(--good)}
.bilan ul.work li{color:var(--bad)}
.bilan-tip{background:var(--cobalt-wash);border-radius:8px;padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--body)}

/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--soft)}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#fff}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
:root[data-theme="dark"] .attempt-note{color:#0E1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .attempt-note{color:#0E1424}}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:9px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--soft)}
.tab-e{font-size:18px} .tab-l{font-size:11px;font-weight:700}
.tab.on{color:var(--cobalt)} .tab.on .tab-l{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* voir mes erreurs : lisible sans les couleurs (barré + fond foncé = faux ; souligné + fond clair = ce qu'il fallait) */
.dx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px;color:var(--soft)}
.dx-line{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline;margin:2px 0!important}
.dx-lab{font-size:12.5px!important;font-weight:700;color:var(--soft)}
.dx-ans{font-size:17px;font-weight:700;overflow-wrap:anywhere;letter-spacing:.3px;line-height:1.7}
.dx-bad{background:#A3241B;color:#fff;text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:1px 2px}
.dx-good{background:#D4F0E1;color:#08402A;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;padding:1px 2px;font-weight:800}
.dx-miss{display:inline-block;background:#A3241B;color:#fff;border-radius:3px;padding:0 4px;margin:0 1px;font-weight:800;font-size:14px;line-height:1.35;vertical-align:1px;text-decoration:none}
.dx-none{font-style:italic;font-weight:400;color:var(--soft)}
.dx-note{font-size:13.5px!important;font-weight:700}

@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>

<script>
/* ============================================================
   ANGLAIS — Unit 1 « Learning languages » (Active wordlist)
   Révision LVO — à savoir pour le 22.10
   Contenu : uniquement les parties encadrées des deux photos.
   ============================================================ */

const QUIZ_ID = "lvo-quiz-anglais-unit1-languages";
/* Dans Claude, window.claude existe ; sur un site web normal (GitHub Pages), non. */
const HAS_CLAUDE = !!(window.claude && window.claude.use);
const VERSION = { n:2, date:"17.10.2026" };   /* v1 : 16.10.2026, première publication · v2 : « Voir mes erreurs », fautes barrées et corrections soulignées */
const INDEX_KEY = QUIZ_ID + "-index";
const ATTEMPT_PREFIX = QUIZ_ID + "-attempt-";

/* ---------- CONTENU : paquets (texte exact du livre) ---------- */
const DECKS = [
  { key:"languages", title:"Languages", letter:"L", items:[
    { en:"Chinese", frShow:"chinois" },
    { en:"English", frShow:"anglais" },
    { en:"French", frShow:"français" },
    { en:"German", frShow:"allemand" },
    { en:"Greek", frShow:"grec" },
    { en:"Italian", frShow:"italien" },
    { en:"Japanese", frShow:"japonais" },
    { en:"Portuguese", frShow:"portugais" },
    { en:"Russian", frShow:"russe" },
    { en:"Spanish", frShow:"espagnol" },
  ]},
  { key:"learning", title:"Language learning", letter:"G", items:[
    { en:"forget", frShow:"oublier" },
    { en:"guess", frShow:"deviner" },
    { en:"know", frShow:"savoir, connaître", fr:["savoir","connaître"] },
    { en:"learn", frShow:"apprendre" },
    { en:"make a mistake", frShow:"faire une erreur", keep:true },
    { en:"mean", frShow:"vouloir dire, signifier", fr:["vouloir dire","signifier"] },
    { en:"practise", frShow:"s'exercer / s'entraîner (à)", fr:["s'exercer (à)","s'entraîner (à)"], note:"Comme dans le livre, le verbe s'écrit practise, avec un s." },
    { en:"remember", frShow:"se souvenir de", fr:["se souvenir de","se souvenir"] },
    { en:"translate", frShow:"traduire" },
    { en:"understand", frShow:"comprendre" },
  ]},
  { key:"documents", title:"Documents and texts", letter:"D", items:[
    { en:"advert", frShow:"publicité" },
    { en:"certificate", frShow:"certificat" },
    { en:"dictionary", frShow:"dictionnaire" },
    { en:"ebook", enAccept:["e-book"], frShow:"ebook", fr:["ebook","e-book"] },
    { en:"email", enAccept:["e-mail"], frShow:"e-mail", fr:["e-mail","email","mail"] },
    { en:"form", frShow:"formulaire" },
    { en:"instructions", frShow:"consignes" },
    { en:"letter", frShow:"lettre", note:"Dans ce paquet, letter = la lettre qu'on écrit et qu'on envoie." },
    { en:"newspaper", frShow:"journal" },
  ]},
  { key:"words1", title:"Words and phrases (1)", letter:"W", items:[
    { en:"amazing", frShow:"surprenant, incroyable", fr:["surprenant","incroyable"] },
    { en:"ask", frShow:"demander à", fr:["demander à","demander"] },
    { en:"be fluent", frShow:"parler couramment", keep:true, enAccept:["to be fluent"] },
    { en:"explain", frShow:"expliquer" },
    { en:"first language", frShow:"langue d'origine" },
    { en:"grammar", frShow:"grammaire" },
    { en:"hard", frShow:"dur" },
    { en:"letter (ABC)", frShow:"lettre", note:"Ici, letter = une lettre de l'alphabet (A, B, C…)." },
    { en:"listening", frShow:"écoute" },
    { en:"meaning", frShow:"signification, sens", fr:["signification","sens"] },
  ]},
  { key:"words2", title:"Words and phrases (2)", letter:"P", items:[
    { en:"pronunciation", frShow:"prononciation" },
    { en:"reading", frShow:"lecture" },
    { en:"repeat", frShow:"répéter" },
    { en:"speak", frShow:"parler" },
    { en:"speaker", frShow:"locuteur" },
    { en:"speaking", frShow:"expression orale" },
    { en:"spelling", frShow:"orthographe" },
    { en:"vocabulary", frShow:"vocabulaire" },
    { en:"word", frShow:"mot" },
    { en:"writing", frShow:"expression écrite" },
  ]},
  { key:"advice", title:"Giving advice", letter:"A", items:[
    { en:"I don't think it's good to …", enAccept:["I do not think it is good to"], frShow:"Je ne pense pas que c'est bien de…", keep:true },
    { en:"It's a good idea to …", enAccept:["It is a good idea to"], frShow:"C'est une bonne idée de…", keep:true },
    { en:"It's useful to …", enAccept:["It is useful to"], frShow:"Il est utile de…", keep:true },
    { en:"Remember (to + infinitive)", enAccept:["Remember to"], frShow:"Rappelle-toi/Rappelez-vous (de…/que…)", fr:["Rappelle-toi","Rappelez-vous","Rappelle-toi de","Rappelle-toi que","Rappelez-vous de","Rappelez-vous que"], keep:true },
    { en:"Try (to + infinitive)", enAccept:["Try to"], frShow:"Essaie/Essayez (de…)", fr:["Essaie","Essayez","Essaie de","Essayez de"], keep:true },
    { en:"Why don't you …?", enAccept:["Why do not you"], frShow:"Et si tu/vous (+ imparfait)… ?", fr:["Et si tu","Et si vous"], keep:true },
  ]},
  { key:"culture", title:"Culture in mind", letter:"C", items:[
    { en:"adult", frShow:"adulte" },
    { en:"depend on", frShow:"dépendre de", fr:["dépendre de","dépendre"], keep:true },
    { en:"different", frShow:"différent" },
    { en:"invent", frShow:"inventer" },
    { en:"teenager (teen)", enAccept:["teen"], frShow:"adolescent (ado)", fr:["adolescent","ado"] },
    { en:"the same", frShow:"le/la/les même(s)", fr:["le même","la même","les mêmes","même","mêmes"], keep:true },
  ]},
];
const DECK = Object.fromEntries(DECKS.map(d => [d.key, d]));

/* ---------- CONTENU : fiche ---------- */

/* ---------- utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s, apoMode){
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/…|\.\.\./g," ").replace(/[’'`]/g, apoMode === "del" ? "" : " ")
    .replace(/[.!?;,:«»"()\/\-+]/g," ").replace(/\s+/g," ").trim();
}
const stripFr = s => s.replace(/^(le |la |les |l |un |une |des |du |de la |d )/,"").trim();
const stripEn = s => s.replace(/^(to |the |a |an )/,"").trim();
const dropParen = s => s.replace(/\s*\([^)]*\)/g,"").trim();
function expand(list){ const out = []; list.forEach(s => { out.push(s); const d = dropParen(s); if (d && d !== s) out.push(d); }); return [...new Set(out)]; }
function frList(it){ return expand(it.fr || [it.frShow]).concat(it.fr ? [it.frShow] : []); }
function enList(it){ return expand([it.en].concat(it.enAccept || [])); }
function matchAnswer(input, accept, lang, keep){
  const strip = lang === "fr" ? stripFr : stripEn;
  return ["sp","del"].some(m => {
    const a = norm(input, m); if (!a) return false;
    return accept.some(raw => { const b = norm(raw, m); if (a === b) return true; if (keep) return false; return strip(a) === strip(b); });
  });
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function sameMeaning(a, b){ const A = new Set(frList(a).map(x => norm(x,"sp"))); return frList(b).some(x => A.has(norm(x,"sp"))); }
function pickOptions(item, pool, wide, valueFn){
  const good = valueFn(item), out = [], seen = new Set([good]);
  const take = list => shuffle(list).forEach(x => { if (out.length >= 3 || x === item || sameMeaning(x, item)) return; const v = valueFn(x); if (v && !seen.has(v)){ seen.add(v); out.push(v); } });
  take(pool); if (out.length < 3) take(wide);
  return shuffle([good, ...out]);
}
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");
function dateLabel(ts){ const d = new Date(ts), p = x => String(x).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} · ${p(d.getHours())}h${p(d.getMinutes())}`; }
const explain = it => `${it.en} = ${it.frShow}` + (it.note ? ` — ${it.note}` : "");

/* ---------- fabrication du test (numérotation unique) ---------- */
function buildTest(deckKeys, difficulty){
  const all = []; deckKeys.forEach(k => DECK[k].items.forEach(it => all.push({ it, deck:DECK[k] })));
  const qs = []; let num = 0, ex = 0;
  DECKS.filter(d => deckKeys.includes(d.key)).forEach(d => {
    const groups = {}; KIND_ORDER.forEach(k => groups[k] = []);
    shuffle(d.items).forEach(it => {
      let kind = difficulty === "easy" ? "mcq_fr" : difficulty === "hard" ? "type_en" : (Math.random() < 0.5 ? "type_fr" : "mcq_en");
      groups[kind].push(it);
    });
    KIND_ORDER.forEach(kind => {
      if (!groups[kind].length) return;
      ex++; const K = KINDS[kind];
      groups[kind].forEach(it => {
        num++;
        const q = { id:"q"+num, num, ex, exTitle:d.title, deckKey:d.key, kind, type:K.type, tag:K.tag, lang:K.lang, consigne:K.consigne, keep:!!it.keep, expl:explain(it) };
        const wide = all.map(x => x.it);
        if (kind === "mcq_fr"){ q.word = it.en; q.options = pickOptions(it, d.items, wide, x => x.frShow); q.answer = it.frShow; }
        if (kind === "type_fr"){ q.word = it.en; q.accept = frList(it); q.answer = it.frShow; }
        if (kind === "mcq_en"){ q.word = it.frShow; q.options = pickOptions(it, d.items, wide, x => x.en); q.answer = it.en; }
        if (kind === "type_en"){ q.word = it.frShow; q.accept = enList(it); q.answer = it.en; }
        q.prompt = `${K.consigne} « ${q.word} »`;
        qs.push(q);
      });
    });
  });
  return qs;
}

/* ---------- stockage : db privée de l'utilisateur, sinon navigateur, sinon mémoire ---------- */
const store = {
  mode:"memory", col:null, mem:{},
  async init(){
    try {
      if (window.claude && window.claude.use){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user){ const uid = await user.id(); if (uid){ this.col = db.collection("data/users/" + uid); this.mode = "db"; return; } }
      }
    } catch(e){}
    try { localStorage.setItem(QUIZ_ID + "-probe","1"); localStorage.removeItem(QUIZ_ID + "-probe"); this.mode = "local"; } catch(e){ this.mode = "memory"; }
  },
  async list(){
    if (this.mode === "db"){
      const snap = await this.col.limit(1000).get();
      return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean);
    }
    if (this.mode === "local"){
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]");
      return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean);
    }
    return Object.values(this.mem);
  },
  async save(att){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + att.id).set(att); return; }
    if (this.mode === "local"){
      localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att));
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id);
      localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return;
    }
    this.mem[att.id] = att;
  },
  async remove(id){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + id).delete(); return; }
    if (this.mode === "local"){ localStorage.removeItem(ATTEMPT_PREFIX + id); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]").filter(x => x !== id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }
    delete this.mem[id];
  },
};

/* ---------- quiz ---------- */
function startQuiz(questions, rattrapage){
  S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, label: rattrapage ? S.rattrLabel : deckLabel(S.selected) };
  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.results.all = false; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function viewQuiz(){
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode === "train";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>
  <div class="badges"><span class="num">N° ${q.num}</span><span class="chip ${q.tag}">${q.tag === "anglais" ? "vers l'anglais" : "vers le français"}</span><span class="ref">Exercice ${q.ex} · ${esc(q.exTitle)}</span></div>
  <p class="consigne">${esc(q.consigne)}</p><p class="qword">${esc(q.word)}</p>`;
  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice";
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="${q.lang === "en" ? "Your answer…" : "Ta réponse…"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){
    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? ["Juste !","Bien vu.","Nickel.","Exact.","Tu l'as."][Q.i % 5] : "Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b>${esc(q.answer)}</b></p>`}<p class="fb-x">${esc(q.expl)}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q.accept, q.lang, q.keep); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], correct = isRight(q, val);
  if (S.mode === "train"){ Q.ok = correct; Q.checked = true; render(); }
  else record(val, correct);
}
function record(val, correct){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.exTitle, prompt:q.prompt, user:val || "", answer:q.answer, correct, expl:q.expl, tag:q.tag, question:q });
  if (Q.i + 1 >= Q.questions.length){
    Q.done = true; Q.finishing = true; render();   /* verrou de fin : une seule fois */
    finishQuiz();
  } else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; render(); }
}
async function finishQuiz(){
  const Q = S.quiz, score = Q.detail.filter(x => x.correct).length, total = Q.detail.length, id = String(Date.now());
  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:"Anglais", theme:"Unit 1 — Learning languages", deck:Q.label,
    difficulty:DIFFICULTIES[S.difficulty].label, mode:MODES[S.mode].label, rattrapage:S.rattrapage, score, total, note:noteFrom(score/total), questions:Q.detail };
  S.attempts = [att, ...S.attempts.filter(a => a.id !== id)];
  try { await store.save(att); S.storeMsg = store.mode === "memory" ? "Ce résultat est affiché ici, mais il ne sera pas gardé si tu fermes la page. Pense à noter ta note ou à l'exporter." : ""; }
  catch(e){ S.storeMsg = "Je n'ai pas pu enregistrer ce résultat : il disparaîtra si tu fermes la page. Note ta note ou copie-la pour le chat."; }
  S.lastResult = att; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; S.screen = "results"; render(); window.scrollTo(0,0);
}

/* ---------- bilan ---------- */
function bilanState(id){ return S.bilan[id] || (S.bilan[id] = { busy:false, err:"", copied:false, fallback:"" }); }
function bilanBlock(att){
  const b = bilanState(att.id), a = att.analysis;
  const wrong = att.questions.filter(x => !x.correct), canRetry = wrong.some(x => x.question);
  let h = `<div class="bilan">`;
  if (!a && !b.busy && HAS_CLAUDE) h += `<p class="fine">Tu veux savoir ce qui coince vraiment ? Je regarde tes réponses et je te dis quoi travailler.</p><button class="cta" data-act="analyse" data-v="${att.id}">Analyser mes résultats</button>`;

/* ---------- voir mes erreurs : comparaison mot par mot, puis lettre par lettre ----------
   Ce que la correction tolère (majuscules, accents, ß/ss) n'est jamais marqué comme faux. */
function dxN(c){ return String(c).toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,""); }
function dxW(w){ return dxN(w).replace(/[.,!?;:«»"()…]/g,""); }
function lev(a, b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function lcsOps(A, B, eq){
  const m=A.length, n=B.length, L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j]=eq(A[i],B[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<m&&j<n){ if(eq(A[i],B[j])){ ops.push({t:"=",a:A[i],b:B[j]}); i++; j++; } else if(L[i+1][j]>=L[i][j+1]) ops.push({t:"-",a:A[i++]}); else ops.push({t:"+",b:B[j++]}); }
  while(i<m) ops.push({t:"-",a:A[i++]}); while(j<n) ops.push({t:"+",b:B[j++]});
  return ops;
}
/* découpe en blocs : égalités, ou bloc de différences {del:[], ins:[]} */
function dxBlocks(ops){ const out=[]; let cur=null; ops.forEach(o=>{ if(o.t==="="){ cur=null; out.push(o); } else { if(!cur){ cur={t:"x",del:[],ins:[]}; out.push(cur); } (o.t==="-"?cur.del:cur.ins).push(o.t==="-"?o.a:o.b); } }); return out; }
const dxBad = t => `<del class="dx-bad">${esc(t)}</del>`;
const dxGood = t => `<ins class="dx-good">${esc(t)}</ins>`;
const dxMiss = `<span class="dx-miss" aria-label="il manque quelque chose ici">?</span>`;
function dxChars(u, r){
  let U="", R="";
  dxBlocks(lcsOps([...u],[...r],(x,y)=>dxN(x)===dxN(y))).forEach(b=>{
    if(b.t==="="){ U+=esc(b.a); R+=esc(b.b); return; }
    U += b.del.length ? dxBad(b.del.join("")) : dxMiss;
    if(b.ins.length) R += dxGood(b.ins.join(""));
  });
  return { U, R };
}
function dxDiff(user, right){
  const A=user.trim().split(/\s+/).filter(Boolean), B=right.trim().split(/\s+/).filter(Boolean);
  const U=[], R=[]; let common=0;
  dxBlocks(lcsOps(A,B,(x,y)=>dxW(x)===dxW(y))).forEach(b=>{
    if(b.t==="="){ common++; U.push(esc(b.a)); R.push(esc(b.b)); return; }
    const k=Math.min(b.del.length,b.ins.length);
    for(let i=0;i<k;i++){
      const x=b.del[i], y=b.ins[i], lim=Math.max(1, Math.floor(Math.max(dxW(x).length,dxW(y).length)*0.4));
      if(lev(dxW(x),dxW(y))<=lim){ const c=dxChars(x,y); U.push(c.U); R.push(c.R); common++; }
      else { U.push(dxBad(x)); R.push(dxGood(y)); }
    }
    b.del.slice(k).forEach(x=>U.push(dxBad(x)));
    if(b.ins.length>k){ U.push(dxMiss); b.ins.slice(k).forEach(y=>R.push(dxGood(y))); }
  });
  return { U:U.join(" "), R:R.join(" "), other: common===0 };
}
function dxLegend(){ return `<p class="dx-legend"><span>${dxBad("barré")} = ce qui était faux</span><span>${dxGood("souligné")} = ce qu'il fallait écrire</span><span>${dxMiss} = il manque quelque chose</span></p>`; }
function errCard(q){
  const Q = q.question || {}, isMcq = Q.type === "mcq", user = (q.user || "").trim();
  let right = q.answer, U, R, note = "";
  if (!user){ U = `<span class="dx-none">rien</span>`; R = dxGood(right); }
  else if (isMcq){ U = dxBad(user); R = dxGood(right); }
  else {
    const cands = (Q.accept && Q.accept.length ? Q.accept : [q.answer]).filter(Boolean);
    right = cands.reduce((best, c) => lev(dxN(user), dxN(c)) < lev(dxN(user), dxN(best)) ? c : best, cands[0]);
    const d = dxDiff(user, right); U = d.U; R = d.R;
    if (d.other) note = "Ce n'est pas le même mot : apprends-le en entier.";
  }
  return `<div class="revcard"><p class="rev-q">N° ${q.num} · ${esc(q.prompt)}</p>
    <p class="dx-line"><span class="dx-lab">✗ ${isMcq ? "Tu as choisi" : "Tu as écrit"}</span><span class="dx-ans">${U}</span></p>
    <p class="dx-line"><span class="dx-lab">✓ Il fallait</span><span class="dx-ans">${R}</span></p>
    ${note ? `<p class="dx-note">${note}</p>` : ""}${right !== q.answer ? `<p class="fine">Réponse complète : ${esc(q.answer)}</p>` : ""}
    <p class="rev-x">${esc(q.expl)}</p></div>`;
}
function errView(id){ const b = bilanState(id); return b.errOnly != null ? b.errOnly : S.screen === "results"; }
function questionList(att){

/* ---------- chargement de l'historique ---------- */
async function loadHistory(){
  try {
    await store.init();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  S.loaded = true;
  if (S.screen === "scores") render();
}

    case "flip": S.cards.flip = !S.cards.flip; render(); break;
    case "card": { const n = cardItems().length; S.cards.flip = false; S.cards.pos = (S.cards.pos + (+v) + n) % n; render(); break; }
    case "cardShuffle": S.cards.order = shuffle(S.cards.order); S.cards.pos = 0; S.cards.flip = false; render(); break;
    case "diff": S.difficulty = v; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; render(); break;
    case "mode": S.mode = v; render(); break;
    case "freeze": S.frozen = buildTest(S.selected, S.difficulty); render(); break;
    case "unfreeze": S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; render(); break;
    case "paper": savePaper(v); break;
    case "start": startQuiz(S.frozen || buildTest(S.selected, S.difficulty), false); break;
    case "quit": S.screen = "home"; S.quiz = null; render(); break;
    case "pick": { if (Q.checked || Q.done) return; const q = Q.questions[Q.i]; Q.picked = q.options[+v]; if (S.mode === "train") validate(Q.picked); else render(); break; }
    case "validate": { const q = Q.questions[Q.i]; if (q.type === "type"){ const inp = document.getElementById("answer-input"); Q.typed = inp ? inp.value : Q.typed; if (Q.typed.trim()) validate(Q.typed); } else if (Q.picked !== null) validate(Q.picked); break; }
    case "dontknow": { const q = Q.questions[Q.i]; if (S.mode === "train"){ Q.ok = false; Q.checked = true; if (q.type === "mcq") Q.picked = null; render(); } else record("", false); break; }
    case "typo": record(Q.typed, true); break;
    case "next": { const q = Q.questions[Q.i]; record(q.type === "mcq" ? Q.picked : Q.typed, Q.ok); break; }
    case "toggleAll": S.results.all = !S.results.all; render(); break;
    case "showErr": { const b = bilanState(v); b.errOnly = !errView(v); render(); break; }
    case "analyse": analyse(v); break;
    case "copy": copyFor(v); break;
    case "retryWrong": retryWrong(v); break;
    case "openAttempt": S.scores.open = S.scores.open === v ? null : v; render(); break;
    case "exportToggle": S.scores.exportOpen = !S.scores.exportOpen; render(); break;
    case "clearAsk": S.scores.confirm = true; render(); break;
    case "clearNo": S.scores.confirm = false; render(); break;
    case "clearYes": (async () => {
      const ids = S.attempts.map(a => a.id); S.attempts = []; S.scores = { open:null, exportOpen:false, confirm:false }; render();
      let failed = false; for (const id of ids){ try { await store.remove(id); } catch(e){ failed = true; } }
      if (failed){ S.loadErr = "L'effacement n'a pas pu être enregistré partout. Recharge la page et réessaie."; render(); }
    })(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "answer-input" && S.quiz){ S.quiz.typed = e.target.value; const b = document.getElementById("validate-btn"); if (b) b.disabled = !S.quiz.typed.trim(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });

render();
loadHistory();
</script>

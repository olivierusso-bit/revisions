    ["Son avis","il dénonce les massacres et le travail forcé · il justifie la domination espagnole"]]) },
  { t:"mine", s:"Cahier p. 21, ex. 12c (doc. 27 et 28)", titre:"Ta réponse à l'exercice 12c", items:["Les deux auteurs espagnols n'ont pas le même point de vue : l'un trouve bien la façon dont on fait travailler les Indiens, l'autre dit le contraire, que c'est mauvais."] },
  { t:"pause", q:"Cite deux reproches que Sepúlveda fait aux Indiens.", a:"Par exemple : ils n'ont pas de lois écrites, seulement des coutumes ; ils ignorent le droit de propriété ; ils seraient dépourvus de science et d'art.", s:"Livre p. 47, doc. 28" },
  { t:"h3", h:"D'autres regards (« etc. »)" },
  { t:"p", s:"Livre p. 44 (doc. 16, 17), p. 45 (doc. 22), p. 46 (codex), p. 47 (doc. 25, 26)", h:"<b>Bernardino de Sahagún</b>, missionnaire franciscain, rapporte la joie des Espagnols devant l'or (doc. 17), les ravages de la variole (doc. 25) et la réponse de prêtres aztèques : « Laissez-nous donc mourir […], car nos dieux déjà sont morts » (doc. 22). Son <i>Codex de Florence</i> est interdit sur ordre du roi d'Espagne. <b>Guamán Poma de Ayala</b>, chroniqueur inca, dessine les tortures infligées aux Indiens (doc. 26). Les codex, réalisés avec des artistes amérindiens, dénoncent les sévices subis. Et la <b>Malinche</b> est vue soit comme un symbole de trahison, soit comme la « mère » du Mexique métissé." },
  { t:"tip", h:"Pour présenter un avis, donne l'auteur, ce qu'il est (prêtre, humaniste, missionnaire, chroniqueur inca), la date, l'ouvrage, puis son avis en une phrase avec une citation courte. Las Casas et Sepúlveda sont tous les deux espagnols : ce n'est pas la nationalité qui fait l'avis." },
  { t:"see", ids:["C1","C2","S6"] },
  { t:"src", h:"Livre pp. 44-47 (doc. 16, 17, 20, 22, 25 à 28, glossaire) · cahier ex. 12c" },
]},


/* ---------------- C1 ---------------- */
{ id:"C1", ch:"C", titre:"Présenter les différentes interprétations", court:"« Découverte » ou conquête ? Qui parle, et quand ?",
  obj:"de présenter les différentes interprétations de ces événements",
  pre:[{ q:"Les Européens parlent des « Grandes Découvertes ». Les Amérindiens qui vivaient déjà là diraient-ils la même chose ?", a:"Non : ces terres étaient habitées. Le livre met d'ailleurs « découverte » entre guillemets.", s:"Livre p. 35 (apprentissages visés) · cahier ex. 8" }, { q:"Que s'est-il passé en 2004 avec la statue de Francisco Pizarro à Lima ?", a:"Elle a été enlevée de son piédestal et déplacée de la grande place de Lima, où elle se trouvait depuis 1935.", s:"Cahier p. 22, ex. 14a (énoncé)" }],
  blank:{ consigne:"Présente deux interprétations opposées des mêmes événements, avec l'auteur, la date et un argument chacune.", points:["Sepúlveda (1544) : les Indiens doivent être placés sous l'autorité des Espagnols, qui leur apporteraient une morale plus haute", "Las Casas (1552) : les Espagnols, « loups enragés », massacrent des Indiens doux et paisibles", "La Malinche : traîtresse pour les uns, « mère » du Mexique métissé pour les autres", "Le mot « découverte » : c'est le point de vue des Européens ; pour les Amérindiens, c'est une conquête", "Aujourd'hui encore : la statue de Pizarro déplacée en 2004 à Lima ; des Amérindiens Kayapó et Pataxó manifestent à Brasilia en 2015"], s:"Livre pp. 35, 36, 44, 45, 47 · cahier ex. 8 et 14" },
  blocks:[
  { t:"p", s:"Livre p. 35, « Apprentissages visés »", h:"Ton manuel annonce que tu vas apprendre à « distinguer les conséquences de la « découverte » de l'Amérique selon différents points de vue (européens, amérindiens, etc.) » et à « argumenter autour de différentes interprétations d'un fait historique que les Européens appellent les Grandes Découvertes ». Une interprétation, c'est la façon dont quelqu'un juge un événement." },
  { t:"h3", h:"1. Un mot entre guillemets : la « découverte »" },
  { t:"p", s:"Livre p. 37 · cahier p. 18, ex. 8 (« débarque aux Bahamas et « découvre » ainsi l'Amérique »)", h:"Ton livre et ton cahier écrivent souvent « découverte » entre guillemets. Les voyages permettent aux Européens d'entrer en contact avec des peuples « dont ils ignoraient l'existence » : la terre était donc déjà habitée. Parler de « Grandes Découvertes », c'est raconter l'histoire du point de vue des Européens." },
  { t:"pause", q:"Pourquoi le mot « découverte » est-il mis entre guillemets ?", a:"Parce que l'Amérique était déjà habitée : ce sont seulement les Européens qui ignoraient l'existence de ces peuples. C'est leur point de vue.", s:"Livre p. 37 · p. 35" },
  { t:"h3", h:"2. Deux Espagnols, deux interprétations" },
  { t:"html", s:"Livre p. 45 (doc. 20), p. 47 (doc. 27 et 28)", h:tbl(["Auteur","Son interprétation"], [
    ["<b>Sepúlveda</b>, 1544","La conquête est juste : les Indiens « demandent » à être placés sous l'autorité d'États « civilisés et vertueux », qui leur apprendront « une morale plus haute »."],
    ["<b>Las Casas</b>, 1552","La conquête est une destruction : des hommes « assoiffés de richesses » se jettent comme des loups sur de « doux et paisibles agneaux »."]]) },
  { t:"h3", h:"3. Une même personne, deux images : la Malinche" },
  { t:"p", s:"Livre p. 44, doc. 16", h:"Le nom de la Malinche est aujourd'hui <b>symbole de trahison</b>, mais elle est aussi parfois vue comme la <b>« mère » du Mexique moderne et métissé</b>. Même personne, deux interprétations." },
  { t:"pause", q:"Quelles sont les deux façons de voir la Malinche aujourd'hui ?", a:"Un symbole de trahison, ou la « mère » du Mexique moderne et métissé.", s:"Livre p. 44, doc. 16" },
  { t:"h3", h:"4. Ces événements font encore débat aujourd'hui" },
  { t:"p", s:"Cahier p. 22, ex. 14a (énoncé et doc. f) · livre p. 36 (photo)", h:"En <b>2004</b>, la statue équestre de Francisco Pizarro a été enlevée de son piédestal et déplacée de la grande place de Lima, où elle se trouvait depuis 1935 (aujourd'hui dans le parc des Murailles). En <b>novembre 2015</b>, des Amérindiens brésiliens Kayapó et Pataxó manifestent devant le Congrès, à Brasilia. Le cahier rappelle aussi que l'appellation « Grandes Découvertes » est aujourd'hui remise en cause par les historiens (ex. 14b)." },
  { t:"ex", s:"Cahier p. 18, ex. 8 · p. 21, ex. 12c · p. 22, ex. 14", items:[
    ["Ex. 12c","Tu as comparé Las Casas et Sepúlveda : ils n'ont pas le même point de vue.","Deux auteurs du même pays et de la même époque peuvent juger les mêmes faits de façon opposée."],
    ["Ex. 14","Les questions sur la statue de Pizarro et sur le nom « Grandes Découvertes » sont restées vides.","À préparer avec les éléments de cette page : qui parle, à quelle époque, et de quel côté."]] },
  { t:"tip", h:"Pour présenter des interprétations, ne donne pas ton avis tout de suite : présente d'abord chaque point de vue (qui, quand, de quel côté, une citation), puis montre en quoi ils s'opposent. Utilise les mots du livre : point de vue européen, point de vue amérindien." },
  { t:"see", ids:["S9","C2","C4"] },
  { t:"src", h:"Livre p. 35, p. 36, p. 37, p. 44 (doc. 16), p. 45 (doc. 20), p. 47 (doc. 27, 28) · cahier ex. 8, 12c, 14" },
]},

/* ---------------- C2 ---------------- */
{ id:"C2", ch:"C", titre:"Comprendre comment les peuples se perçoivent", court:"Ce que disent les textes et les images des uns sur les autres",
  obj:"comprendre comment les peuples se perçoivent à l'aide de textes et d'illustrations",
  pre:[{ q:"Selon les paroles de Moctezuma, pour quoi certains Amérindiens prenaient-ils les Espagnols ?", a:"Pour des dieux, à qui des bêtes farouches obéissaient et qui tenaient la foudre entre leurs mains.", s:"Livre p. 44, doc. 18" }, { q:"Sur l'image de 1594, comment sont représentés les Amérindiens face à Colomb ?", a:"Dociles, accueillants, respectueux, soumis, presque nus, et ils offrent des présents.", s:"Cahier ex. 9a (corrigé)" }],
  blank:{ consigne:"Fais deux colonnes : comment les Amérindiens voient les Européens, et comment les Européens voient les Amérindiens. Une source par ligne.", points:["Amérindiens → Européens : des dieux, avec des bêtes et la foudre ; puis des hommes « assoiffés d'or » (doc. 18, Moctezuma)", "Amérindiens → Européens : « Cet or, nous mangeons » (doc. 19, Guamán Poma) ; « nos dieux déjà sont morts » (doc. 22)", "Européens → Amérindiens : sans armes, sans fer, « d'aucune religion », faciles à convertir (Colomb, doc. 14 et texte d)", "Européens → Amérindiens : « médiocrement humains » (Sepúlveda) ou « doux et paisibles agneaux » (Las Casas)", "Chinois → Portugais : violents, ils enfreignent les lois, on les soupçonne d'espionner (doc. 31)"], s:"Livre pp. 43-49 · cahier ex. 9" },
  blocks:[
  { t:"p", s:"Livre p. 35, « Apprentissages visés » · cahier p. 20, ex. 11 (consigne)", h:"Ton manuel annonce : « analyser la vision d'un peuple (les Amérindiens, les Européens : Espagnols, Portugais) par un autre peuple à l'aide de diverses sources (textuelles, iconographiques) ». La consigne de ton exercice 11 donne la méthode : « prends en compte la date de la source »." },
  { t:"h3", h:"Comment les Amérindiens voient les Européens" },
  { t:"html", s:"Livre p. 44 (doc. 18, 19), p. 45 (doc. 22), p. 47 (doc. 26)", h:tbl(["Source","Ce qu'elle montre"], [
    ["Doc. 18 · paroles de Moctezuma rapportées par Cortés, 1521","D'abord des dieux, avec des bêtes farouches et la foudre ; Moctezuma reconnaît ensuite des hommes « assoiffés d'or ». Les chevaux deviennent « de grands cerfs », les fusils « des tuyaux d'un métal » inconnu."],
    ["Doc. 19 · Guamán Poma de Ayala, chroniqueur inca, 1615","L'Inca : « Vous mangez cet or ? » ; l'Espagnol : « Cet or, nous mangeons. » Les Espagnols sont vus comme obsédés par l'or."],
    ["Doc. 22 · prêtres aztèques, rapporté par Sahagún, vers 1564","« Laissez-nous donc mourir, […] car nos dieux déjà sont morts. » Ils refusent la nouvelle religion : « nous ne l'acceptons pas pour vérité »."],
    ["Doc. 26 · Guamán Poma de Ayala, 1615","Des scènes de tortures infligées aux Indiens refusant de se soumettre aux Espagnols."]]) },
  { t:"pause", q:"Dans le doc. 18, que sont les « grands cerfs » et les « tuyaux d'un métal » dont parle Moctezuma ?", a:"Les chevaux et les armes à feu des Espagnols, que les Aztèques ne connaissaient pas.", s:"Livre p. 44, doc. 18 · p. 41 (pas de chevaux en Amérique)" },
  { t:"h3", h:"Comment les Européens voient les Amérindiens" },
  { t:"html", s:"Livre p. 43 (doc. 14), p. 45 (doc. 20), p. 47 (doc. 28) · cahier p. 19 (texte d)", h:tbl(["Source","Ce qu'elle montre"], [
    ["Colomb, lettre de 1493 (doc. 14 et texte d)","Des gens nus, sans armes, qui ne connaissent pas le fer, « d'aucune religion » : ils « se feraient aisément chrétiens »."],
    ["Las Casas, 1552 (doc. 20)","« Les êtres les plus doux et les plus pacifiques du monde », de « doux et paisibles agneaux »."],
    ["Sepúlveda, 1544 (doc. 28)","Des « hommelets si médiocrement humains », sans lois écrites, aux « traditions barbares »."]]) },
  { t:"pause", q:"Pourquoi Colomb pense-t-il que les habitants se feraient aisément chrétiens ?", a:"Parce qu'il lui a paru qu'ils n'étaient d'aucune religion.", s:"Cahier p. 19, texte d" },
  { t:"h3", h:"Les images aussi parlent" },
  { t:"mine", s:"Cahier p. 19, ex. 9 (doc. b, gravure de 1594 ; doc. c, huile sur toile de 1890) · p. 20, ex. 10", titre:"Ce que tu as lu dans les images", items:["Les Espagnols sont représentés fiers, en armure, avec épées, fusils, croix et bannière.","Les Amérindiens sont représentés dociles, accueillants, soumis, presque nus, avec des présents.","Codex de Tlaxcala (1550) : une rencontre paisible, mais Cortés est assis en position de supériorité, entouré de soldats armés."] },
  { t:"h3", h:"Et les Chinois ?" },
  { t:"p", s:"Livre p. 49, doc. 31 (ministre chinois des rites, vers 1522)", h:"Pour le ministre chinois des rites, les Portugais « se sont montrés violents et ont enfreint les lois » ; « s'ils séjournent longtemps, on peut soupçonner qu'ils espionnent ». Il faut donc « les expulser tous »." },
  { t:"tip", h:"Pour chaque source, pose-toi trois questions : qui l'a faite (un Européen, un Amérindien, un Chinois) ? Quand (pendant les événements, ou bien plus tard, comme le tableau de 1890) ? Qu'est-ce qu'elle montre de l'autre peuple ? Une image peinte longtemps après n'est pas un témoin direct." },
  { t:"see", ids:["S3","S9","C1"] },
  { t:"src", h:"Livre p. 35, p. 43, pp. 44-45, p. 47, p. 49 (doc. 14, 18, 19, 20, 22, 26, 28, 31) · cahier ex. 9, 10, 11" },
]},

/* ---------------- C3 ---------------- */
{ id:"C3", ch:"C", titre:"Comparer la représentation du monde", court:"Le globe de Behaim (1492), le planisphère de Cantino (1502), le monde connu vers 1400 et vers 1550",
  obj:"de comparer la représentation du monde à différentes époques",
  pre:[{ q:"Sur le globe de Martin Behaim, réalisé en 1492, l'Amérique figure-t-elle ?", a:"Non : l'Amérique n'y figure pas.", s:"Livre p. 42, doc. 13" }, { q:"Vers 1400, les Européens connaissent-ils l'océan Pacifique ?", a:"Non : il fait partie des nouvelles parties du monde connues vers 1550.", s:"Livre p. 37, carte · cahier ex. 2 (corrigé)" }],
  blank:{ consigne:"Compare trois représentations du monde dans l'ordre chronologique : ce qu'on y voit, ce qui manque.", points:["Globe de Martin Behaim, 1492 : le plus ancien globe connu ; l'Amérique n'y figure pas ; l'océan Indien est ouvert au sud, avec des îles au hasard", "Il s'appuie sur des sources antiques (Ptolémée) et des récits médiévaux (Marco Polo)", "Planisphère de Cantino, 1502 : il représente les découvertes portugaises", "1507 : on réédite La Géographie de Ptolémée en y ajoutant le nom de l'Amérique (Amerigo Vespucci)", "Carte p. 37 : le monde connu des Européens vers 1400, puis vers 1550 (Amérique, Pacifique, côtes de l'Afrique)"], s:"Livre p. 36, p. 37, p. 42, p. 43 · cahier ex. 2" },
  blocks:[
  { t:"p", s:"Livre p. 35, « Apprentissages visés »", h:"Ton manuel annonce : « comparer la représentation d'un même espace (le globe terrestre / la Terre) à différentes époques ». Comparer, c'est dire ce qui est représenté, ce qui manque, et pourquoi." },
  { t:"h3", h:"Le globe de Martin Behaim (1492)" },
  { t:"p", s:"Livre p. 42, doc. 13 · p. 36 (diagramme du globe)", h:"<b>Martin Behaim</b>, marin et artiste de Nuremberg, se met au service du Portugal et participe à une expédition le long des côtes de l'Afrique en 1484-1485. Le globe qu'il réalise ensuite, <b>le plus ancien connu</b>, reflète l'état des connaissances de son époque : <b>l'Amérique n'y figure pas</b> et l'océan Indien, encore largement inexploré, est représenté ouvert au sud, avec quelques îles semées au hasard. Ce tracé, géographiquement imprécis, s'appuie encore beaucoup sur des sources antiques, comme <i>La Géographie</i> de Ptolémée, et des récits médiévaux (dont celui de Marco Polo)." },
  { t:"pause", q:"Sur quelles sources s'appuie le globe de Behaim ?", a:"Sur des sources antiques, comme La Géographie de Ptolémée, et des récits médiévaux, dont celui de Marco Polo.", s:"Livre p. 42, doc. 13" },
  { t:"h3", h:"Après les grands voyages" },
  { t:"html", s:"Livre p. 36 (globe de Behaim, planisphère de Cantino), p. 42 (doc. 13), p. 43 (encadré), p. 48 (doc. 29)", h:tbl(["Représentation","Ce qu'elle montre"], [
    ["Globe de Behaim, <b>1492</b>","Pas d'Amérique ; océan Indien ouvert au sud ; connaissances antiques et médiévales."],
    ["Planisphère de Cantino, <b>1502</b>","Les découvertes portugaises, dix ans après Colomb."],
    ["La Géographie de Ptolémée rééditée en <b>1507</b>","Le nom de l'Amérique y est ajouté ; il vient du Florentin Amerigo Vespucci, qui a fait plusieurs voyages au Brésil."],
    ["Carte des empires coloniaux, <b>XVII<sup>e</sup> siècle</b> (doc. 29)","Il reste encore des « terres inconnues en 1600 »."]]) },
  { t:"pause", q:"D'où vient le nom « Amérique », et quand apparaît-il sur une carte ?", a:"Du Florentin Amerigo Vespucci ; il est ajouté en 1507 dans une réédition de La Géographie de Ptolémée.", s:"Livre p. 43, encadré" },
  { t:"h3", h:"Le monde connu des Européens, vers 1400 et vers 1550" },
  { t:"p", s:"Livre p. 37, carte « L'élargissement du monde connu des Européens » (légende)", h:"La carte de la p. 37 distingue la terre et l'océan connus des Européens <b>vers 1400</b>, puis la terre et l'océan connus <b>vers 1550</b>. Vers 1400 : l'Europe, le Moyen-Orient, une partie de l'Asie et le nord de l'Afrique. Vers 1550 s'ajoutent notamment les côtes de l'Afrique, une partie de l'Amérique et de nouveaux océans." },
  { t:"mine", s:"Cahier p. 15, ex. 2 (corrigé en classe, livre p. 37)", titre:"Ton exercice 2 (avec les corrections de la classe)", items:["Connues vers 1400 : l'Afrique (côtes nord), l'Asie (pas complète), le Moyen-Orient, la mer Méditerranée, l'Inde (côte ouest).","Nouvelles vers 1550 : l'Afrique (côtes sud), le Japon (sud), l'Amérique du Sud (pas centrale), l'Amérique du Nord, l'océan Pacifique.","Encore inconnues vers 1550 : l'Afrique centrale, le reste du Japon, l'Océanie, l'Amérique centrale, une partie de l'océan Indien."] },
  { t:"pause", q:"Vers 1550, quelles parties du monde restent encore inconnues des Européens ? Cite-en deux.", a:"Par exemple : l'Afrique centrale, l'Océanie (et le reste du Japon, une partie de l'océan Indien).", s:"Cahier ex. 2 (corrigé) · livre p. 37" },
  { t:"tip", h:"Pour comparer deux représentations, commence par la date et l'auteur, puis compare : ce qui est représenté, ce qui manque (l'Amérique en 1492), ce qui est faux ou imprécis (l'océan Indien de Behaim). Termine par la raison : les voyages ont fait progresser les connaissances." },
  { t:"see", ids:["S1","S2","C5"] },
  { t:"src", h:"Livre p. 35, p. 36, p. 37 (carte), p. 42 (doc. 13), p. 43 (encadré), p. 48 (doc. 29) · cahier ex. 2" },
]},

/* ---------------- C4 ---------------- */
{ id:"C4", ch:"C", titre:"Les conséquences à court et à long terme", court:"Ce qui arrive tout de suite, et ce qui dure encore",
  obj:"de comprendre les conséquences de ces événements à court terme et à long terme",
  pre:[{ q:"La disparition des Amérindiens des Antilles est-elle une conséquence à court ou à long terme ?", a:"À court terme : ils disparaissent en cinquante ans après l'arrivée de Colomb.", s:"Livre p. 46" }, { q:"Le métissage culturel est-il une conséquence à court ou à long terme ?", a:"À long terme : il a permis de conserver une partie de la culture amérindienne jusqu'à nos jours.", s:"Livre p. 47" }],
  blank:{ consigne:"Fais deux colonnes, court terme et long terme, avec au moins trois conséquences et une date dans chaque colonne.", points:["Court terme : conquête des empires aztèque (1519-21) et inca (1531-1533)", "Court terme : choc microbien, conversions forcées, exploitation ; les Amérindiens des Antilles disparaissent en cinquante ans", "Long terme : empires coloniaux et traite atlantique (XVIe-XVIIe siècles)", "Long terme : l'échange colombien diffuse les plantes dans le monde (pomme de terre en Europe au XVIIIe siècle), croissance démographique", "Long terme : métissage culturel jusqu'à nos jours ; indépendance des colonies vers 1825 ; débats d'aujourd'hui (statue de Pizarro, 2004)"], s:"Livre pp. 34-35, 44-49 · cahier ex. 14a" },
  blocks:[
  { t:"p", s:"Feuille d'objectifs · livre p. 35, « Apprentissages visés »", h:"Une conséquence <b>à court terme</b> arrive pendant ou juste après les événements (quelques années, quelques dizaines d'années). Une conséquence <b>à long terme</b> se voit des siècles plus tard, parfois jusqu'à aujourd'hui. Pour les classer, regarde les dates que donne ton livre." },
  { t:"html", s:"Livre p. 44, 45, 46, 47 (court terme) · p. 34-35 (frise), 47, 48, 49 · cahier ex. 14a (long terme)", h:tbl(["","Ce que dit ton livre"], [
    ["<b>Court terme</b><br>XVI<sup>e</sup> siècle","Conquête du Mexique (1519-21) et du Pérou (1531-1533) ; empereurs Moctezuma et Atahualpa tués."],
    ["","Choc microbien : les Amérindiens des Antilles disparaissent en cinquante ans ; au Mexique, d'environ 25 millions à environ 1 million en 1605."],
    ["","Conversions forcées, temples détruits, autodafés ; exploitation dans les mines et les grands domaines."],
    ["<b>Long terme</b><br>du XVI<sup>e</sup> siècle à nos jours","Les empires coloniaux et la traite atlantique ; l'Europe au cœur du commerce mondial."],
    ["","L'échange colombien : diffusion des plantes cultivées dans le monde (pomme de terre en Europe au XVIII<sup>e</sup> siècle), croissance démographique."],
    ["","Le métissage culturel, qui conserve une partie de la culture amérindienne jusqu'à nos jours."],
    ["","Vers 1825 : indépendance des colonies espagnoles et portugaises d'Amérique (frise p. 35)."],
    ["","Aujourd'hui : la statue de Pizarro déplacée à Lima en 2004, des Amérindiens qui manifestent à Brasilia en 2015."]]) },
  { t:"pause", q:"Cite une conséquence à court terme et une conséquence à long terme de l'arrivée des Européens en Amérique.", a:"Par exemple : à court terme, le choc microbien (les Amérindiens des Antilles disparaissent en cinquante ans) ; à long terme, le métissage culturel jusqu'à nos jours, ou l'échange colombien.", s:"Livre pp. 46-47, 49" },
  { t:"svg", k:"pop", titre:"Le choc microbien : une conséquence immédiate", alt:"Le graphique compare la population amérindienne avant et après la conquête, pour trois régions. Aux Antilles : 4 millions en 1492, plus personne cinquante ans plus tard. Au Mexique : plus de 25 millions avant 1492, environ 1 million en 1605. Au Pérou : environ 10 millions, puis 1 million en 1605.", s:"Livre p. 46, « Le choc microbien »" },
  { t:"h3", h:"Des conséquences pour qui ?" },
  { t:"p", s:"Livre p. 35, « Apprentissages visés » · p. 46-49", h:"Le manuel demande aussi de distinguer les conséquences « selon différents points de vue (européens, amérindiens, etc.) ». Pour les Européens : des richesses (or, argent, produits rares), de nouveaux territoires, l'Europe au cœur du commerce mondial. Pour les Amérindiens : la conquête, les maladies, le travail forcé, la perte de leurs dieux. Pour les Africains : la traite atlantique." },
  { t:"pause", q:"Pour les Africains, quelle est la conséquence de la colonisation de l'Amérique ?", a:"La traite atlantique : les puissances coloniales vont chercher en Afrique la main-d'œuvre dont elles ont besoin ; les esclaves sont vendus en Amérique.", s:"Livre p. 48" },
  { t:"ex", s:"Cahier p. 21, ex. 12 · p. 22, ex. 13d et 14", items:[
    ["Ex. 12","Tu as construit le graphique de la population amérindienne.","Une conséquence à court terme se mesure en dizaines d'années : 1492, 1542, 1605."],
    ["Ex. 14","Questions sur des réactions d'aujourd'hui (statue de Pizarro, « Grandes Découvertes »), restées vides.","Ces événements ont des conséquences jusqu'à nos jours : c'est le long terme."]] },
  { t:"tip", h:"Classe chaque conséquence avec une date : si elle tombe au XVIe siècle, c'est le court terme ; si elle va jusqu'aux siècles suivants ou jusqu'à nos jours, c'est le long terme. Ajoute à chaque fois pour qui c'est une conséquence (Européens, Amérindiens, Africains)." },
  { t:"see", ids:["S6","S7","C1"] },
  { t:"src", h:"Livre pp. 34-35 (frise, apprentissages visés), pp. 44-49 · cahier ex. 12, 13, 14" },
]},

/* ---------------- C5 ---------------- */
{ id:"C5", ch:"C", titre:"Représenter les expéditions sur une carte", court:"Six navigateurs, leurs routes, leurs dates",
  obj:"de représenter sur une carte des informations concernant les expéditions et découvertes",
  pre:[{ q:"Quel navigateur a contourné l'Afrique par le cap de Bonne-Espérance pour arriver en Inde ?", a:"Vasco de Gama (arrivée en Inde en 1498).", s:"Livre p. 37 et p. 43" }, { q:"Quel passage, au sud de l'Amérique, porte le nom d'un navigateur ?", a:"Le détroit de Magellan, franchi en 1519.", s:"Livre p. 43" }],
  blank:{ consigne:"Dessine de mémoire un planisphère simple et trace les routes de quatre navigateurs, avec une légende (couleur ou trait) et les dates.", points:["Colomb (1492-1493) : de l'Espagne aux Bahamas, vers l'ouest", "Vasco de Gama (1497-1498) : du Portugal à l'Inde, par le cap de Bonne-Espérance", "Cabral (1500-1501) : du Portugal au Brésil, en partant loin au large de l'Afrique", "Magellan (1519-1522) : de Séville au détroit de Magellan, puis le Pacifique, les Philippines, et retour à Séville", "Cabot (1497-1498) : Amérique du Nord ; Cartier (1534-1542) : le Canada, le fleuve Saint-Laurent", "Une légende, un titre, et la mention des points de repère (cap de Bonne-Espérance, détroit de Magellan)"], s:"Livre p. 43, doc. 15 · cahier ex. 8" },
  blocks:[
  { t:"p", s:"Livre p. 43, doc. 15 « Voyages de quelques grands navigateurs »", h:"Le doc. 15 de ton livre trace les routes de six navigateurs, chacun avec sa couleur et son type de trait. Voici le même schéma, simplifié : chaque route a son propre pointillé, pour que tu les distingues même sans les couleurs." },
  { t:"svg", k:"routes", titre:"Les voyages de six grands navigateurs (schéma simplifié)", alt:"La carte montre six routes qui partent de l'Europe. Un : Christophe Colomb, en 1492-1493, va de l'Espagne aux Bahamas en traversant l'Atlantique vers l'ouest. Deux : Jean Cabot, en 1497-1498, atteint les côtes de l'Amérique du Nord. Trois : Vasco de Gama, en 1497-1498, descend le long de l'Afrique, passe le cap de Bonne-Espérance et arrive en Inde. Quatre : Pedro Alvares Cabral, en 1500-1501, part loin au large et accoste au Brésil. Cinq : Fernand de Magellan, de 1519 à 1522, part de Séville, longe l'Amérique du Sud, franchit le détroit de Magellan, traverse le Pacifique jusqu'aux Philippines, puis son expédition revient à Séville par l'océan Indien et le sud de l'Afrique. Six : Jacques Cartier, de 1534 à 1542, va au Canada, jusqu'au fleuve Saint-Laurent.", s:"Livre p. 43, doc. 15 et texte" },
  { t:"html", s:"Livre p. 43, texte et légende du doc. 15 · cahier ex. 8 (corrigé)", h:tbl(["Navigateur (dates du doc. 15)","Pour qui ? Où ?"], [
    ["Christophe Colomb (1492-1493)","Au service des rois d'Espagne ; vers l'ouest, il débarque aux Bahamas, convaincu d'être aux Indes."],
    ["Jean Cabot (1497-1498)","Au service du roi d'Angleterre ; les côtes de l'Amérique du Nord, à la fin du XV<sup>e</sup> siècle."],
    ["Vasco de Gama (1497-1498)","Portugais ; contourne l'Afrique par le cap de Bonne-Espérance et atteint les Indes en 1498 : le premier à y arriver ainsi."],
    ["Pedro Alvares Cabral (1500-1501)","Portugais ; en 1500, il accoste au Brésil en cherchant à contourner l'Afrique en partant loin au large : le premier à aborder les côtes du Brésil."],
    ["Fernand de Magellan (1519-1522)","Au service de l'Espagne ; franchit en 1519 le détroit qui porte son nom ; mort aux Philippines ; son expédition revient à Séville en 1522 : premier tour du monde."],
    ["Jacques Cartier (1534-1542)","Pour la couronne de France ; accoste au Canada, à l'embouchure du Saint-Laurent, en 1535."]]) },
  { t:"pause", q:"Qui a accosté au Brésil en 1500, et en cherchant à faire quoi ?", a:"Pedro Alvares Cabral, en cherchant à contourner l'Afrique en partant loin au large.", s:"Livre p. 43" },
  { t:"p", s:"Livre p. 43, texte et encadré · cahier ex. 8", h:"Avant Vasco de Gama, les Portugais atteignent le <b>cap de Bonne-Espérance en 1487</b>. Ton exercice 8 ajoute <b>Amerigo Vespucci</b> : ses expéditions au Brésil lui permettent de réaliser qu'un nouveau continent a été découvert ; le nom « Amérique » vient de lui." },
  { t:"pause", q:"Quel point de départ et d'arrivée a l'expédition de Magellan ?", a:"Séville : elle en part en 1519 et y revient en 1522.", s:"Livre p. 43" },
  { t:"h3", h:"Les grands empires sur la carte de la p. 34" },
  { t:"p", s:"Livre p. 34, carte d'ouverture", h:"La carte d'ouverture du chapitre place les Européens (Angleterre, France, Espagne, Portugal) face au monde : l'<b>Empire aztèque</b> (Tenochtitlan) et les <b>Mayas</b> au Mexique, l'<b>Empire inca</b> le long des Andes (Cuzco, Machu Picchu), Cuba et les Bahamas, l'<b>Empire ottoman</b> (Constantinople), les empires et royaumes africains, et, sur la p. 35, l'<b>Empire chinois</b>, le <b>Japon</b> et les <b>royaumes indiens</b>." },
  { t:"ex", s:"Cahier p. 18, ex. 8 (corrigé en classe) · p. 15, ex. 2", items:[
    ["Ex. 8","Tu as relié sept voyageurs à leur expédition (Colomb, Vespucci, Cabral, Cabot, Magellan, Vasco de Gama, Cartier).","Chaque navigateur a un « exploit » à retenir : premier tour du monde, première arrivée aux Indes par l'Afrique, premier au Brésil…"],
    ["Ex. 2","Tu as classé les parties du monde connues vers 1400 et vers 1550.","Une carte peut montrer l'évolution des connaissances dans le temps (voir C3)."]] },
  { t:"tip", h:"Une carte d'histoire a toujours un titre, une légende et des dates. Donne à chaque navigateur un trait différent (couleur ou pointillé), écris la date à côté de la route, et place les repères : Espagne et Portugal au départ, Bahamas, Brésil, cap de Bonne-Espérance, Inde, détroit de Magellan." },
  { t:"see", ids:["S2","C3","P"] },
  { t:"src", h:"Livre p. 34 (carte), p. 37, p. 43 (doc. 15, texte, encadré) · cahier ex. 2 et 8" },
]},

/* ---------------- T ---------------- */

  });
  return out;
}

    { front:"Pourquoi la prise de Constantinople en 1453 pousse-t-elle les Européens vers la mer ?", back:["Elle risque de couper la route terrestre vers les ports de l'océan Indien"], wrong:["Elle ferme tous les ports de l'Atlantique","Elle donne aux Européens de nouveaux bateaux","Elle oblige les Européens à quitter l'Europe"], mcqOnly:true, ans:"La prise de Constantinople par les Turcs risque de couper la route terrestre qui mène aux ports de l'océan Indien : on cherche un accès maritime.", src:"livre p. 42" },
    { front:"En quelle année les Turcs prennent-ils Constantinople ?", back:["1453"], opts:["1271","1453","1492","1498"], keepOrder:true, ans:"1453 : un événement de l'exercice 1.", src:"livre p. 34, frise · p. 42 · cahier ex. 1a" },
    { front:"Selon le livre p. 37, par qui les Européens veulent-ils éviter de passer pour atteindre l'Asie ?", back:["Par l'intermédiaire des marchands musulmans"], wrong:["Par les Vénitiens","Par les Portugais","Par les Chinois"], mcqOnly:true, ans:"Ils cherchent de nouvelles routes sans passer par l'intermédiaire des marchands musulmans.", src:"livre p. 37" },
    { front:"À part le commerce, quel but religieux ont aussi les Européens ?", back:["Convertir de nouvelles populations au christianisme"], wrong:["Fonder une nouvelle religion","Rencontrer le pape","Apprendre les religions de l'Asie"], mcqOnly:true, ans:"Ils souhaitent aussi convertir de nouvelles populations au christianisme.", src:"livre p. 37" },
    { front:"Quel voyageur, avec son Livre des Merveilles du Monde, fait rêver les Européens des richesses de l'Asie ?", back:["Marco Polo","Polo"], opts:PERS, ans:"Marco Polo (1254-1324) : le récit de son voyage décrit les richesses extraordinaires de l'Asie.", src:"livre p. 37" },
    { front:"Quel nouveau navire, petit, léger, rapide et très maniable, les Portugais mettent-ils au point ?", back:["la caravelle","caravelle"], wrong:["la caraque","la galère","le porte-conteneurs"], ans:"La caravelle, inspirée de l'évolution de la caraque.", src:"livre p. 42" },
    { front:"Quelles innovations aident les marins à se repérer et à s'orienter ?", back:["Les portulans, la boussole et l'astrolabe"], wrong:["Le GPS et le radar","Le télescope et l'horloge","La carte de Behaim et la caraque"], mcqOnly:true, ans:"Des cartes nautiques de plus en plus précises (comme les portulans), la boussole, l'astrolabe.", src:"livre p. 42" },
    { front:"Quelle direction choisissent les navigateurs portugais pour atteindre les Indes ?", back:["l'est, en contournant l'Afrique"], opts:["l'est, en contournant l'Afrique","l'ouest, à travers l'Atlantique","le nord, par l'Arctique"], keepOrder:true, ans:"Les Portugais cherchent un passage par l'est, en contournant l'Afrique ; les Espagnols misent sur l'ouest.", src:"livre p. 42" },
    { front:"Au début du XVe siècle, aux mains de qui est le commerce entre l'Europe et l'Asie ?", back:["des Vénitiens","Vénitiens","Venise"], wrong:["des Portugais","des Espagnols","des Anglais"], ans:"Des Vénitiens. Ces échanges existent depuis l'époque romaine.", src:"livre p. 37" },
  ]},
  { key:"rencontre", code:"S3", title:"La rencontre", src:"livre pp. 37, 43, 44 · cahier ex. 9 et 10", items:[
    { front:"Où Christophe Colomb débarque-t-il en 1492, et où croit-il être arrivé ?", back:["Sur une île des Bahamas ; il croit être aux Indes"], wrong:["Au Brésil ; il croit être en Afrique","Au Mexique ; il croit être en Chine","Au Canada ; il croit être au Japon"], mcqOnly:true, ans:"Il débarque sur une île des Bahamas, convaincu d'être arrivé aux Indes.", src:"livre p. 43" },
    { front:"Selon le texte d (12 octobre 1492), que fait Colomb en débarquant ?", back:["Il prend possession de la terre au nom du Roi et de la Reine"], wrong:["Il offre des présents au chef de l'île","Il repart aussitôt vers l'Espagne","Il construit une église"], mcqOnly:true, ans:"Il débarque avec la bannière royale et prend possession de la terre au nom du Roi et de la Reine.", src:"cahier p. 19, texte d (lettre de Colomb, 1493)" },
    { front:"Pourquoi Colomb pense-t-il que les habitants se feraient aisément chrétiens ?", back:["Il lui a paru qu'ils n'étaient d'aucune religion"], wrong:["Ils connaissaient déjà la Bible","Ils le lui ont demandé","Ils avaient déjà des églises"], mcqOnly:true, ans:"« Je crois qu'ils se feraient aisément chrétiens, car il m'a paru qu'ils n'étaient d'aucune religion. »", src:"cahier p. 19, texte d" },
    { front:"Dans sa lettre (doc. 14), que dit Colomb des habitants de l'île ?", back:["Ils ne connaissent pas le fer ni l'acier et n'ont pas d'armes"], wrong:["Ils sont armés de fusils","Ils parlent espagnol","Ils sont très nombreux et violents"], mcqOnly:true, ans:"« Les habitants de cette île ne connaissent pas le fer, ni l'acier ; ils ne possèdent pas d'armes et ne savent pas s'en servir. »", src:"livre p. 43, doc. 14" },
    { front:"Selon la lettre de Colomb, que charrient la plupart des grandes rivières de l'île ?", back:["de l'or","or","l'or"], wrong:["de l'argent","des épices","du sel"], ans:"De l'or. Colomb décrit une terre riche, pour montrer que son voyage était utile.", src:"livre p. 43, doc. 14" },
    { front:"Ex. 9 : comment les Amérindiens sont-ils représentés sur les images de l'arrivée de Colomb ?", back:["Dociles, accueillants, respectueux, soumis"], wrong:["Fiers et armés de fusils","En armure et casque","Menaçants et violents"], mcqOnly:true, ans:"Dociles, accueillants, respectueux, soumis ; presque nus ; ils offrent des présents. Les Espagnols, eux, sont fiers et armés.", src:"cahier ex. 9a (corrigé)" },
    { front:"Ex. 10 : quelle atmosphère se dégage de la rencontre entre Cortés et Maxixcatzin ?", back:["Paisible, calme, amicale"], wrong:["Violente et guerrière","Triste et inquiète","Méfiante et hostile"], mcqOnly:true, ans:"L'atmosphère paraît paisible, calme, amicale : le chef de Tlaxcala offre des cadeaux comme signe de bienvenue.", src:"cahier ex. 10b (corrigé) · doc. e, Codex de Tlaxcala, 1550" },
    { front:"Ex. 10 : quels éléments de l'image annoncent toutefois la conquête ?", back:["Les armes des soldats espagnols et de leurs alliés, Cortés en position de supériorité"], wrong:["Les cadeaux offerts par Maxixcatzin","Les dindes et les paniers de maïs","L'interprète qui traduit"], mcqOnly:true, ans:"On voit les armes des soldats espagnols et de leurs alliés ; Cortés est assis en position de supériorité, sur une petite estrade.", src:"cahier ex. 10c (corrigé)" },
    { front:"Qui reçoit Cortés à Tenochtitlan en 1519 ?", back:["Moctezuma","l'empereur Moctezuma"], wrong:["Atahualpa","Maxixcatzin","Túpac Amaru"], ans:"L'empereur aztèque Moctezuma.", src:"livre p. 44" },
    { front:"Selon Sahagún (doc. 17), comment réagissent les Espagnols quand on leur offre des colliers d'or ?", back:["Leur visage s'éclaira, grande fut leur joie"], wrong:["Ils les refusèrent poliment","Ils se mirent en colère","Ils les offrirent au pape"], mcqOnly:true, ans:"« Leur visage s'éclaira, grande fut leur joie, ils étaient aux anges. »", src:"livre p. 44, doc. 17" },
  ]},
  { key:"ameri", code:"S4", title:"Aztèques, Incas, Mayas", src:"livre pp. 40-41", items:[
    { front:"D'où viennent les ancêtres des Amérindiens, et par où sont-ils passés ?", back:["D'Asie, par le détroit de Béring"], wrong:["D'Europe, par l'Atlantique","D'Afrique, par le Brésil","D'Océanie, par le Pacifique"], mcqOnly:true, ans:"Venus d'Asie il y a au moins 40 000 ans, par le détroit de Béring, alors franchissable grâce aux glaciations.", src:"livre p. 40 · cahier ex. 4a" },
    { front:"Quelle est la capitale des Aztèques ?", back:["Tenochtitlán","Tenochtitlan","Mexico"], wrong:["Cuzco","Machu Picchu","Chichén Itzá"], ans:"Tenochtitlán, l'actuelle Mexico, fondée en 1325.", src:"livre p. 41" },
    { front:"En quelle année les Aztèques fondent-ils Tenochtitlán ?", back:["1325"], opts:["1325","1445","1492","1519"], keepOrder:true, ans:"En 1325, sur le haut plateau central du Mexique.", src:"livre p. 41" },
    { front:"Le long de quelle chaîne de montagnes s'étend l'Empire inca ?", back:["la cordillère des Andes","les Andes","Andes"], wrong:["les Alpes","les Rocheuses","l'Himalaya"], ans:"La cordillère des Andes ; les Incas cultivent sur des terrasses aménagées aux flancs des montagnes.", src:"livre p. 41" },
    { front:"Comment est appelé l'empereur inca, considéré comme d'origine divine ?", back:["le fils du Soleil","fils du Soleil"], wrong:["le roi des dieux","le grand serpent","le maître de la Lune"], ans:"Le « fils du Soleil », souverain au pouvoir absolu.", src:"livre p. 41" },
    { front:"Pourquoi les Aztèques offrent-ils du sang humain à leurs dieux ?", back:["Pour que leurs dieux ne perdent pas leurs forces"], wrong:["Pour faire pleuvoir sur le maïs","Pour chasser les Espagnols","Pour fêter la fondation de Tenochtitlán"], mcqOnly:true, ans:"Pour éviter que leurs nombreux dieux ne perdent leurs forces, ils les « nourrissent » en leur offrant du sang humain.", src:"livre p. 41" },
    { front:"Les Mayas forment-ils un empire dirigé par un souverain ?", back:["Non : ils s'organisent en cités-États"], wrong:["Oui : un empereur, fils du Soleil","Oui : l'empereur Moctezuma","Non : ils vivent dans le désert"], mcqOnly:true, ans:"Non : ils s'organisent plutôt en cités-États disposant chacune de son propre système de gouvernement.", src:"livre p. 40" },
    { front:"Pourquoi l'écriture maya n'est-elle pas encore complètement déchiffrée ?", back:["La plupart des codex ont été détruits en 1562"], wrong:["Elle n'a que trois signes","Personne ne l'a jamais vue","Elle était secrète"], mcqOnly:true, ans:"Leur écriture compte plus de 1000 signes, mais la plupart des codex ont été détruits en 1562.", src:"livre p. 40" },
    { front:"Vrai ou faux : les peuples amérindiens utilisent la roue et des outils en fer ?", back:["Faux"], opts:["Vrai","Faux"], keepOrder:true, ans:"Faux : la roue n'est pas utilisée et il n'y a pas d'outils en fer (ni chevaux).", src:"livre p. 41, points communs" },
    { front:"Dans quels domaines les peuples amérindiens ont-ils des connaissances étendues ?", back:["en mathématiques et en astronomie","mathématiques et astronomie"], wrong:["en navigation et en métallurgie du fer","en médecine et en imprimerie","en élevage de chevaux"], mcqOnly:true, ans:"En mathématiques et en astronomie (les Mayas ont des calendriers perfectionnés).", src:"livre p. 41, points communs · p. 40" },
    { front:"Quels animaux domestiques les peuples amérindiens ont-ils ?", back:["Peu : lamas, dindes, chiens ; pas de chevaux"], wrong:["Chevaux, vaches et moutons","Aucun animal","Chameaux et dromadaires"], mcqOnly:true, ans:"Peu d'animaux domestiques (lamas, dindes, chiens…), pas de chevaux.", src:"livre p. 41, points communs" },
    { front:"Quelle cité sanctuaire inca a été fondée vers 1445 ?", back:["Machu Picchu"], wrong:["Tenochtitlán","Chichén Itzá","Tlaxcala"], ans:"Machu Picchu, au Pérou ; les Incas sont d'excellents bâtisseurs.", src:"livre p. 41, doc. 11 · frise p. 34" },
  ]},
  { key:"conquete", code:"S5", title:"La conquête", src:"livre pp. 44-45", items:[
    { front:"Selon le livre, de quels deux avantages bénéficient les conquistadors ?", back:["La supériorité de leur armement et les rivalités entre peuples amérindiens"], wrong:["Leur nombre et la connaissance du terrain","Leurs chevaux et l'aide du pape","Leurs bateaux et leurs alliés chinois"], mcqOnly:true, ans:"La supériorité de leur armement, mais aussi les rivalités importantes existant entre les divers peuples amérindiens.", src:"livre p. 44" },
    { front:"Quel conquistador envahit l'Empire aztèque ?", back:["Hernán Cortés","Cortés","Cortès","Hernan Cortes","Cortes"], opts:["Hernán Cortés","Francisco Pizarro","Christophe Colomb","Fernand de Magellan"], ans:"Hernán Cortés, après avoir entendu parler des richesses en or du Mexique.", src:"livre p. 44" },
    { front:"Combien d'habitants compte l'Empire aztèque quand Cortés décide de l'envahir ?", back:["20 millions","vingt millions"], opts:["2 millions","20 millions","200 millions"], keepOrder:true, ans:"20 millions d'habitants.", src:"livre p. 44" },
    { front:"Que devient l'empereur Moctezuma ?", back:["Il est fait prisonnier, puis tué"], wrong:["Il s'enfuit au Pérou","Il devient l'allié de Charles Quint","Il part en Espagne"], mcqOnly:true, ans:"L'empereur est fait prisonnier, puis tué, et son territoire soumis aux Espagnols.", src:"livre p. 44" },
    { front:"Qui est l'interprète de Cortés pendant la conquête de l'Empire aztèque ?", back:["la Malinche","Malinche"], wrong:["Maxixcatzin","Atahualpa","Moctezuma"], ans:"La Malinche, esclave des Mayas offerte à Cortés ; elle devient sa compagne et son interprète.", src:"livre p. 44, doc. 16" },
    { front:"Quel conquistador conquiert l'Empire inca ?", back:["Francisco Pizarro","Pizarro"], opts:["Hernán Cortés","Francisco Pizarro","Vasco de Gama","Jacques Cartier"], ans:"Francisco Pizarro, de 1531 à 1533.", src:"livre p. 45" },
    { front:"De quelle année à quelle année Pizarro conquiert-il l'Empire inca ?", back:["1531-1533","de 1531 à 1533","1531 à 1533"], wrong:["1519-1521","1492-1498","1572-1580"], ans:"De 1531 à 1533.", src:"livre p. 45" },
    { front:"Que devient l'empereur inca Atahualpa ?", back:["Il est arrêté ; une rançon est payée, mais il est mis à mort"], wrong:["Il devient gouverneur pour les Espagnols","Il s'enfuit au Mexique","Il gagne la guerre contre Pizarro"], mcqOnly:true, ans:"Il accueille les Espagnols, est arrêté ; une rançon est payée, mais il est mis à mort.", src:"livre p. 45" },
    { front:"En quelle année Túpac Amaru, dernier empereur inca, est-il décapité ?", back:["1572"], opts:["1533","1572","1640","1697"], keepOrder:true, ans:"En 1572 : la résistance à la domination espagnole cesse.", src:"livre p. 45 · frise p. 35" },
    { front:"Dans le doc. 18, que sont les « grands cerfs » dont parle Moctezuma ?", back:["Les chevaux des Espagnols"], wrong:["Des animaux sacrés aztèques","Les lamas des Incas","Les bateaux des Espagnols"], mcqOnly:true, ans:"Les chevaux, que les Amérindiens ne connaissaient pas (« pas de chevaux », p. 41).", src:"livre p. 44, doc. 18 · p. 41" },
    { front:"Quel mot espagnol désigne un conquérant de l'Amérique centrale et du Sud ?", back:["conquistador","conquistadors","conquistadores"], wrong:["missionnaire","shôgun","amiral"], ans:"Un conquistador (glossaire p. 44).", src:"livre p. 44, glossaire" },
    { front:"Quelle date de ta feuille correspond à la conquête du Mexique par Cortès ?", back:["1519-21","1519-1521","1519 1521"], opts:["1492","1498","1519-21","1543"], keepOrder:true, ans:"1519-21 : Cortès au Mexique. (La frise p. 34 indique 1511 : c'est sûrement une erreur ; Cortés n'est reçu par Moctezuma qu'en 1519.)", src:"feuille d'objectifs · livre p. 44" },
  ]},
  { key:"consequ", code:"S6", title:"Les conséquences", src:"livre pp. 46-47", items:[
    { front:"Quelles sont les trois conséquences de la découverte de l'Amérique citées par ta feuille ?", back:["Conversions forcées, choc microbien, exploitation des Amérindiens"], wrong:["Échange colombien, traite atlantique, comptoirs","Caravelle, boussole, astrolabe","Tordesillas, Saragosse, Macao"], mcqOnly:true, ans:"Conversions forcées, choc microbien, exploitation des Amérindiens.", src:"feuille d'objectifs · livre pp. 46-47" },
    { front:"Que font les missionnaires lors d'un autodafé ?", back:["Ils brûlent les textes et les objets sacrés"], wrong:["Ils baptisent les enfants","Ils construisent des temples","Ils traduisent la Bible"], mcqOnly:true, ans:"Ils brûlent les textes (autodafés) et les objets sacrés, et détruisent les temples aztèques ou incas pour construire des églises.", src:"livre p. 46, doc. 23" },
    { front:"Pourquoi les missionnaires éduquent-ils les enfants amérindiens dans des couvents ?", back:["Pour les couper de leurs traditions"], wrong:["Pour leur apprendre à naviguer","Pour les protéger des maladies","Pour en faire des soldats"], mcqOnly:true, ans:"Ils entreprennent la conversion des élites au christianisme, éduquant les enfants dans des couvents pour les couper de leurs traditions.", src:"livre p. 46" },
    { front:"Les conversions des Amérindiens sont-elles profondes ?", back:["Non, elles restent souvent superficielles"], wrong:["Oui, tous oublient leurs dieux","Oui, ils deviennent tous prêtres","Non, personne n'est converti"], mcqOnly:true, ans:"« Mais les conversions restent souvent superficielles. »", src:"livre p. 46" },
    { front:"Quel nom le livre donne-t-il au fait que les Amérindiens n'ont aucune défense immunitaire contre les maladies nouvelles ?", back:["choc microbien","le choc microbien"], wrong:["échange colombien","traite atlantique","métissage culturel"], ans:"Le choc microbien.", src:"livre p. 46" },
    { front:"Quelles maladies venues d'Europe, d'Afrique et d'Asie touchent les Amérindiens ?", back:["Grippe, choléra, variole, rougeole, paludisme"], wrong:["Peste, lèpre, scorbut","Rhume, varicelle, angine","Aucune maladie"], mcqOnly:true, ans:"Grippe, choléra, petite vérole ou variole, rougeole, paludisme.", src:"livre p. 46" },
    { front:"Combien d'Amérindiens habitaient les Antilles à l'arrivée de Colomb ?", back:["4 millions","quatre millions"], opts:["400 000","4 millions","25 millions","10 millions"], keepOrder:true, ans:"4 millions. Cinquante ans plus tard, ils avaient disparu.", src:"livre p. 46 · cahier ex. 12a" },
    { front:"Combien d'Amérindiens peuplaient le Mexique avant 1492, et combien en 1605 ?", back:["Plus de 25 millions ; environ 1 million en 1605"], wrong:["4 millions ; aucun en 1605","10 millions ; 5 millions en 1605","1 million ; 25 millions en 1605"], mcqOnly:true, ans:"Plus de 25 millions avant 1492, environ 1 million en 1605. Au Pérou : d'environ 10 millions à 1 million.", src:"livre p. 46 · cahier ex. 12a" },
    { front:"Pourquoi les Européens résistent-ils mieux aux microbes venus d'Amérique ?", back:["Grâce aux échanges avec l'Asie et l'Afrique, ils ont de meilleures défenses immunitaires"], wrong:["Ils ont des médicaments modernes","Ils ne vont jamais en Amérique","Ils sont vaccinés"], mcqOnly:true, ans:"En Europe, grâce aux échanges avec l'Asie et l'Afrique, les populations ont de meilleures défenses immunitaires.", src:"livre p. 46" },
    { front:"Où les Amérindiens sont-ils forcés de travailler ?", back:["Dans les grands domaines agricoles et les mines d'or ou d'argent"], wrong:["Dans les usines de caravelles","Dans les ports d'Europe","Dans les couvents"], mcqOnly:true, ans:"Dans les grands domaines agricoles créés par les Européens et dans les mines d'or ou d'argent.", src:"livre p. 47" },
    { front:"De quelle intoxication meurent beaucoup d'Amérindiens qui travaillent dans les mines ?", back:["au mercure","mercure","l'intoxication au mercure"], wrong:["au plomb","au charbon","au sel"], ans:"Des maladies dues à l'intoxication au mercure.", src:"livre p. 47" },
    { front:"Qu'est-ce que le métissage culturel, selon le livre ?", back:["Les survivants gardent une partie de leur culture tout en adoptant les mœurs et la langue des Espagnols"], wrong:["Les Espagnols adoptent la religion aztèque","Les Amérindiens partent vivre en Europe","Les deux cultures disparaissent"], mcqOnly:true, ans:"Il a permis la conservation d'une partie de la culture amérindienne jusqu'à nos jours.", src:"livre p. 47" },
  ]},
  { key:"echanges", code:"S7", title:"Les échanges avant et après", src:"livre pp. 37-38, 48-49", items:[
    { front:"Après les découvertes, quels ports jouent un rôle essentiel dans le commerce mondial ?", back:["Séville, Lisbonne, Amsterdam et Anvers"], wrong:["Venise, Gênes et Constantinople","Shanghai et Rotterdam","Macao et Nagasaki"], mcqOnly:true, ans:"Les ports de l'Atlantique (Séville, Lisbonne) et de la mer du Nord (Amsterdam, Anvers), qui reçoivent les produits d'Amérique et d'Asie.", src:"livre p. 48" },
    { front:"Quels sont les deux premiers grands empires coloniaux ?", back:["Celui de l'Espagne et celui du Portugal"], wrong:["Celui de la Chine et celui du Japon","Celui des Aztèques et celui des Incas","Celui de Venise et celui de Gênes"], mcqOnly:true, ans:"L'Espagne (colonies d'Amérique et Philippines) et le Portugal, plus maritime (Brésil et comptoirs).", src:"livre p. 48" },
    { front:"Quel pays a pour empire colonial le Brésil et des comptoirs sur les côtes africaines et asiatiques ?", back:["le Portugal","Portugal"], opts:["l'Espagne","le Portugal","la France","les Provinces-Unies"], keepOrder:true, ans:"Le Portugal, un empire plus maritime.", src:"livre p. 48" },
    { front:"Où les puissances coloniales vont-elles chercher la main-d'œuvre, la population amérindienne étant décimée ?", back:["en Afrique","Afrique","l'Afrique"], opts:["en Afrique","en Asie","en Europe"], keepOrder:true, ans:"En Afrique : c'est le début de la traite atlantique.", src:"livre p. 48" },
    { front:"Comment ton livre appelle-t-il le trafic où les esclaves sont considérés comme de la marchandise ?", back:["la traite atlantique","traite atlantique"], wrong:["l'échange colombien","le métissage culturel","la route des épices"], ans:"La traite atlantique (ta feuille dit « commerce transatlantique ou triangulaire »).", src:"livre p. 48" },
    { front:"Dans la traite atlantique, que font les navires après avoir vendu les esclaves en Amérique ?", back:["Ils repartent chargés de produits rares vers l'Europe"], wrong:["Ils rentrent vides en Afrique","Ils partent vers la Chine","Ils restent en Amérique"], mcqOnly:true, ans:"Les navires repartent chargés de produits rares, généralement à destination de l'Europe.", src:"livre p. 48" },
    { front:"Que décide le traité de Tordesillas en 1494 ?", back:["Le pape répartit les terres à découvrir entre Espagnols et Portugais"], wrong:["L'Espagne et l'Angleterre font la paix","Les Portugais quittent le Japon","Les colonies deviennent indépendantes"], mcqOnly:true, ans:"Le pape répartit les terres à découvrir entre les Espagnols et les Portugais en traçant une ligne dans l'Atlantique (seconde ligne : Saragosse, 1529, dans le Pacifique).", src:"livre p. 48, encadré" },
    { front:"En quelle année est signé le traité de Tordesillas ?", back:["1494"], opts:["1453","1494","1529","1557"], keepOrder:true, ans:"1494. Le traité de Saragosse, en 1529, fixe une seconde ligne dans le Pacifique.", src:"livre p. 48, encadré" },
    { front:"Que transporte l'échange colombien entre les continents ?", back:["Des plantes, des animaux et des microbes"], wrong:["Seulement de l'or et de l'argent","Des esclaves et des épices","Des livres et des cartes"], mcqOnly:true, ans:"Un échange biologique : plantes, animaux et microbes.", src:"livre p. 49, bulle jaune" },
    { front:"La pomme de terre et le maïs viennent-ils d'Amérique ou d'Europe, d'Afrique et d'Asie ?", back:["d'Amérique","Amérique"], opts:["d'Amérique","d'Europe, d'Afrique et d'Asie"], keepOrder:true, ans:"D'Amérique (doc. 30), comme la tomate, le cacao, le haricot, le tabac, la vanille.", src:"livre p. 49, doc. 30 · cahier ex. 13a" },

function vidPost(cmd){ const f = document.getElementById("vid-frame"); if (f && f.contentWindow) try { f.contentWindow.postMessage(JSON.stringify(cmd), "*"); } catch(e){} }
function vidListen(){
  const ve = document.getElementById("vid-el");
  if (ve){ ve.addEventListener("ended", () => vidEnded(S.vidOpen)); ve.play && ve.play().catch(() => {}); return; }
  const f = document.getElementById("vid-frame"); if (!f) return;
  const hello = () => { vidPost({ event:"listening", id:"vid", channel:"widget" }); vidPost({ event:"command", func:"addEventListener", args:["onStateChange"], id:"vid", channel:"widget" }); };

function vidEnded(id){
  if (S.vidOpen !== id) return;
  S.vidOpen = null; S.vidDone = id; S.vidSeen[id] = Date.now(); saveVids(); render();

window.addEventListener("message", e => {
  if (!/youtube(-nocookie)?\.com$/.test(String(e.origin).replace(/^https?:\/\/(www\.)?/, "").split(":")[0])) return;
  let d = e.data; if (typeof d === "string"){ try { d = JSON.parse(d); } catch(err){ return; } }
  if (!d || !S.vidOpen) return;
  const st = d.event === "onStateChange" ? d.info : (d.event === "infoDelivery" && d.info && "playerState" in d.info ? d.info.playerState : null);
  if (st === 0) vidEnded(S.vidOpen);
});

const audParts = id => (AUDIOS[id] || []);
function audioBtn(id){

function audHead(id, i, n){ return `🎧 Piste audio ${id === "LIENS" ? "du fil rouge" : esc(id)}${n > 1 ? ` · partie ${i+1} / ${n}` : ""}`; }
function audPlayer(id){
  const parts = audParts(id), n = parts.length, i = Math.min(S.audPart || 0, n - 1);
  const note = `<p class="fine">La piste n'a pas de silence aux pauses : quand la voix te dit de mettre sur pause, arrête-la toi-même et réponds avant de continuer.</p>`;
  if (HAS_CLAUDE) return `<div class="aud"><p class="aud-t">${audHead(id, 0, 1)}</p><div class="aud-links">${parts.map((u, k) => `<a class="ghost small" href="${esc(u)}" target="_blank" rel="noopener">▶ ${n > 1 ? "Partie " + (k+1) : "Écouter"}</a>`).join("")}</div>

  return `<div class="aud"><p class="aud-t" id="aud-t">${audHead(id, i, n)}</p><audio id="aud-el" src="${esc(parts[i])}" controls autoplay preload="metadata"></audio>
    ${n > 1 ? `<div class="aud-links">${parts.map((u, k) => `<button class="ghost small${k === i ? " on" : ""}" data-act="audPart" data-v="${id}|${k}">Partie ${k+1}</button>`).join("")}</div><p class="fine">Les parties s'enchaînent toutes seules.</p>` : ""}
    ${note}<div class="row"><button class="ghost small" data-act="audHide">Fermer</button><a class="ghost small aud-ext" id="aud-ext" href="${esc(parts[i])}" target="_blank" rel="noopener">Ouvrir dans un onglet</a></div></div>`;
}
function audListen(){
  const a = document.getElementById("aud-el"); if (!a) return;
  a.addEventListener("ended", () => {
    const id = S.audOpen, parts = audParts(id), k = (S.audPart || 0) + 1;
    if (k >= parts.length) return;
    S.audPart = k; a.src = parts[k]; a.play && a.play().catch(() => {});
    const t = document.getElementById("aud-t"); if (t) t.textContent = audHead(id, k, parts.length);
    const x = document.getElementById("aud-ext"); if (x) x.href = parts[k];
    document.querySelectorAll('[data-act="audPart"]').forEach(b => b.classList.toggle("on", b.dataset.v === id + "|" + k));
  });
  a.play && a.play().catch(() => {});
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s, apoMode){
  return String(s || "").toLowerCase().replace(/ß/g,"ss").replace(/œ/g,"oe").replace(/³/g,"3").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/…|\.\.\./g," ").replace(/[’'`]/g, apoMode === "del" ? "" : " ")
    .replace(/[.!?;,:«»"()\/\-+×]/g," ").replace(/\s+/g," ").trim();
}
const stripFr = s => s.replace(/^(le |la |les |l |un |une |des |du |de la |d )/,"").trim();
function matchAnswer(input, accept){
  return ["sp","del"].some(m => {
    const a = norm(input, m); if (!a) return false;
    return accept.some(raw => { const b = norm(raw, m); return a === b || stripFr(a) === stripFr(b); });
  });
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");
function dateLabel(ts){ const d = new Date(ts), p = x => String(x).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} · ${p(d.getHours())}h${p(d.getMinutes())}`; }
function explain(it, deck){ return (it.expl || it.ans || (it.front + " → " + it.back[0])) + " — " + (it.src || deck.src) + "."; }

function optionsFor(it, deck){
  const good = it.back[0];
  if (it.opts) return it.keepOrder ? [...it.opts] : shuffle(it.opts);
  if (it.wrong) return shuffle([good, ...it.wrong]);
  const pool = deck.items.filter(x => x !== it && (x.grp || "") === (it.grp || "") && !x.opts && !x.wrong);
  const out = [], seen = new Set([norm(good)]);
  shuffle(pool).forEach(x => { if (out.length >= 3) return; const v = x.back[0]; if (!seen.has(norm(v))){ seen.add(norm(v)); out.push(v); } });
  return shuffle([good, ...out]);
}
function chooseKind(it, difficulty){
  if (it.mcqOnly) return "mcq";
  if (difficulty === "easy") return "mcq";
  if (difficulty === "hard") return "type";
  return Math.random() < 0.5 ? "mcq" : "type";
}

/* ---------- fabrication du test : un exercice par paquet et par consigne, numérotation unique ---------- */
function buildTest(deckKeys, difficulty){
  const qs = []; let num = 0, ex = 0;
  DECKS.filter(d => deckKeys.includes(d.key)).forEach(d => {
    const groups = { mcq:[], type:[] };
    shuffle(d.items.filter(it => !rvOf(d, it).exclu)).forEach(it => groups[chooseKind(it, difficulty)].push(it));
    ["mcq","type"].forEach(kind => {
      if (!groups[kind].length) return;
      ex++; const K = KINDS[kind];
      groups[kind].forEach(it => {
        num++;
        const q = { id:"q"+num, num, ex, exTitle:d.title, deckKey:d.key, kind, type:K.type, tag:d.key, consigne:K.consigne, word:it.front, answer:it.back[0], expl:explain(it, d), src:it.src || d.src, hint:"" };
        if (kind === "mcq") q.options = optionsFor(it, d); else q.accept = it.back;
        q.prompt = `${K.consigne} « ${q.word} »`;
        qs.push(q);
      });
    });
  });
  return qs;
}

/* ---------- stockage : db privée de l'utilisateur, sinon navigateur, sinon mémoire ---------- */
const store = {
  mode:"memory", col:null, mem:{},
  async init(){
    try {
      if (window.claude && window.claude.use){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user){ const uid = await user.id(); if (uid){ this.col = db.collection("data/users/" + uid); this.mode = "db"; return; } }
      }
    } catch(e){}
    try { localStorage.setItem(QUIZ_ID + "-probe","1"); localStorage.removeItem(QUIZ_ID + "-probe"); this.mode = "local"; } catch(e){ this.mode = "memory"; }
  },
  async list(){
    if (this.mode === "db"){
      const snap = await this.col.limit(1000).get();
      return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean);
    }
    if (this.mode === "local"){
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]");
      return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean);
    }
    return Object.values(this.mem);
  },
  async save(att){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + att.id).set(att); return; }
    if (this.mode === "local"){
      localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att));
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id);
      localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return;
    }
    this.mem[att.id] = att;
  },
  memDocs:{},
  async getDoc(id){
    if (this.mode === "db"){ const sn = await this.col.doc(id).get(); return sn && sn.exists ? sn.data() : null; }
    if (this.mode === "local"){ const v = localStorage.getItem(id); return v ? JSON.parse(v) : null; }
    return this.memDocs[id] || null;
  },
  async setDoc(id, obj){
    if (this.mode === "db"){ await this.col.doc(id).set(obj); return; }
    if (this.mode === "local"){ localStorage.setItem(id, JSON.stringify(obj)); return; }
    this.memDocs[id] = obj;
  },
  async remove(id){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + id).delete(); return; }
    if (this.mode === "local"){ localStorage.removeItem(ATTEMPT_PREFIX + id); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]").filter(x => x !== id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }
    delete this.mem[id];
  },
};

function reviewCounts(){
  let revoir = 0, exclu = 0, notes = 0;
  DECKS.forEach(d => d.items.forEach(it => { const r = rvOf(d, it); if (r.revoir) revoir++; if (r.exclu) exclu++; if (r.note && r.note.trim()) notes++; }));
  return { revoir, exclu, notes };
}
function reviewText(){
  const l = ["REVUE DES CARTES — " + SUBJECT_LONG + " (outil version " + VERSION.n + ")"], c = reviewCounts();
  l.push(`${c.revoir} à revoir · ${c.exclu} hors test · ${c.notes} remarque(s)`, "");
  DECKS.forEach(d => d.items.forEach((it, i) => { const r = rvOf(d, it); if (!rvMarked(r)) return;
    const tags = [r.revoir ? "À REVOIR" : "", r.exclu ? "HORS TEST" : ""].filter(Boolean).join(" + ") || "remarque";
    l.push(`- ${d.code} · ${d.title} · carte ${i+1} [${tags}]`, `  Q : ${it.front}`, `  R : ${it.back[0]}`);
    if (r.note && r.note.trim()) l.push(`  Remarque : ${r.note.trim()}`);
  }));
  if (!c.revoir && !c.exclu && !c.notes) l.push("Aucune carte marquée.");
  return l.join("\n");
}

function startQuiz(questions, rattrapage){
  S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, label: rattrapage ? S.rattrLabel : deckLabel(S.selected) };
  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function viewQuiz(){
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode !== "exam";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>

  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice";

      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="Ta réponse…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;

    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? ["✓ Juste !","✓ Bien vu.","✓ Exact.","✓ Tu l'as.","✓ Nickel."][Q.i % 5] : "✗ Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b>${esc(q.answer)}</b></p>`}<p class="fb-x">${esc(q.expl)}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q.accept); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], right = isRight(q, val);
  if (S.mode !== "exam"){ Q.ok = right; Q.checked = true; render(); }
  else record(val, right);
}
function record(val, correct){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.exTitle, prompt:q.prompt, user:val || "", answer:q.answer, correct, expl:q.expl, tag:q.tag, question:q });
  if (Q.i + 1 >= Q.questions.length){ Q.done = true; Q.finishing = true; render(); finishQuiz(); }
  else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; render(); }
}
async function finishQuiz(){
  const Q = S.quiz, score = Q.detail.filter(x => x.correct).length, total = Q.detail.length, id = String(Date.now());
  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:BRANCHE, theme:THEME, deck:Q.label,
    difficulty:DIFFICULTIES[S.difficulty].label, mode:MODES[S.mode].label, rattrapage:S.rattrapage, score, total, note:noteFrom(score/total), questions:Q.detail };
  S.attempts = [att, ...S.attempts.filter(a => a.id !== id)];
  try { await store.save(att); S.storeMsg = store.mode === "memory" ? "Ce résultat est affiché ici, mais il ne sera pas gardé si tu fermes la page. Note ta note ou copie-la pour le chat." : ""; }
  catch(e){ S.storeMsg = "Je n'ai pas pu enregistrer ce résultat : il disparaîtra si tu fermes la page. Note ta note ou copie-la pour le chat."; }
  S.lastResult = att; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; S.screen = "results"; render(); window.scrollTo(0,0);
}

function bilanState(id){ return S.bilan[id] || (S.bilan[id] = { busy:false, err:"", copied:false, fallback:"" }); }
function bilanBlock(att){

  if (!a && !HAS_CLAUDE) h += `<p class="fine">Pour savoir ce qui coince vraiment, copie tes résultats et colle-les dans le chat de révisions : on les analyse ensemble.</p>`;

  return h + `</div>`;
}
function findAttempt(id){ return (S.lastResult && S.lastResult.id === id) ? S.lastResult : S.attempts.find(a => a.id === id); }
async function analyse(id){
  const att = findAttempt(id), b = bilanState(id); b.busy = true; b.err = ""; render();

Score : ${att.score}/${att.total} (note suisse ${fmtNote(att.note)}/6)${att.rattrapage ? " — RATTRAPAGE : seules les questions ratées d'un test précédent ont été rejouées" : ""}
Paquets : ${att.deck}
Niveau : ${att.difficulty} — Mode : ${att.mode}

Étiquettes (le code entre parenthèses est le chapitre du Dossier à relire) : ${DECKS.map(d => d.key + " = " + d.title + " (" + d.code + ")").join(" ; ")}.

Détail :
${lignes}

Analyse les ERREURS pour trouver ce qui coince vraiment : les dates, les noms des personnages (Cortés / Pizarro, Colomb / Vasco de Gama / Cabral), les définitions, l'ordre chronologique, les points de vue (Las Casas / Sepúlveda), avant / après 1492 ? Cherche le point commun, ne recopie pas la liste. S'il n'y a pas de motif clair, dis-le honnêtement.

Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, exactement dans ce format :
{"points_forts":["..."],"a_travailler":["..."],"conseil":"..."}
- "points_forts" : 1 à 3 points courts et concrets.
- "a_travailler" : 1 à 3 axes de progrès formulés positivement, avec l'exemple précis tiré du test et le chapitre du Dossier à relire (S5, P, D…).
- "conseil" : 2 phrases maximum, une action à faire ce soir.
Tu tutoies l'élève. Français de Suisse romande, ton encourageant, pas enfantin.`;
    const parsed = await sample.json(prompt, { modelTier:"default" });
    att.analysis = { points_forts: Array.isArray(parsed.points_forts) ? parsed.points_forts : [], a_travailler: Array.isArray(parsed.a_travailler) ? parsed.a_travailler : [], conseil: parsed.conseil || "" };

  } catch(e){

  }

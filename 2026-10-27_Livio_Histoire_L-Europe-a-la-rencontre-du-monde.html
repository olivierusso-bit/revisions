<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Histoire · pour le 27.10</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Carte marine (portulan) : mer profonde, or des Incas, rouge cochenille ; le cours se lit en Alegreya, l'outil se manie en Alegreya Sans. */
:root{
  --dock:#E8EFEE; --sheet:#FFFFFF; --ink:#1B2430; --soft:#55616E; --st:#8E978F; --rule:#C4CFCD;
  --box:#0E5A63; --box-wash:#DCEBEA; --crane:#E3A923; --crane-ink:#3A2700; --board:#152A33; --on-box:#FFFFFF;
  --good:#1F6E4E; --good-wash:#DDF1E6; --bad:#A3243B; --bad-wash:#F7E1E5;
  --gen:#55616B; --gen-wash:#EEF1F4; --book-wash:#FFF1B8; --book-ink:#5A4500; --dico:#6A3D8F; --dico-wash:#EFE6F7;
  --land:#E7E1D2; --r1:#B3261E; --r2:#6B3FA0; --r3:#1E7A46; --r4:#7A6A12; --r5:#8E2A2A; --r6:#2361A8;
  --display:'Alegreya',Georgia,serif;
  --ui:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --read:'Alegreya',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --dock:#0D1719; --sheet:#152226; --ink:#E3ECEB; --soft:#9DB0B3; --st:#5E6E70; --rule:#2A3B3F;
  --box:#5FB8C1; --box-wash:#173338; --crane:#E8B13A; --crane-ink:#1C1300; --board:#0A1416; --on-box:#06181B;
  --good:#5FD3A0; --good-wash:#14332A; --bad:#FF8FA0; --bad-wash:#3A1D23;
  --gen:#A9B6BF; --gen-wash:#1D2830; --book-wash:#3A3110; --book-ink:#F4D46A; --dico:#C9A3EC; --dico-wash:#2B2136;
  --land:#2C3430; --r1:#FF8A80; --r2:#C3A6F0; --r3:#7FD6A4; --r4:#E2CF6A; --r5:#F0A0A0; --r6:#8DB8F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --dock:#0D1719; --sheet:#152226; --ink:#E3ECEB; --soft:#9DB0B3; --st:#5E6E70; --rule:#2A3B3F;
  --box:#5FB8C1; --box-wash:#173338; --crane:#E8B13A; --crane-ink:#1C1300; --board:#0A1416; --on-box:#06181B;
  --good:#5FD3A0; --good-wash:#14332A; --bad:#FF8FA0; --bad-wash:#3A1D23;
  --gen:#A9B6BF; --gen-wash:#1D2830; --book-wash:#3A3110; --book-ink:#F4D46A; --dico:#C9A3EC; --dico-wash:#2B2136;
  --land:#2C3430; --r1:#FF8A80; --r2:#C3A6F0; --r3:#7FD6A4; --r4:#E2CF6A; --r5:#F0A0A0; --r6:#8DB8F2; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--dock);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--crane);outline-offset:2px}

/* en-tête : un conteneur vu de côté (ondulations de la tôle) */
.head{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;margin-bottom:18px;padding:16px 14px 16px 16px;border-radius:4px;color:#fff;background:repeating-conic-gradient(from 3deg at 92% 30%,rgba(255,255,255,0) 0deg 10.5deg,rgba(255,255,255,.22) 10.5deg 11.25deg),#0E5A63}
.head-code{flex:none;background:#E3A923;color:#3A2700;font-family:var(--display);font-weight:800;font-size:15px;padding:4px 8px;border-radius:2px;letter-spacing:.5px;line-height:1.1;text-align:center}
.head-code b{display:block;font-size:24px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(25px,7.4vw,34px);line-height:1;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;font-size:14px;opacity:.92}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:700;font-size:22px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 6px 6px 0;margin:0}
.note{background:var(--box-wash);border-radius:6px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--box);font-weight:700;padding:0;cursor:pointer}
.cta{width:100%;padding:15px;border:0;border-radius:4px;background:var(--box);color:var(--on-box);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ===== DOSSIER (e-book) ===== */
.toc-ch{display:flex;flex-direction:column;gap:6px}
.toc-ch h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:14px 0 2px;display:flex;flex-direction:column;gap:2px}
.toc-ch h2 span{font-family:var(--ui);font-weight:600;font-size:14px;color:var(--soft)}
.toc-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:11px 12px;cursor:pointer}
.code{font-family:var(--display);font-weight:800;font-size:16px;background:var(--board);color:var(--crane);padding:3px 8px;border-radius:2px;letter-spacing:.5px;min-width:42px;text-align:center}
.toc-t{font-weight:700;font-size:15px;line-height:1.3}
.toc-s{display:block;font-weight:400;font-size:12.5px;color:var(--soft)}
.legend{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px}
.legend p{margin:0;font-size:14px;display:flex;gap:8px;align-items:baseline}

.page{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.page h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,32px);line-height:1.05;margin:0;text-wrap:balance}
.objective{margin:0;padding:10px 12px;border:2px solid var(--board);border-radius:3px;font-size:14.5px;background:var(--dock)}
.objective b{display:block;font-family:var(--display);font-size:15px;letter-spacing:.3px;color:var(--soft);font-weight:700}
.read{font-family:var(--read);font-size:17px;line-height:1.65;margin:0;max-width:65ch}
.page h3{font-family:var(--display);font-weight:700;font-size:21px;margin:6px 0 -4px}
.def{border-left:4px solid var(--box);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.def-term{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.def .read{font-size:16.5px}
.def.gen{border-left:4px dashed var(--gen);background:var(--gen-wash);padding:8px 10px 8px 12px;border-radius:0 4px 4px 0}
.def.book{border-left:4px solid var(--crane);background:var(--book-wash);padding:9px 10px 9px 12px;border-radius:0 14px 14px 0}
.def.book .read{font-weight:600}
.tag.book{background:var(--crane);color:var(--crane-ink)}
.step.st .step-bar{width:6px;justify-self:center;opacity:.55}
.rv-d{font-family:var(--display);font-weight:700;font-size:15px;color:var(--soft)}
.rv-c{font-size:12.5px;font-weight:700;color:var(--box);margin-top:3px}
.nike{gap:10px}
.nk{display:flex;flex-direction:column;gap:3px}
.nk-r{font-weight:700;font-size:14px}
.tag{display:inline-block;white-space:nowrap;flex:none;font-family:var(--ui);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;vertical-align:2px}
.tag.mine{background:var(--box-wash);color:var(--box)}
.tag.gen{background:var(--gen-wash);color:var(--gen);border:1px dashed var(--gen)}
.mywork{background:var(--box-wash);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.mywork-t{font-weight:700;font-size:14px;color:var(--box);margin:0}
.mywork ul{margin:0;padding-left:18px}
.mywork li{font-family:var(--read);font-size:15.5px;margin:2px 0}
.tip{margin:0;padding:10px 12px;border-radius:4px;background:var(--board);color:#E9EEF2;font-size:15px}
.tip b{color:var(--crane);font-family:var(--display);font-size:17px;display:block}
.todo{margin:0;padding:10px 12px;border:1px dashed var(--bad);border-radius:4px;font-size:14px;color:var(--ink)}
.src{font-size:12.5px;color:var(--soft);margin:0}
.exl{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.exl-t{margin:0;padding:8px 12px;font-weight:700;font-size:14px;background:var(--box-wash);color:var(--box)}
.exr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:9px 12px;border-top:1px solid var(--rule);font-size:14.5px}
.exr .code{font-size:13px;min-width:0;padding:2px 6px;align-self:start}
.exr b{font-weight:600}
.exr span.so{display:block;color:var(--soft);font-size:13.5px;margin-top:2px}
.links{display:flex;flex-direction:column;gap:10px}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:4px}
.lk-ids{display:flex;flex-direction:column;gap:4px;align-items:center}
.lk-ids button{border:0;background:var(--board);color:var(--crane);font-family:var(--display);font-weight:800;font-size:14px;padding:2px 7px;border-radius:2px;cursor:pointer}
.lk-ids i{font-style:normal;color:var(--soft);font-size:12px;line-height:1}
.lk p{margin:0;font-size:15px}
.trio{display:flex;flex-direction:column;gap:0}
.trio-s{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 0}
.trio-s + .trio-s{border-top:1px dashed var(--rule)}
.trio-k{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--on-box);background:var(--box);border-radius:3px;display:flex;align-items:center;justify-content:center;height:44px}
.trio-s b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.trio-s p{margin:2px 0 6px;font-size:14.5px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--rule);background:var(--dock);border-radius:3px;padding:3px 8px;font-size:13px;font-weight:700;cursor:pointer}
.rv-s{width:34px;height:34px;color:var(--box)}
.sect6{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sx{border:2px solid var(--board);border-radius:3px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sx b{font-family:var(--display);font-size:17px;line-height:1.1}
.sx span{font-size:13.5px;color:var(--soft)}
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;gap:12px;background:var(--dock);border-bottom:1px solid var(--rule);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding:9px max(16px, env(safe-area-inset-right, 0px)) 9px max(16px, env(safe-area-inset-left, 0px))}
.pbar-back{flex:none;background:none;border:0;color:var(--box);font-weight:700;font-size:15px;padding:4px 0;cursor:pointer}
.pbar-t{min-width:0;flex:1;display:flex;gap:8px;align-items:center}
.pbar-t .code{flex:none;font-size:13px;min-width:0;padding:2px 6px}
.pbar-x{min-width:0;font-weight:700;font-size:14.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--dock)}
.vid{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:4px;background:var(--board);color:#E9EEF2;text-decoration:none;margin:0}
.vid b{display:block;font-size:15.5px;color:#fff}.vid small{display:block;font-size:12.5px;color:#C9D3E0}
.vid-i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--crane);color:var(--crane-ink);display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:2px}
.vid.off{background:var(--gen-wash);color:var(--gen);border:1px dashed var(--gen)}.vid.off b{color:var(--gen)}.vid.off small{color:var(--gen)}.vid.off .vid-i{background:var(--rule);color:var(--soft)}
.vthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--board);cursor:pointer;color:#fff;text-align:left}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.vthumb-play{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:var(--crane);color:var(--crane-ink);display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.vthumb-t{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(10,17,23,.9))}
.vthumb-t b{display:block;font-size:15.5px}.vthumb-t small{display:block;font-size:12.5px;color:#D5DEE6}
.vplay{display:flex;flex-direction:column;gap:8px}
.vframe{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbar{display:grid;grid-template-columns:1fr auto;gap:8px}
.vfb{margin:0}.vfb a{color:var(--soft)}
.vdone{background:var(--good-wash);border:1px solid var(--good);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px}
.vdone-t{margin:0;font-family:var(--display);font-weight:800;font-size:22px;color:var(--good)}
.toc-v.seen{background:var(--good-wash);color:var(--good);border:1px solid var(--good)}
.ctest{border:1px solid var(--box);background:var(--box-wash);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ctest.end{margin-top:4px}
.ctest-t{margin:0;font-weight:700;font-size:15px;color:var(--box)}.ctest-t small{display:block;font-weight:400;font-size:12.5px;color:var(--soft)}
.ctest-b{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);cursor:pointer;min-width:0}
.ctest-b span{font-size:17px}.ctest-b b{font-size:13px;line-height:1.2;text-align:center}
.prebox{border:2px dashed var(--crane);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--sheet)}
.prebox-t,.blank-t{margin:0;font-weight:700;font-size:15.5px}.prebox-t small,.blank-t small{display:block;font-weight:400;font-size:13px;color:var(--soft)}
.prebox ol{margin:0;padding-left:20px;font-size:15px}.prebox li{margin:3px 0}.prebox details li{font-size:14.5px}.prebox .bsrc{display:block;margin:2px 0 0}
.pause{border-left:5px solid var(--crane);background:var(--book-wash);border-radius:0 4px 4px 0;padding:9px 12px;display:flex;flex-direction:column;gap:5px}
.pause-t{margin:0;font-family:var(--display);font-weight:800;font-size:17px;color:var(--book-ink)}
.pause-q{margin:0;font-weight:700;font-size:15.5px}
.pause details p{margin:6px 0 0;font-size:15px}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--box);padding:4px 0}
.blank{border:2px solid var(--board);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--dock)}
.blank-c{margin:0;font-size:15.5px}
.blank-l{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.blank-l label{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer}.blank-l input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--box)}
.svgfig{margin:0;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:8px}
.svgfig svg{display:block;width:100%;height:auto}
.blank .bsrc{margin:6px 0 0}
.svgfig figcaption{font-size:13px;color:var(--soft);margin-top:4px;font-weight:700}
.caps-cta{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:4px;background:var(--board);color:#E9EEF2;cursor:pointer}
.caps-cta b{display:block;font-family:var(--display);font-size:20px;color:#fff;line-height:1.1}.caps-cta small{display:block;font-size:13px;color:#C9D3E0}
.caps-cta-i,.caps-play{flex:none;width:42px;height:42px;border-radius:50%;background:var(--crane);color:var(--crane-ink);display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:3px;border:0;cursor:pointer}
.caps-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.caps-date{font-weight:700;font-size:14px;background:var(--box-wash);color:var(--box);padding:5px 10px;border-radius:4px}
.caps-prog{font-weight:700;color:var(--soft)}.caps-prog b{color:var(--good)}
.caps-ch{display:flex;flex-direction:column;gap:8px}
.caps-ch h3{margin:8px 0 0;border-bottom:2px solid var(--board);padding-bottom:5px}.caps-ch h3 small{display:block;font-family:var(--ui);font-weight:400;font-size:13.5px;color:var(--soft)}
.caps-row{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:64px}
.caps-row.seen{background:var(--good-wash);border-color:var(--good)}.caps-row.on{border-color:var(--box)}
.caps-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.caps-line .code{font-size:14px;min-width:46px;padding:3px 6px}
.caps-txt b{display:block;font-size:15.5px;line-height:1.25}.caps-txt small{display:block;font-size:13px;color:var(--soft);line-height:1.35;margin-top:2px}
.caps-st{margin:0;font-size:12.5px;color:var(--soft)}.caps-st .back{font-size:12.5px;display:inline}
.caps-row.seen .caps-st{color:var(--good);font-weight:700}
.toc-v{display:inline-block;font-size:11.5px;font-weight:700;background:var(--crane);color:var(--crane-ink);padding:0 6px;border-radius:3px;vertical-align:2px;white-space:nowrap}
.pm{margin:0 0 6px;font-size:14.5px}
.pm b{display:inline-block;width:16px}
.bsrc{margin:-8px 0 0;font-size:12.5px;color:var(--soft);line-height:1.35}
.see{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.see button{border:1px solid var(--rule);background:var(--dock);border-radius:3px;padding:5px 9px;cursor:pointer;font-weight:700}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);cursor:pointer;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--soft);font-size:12px}
.pager b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* schémas */
.chain{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:stretch}
.step-bar{border-radius:3px}
.step-body{padding:8px 0 12px}

/* ---------- SOURCES ----------
   Feuille d'objectifs « Histoire 10FR — L'Europe à la rencontre du monde ».
   Manuel pp. 34 à 49 (chapitre 3), lexique en fin de manuel pp. 172-173 (+ la page d'« Esclavage / esclave »).
   Cahier d'exercices pp. 15, 16, 18, 19, 20, 21, 22 (exercices 1 à 14 ; l'exercice 5, p. 17, n'a pas été fait en classe : écarté).

const SOURCES = [
  { titre:"Feuille d'objectifs « Histoire 10FR »", recue:"24.10.2026", contenu:"Les 9 points « Tu dois principalement savoir », les 5 points « Tu dois principalement être capable », les 9 termes, les 9 personnages et les 4 dates à connaître (plus celles de l'exercice 1). Chaque chapitre du Dossier recopie un point tel quel." },

  { titre:"Manuel pp. 38-41 — le monde hors de l'Europe jusqu'en 1492", recue:"24.10.2026", contenu:"Grandes civilisations au XVe siècle (doc. 1), Empire ottoman, empires et royaumes d'Afrique, empires d'Asie, Zheng He (doc. 5), Mayas, Aztèques, Incas, points communs des peuples amérindiens ; glossaires subsaharienne, apogée, berbères." },

const svgEsc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function svgText(P, x, y, lines, o = {}){
  const size = o.size || 11, lh = o.lh || size * 1.25, anchor = o.anchor || "middle";
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" style="font-family:${P.font};font-size:${size}px">` +

}
function svgArrow(P, x1, y1, x2, y2, c){
  const a = Math.atan2(y2 - y1, x2 - x1), h = 6;
  const p1 = [x2 - h*Math.cos(a - 0.45), y2 - h*Math.sin(a - 0.45)], p2 = [x2 - h*Math.cos(a + 0.45), y2 - h*Math.sin(a + 0.45)];
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c || P.soft};stroke-width:1.4"/>` +
    `<polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" style="fill:${c || P.soft}"/>`;
}

  { t:"p", s:"Livre p. 37, texte d'introduction · feuille d'objectifs", h:"Tout ton chapitre raconte une seule histoire. Au XV<sup>e</sup> siècle, les Européens rêvent des richesses de l'Asie. Ils cherchent une route par la mer, rencontrent des peuples dont ils ignoraient l'existence, conquièrent l'Amérique, puis organisent un commerce à l'échelle du monde. Ta feuille d'objectifs découpe cette histoire en points : chaque point est un chapitre de ce Dossier." },
  { t:"html", s:"Feuille d'objectifs · livre pp. 34-49", h:`<div class="trio">
    <div class="trio-s"><span class="trio-k">1</span><div><b>Avant 1492 : le monde sans les Européens au centre</b><p>Les grandes civilisations, l'Asie et l'océan Indien au cœur du commerce, l'Amérique inconnue des Européens.</p><div class="chips"><button data-act="page" data-v="S1">S1 civilisations</button><button data-act="page" data-v="S4">S4 Aztèques et Incas</button><button data-act="page" data-v="C3">C3 représenter le monde</button></div></div></div>
    <div class="trio-s"><span class="trio-k">2</span><div><b>Partir : pourquoi et comment</b><p>Les épices, la prise de Constantinople, la caravelle et la boussole ; Colomb, Vasco de Gama, Magellan.</p><div class="chips"><button data-act="page" data-v="S2">S2 expéditions</button><button data-act="page" data-v="C5">C5 la carte</button><button data-act="page" data-v="D">D dates</button></div></div></div>
    <div class="trio-s"><span class="trio-k">3</span><div><b>Rencontrer, puis conquérir</b><p>L'accueil des Amérindiens, puis la conquête du Mexique et du Pérou ; ailleurs, la Chine et le Japon tiennent les Européens à l'écart.</p><div class="chips"><button data-act="page" data-v="S3">S3 rencontre</button><button data-act="page" data-v="S5">S5 conquête</button><button data-act="page" data-v="S8">S8 Chine, Japon</button><button data-act="page" data-v="C2">C2 se percevoir</button></div></div></div>
    <div class="trio-s"><span class="trio-k">4</span><div><b>Les conséquences, et les avis</b><p>Conversions forcées, choc microbien, exploitation ; empires coloniaux, traite atlantique, échange colombien ; Las Casas contre Sepúlveda.</p><div class="chips"><button data-act="page" data-v="S6">S6 conséquences</button><button data-act="page" data-v="S7">S7 échanges</button><button data-act="page" data-v="S9">S9 avis</button><button data-act="page" data-v="C1">C1 interprétations</button><button data-act="page" data-v="C4">C4 court et long terme</button></div></div></div></div>` },
  { t:"h3", h:"Les liens à savoir faire" },
  { t:"links", s:"Livre pp. 37, 42, 44, 46, 47, 48, 49 · cahier ex. 3b, 12c, 13d", items:[
    [["S1","S2"], "Avant 1492, l'Europe est à l'écart : l'océan Indien, principal lieu d'échanges, est dominé par des marchands juifs, arabes puis indiens. Quand les Turcs prennent Constantinople en 1453, la route terrestre vers l'Asie risque d'être coupée : les Européens cherchent un accès par la mer."],
    [["S3","S5"], "La rencontre commence souvent par des présents et un accueil paisible (Colomb, Cortés reçu par Moctezuma, Atahualpa qui accueille Pizarro), puis tourne à la conquête par la violence."],
    [["S4","S5"], "Les Amérindiens n'ont ni chevaux ni outils en fer, et n'utilisent pas la roue : les conquistadors profitent de la supériorité de leur armement, mais aussi des rivalités entre les peuples amérindiens."],
    [["S6","S7"], "Les Amérindiens meurent du choc microbien et de l'exploitation : les puissances coloniales vont alors chercher la main-d'œuvre en Afrique. C'est la traite atlantique."],
    [["S6","S9"], "Las Casas dénonce ces souffrances, Sepúlveda les justifie : deux Espagnols, deux avis opposés sur les mêmes événements."],
    [["S7","S8"], "En Amérique, les Européens conquièrent et colonisent. En Asie, ils n'y arrivent pas : le Japon les expulse vers 1640 et la Chine limite leur présence pour protéger son marché intérieur."]] },
  { t:"pause", q:"Pourquoi la prise de Constantinople en 1453 pousse-t-elle les Européens vers la mer ?", a:"Elle risque de couper la route terrestre qui mène aux ports de l'océan Indien, où l'on trouve les épices.", s:"Livre p. 42, texte d'introduction" },
  { t:"h3", h:"La frise de l'épreuve" },
  { t:"svg", k:"frise", titre:"Les dates à connaître, dans l'ordre", alt:"La frise suit le chapitre dans l'ordre. De 1271 à 1295, voyage et séjour de Marco Polo en Chine. En 1453, prise de Constantinople par les Turcs. En 1492, Christophe Colomb arrive aux Bahamas. En 1498, Vasco de Gama arrive en Inde. En 1500, Cabral accoste au Brésil. De 1519 à 1521, Cortès au Mexique. De 1519 à 1522, tour du monde de Magellan. De 1531 à 1533, Pizarro conquiert l'Empire inca. En 1534-1535, première expédition de Cartier au Canada. En 1543, les Portugais arrivent au Japon. En 1572, dernière révolte inca de Túpac Amaru. Vers 1640, le shôgun expulse les Européens du Japon. Vers 1825, indépendance des colonies espagnoles et portugaises d'Amérique. Les quatre dates de ta feuille d'objectifs sont marquées d'une étoile : 1492, 1498, 1519-1521 et 1543.", s:"Livre pp. 34-35 (frise), p. 43, p. 45, p. 49 · feuille d'objectifs (dates)" },
  { t:"pause", q:"Quelles sont les quatre dates de ta feuille d'objectifs ?", a:"1492 : Christophe Colomb ; 1498 : Vasco de Gama en Inde ; 1519-21 : Cortès au Mexique ; 1543 : les Portugais arrivent au Japon.", s:"Feuille d'objectifs, « Quelques dates importantes à connaître »" },
  { t:"tip", h:"Ta feuille dit aussi que les objectifs du manuel (p. 35, « Apprentissages visés ») et ceux en tête de chaque exercice sont utiles pour l'épreuve. Ils sont rappelés dans les chapitres concernés, dans les encadrés « Pour l'épreuve »." },
]},

/* ---------------- S1 ---------------- */
{ id:"S1", ch:"S", titre:"Les grandes civilisations avant 1492", court:"Empire ottoman, empires africains, Chine des Ming, Aztèques et Incas",
  obj:"Quelles grandes civilisations se trouvent dans le monde avant 1492",
  pre:[{ q:"Au XVe siècle, les puissances qui dominent les échanges commerciaux sont-elles en Europe ou en Asie ?", a:"En Asie (vrai dans ton exercice 3a).", s:"Cahier ex. 3a, affirmation 2 (corrigée en classe) · livre p. 38" }, { q:"L'Europe et l'Asie connaissent-elles l'existence du continent américain avant 1492 ?", a:"Non (faux dans ton exercice 3a). Les sociétés amérindiennes prospèrent à l'écart des grands axes.", s:"Cahier ex. 3a, affirmation 5 · livre p. 38" }],
  blank:{ consigne:"Écris les grandes civilisations de la carte du doc. 1, chacune avec une information du livre.", points:["Empire ottoman : capitale Constantinople, conquise en 1453 ; contrôle les voies commerciales entre l'Europe et l'Inde", "Empires et royaumes d'Afrique : Ghana, Mali (or), Abyssinie chrétienne ; commerce d'or, d'ivoire et d'esclaves", "Empire chinois des Ming : le plus important au XVe siècle, capitale Beijing ; l'amiral Zheng He", "En Inde et en Asie du Sud : des États prestigieux", "En Amérique : les Empires aztèque et inca (et les Mayas)"], s:"Livre pp. 38-39, doc. 1" },
  blocks:[
  { t:"p", s:"Livre p. 38, texte d'introduction (en gras)", h:"Au XV<sup>e</sup> siècle, de grandes civilisations s'épanouissent en dehors du continent européen : l'Empire ottoman, plusieurs empires ou royaumes africains, l'Empire chinois ou, en Amérique, les Empires aztèque et inca." },
  bookDef("civ"),
  { t:"h3", h:"La carte du doc. 1 : les grandes civilisations au XV<sup>e</sup> siècle" },
  { t:"html", s:"Livre p. 38, doc. 1 « Les grandes civilisations au XVe siècle » (légende)", h:tbl(["Ce que montre la légende","Exemples sur la carte"], [
    ["Le monde familier des Européens","l'Europe"],
    ["Les puissances économiques hors Europe","Empire ottoman (Constantinople, Le Caire), Empire perse, Sultanat de Delhi, royaumes indiens, Chine des Ming (Beijing), Japon, royaumes sud-asiatiques, port de Malacca"],
    ["Les empires ou royaumes africains","Empire du Mali, Kanem-Bornou, Abyssinie, royaume de Kongo, Zimbabwe"],
    ["Les grands empires inconnus du continent américain","Empire aztèque (Tenochtitlan), Mayas, Empire inca (Cuzco)"]], "Des flèches montrent les grands axes commerciaux : aucun ne traverse l'Atlantique ni le Pacifique.") },
  { t:"p", s:"Livre p. 38, texte", h:"À cette époque, les Européens sont déjà en concurrence avec les Turcs pour la domination de la Méditerranée. Ils sont par contre peu présents dans l'<b>océan Indien</b>. Principal lieu d'échanges commerciaux, celui-ci est dominé par des réseaux de marchands juifs, puis arabes et ensuite indiens, et traversé par la flotte chinoise de l'amiral <b>Zheng He</b> (vers 1371-1433). De l'autre côté de l'océan Pacifique, à l'écart de ces grands axes, prospèrent les sociétés amérindiennes." },
  { t:"pause", q:"Quel est le principal lieu d'échanges commerciaux au XVe siècle, et qui le domine ?", a:"L'océan Indien, dominé par des réseaux de marchands juifs, puis arabes et ensuite indiens.", s:"Livre p. 38, texte" },
  { t:"h3", h:"L'Empire ottoman" },
  { t:"p", s:"Livre p. 38, « L'Empire ottoman, puissance méditerranéenne » et doc. 2", h:"L'expansion ottomane en mer Méditerranée donne naissance à un immense empire qui <b>contrôle les voies commerciales entre l'Europe et l'Inde</b>. Il est l'adversaire de certains États européens, tout en étant le partenaire commercial des villes italiennes, en particulier de Venise. <b>Constantinople, conquise par les Turcs en 1453</b>, en est la capitale (doc. 2 : vue de Constantinople en 1580)." },
  { t:"h3", h:"Les empires et royaumes d'Afrique" },
  { t:"p", s:"Livre p. 39, « Les empires et royaumes d'Afrique » et doc. 3", h:"Durant tout le Moyen Âge, l'Afrique fournit la plus grande partie de l'<b>or</b> mondial. De grandes puissances se développent dans la région du Sahel (Empires du <b>Ghana</b>, du <b>Mali</b>…) et atteignent leur apogée entre le VIII<sup>e</sup> et le XVI<sup>e</sup> siècle. Les marchands arabes et berbères traversent le Sahara avec leurs caravanes de dromadaires : ils amènent le sel et l'échangent contre de l'or, de l'ivoire et des esclaves. Sur la côte de l'océan Indien, des cités marchandes commercent avec les navigateurs arabes, indiens et chinois. Le royaume d'<b>Abyssinie</b> est chrétien depuis le IV<sup>e</sup> siècle. Doc. 3 : Kanga Moussa, empereur du Mali, tenant une pépite d'or (Atlas catalan, XIV<sup>e</sup> siècle)." },
  bookDef("subsa"), bookDef("apogee"),
  { t:"pause", q:"Que fournit l'Afrique en grande quantité au Moyen Âge, et contre quoi les marchands arabes et berbères l'échangent-ils ?", a:"L'or. Ils amènent le sel et l'échangent contre de l'or, de l'ivoire et des esclaves.", s:"Livre p. 39" },
  { t:"h3", h:"Des empires prospères en Asie" },
  { t:"p", s:"Livre p. 39, « Des empires prospères en Asie », doc. 4 et 5", h:"Chaque grand ensemble d'Asie jouit d'une civilisation raffinée, d'une administration efficace et d'une agriculture productive. <b>L'Empire chinois de la dynastie des Ming est le plus important au XV<sup>e</sup> siècle.</b> Deux siècles après la description de Marco Polo dans son <i>Livre des Merveilles du Monde</i>, Beijing, la capitale, est l'une des plus grandes villes du monde (doc. 4 : une porte de la Cité interdite). En Inde et en Asie du Sud, d'autres États prestigieux contrôlent d'importants territoires. Doc. 5 : l'amiral Zheng He (1371-1433) prend la tête de grandes expéditions dans tout l'océan Indien en vue d'échanges commerciaux." },
  { t:"ex", s:"Cahier p. 16, ex. 3a et 3b (corrigés en classe)", items:[
    ["Ex. 3a","Vrai ou faux sur le monde jusqu'en 1492.","Juste : les puissances qui dominent les échanges sont en Asie ; l'Empire ottoman contrôle le commerce entre l'Europe et l'Asie ; les royaumes africains ont peu de contacts avec les Européens ; la Cité interdite est l'immense palais de l'empereur chinois. Faux : les axes ne traversent ni l'Atlantique ni le Pacifique ; personne en Europe ou en Asie ne connaît l'Amérique ; Zheng He sillonne l'océan Indien, pas le Pacifique."],
    ["Ex. 3b","La place de l'Europe dans le réseau commercial mondial.","L'Europe est à la périphérie du réseau, un peu à l'écart, sans accès à l'océan Indien, principal lieu d'échanges."]] },
  { t:"pause", q:"Vrai ou faux : l'amiral Zheng He sillonne l'océan Pacifique pour le compte de l'Empire chinois ?", a:"Faux : il prend la tête de grandes expéditions dans tout l'océan Indien.", s:"Cahier ex. 3a, affirmation 7 · livre p. 39, doc. 5" },
  { t:"tip", h:"Pour citer une civilisation, donne son nom, son lieu et une information du livre : « l'Empire chinois des Ming, le plus important au XVe siècle, capitale Beijing ». Retiens surtout qu'avant 1492, l'Europe n'est pas au centre du monde."},
  { t:"see", ids:["S4","S7","C3"] },
  { t:"src", h:"Livre pp. 38-39 (doc. 1 à 5, glossaire) · cahier ex. 3" },
]},

/* ---------------- S2 ---------------- */
{ id:"S2", ch:"S", titre:"Ce qui a permis les grandes expéditions", court:"Les épices, Constantinople, la caravelle, la boussole",
  obj:"Ce qui a permis les grandes expéditions maritimes",
  pre:[{ q:"Pourquoi les épices sont-elles si recherchées par les Européens ?", a:"Leur origine lointaine, leur rareté et leur prix en font une denrée de luxe.", s:"Livre p. 42, introduction" }, { q:"Quel nouveau navire les Portugais mettent-ils au point au XVe siècle ?", a:"La caravelle : un voilier de petite taille, léger, rapide et très maniable.", s:"Livre p. 42" }],
  blank:{ consigne:"Écris les raisons de partir (pourquoi) et les innovations qui le rendent possible (comment).", points:["Pourquoi : le commerce des épices (poivre, cannelle, muscade, safran, girofle, gingembre), denrée de luxe", "Pourquoi : la prise de Constantinople par les Turcs en 1453 risque de couper la route terrestre", "Pourquoi : éviter les marchands musulmans, convertir de nouvelles populations au christianisme ; le récit de Marco Polo fait rêver", "Comment : la caravelle (inspirée de la caraque), les portulans, la boussole, l'astrolabe", "Deux directions : les Portugais par l'est (contourner l'Afrique), les Espagnols par l'ouest"], s:"Livre p. 37 et p. 42" },
  blocks:[
  { t:"h3", h:"Pourquoi partir ?" },
  { t:"p", s:"Livre p. 37, introduction", h:"Les échanges commerciaux entre l'Europe et l'Asie existent depuis l'époque romaine. Au début du XV<sup>e</sup> siècle, ils sont aux mains des <b>Vénitiens</b>. Le récit du voyage de <b>Marco Polo</b> (1254-1324), publié sous le nom de <i>Livre des Merveilles du Monde</i> et décrivant les richesses extraordinaires de l'Asie, fait rêver les Européens." },
  { t:"p", s:"Livre p. 42, introduction", h:"Depuis l'Antiquité, les civilisations asiatiques sont à la source du commerce des <b>épices</b> (poivre, cannelle, muscade, safran, girofle, gingembre…). Leur origine lointaine, leur rareté et leur prix en font une denrée de luxe très recherchée par les Européens. <b>La prise de Constantinople par les Turcs en 1453</b> risque de couper la route terrestre qui mène aux ports de l'océan Indien. D'où l'idée de chercher un accès <b>maritime</b>." },
  { t:"p", s:"Livre p. 37, texte", h:"Après 1453, les Européens cherchent de nouvelles routes pour atteindre ces contrées merveilleuses <b>sans passer par l'intermédiaire des marchands musulmans</b>. Ils souhaitent aussi <b>convertir de nouvelles populations au christianisme</b>." },
  { t:"pause", q:"Cite trois raisons de partir données par ton livre.", a:"Les épices (denrée de luxe), la prise de Constantinople en 1453 qui risque de couper la route terrestre, la volonté d'éviter les marchands musulmans et de convertir de nouvelles populations au christianisme. Le récit de Marco Polo fait aussi rêver.", s:"Livre p. 37 et p. 42" },
  { t:"h3", h:"Comment ? Les innovations techniques" },
  { t:"p", s:"Livre p. 42, texte", h:"Au XV<sup>e</sup> siècle, les Européens poursuivent leurs avancées techniques dans le domaine de la navigation. En s'inspirant de la caraque, les <b>Portugais</b> mettent au point un nouveau navire, la <b>caravelle</b>, un voilier de petite taille, léger, rapide et très maniable. Des cartes nautiques de plus en plus précises (comme les <b>portulans</b>), la <b>boussole</b> et l'<b>astrolabe</b> permettent aux marins de mieux se repérer et s'orienter. Atteindre les Indes par la mer ne paraît alors plus impossible." },
  { t:"html", s:"Livre p. 42, texte, doc. 12 et glossaire", h:tiles([["La caravelle","voilier de petite taille, léger, rapide et très maniable, mis au point par les Portugais"],["La caraque","grand navire à coque arrondie (doc. 12 : la Victoria de Magellan)"],["Le portulan","carte de navigation qui repère les ports et leurs dangers"],["La boussole et l'astrolabe","pour mieux se repérer et s'orienter en mer"]]) },
  bookDef("caraque"), bookDef("portulan"),
  { t:"pause", q:"Quels instruments et quelles cartes aident les marins à se repérer ?", a:"Les portulans (cartes nautiques de plus en plus précises), la boussole et l'astrolabe.", s:"Livre p. 42" },
  { t:"h3", h:"Deux directions" },
  { t:"p", s:"Livre p. 42, texte · p. 37", h:"Les navigateurs <b>portugais</b> cherchent un passage <b>par l'est</b>, en tentant de contourner le continent africain : avec Vasco de Gama, ils passent le cap de Bonne-Espérance et arrivent en Inde en 1498. Les <b>Espagnols</b> misent plutôt sur la direction de l'<b>ouest</b> : Christophe Colomb part en 1492." },
  { t:"ex", s:"Cahier p. 18, ex. 6 (livre pp. 37 et 42) · cahier p. 15, ex. 1a", items:[
    ["Ex. 6","Tu as relié six motivations aux acteurs concernés : convertir au christianisme, agrandir le territoire, soif de richesses, acheminer des épices, curiosité, goût de l'aventure.","Les expéditions ont plusieurs moteurs : religieux, politiques, économiques et l'envie de découvrir. Ces six motivations sont à savoir citer."],
    ["Ex. 1a","Tu as daté la prise de Constantinople par les Turcs.","1453 : l'événement qui pousse les Européens à chercher la route de la mer."]] },
  { t:"pause", q:"Quelle direction choisissent les Portugais, et laquelle les Espagnols ?", a:"Les Portugais : l'est, en contournant l'Afrique. Les Espagnols : l'ouest.", s:"Livre p. 42" },
  { t:"tip", h:"Le manuel (p. 35) demande de « décrire les conditions (techniques, politiques, économiques, scientifiques) » des grandes expéditions. Range tes arguments dans ces cases : économiques (épices, éviter les marchands musulmans), politiques (Constantinople prise par les Turcs, agrandir le territoire), techniques et scientifiques (caravelle, portulans, boussole, astrolabe), sans oublier la religion (convertir)." },
  { t:"see", ids:["S1","C5","D"] },
  { t:"src", h:"Livre p. 35 (apprentissages visés), p. 37, p. 42 (doc. 12, glossaire) · cahier ex. 1a et 6" },
]},

/* ---------------- S3 ---------------- */
{ id:"S3", ch:"S", titre:"La rencontre entre Européens et indigènes", court:"Colomb aux Bahamas, Cortés reçu à Tlaxcala et par Moctezuma",
  obj:"Comment se passe la rencontre entre les Européens et les indigènes",
  pre:[{ q:"Où Christophe Colomb croit-il être arrivé en 1492 ?", a:"Aux Indes. En réalité, il débarque sur une île des Bahamas.", s:"Livre p. 43" }, { q:"Selon toi, la première rencontre se passe-t-elle dans la violence ou dans le calme ?", a:"Les documents montrent d'abord un accueil paisible, avec des présents ; mais des détails annoncent déjà la conquête.", s:"Cahier ex. 9 et 10 (corrigés) · livre p. 44" }],
  blank:{ consigne:"Raconte deux rencontres (Colomb, Cortés) : comment elles commencent et ce qui annonce la suite.", points:["Colomb, 12 octobre 1492 : il débarque avec la bannière royale et prend possession de la terre au nom du Roi et de la Reine", "Colomb décrit des gens sans armes, qui ne connaissent pas le fer, et une terre riche en or", "Cortés et Maxixcatzin : atmosphère paisible, calme, amicale ; des présents", "Ce qui annonce la conquête : les armes des soldats espagnols et de leurs alliés, Cortés assis en position de supériorité"], s:"Livre p. 43, doc. 14 · cahier ex. 9 et 10" },
  blocks:[
  { t:"p", s:"Livre p. 37, texte", h:"Les voyages permettent aux Européens de découvrir des terres et d'entrer en contact avec des <b>peuples dont ils ignoraient l'existence</b>." },
  { t:"h3", h:"Christophe Colomb aux Bahamas (1492)" },
  { t:"p", s:"Livre p. 43, « Les grandes expéditions européennes »", h:"Au service des rois d'Espagne, Christophe Colomb, un navigateur génois, part en 1492 avec trois bateaux pour chercher une route par l'ouest, vers l'Asie. Il débarque sur une île des Bahamas, <b>convaincu d'être arrivé aux Indes</b>." },
  { t:"p", s:"Cahier p. 19, texte d (adapté de la première lettre des Indes de Christophe Colomb, 1493)", h:"« 12 octobre 1492. La terre (San Salvador) paraît à deux heures du matin. Au matin, je débarque avec la bannière royale et j'en prends possession au nom du Roi et de la Reine. […] Alors nous vîmes des gens nus […]. Je crois qu'ils se feraient aisément chrétiens, car il m'a paru qu'ils n'étaient d'aucune religion. »" },
  { t:"p", s:"Livre p. 43, doc. 14 (adapté de la première lettre des Indes de Christophe Colomb, éditée en 1493)", h:"Dans sa lettre, Colomb décrit l'île Espagnole comme « une véritable merveille » : la terre est si belle qu'elle semble appropriée pour semer, cultiver, élever du bétail, construire des villes. Il y a beaucoup de grandes rivières, dont la plupart « charrient de l'or ». Les habitants « ne connaissent pas le fer, ni l'acier ; ils ne possèdent pas d'armes et ne savent pas s'en servir »." },
  { t:"pause", q:"Dans le texte d, que fait Colomb dès qu'il débarque ?", a:"Il débarque avec la bannière royale et prend possession de la terre au nom du Roi et de la Reine.", s:"Cahier p. 19, texte d" },
  { t:"mine", s:"Cahier p. 19, ex. 9a et 9b (corrigés en classe) · docs b (gravure, 1594) et c (huile sur toile, 1890)", titre:"Ton exercice 9 : deux images de l'arrivée de Colomb", items:["Espagnols : fiers ; armure et casque, vêtements riches, chapeau, manteau ; épées, fusils, croix, bannière.","Amérindiens : dociles, accueillants, respectueux, soumis ; presque nus ou en pagne ; présents (coupes, colliers), arcs et flèches.","Les images correspondent en grande partie aux récits : habitants accueillants, sans armes à feu, terre qui paraît fertile. Mais les indigènes ne sont que partiellement nus et ont des arcs (doc. c), et la bannière n'apparaît pas sur le doc. b."] },
  { t:"h3", h:"Cortés et le chef de Tlaxcala" },
  { t:"p", s:"Cahier p. 20, doc. e : « Le chef de Tlaxcala, Maxixcatzin, présente des cadeaux à Hernán Cortés comme signe de bienvenue », enluminure du Codex de Tlaxcala, 1550", h:"Sur l'image, on reconnaît Cortés et son interprète, la Malinche, le chef de Tlaxcala, Maxixcatzin, les soldats espagnols, les représentants tlaxcaltèques, les alliés amérindiens de Cortés, et des présents." },
  { t:"mine", s:"Cahier p. 20, ex. 10b et 10c (corrigés en classe)", titre:"Ton exercice 10", items:["Atmosphère : paisible, calme, amicale.","Ce qui annonce toutefois la conquête : les armes des soldats espagnols et de leurs alliés ; Cortés est assis en position de supériorité, sur une petite estrade."] },
  { t:"pause", q:"Sur l'image du Codex de Tlaxcala, quels éléments annoncent la conquête ?", a:"Les armes des soldats espagnols et de leurs alliés, et Cortés assis en position de supériorité sur une estrade.", s:"Cahier ex. 10c (corrigé)" },
  { t:"h3", h:"Moctezuma et les présents" },
  { t:"p", s:"Livre p. 44, « La conquête du Mexique », doc. 17 (Sahagún, Codex de Florence, vers 1575)", h:"En 1519, Cortés est <b>reçu par l'empereur Moctezuma</b> à Tenochtitlan. Bernardino de Sahagún raconte : « Quand ils offrirent aux Espagnols des colliers d'or, et quand ils leur eurent fait ces présents, leur visage s'éclaira, grande fut leur joie, ils étaient aux anges. »" },
  { t:"ex", s:"Cahier p. 18, ex. 7 (livre p. 43, doc. 14)", items:[["Ex. 7","Tu as repéré, dans la lettre de Colomb, les avantages de l'île et ce qu'il veut prouver aux souverains espagnols.","Le récit d'un explorateur n'est pas neutre : Colomb décrit une terre riche en or et des habitants sans armes, pour montrer que son voyage était utile."]] },
  { t:"tip", h:"Pour décrire une rencontre, suis trois étapes : qui rencontre qui, où et quand ; comment se passe l'accueil (présents, atmosphère) ; quels signes annoncent la suite (armes, prise de possession au nom du roi, recherche de l'or)." },
  { t:"see", ids:["S5","C2","S8"] },
  { t:"src", h:"Livre p. 37, p. 43 (doc. 14), p. 44 (doc. 17) · cahier ex. 7, 9 et 10" },
]},

/* ---------------- S4 ---------------- */
{ id:"S4", ch:"S", titre:"Aztèques et Incas, des civilisations développées", court:"Mayas, Aztèques, Incas et ce qu'ils ont en commun",
  obj:"Que les Aztèques et les Incas etc. étaient des civilisations plus ou moins développées",
  pre:[{ q:"D'où viennent les ancêtres des Amérindiens ?", a:"D'Asie, il y a au moins 40 000 ans, par le détroit de Béring.", s:"Livre p. 40 · cahier ex. 4a" }, { q:"Les Incas et les Aztèques utilisaient-ils la roue et le fer ?", a:"Non : la roue n'est pas utilisée et ils n'ont pas d'outils en fer.", s:"Livre p. 41, points communs" }],
  blank:{ consigne:"Fais deux colonnes : ce que les peuples amérindiens maîtrisent, et ce qu'ils n'utilisent pas.", points:["Ils maîtrisent : l'astronomie et les mathématiques, des calendriers perfectionnés, une écriture (Mayas), des constructions monumentales", "Ils maîtrisent : l'agriculture (maïs, haricots, terrasses des Incas), le travail de l'or, de l'argent, du cuivre", "Ils n'utilisent pas : la roue, les outils en fer, les chevaux ; la navigation est peu développée", "Capitale aztèque : Tenochtitlán (fondée en 1325) ; Empire inca : le long des Andes, empereur « fils du Soleil »"], s:"Livre pp. 40-41" },
  blocks:[
  { t:"p", s:"Livre p. 40, « Des civilisations millénaires en Amérique »", h:"En Amérique, plusieurs peuples se succèdent depuis le II<sup>e</sup> millénaire av. J.-C., parmi lesquels les Olmèques, les Mayas, les Aztèques et les Incas. Ils descendent d'ancêtres communs, <b>venus d'Asie il y a au moins 40 000 ans par le détroit de Béring</b>, alors franchissable grâce aux glaciations. Ils ont chacun leur organisation politique et sociale, une religion polythéiste et leurs coutumes. Les Empires aztèque et inca sont très étendus." },
  { t:"mine", s:"Cahier p. 16, ex. 4a", titre:"Ton exercice 4a", items:["D'où sont originaires les Amérindiens ? Ils sont d'Asie."] },
  { t:"h3", h:"Mayas, Aztèques, Incas" },
  { t:"html", s:"Livre p. 40 (Mayas, doc. 6 à 8) et p. 41 (Aztèques, Incas, doc. 9 à 11)", h:tbl(["Peuple","Ce que dit ton livre"], [
    ["<b>Mayas</b><br>du Yucatán au Honduras","Pas un véritable empire : des cités-États, chacune avec son gouvernement. Grande maîtrise de l'astronomie, calendriers perfectionnés, écriture de plus de 1000 signes (codex détruits en 1562), temples-pyramides, palais, observatoires (Chichén Itzá). Au XVe siècle, la civilisation maya est en déclin."],
    ["<b>Aztèques</b><br>haut plateau du Mexique","Capitale Tenochtitlán (l'actuelle Mexico), fondée en 1325. Tribu de guerriers, vaste territoire. Un empereur entouré de prêtres et de nobles ; administration avec une écriture particulière. Agriculture (maïs, haricots, pommes de terre) et commerce. Sacrifices humains pour « nourrir » les dieux."],
    ["<b>Incas</b><br>cordillère des Andes","Empereur au pouvoir absolu, « fils du Soleil », d'origine divine. Agriculture en terrasses aux flancs des montagnes, outils en bois et en pierre. Lamas, alpagas ; travail de l'or, de l'argent, du cuivre. Excellents bâtisseurs (Machu Picchu). Discipline très stricte : travail obligatoire au service de l'empire."]]) },
  { t:"pause", q:"Quelle est la capitale des Aztèques, et quand a-t-elle été fondée ?", a:"Tenochtitlán, l'actuelle Mexico, fondée en 1325.", s:"Livre p. 41" },
  { t:"pause", q:"Pourquoi l'écriture maya n'est-elle pas encore complètement déchiffrée ?", a:"Parce que la plupart des codex ont été détruits en 1562.", s:"Livre p. 40" },
  { t:"h3", h:"Les points communs des peuples amérindiens" },
  { t:"html", s:"Livre p. 41, encadré « Points communs entre les différents peuples amérindiens »", h:tbl(["Ce qu'ils ont","Ce qu'ils n'ont pas"], [
    ["Une agriculture basée sur des céréales et des plantes inconnues en Europe","Pas d'outils en fer"],
    ["Des connaissances étendues en mathématiques et en astronomie","La roue n'est pas utilisée"],
    ["Des constructions monumentales","Peu d'animaux domestiques (lamas, dindes, chiens…), pas de chevaux"],
    ["","Une navigation peu développée"]]) },
  { t:"pause", q:"Cite deux choses que les Amérindiens maîtrisent et deux qu'ils n'utilisent pas.", a:"Ils maîtrisent par exemple les mathématiques et l'astronomie, et les constructions monumentales. Ils n'utilisent pas la roue et n'ont pas d'outils en fer (ni chevaux).", s:"Livre p. 41, points communs" },
  { t:"tip", h:"Ta feuille dit « plus ou moins développées » : réponds avec les deux colonnes. Ce qu'ils maîtrisent (astronomie, calendriers, constructions, agriculture, écriture) et ce qu'ils n'ont pas (roue, fer, chevaux, navigation). Ces manques expliquent en partie la supériorité de l'armement des conquistadors (S5)." },
  { t:"see", ids:["S1","S5","S6"] },
  { t:"src", h:"Livre pp. 40-41 (doc. 6 à 11, points communs) · cahier ex. 4a" },
]},

/* ---------------- S5 ---------------- */
{ id:"S5", ch:"S", titre:"La conquête des empires amérindiens", court:"Cortés et Malinche au Mexique, Pizarro au Pérou",
  obj:"Comment se passe la conquête des empires amérindiens (ex Mexique)",
  pre:[{ q:"Qui conquiert l'Empire aztèque, et qui conquiert l'Empire inca ?", a:"Hernán Cortés conquiert l'Empire aztèque (Mexique) ; Francisco Pizarro conquiert l'Empire inca (Pérou), de 1531 à 1533.", s:"Livre pp. 44-45" }, { q:"Qui est la Malinche ?", a:"Une esclave des Mayas offerte à Cortés ; elle devient sa compagne et son interprète.", s:"Livre p. 44, doc. 16" }],
  blank:{ consigne:"Raconte la conquête du Mexique puis celle du Pérou en quatre étapes chacune.", points:["Mexique : Cortés entend parler de l'or du Mexique, décide d'envahir l'Empire aztèque (20 millions d'habitants)", "1519 : reçu par Moctezuma à Tenochtitlan ; l'empereur est fait prisonnier, puis tué ; territoire soumis (Cortès au Mexique 1519-21)", "La Malinche, interprète de Cortés", "Pérou : Pizarro (1531-1533) ; Atahualpa accueille les Espagnols, est arrêté, une rançon est payée, il est mis à mort", "Résistance inca jusqu'en 1572 : Túpac Amaru est décapité, la résistance cesse"], s:"Livre pp. 44-45 · feuille d'objectifs" },
  blocks:[
  { t:"p", s:"Livre p. 44, texte d'introduction", h:"Après la découverte de l'Amérique débute une phase de <b>conquête</b>. Au début du XVI<sup>e</sup> siècle, des aventuriers et des hommes de guerre se lancent à l'assaut des terres où vivent les civilisations amérindiennes. Les <b>conquistadors</b> s'emparent rapidement et par la violence de territoires immenses. Ils bénéficient de la <b>supériorité de leur armement</b>, mais aussi des <b>rivalités importantes entre les divers peuples amérindiens</b>." },
  bookDef("conq"),
  { t:"pause", q:"Selon le livre, quels sont les deux avantages des conquistadors ?", a:"La supériorité de leur armement et les rivalités importantes entre les divers peuples amérindiens.", s:"Livre p. 44" },
  { t:"h3", h:"La conquête du Mexique (Cortés)" },
  { t:"p", s:"Livre p. 44, « La conquête du Mexique » · feuille d'objectifs (1519-21 : Cortès au Mexique)", h:"Après avoir entendu parler des richesses en <b>or</b> du Mexique, l'Espagnol <b>Hernán Cortés</b>, qui a passé quatorze années à Cuba, décide d'envahir l'<b>Empire aztèque</b>, peuplé de 20 millions d'habitants. <b>En 1519</b>, il est reçu par l'empereur <b>Moctezuma</b> à Tenochtitlan, capitale de l'Empire aztèque. L'empereur est fait prisonnier, puis tué, et son territoire soumis aux Espagnols. Ta feuille résume : <b>1519-21, Cortès au Mexique</b>." },
  { t:"p", s:"Livre p. 44, doc. 16 « La Malinche (vers 1502-1529) »", h:"<b>La Malinche</b>, esclave des Mayas, est offerte à Cortés. Elle devient sa compagne et lui donne un fils. Elle est aussi son <b>interprète</b> lors de la conquête de l'Empire aztèque. Son nom est aujourd'hui symbole de trahison, mais elle est aussi parfois vue comme la « mère » du Mexique moderne et métissé." },
  { t:"p", s:"Livre p. 44, doc. 18 (Hernán Cortés, première lettre à Charles Quint, mars 1521)", h:"Paroles de Moctezuma rapportées par Cortés : certains croyaient que les Espagnols étaient des dieux, que des bêtes farouches leur obéissaient et qu'ils tenaient la foudre entre leurs mains. Moctezuma reconnaît qu'ils sont des hommes : les bêtes sont « de grands cerfs » apprivoisés, les armes sont « des tuyaux d'un métal que nous ne connaissons pas ». Une prophétie disait que les descendants du dieu Quetzalcoatl reviendraient de l'est." },
  { t:"pause", q:"En quelle année Cortés est-il reçu par Moctezuma, et que devient ensuite l'empereur ?", a:"En 1519. Moctezuma est fait prisonnier, puis tué, et son territoire est soumis aux Espagnols.", s:"Livre p. 44" },
  { t:"h3", h:"La conquête du Pérou (Pizarro)" },
  { t:"p", s:"Livre p. 45, « La conquête du Pérou », doc. 19 et 21", h:"<b>De 1531 à 1533, Francisco Pizarro conquiert l'Empire inca.</b> L'empereur inca <b>Atahualpa</b> accueille les Espagnols, cependant il est arrêté ; une rançon est payée, mais il est mis à mort (doc. 19 : un conquistador reçoit des présents en guise de rançon ; « Cet or, nous mangeons »). La résistance inca se développe et les Espagnols sont assiégés dans la ville de Cuzco. Mais lorsque <b>Túpac Amaru</b>, neveu d'Atahualpa et dernier empereur inca, est décapité <b>en 1572</b>, la résistance à la domination espagnole cesse." },
  { t:"html", s:"Livre pp. 44-45 · frise p. 34", h:tbl(["Étape","Mexique (Aztèques) · Pérou (Incas)"], [
    ["Le conquistador","Hernán Cortés · Francisco Pizarro"],
    ["L'empereur","Moctezuma · Atahualpa"],
    ["L'accueil","Cortés reçu à Tenochtitlan en 1519 · Atahualpa accueille les Espagnols"],
    ["La fin de l'empereur","fait prisonnier, puis tué · arrêté, rançon payée, mis à mort"],
    ["Les dates","1519-21 (feuille d'objectifs) · 1531-1533 ; résistance jusqu'en 1572"]]) },
  { t:"pause", q:"Qui est Túpac Amaru, et que se passe-t-il en 1572 ?", a:"Le neveu d'Atahualpa et dernier empereur inca. Il est décapité en 1572 et la résistance inca cesse.", s:"Livre p. 45 · frise p. 35" },
  { t:"p", s:"Livre p. 34, frise · feuille d'objectifs · livre p. 44", h:"⚠️ Attention : la frise de la p. 34 indique « 1511 Prise de Tenochtitlan ». C'est sûrement une erreur, puisque Cortés n'est reçu par Moctezuma qu'en 1519 (p. 44). Retiens la date de ta feuille : <b>1519-21, Cortès au Mexique</b>. En cas de doute, demande à ton maître." },
  { t:"ex", s:"Cahier p. 20, ex. 10a", items:[["Ex. 10a","Tu as retrouvé sur l'image du Codex de Tlaxcala Cortés et la Malinche, le chef Maxixcatzin, les soldats espagnols, les alliés amérindiens et les présents.","Cortés n'est pas seul : il a une interprète et des alliés amérindiens. C'est ce que le livre appelle les « rivalités entre les peuples »."]] },
  { t:"tip", h:"Pour raconter une conquête, donne le conquistador, l'empire, l'empereur, la date et ce qui arrive à l'empereur. Explique ensuite pourquoi les Espagnols gagnent : l'armement, les rivalités entre peuples (et les maladies, voir S6)." },
  { t:"see", ids:["S3","S6","P"] },
  { t:"src", h:"Livre pp. 44-45 (doc. 16, 18, 19, 21, glossaire) · frise p. 34 · cahier ex. 10a" },
]},

/* ---------------- S6 ---------------- */
{ id:"S6", ch:"S", titre:"Les conséquences de la découverte de l'Amérique", court:"Conversions forcées, choc microbien, exploitation des Amérindiens",
  obj:"Quelles sont les conséquences de la découverte de l'Amérique (conversions forcées, choc microbien, exploitation des amérindiens…)",
  pre:[{ q:"Combien d'Amérindiens vivaient aux Antilles à l'arrivée de Colomb, et combien cinquante ans plus tard ?", a:"4 millions ; cinquante ans plus tard, ils avaient disparu.", s:"Livre p. 46" }, { q:"Pourquoi les Amérindiens meurent-ils de maladies comme la grippe ou la variole ?", a:"Ils n'ont aucune défense immunitaire contre ces maladies nouvelles : c'est le choc microbien.", s:"Livre p. 46" }],
  blank:{ consigne:"Écris les trois conséquences de ta feuille, chacune avec un exemple ou un chiffre du livre.", points:["Conversions forcées : les missionnaires brûlent les textes et les objets sacrés (autodafés), détruisent les temples, éduquent les enfants dans des couvents", "Choc microbien : grippe, choléra, variole, rougeole, paludisme ; Mexique : plus de 25 millions avant 1492, environ 1 million en 1605", "Exploitation : travail forcé dans les grands domaines et les mines d'or ou d'argent, intoxication au mercure", "Les Européens créent une administration, s'approprient les terres et les mines", "À long terme : un métissage culturel"], s:"Livre pp. 46-47" },
  blocks:[
  { t:"p", s:"Livre p. 46, « L'exploitation de l'Amérique »", h:"Après les conquêtes, les Espagnols dominent les Antilles ainsi que l'Amérique centrale et andine ; les Portugais occupent les côtes du Brésil. Les Européens créent une <b>administration</b> pour gouverner les régions du nouveau continent. Ils s'approprient les terres et les mines d'or et d'argent. Les populations amérindiennes se retrouvent obligées de travailler au service de leurs conquérants et se voient imposer une autre culture (religion, langue…). Victimes de maladies et de mauvais traitements, elles disparaissent progressivement." },
  { t:"h3", h:"1. Des conversions forcées" },
  { t:"p", s:"Livre p. 46, « Des conversions forcées », doc. 23", h:"Dès le début de la conquête, les missionnaires <b>brûlent les textes (autodafés) et les objets sacrés</b>, détruisent les temples aztèques ou incas pour construire des églises. Ils entreprennent ensuite la conversion des élites au christianisme, éduquant les enfants dans des couvents pour les couper de leurs traditions. Leur succès vient de l'utilisation des langues locales et de la protection qu'ils offrent aux Amérindiens face aux sévices des conquistadors. <b>Mais les conversions restent souvent superficielles.</b> (Doc. 23 : « Autodafé d'objets sacrés », Codex de Tlaxcala, XVI<sup>e</sup> siècle.)" },
  bookDef("conv"),
  { t:"pause", q:"Qu'est-ce qu'un autodafé, d'après ton livre ?", a:"Les missionnaires brûlent les textes et les objets sacrés des Amérindiens.", s:"Livre p. 46, doc. 23" },
  { t:"h3", h:"2. Le choc microbien" },
  bookDef("choc"),
  { t:"p", s:"Livre p. 46, « Le choc microbien »", h:"En Europe, grâce aux échanges avec l'Asie et l'Afrique, les populations ont de meilleures défenses immunitaires ; cela leur permet de mieux résister aux microbes venus d'Amérique. Les chiffres du livre : <b>à l'arrivée de Colomb, 4 millions d'Amérindiens habitaient les Antilles ; cinquante ans plus tard, ils avaient disparu.</b> Au Mexique : plus de 25 millions avant 1492, environ 1 million en 1605. Au Pérou, durant la même période : d'environ 10 millions à 1 million." },
  { t:"svg", k:"pop", titre:"La population amérindienne avant et après la conquête", alt:"Le graphique compare la population amérindienne avant et après la conquête, pour trois régions. Aux Antilles : 4 millions en 1492, plus personne cinquante ans plus tard. Au Mexique : plus de 25 millions avant 1492, environ 1 million en 1605. Au Pérou : environ 10 millions, puis 1 million en 1605. Les barres hachurées, presque vides, montrent l'effondrement.", s:"Livre p. 46, « Le choc microbien » · cahier ex. 12a et 12b" },
  { t:"p", s:"Livre p. 46, doc. 24 · p. 47, doc. 25 (Bernardino de Sahagún, Codex de Florence, vers 1575) et glossaire", h:"Le doc. 24 montre « L'arrivée de la petite vérole » (Codex de Florence, 1575-1577). Sahagún décrit les pustules « horribles à voir » : beaucoup en mouraient, d'autres mouraient de faim ; certains perdaient un œil ou devenaient aveugles." },
  bookDef("pust"),
  { t:"pause", q:"Au Mexique, combien d'Amérindiens avant 1492, et combien en 1605 ?", a:"Plus de 25 millions avant 1492, environ 1 million en 1605.", s:"Livre p. 46" },
  { t:"h3", h:"3. L'exploitation des Amérindiens" },
  { t:"p", s:"Livre p. 47, « L'exploitation des Amérindiens », doc. 26", h:"Au choc microbien s'ajoute l'exploitation de la main-d'œuvre amérindienne : des milliers d'Amérindiens sont <b>forcés à travailler dans les grands domaines agricoles</b> créés par les Européens, <b>dans les mines d'or ou d'argent</b>. Beaucoup préfèrent risquer les châtiments et fuir leur village plutôt que de subir de mauvais traitements et mourir des maladies dues à l'<b>intoxication au mercure</b>. (Doc. 26 : scènes de tortures infligées aux Indiens refusant de se soumettre, Guamán Poma de Ayala, 1615.)" },
  { t:"pause", q:"Où les Amérindiens sont-ils forcés de travailler ?", a:"Dans les grands domaines agricoles créés par les Européens et dans les mines d'or ou d'argent.", s:"Livre p. 47" },
  { t:"h3", h:"Et plus tard : le métissage culturel" },
  { t:"p", s:"Livre p. 47, « Le métissage culturel »", h:"Après leur conquête, les grandes civilisations disparaissent, mais les survivants aztèques et incas convertis au christianisme gardent leur mode de vie, certaines coutumes et parfois leur religion, tout en adoptant les mœurs et la langue des Espagnols. Des descendants de Moctezuma occupent des fonctions administratives ; des capitaines espagnols épousent des nobles incas. C'est ainsi qu'apparaît un <b>métissage culturel</b> qui a permis la conservation d'une partie de la culture amérindienne jusqu'à nos jours." },
  { t:"ex", s:"Cahier p. 21, ex. 12a et 12b (livre pp. 46-47)", items:[["Ex. 12a-b","Tu as relevé les chiffres de population et construit un graphique : Antilles 4 millions en 1492, 0 en 1542 ; Mexique 25 millions en 1492, 1 million en 1605.","La population amérindienne s'effondre en un siècle. La case Pérou 1605 est restée vide : le livre donne 1 million."]] },
  { t:"tip", h:"Pour chaque conséquence, donne le nom (conversions forcées, choc microbien, exploitation), ce qui se passe et un exemple ou un chiffre. Les chiffres du Mexique (plus de 25 millions → environ 1 million en 1605) marquent les esprits : apprends-les." },
  { t:"see", ids:["S7","S9","C4"] },
  { t:"src", h:"Livre pp. 46-47 (doc. 23 à 26, glossaire) · Larousse (conversion) · cahier ex. 12" },
]},

/* ---------------- S7 ---------------- */
{ id:"S7", ch:"S", titre:"Les échanges avant et après les découvertes", court:"Échange colombien, traite atlantique, empires coloniaux",
  obj:"Quels sont les échanges entre les continents avant et après les découvertes (échange colombien, commerce transatlantique ou triangulaire, apparition des empires coloniaux)",
  pre:[{ q:"Avant 1492, aux mains de qui est le commerce entre l'Europe et l'Asie au début du XVe siècle ?", a:"Des Vénitiens.", s:"Livre p. 37" }, { q:"La pomme de terre et le maïs viennent-ils d'Amérique ou d'Europe ?", a:"D'Amérique : ils font partie de l'échange colombien.", s:"Livre p. 49, doc. 30" }],
  blank:{ consigne:"Écris ce qui change entre avant et après les découvertes, avec les trois mots de ta feuille.", points:["Avant : échanges Europe-Asie aux mains des Vénitiens ; l'océan Indien est le principal lieu d'échanges ; l'Europe est à la périphérie", "Après : l'Europe au cœur du commerce mondial (Séville, Lisbonne, Amsterdam, Anvers)", "Empires coloniaux : Espagne (Amérique, Philippines), Portugal (Brésil, comptoirs), Provinces-Unies ; puis Anglais et Français en Amérique du Nord", "Traite atlantique : main-d'œuvre cherchée en Afrique, esclaves vendus en Amérique, produits rares vers l'Europe", "Échange colombien : plantes, animaux et microbes entre les continents (maïs, pomme de terre, cheval, blé…)"], s:"Livre pp. 37-38, 48-49" },
  blocks:[
  { t:"h3", h:"Avant les découvertes" },
  { t:"p", s:"Livre p. 37 et p. 38 · cahier ex. 3b (corrigé)", h:"Les échanges entre l'Europe et l'Asie existent depuis l'époque romaine ; au début du XV<sup>e</sup> siècle, ils sont <b>aux mains des Vénitiens</b>. Le principal lieu d'échanges est l'<b>océan Indien</b>, dominé par des marchands juifs, arabes puis indiens. L'Europe est à la périphérie de ce réseau." },
  { t:"h3", h:"Après : un réseau commercial à l'échelle du globe" },
  { t:"p", s:"Livre p. 48, texte d'introduction", h:"L'exploitation des richesses du Nouveau-Monde favorise le développement des échanges. <b>L'Europe se retrouve au cœur du commerce mondial.</b> Les ports de l'Atlantique, comme Séville et Lisbonne, et de la mer du Nord, comme Amsterdam et Anvers, jouent un rôle essentiel car ils reçoivent les produits d'Amérique et d'Asie." },
  { t:"pause", q:"Avant les découvertes, l'Europe est à la périphérie du commerce. Où se trouve-t-elle après ?", a:"Au cœur du commerce mondial, avec ses ports de l'Atlantique (Séville, Lisbonne) et de la mer du Nord (Amsterdam, Anvers).", s:"Livre p. 48" },
  { t:"h3", h:"L'apparition des empires coloniaux" },
  bookDef("empcol"),
  { t:"p", s:"Livre p. 48, texte", h:"Deux grands empires coloniaux naissent : celui de l'<b>Espagne</b>, avec ses colonies d'Amérique et les Philippines ; celui, plus maritime, du <b>Portugal</b>, avec le Brésil et divers comptoirs sur les côtes africaines et asiatiques. Les <b>Provinces-Unies des Pays-Bas</b> créent et exploitent également un vaste réseau de colonies et de comptoirs. Les <b>Anglais</b> et les <b>Français</b> s'installent durablement en Amérique du Nord à partir de la première moitié du XVII<sup>e</sup> siècle." },
  bookDef("colonie"), bookDef("comptoir"),
  { t:"p", s:"Livre p. 48, encadré · doc. 29 (lignes de partage)", h:"En <b>1494</b>, par le <b>traité de Tordesillas</b>, le pape répartit les terres à découvrir entre les Espagnols et les Portugais en traçant une ligne dans l'Atlantique. Le <b>traité de Saragosse</b>, en <b>1529</b>, fixe une seconde ligne de partage, dans le Pacifique. Ces traités, contestés par les Anglais et les Français, expriment la volonté européenne de dominer le monde." },
  { t:"pause", q:"Que décide le traité de Tordesillas en 1494 ?", a:"Le pape répartit les terres à découvrir entre les Espagnols et les Portugais en traçant une ligne dans l'Atlantique.", s:"Livre p. 48, encadré" },
  { t:"h3", h:"Le commerce transatlantique : la traite atlantique" },
  { t:"p", s:"Livre p. 48, texte", h:"Ta feuille parle de commerce « transatlantique ou triangulaire » ; ton livre l'appelle la <b>traite atlantique</b>. La population amérindienne étant décimée par les maladies, c'est <b>en Afrique</b> que les puissances coloniales vont chercher l'importante main-d'œuvre nécessaire à l'exploitation des mines, des plantations de canne à sucre ou de coton. Les esclaves sont vendus en Amérique, puis les navires repartent chargés de produits rares, généralement à destination de l'Europe. <b>Ce trafic où les esclaves sont considérés comme de la marchandise constitue la traite atlantique.</b>" },
  { t:"svg", k:"traite", titre:"La traite atlantique, d'après le texte du livre", alt:"Le schéma relie trois continents. De l'Europe vers l'Afrique : les puissances coloniales vont chercher la main-d'œuvre. De l'Afrique vers l'Amérique : les esclaves sont vendus en Amérique. De l'Amérique vers l'Europe : les navires repartent chargés de produits rares. Ce trafic, où les esclaves sont considérés comme de la marchandise, est la traite atlantique.", s:"Livre p. 48, texte · doc. 29 (flèches « traite atlantique »)" },
  bookDef("escl"),
  { t:"html", s:"Livre p. 48, doc. 29 « Les empires coloniaux européens au XVIIe siècle et les principales routes maritimes »", h:tbl(["D'où viennent les produits","Exemples sur la carte du doc. 29"], [
    ["Amérique","argent, or, diamants, sucre, café, cacao, coton, tabac, teintures, fourrures"],
    ["Afrique","esclaves"],
    ["Asie","épices, cotonnades, soieries, teintures, thé, sucre, café"]], "La carte montre aussi les possessions de l'Espagne, du Portugal, de la France, du Royaume-Uni et des Provinces-Unies, les lignes de Tordesillas (1494) et de Saragosse (1529).") },
  { t:"h3", h:"L'échange colombien" },
  bookDef("ech"),
  { t:"svg", k:"echange", titre:"L'échange colombien entre les continents", alt:"Le schéma montre deux flèches entre l'Amérique et le groupe Europe, Afrique et Asie. De l'Amérique partent des plantes, comme la pomme de terre, le maïs, le haricot, le cacao, le manioc, le chicle, l'hévéa, la courge, la patate douce, le tabac, la tomate et la vanille, et des animaux comme la dinde, le canard de Barbarie et le cochon d'Inde. Vers l'Amérique arrivent des plantes comme l'orge, le café, l'avoine, la canne à sucre et le blé, des animaux comme la vache, l'âne, la poule, la chèvre, le cheval, le cochon, le lapin et le mouton, et des maladies : grippe, choléra, variole, rougeole, paludisme.", s:"Livre p. 49, doc. 30 · p. 46 (maladies) · cahier ex. 13a" },
  { t:"p", s:"Livre p. 49, « L'échange colombien »", h:"Cet échange biologique, qui concernera aussi l'Asie, entraîne une diffusion et une uniformisation des plantes cultivées à l'échelle mondiale. L'adoption ne se fait pas au même rythme : le maïs est introduit dès 1550 en Italie, mais la pomme de terre ne se développe qu'au XVIII<sup>e</sup> siècle en Europe ; en Chine, maïs et pomme de terre sont cultivés dès le XVI<sup>e</sup> siècle. <b>Ces nouvelles cultures permettent une croissance démographique car elles réduisent les famines.</b> Le cacao servait même de monnaie : un lapin valait dix fèves, un esclave une centaine." },
  { t:"mine", s:"Cahier p. 21, ex. 13a (livre pp. 48-49)", titre:"Ton exercice 13a", items:["De l'Amérique vers l'Europe : pomme de terre, tomate, maïs, cacao ; dinde, canard de Barbarie, cochon d'Inde.","Vers l'Amérique : blé ; cheval ; grippe, choléra, variole."] },
  { t:"pause", q:"Pourquoi les nouvelles cultures de l'échange colombien permettent-elles une croissance démographique ?", a:"Parce qu'elles réduisent les famines.", s:"Livre p. 49" },
  { t:"tip", h:"Réponds toujours en deux temps : avant (Vénitiens, océan Indien, Europe à la périphérie) et après (Europe au centre, empires coloniaux, traite atlantique, échange colombien). Pour l'échange colombien, cite au moins deux plantes, deux animaux et une maladie, dans le bon sens." },
  { t:"see", ids:["S6","S8","C4"] },
  { t:"src", h:"Livre p. 37, p. 38, pp. 48-49 (doc. 29, 30, bulles jaunes, glossaire, encadrés) · lexique · cahier ex. 3b et 13a" },
]},

/* ---------------- S8 ---------------- */
{ id:"S8", ch:"S", titre:"Les Européens face aux Chinois et aux Japonais", court:"Le Japon s'ouvre puis se ferme, la Chine tient les Européens à distance",
  obj:"Comment se passe la rencontre entre les Européens et les Chinois/Japonais",
  pre:[{ q:"En quelle année les Portugais arrivent-ils au Japon ?", a:"En 1543 (date de ta feuille d'objectifs).", s:"Feuille d'objectifs · livre p. 49" }, { q:"Les Européens ont-ils conquis la Chine comme ils ont conquis le Mexique ?", a:"Non : la Chine résiste aux tentatives d'invasions et limite la présence européenne.", s:"Livre p. 49" }],
  blank:{ consigne:"Compare en quelques lignes la rencontre avec le Japon et la rencontre avec la Chine.", points:["Japon : s'ouvre au commerce européen dès le milieu du XVIe siècle (Portugais et Espagnols ; 1543)", "Japon : se referme très vite ; vers 1640, le shôgun ordonne l'expulsion des Européens", "Chine : résiste aux tentatives d'invasions ; comptoir portugais à Macao en 1557", "Chine : des missionnaires adaptent le christianisme à la culture chinoise ; la Chine n'a pas besoin des produits européens et protège son marché intérieur", "Doc. 31 : le ministre chinois des rites veut expulser les Portugais, jugés violents et soupçonnés d'espionner"], s:"Livre p. 49 · feuille d'objectifs" },
  blocks:[
  { t:"p", s:"Livre p. 49, « Le Japon et la Chine à l'écart des échanges ? » · feuille d'objectifs (1543)", h:"Dès le milieu du XVI<sup>e</sup> siècle, le <b>Japon</b> s'ouvre au commerce européen grâce aux premiers contacts avec les Portugais et les Espagnols (ta feuille : <b>1543, les Portugais arrivent au Japon</b>). Mais il va très vite se refermer : <b>vers 1640, le shôgun (le dirigeant) ordonne l'expulsion des Européens.</b>" },
  { t:"p", s:"Livre p. 49, doc. 32", h:"Doc. 32 : « L'arrivée des Portugais au Japon au XVI<sup>e</sup> siècle », panneau d'un paravent, or et couleurs sur soie, Tokyo, XVII<sup>e</sup> siècle." },
  { t:"pause", q:"Que se passe-t-il au Japon vers 1640 ?", a:"Le shôgun, le dirigeant du Japon, ordonne l'expulsion des Européens.", s:"Livre p. 49" },
  { t:"h3", h:"La Chine" },
  { t:"p", s:"Livre p. 49, texte", h:"La <b>Chine</b> résiste aux tentatives d'invasions. Les Portugais obtiennent toutefois l'autorisation de créer un comptoir à <b>Macao en 1557</b>. Quelques missionnaires s'établissent en Chine : ils apprennent le chinois, adoptent le costume chinois et adaptent le christianisme à la culture chinoise. Mais, comme <b>la Chine n'a pas besoin des produits des Européens</b>, elle limite leur présence afin de <b>protéger son marché intérieur</b>." },
  { t:"p", s:"Livre p. 49, doc. 31 (adapté du ministre chinois des rites, vers 1522)", h:"« Les Fo-Lang-ki [les Portugais] se sont montrés violents et ont enfreint les lois ; ils apportent des marchandises pour faire le commerce […]. En outre, […] s'ils séjournent longtemps, on peut soupçonner qu'ils espionnent. Il convient donc de les expulser tous. »" },
  { t:"mine", s:"Cahier p. 22, ex. 13d (doc. 31 et texte p. 49)", titre:"Ta réponse à l'exercice 13d", items:["Pourquoi n'y a-t-il pas eu de grandes conquêtes européennes en Asie comme en Amérique ? Les Japonais ont expulsé les Européens, le pays s'est fermé. Les Chinois, méfiants (Portugais soupçonnés d'espionnage, violents), ont limité la présence européenne et résisté aux invasions."] },
  { t:"pause", q:"Pourquoi la Chine limite-t-elle la présence des Européens ?", a:"Elle n'a pas besoin de leurs produits et veut protéger son marché intérieur ; elle les juge aussi violents et soupçonne les Portugais d'espionner (doc. 31).", s:"Livre p. 49, texte et doc. 31" },
  { t:"p", s:"Livre p. 39 · cahier ex. 3a (corrigé)", h:"Rappelle-toi aussi qu'au XV<sup>e</sup> siècle, l'Empire chinois des Ming est le plus important au monde, et que Zheng He a déjà mené de grandes expéditions dans l'océan Indien : la Chine n'est pas un pays qu'on découvre, c'est une grande puissance." },
  { t:"tip", h:"Ce point se travaille par comparaison : en Amérique, conquête et colonisation ; en Asie, contacts et commerce limités (comptoir de Macao), puis fermeture. Donne pour chaque pays une date (1543 et vers 1640 pour le Japon, 1557 pour Macao) et une raison." },
  { t:"see", ids:["S1","S7","C2"] },
  { t:"src", h:"Livre p. 49 (doc. 31 et 32), p. 39 · feuille d'objectifs · cahier ex. 13d" },
]},

/* ---------------- S9 ---------------- */
{ id:"S9", ch:"S", titre:"Les différents avis : Las Casas et Sepúlveda", court:"Deux Espagnols, deux avis opposés sur les Amérindiens",
  obj:"Quels sont les différents avis sur ces événements (B. de Las Casas, Sepulveda, etc.)",
  pre:[{ q:"Las Casas défend-il ou accuse-t-il les conquistadors ?", a:"Il dénonce les massacres commis par les Espagnols.", s:"Livre p. 45" }, { q:"Selon Sepúlveda, les Indiens doivent-ils être placés sous l'autorité des Espagnols ?", a:"Oui : selon lui, ils le « demandent, de par leur nature et dans leur propre intérêt ».", s:"Livre p. 47, doc. 28" }],
  blank:{ consigne:"Présente Las Casas et Sepúlveda : qui ils sont, leur ouvrage, leur avis, une phrase de chacun.", points:["Bartolomé de Las Casas (1474-1566), prêtre dominicain et historien, « Très brève relation de la destruction des Indes » (1552)", "Las Casas dénonce les massacres : les chrétiens « tels des loups enragés » ; les Indiens envoyés dans les mines, morts d'épuisement et de faim", "Son livre est interdit par l'Inquisition espagnole en 1659", "Juan Ginés de Sepúlveda (1490-1573), humaniste et historiographe de Charles Quint, « Des justes causes de la guerre » (1544)", "Sepúlveda justifie la domination : les Indiens seraient « médiocrement humains », sans lois écrites ni droit de propriété"], s:"Livre p. 45 (doc. 20) et p. 47 (doc. 27, 28)" },
  blocks:[
  { t:"h3", h:"Bartolomé de Las Casas : il dénonce" },
  { t:"p", s:"Livre p. 45, texte et glossaire", h:"Le prêtre <b>Bartolomé de Las Casas</b> est célèbre pour sa <b>dénonciation des massacres commis par les Espagnols</b> à travers son principal ouvrage, <i>Très brève relation de la destruction des Indes</i>, interdit par l'<b>Inquisition</b> espagnole en 1659." },
  bookDef("inqu"),
  { t:"p", s:"Livre p. 45, doc. 20 (adapté de Las Casas, 1552)", h:"« Alors que les Indiens étaient si bien disposés à leur égard, les chrétiens ont envahi ces pays tels des loups enragés qui se jettent sur de doux et paisibles agneaux. Et comme tous ces hommes qui vinrent d'Espagne étaient assoiffés de richesses, ils détruisirent ces pays. […] » Il ajoute que ces Indiens étaient « les êtres les plus doux et les plus pacifiques du monde, totalement dépourvus d'armes »." },
  { t:"p", s:"Livre p. 47, doc. 27 (Las Casas, 1552)", h:"« On donna ainsi des Indiens à chaque chrétien sous prétexte qu'il les instruirait dans la foi catholique […]. Le soin qu'ils prirent des Indiens fut d'envoyer les hommes dans les mines pour en tirer de l'or, un travail intolérable […]. Les hommes moururent dans les mines d'épuisement et de faim… »" },
  { t:"pause", q:"À quels animaux Las Casas compare-t-il les chrétiens et les Indiens ?", a:"Les chrétiens sont des « loups enragés », les Indiens de « doux et paisibles agneaux ».", s:"Livre p. 45, doc. 20" },
  { t:"h3", h:"Juan Ginés de Sepúlveda : il justifie" },
  { t:"p", s:"Livre p. 47, doc. 28 (Sepúlveda, Des justes causes de la guerre, 1544)", h:"<b>Juan Ginés de Sepúlveda</b> (1490-1573), humaniste et historiographe de Charles Quint : « Les Indiens demandent, de par leur nature et dans leur propre intérêt, à être placés sous l'autorité des princes ou d'États civilisés et vertueux […]. Comparez ces bienfaits dont jouissent les Espagnols – prudence, invention, […] humanité et religion – avec ceux de ces hommelets si médiocrement humains, dépourvus de toute science et de tout art […]. Ils n'ont pas de lois écrites mais seulement des coutumes, des traditions barbares. Ils ignorent même le droit de propriété. »" },
  { t:"html", s:"Livre p. 45 (doc. 20) et p. 47 (doc. 27, 28) · cahier ex. 12c", h:tbl(["","Las Casas · Sepúlveda"], [
    ["Qui ?","prêtre dominicain et historien (1474-1566) · humaniste, historiographe de Charles Quint (1490-1573)"],
    ["Ouvrage","Très brève relation de la destruction des Indes, 1552 · Des justes causes de la guerre, 1544"],
    ["Les Indiens sont…","doux, paisibles, sans armes · « médiocrement humains », sans lois écrites"],

    { front:"Deuxième moitié du XXe siècle : où la production se délocalise-t-elle ?", ans:"Dans des pays émergents, alors que la R&D et les marchés restent dans les pays industrialisés.", back:["Dans des pays émergents"], wrong:["Dans les pays industrialisés","Près des mines de charbon","Dans la Silicon Valley"], mcqOnly:true, src:"livre p. 73, « L'évolution de l'industrie au cours du XXe siècle »" },
    { front:"Deuxième moitié du XXe siècle : où restent surtout la R&D et les marchés ?", ans:"Dans les pays industrialisés, alors que la production part vers les pays émergents.", back:["Dans les pays industrialisés"], wrong:["Dans des pays émergents","Près des mines de charbon","Dans des paradis fiscaux"], mcqOnly:true, src:"livre p. 73, « L'évolution de l'industrie au cours du XXe siècle »" },
  ]},
  { key:"besoins", code:"B3", title:"Ce qu'il faut pour produire", src:"livre p. 73 (doc. 22)", items:[
    { front:"D'après le doc. 22, dans quelle catégorie classe-t-on les matières premières et l'énergie ?", ans:"Des ressources naturelles.", back:["ressources naturelles"], opts:RES, keepOrder:true },
    { front:"D'après le doc. 22, dans quelle catégorie classe-t-on la main-d'œuvre et le savoir-faire ?", ans:"Des ressources humaines.", back:["ressources humaines"], opts:RES, keepOrder:true },
    { front:"D'après le doc. 22, dans quelle catégorie classe-t-on le capital (l'argent) ?", ans:"Des ressources financières : l'argent pour payer salaires, machines, pièces et bâtiments.", back:["ressources financières","capital"], opts:RES, keepOrder:true },
    { front:"D'après le doc. 22, dans quelle catégorie classe-t-on les usines, les machines et les outils ?", ans:"Des ressources techniques.", back:["ressources techniques"], opts:RES, keepOrder:true },
    { front:"D'après le doc. 22, que faut-il pour écouler (vendre) le produit fini ?", ans:"Un marché : des consommateurs qui achètent.", back:["un marché","marché","le marché"], opts:RES, keepOrder:true },
    { front:"D'après le doc. 22, que représentent la stabilité et la libre circulation des biens et des personnes ?", ans:"Un contexte politique et économique favorable.", back:["un contexte favorable","un contexte politique et économique favorable","contexte politique et économique favorable","contexte favorable"], opts:RES, keepOrder:true },
    { front:"D'après le doc. 22, combien d'éléments faut-il pour fabriquer un produit industriel ?", ans:"Six : des ressources naturelles, humaines, financières, techniques, un marché et un contexte favorable.", back:["6","six"], opts:["4","5","6","7"], keepOrder:true },
    { front:"À quoi sert l'OMC (doc. 28) ?", ans:"L'OMC compte plus de 160 membres et représente 98 % du commerce mondial : elle sert de cadre pour négocier des accords qui favorisent la liberté des échanges.", back:["Fixer des règles et négocier des accords pour favoriser la liberté des échanges entre les pays"], wrong:["Fabriquer des produits industriels dans plus de 160 pays","Choisir où chaque entreprise doit installer ses usines","Transporter les conteneurs entre les ports"], mcqOnly:true, src:"livre p. 75, doc. 28" },
  ]},
  { key:"apple", code:"B4", title:"Multinationales : où et pourquoi", src:"livre pp. 73-75 (doc. 22 à 29) et dossier B, activité 5", items:[
    { front:"Combien de secteurs d'activité montre la légende de la carte d'Apple (doc. 27) ?", ans:"Six : siège social, R&D, extraction et transformation des matières premières, composants, assemblage, centres de distribution.", back:["6","six"], opts:["3","4","6","8"], keepOrder:true, src:"livre p. 75, doc. 27" },
    { front:"Où une multinationale place-t-elle la plupart du temps son siège social et sa R&D ?", ans:"Dans des pays du Nord, près des hautes écoles et des universités (livre p. 74).", back:["Dans des pays du Nord, près de hautes écoles et d'universités"], wrong:["Dans des pays où les salaires sont bas","Près des mines de matières premières","Toujours dans un paradis fiscal"], mcqOnly:true, src:"livre p. 74" },
    { front:"Où une multinationale place-t-elle souvent sa production ?", ans:"Dans des pays ou régions où les salaires sont bas (livre p. 74).", back:["Dans des pays ou régions où les salaires sont bas"], wrong:["Près des universités des pays du Nord","Toujours dans le pays du siège social","Dans des paradis fiscaux"], mcqOnly:true, src:"livre p. 74" },
    { front:"Où une multinationale place-t-elle l'extraction des matières premières ?", ans:"Là où se trouvent les ressources : pour Apple, en Amérique du Sud, en Afrique, en Australie et en Asie.", back:["Là où se trouvent les ressources naturelles"], wrong:["Près du siège social","Là où les consommateurs sont riches","Près des universités"], mcqOnly:true, src:"livre p. 75, doc. 27" },
    { front:"Selon quel critère une multinationale choisit-elle où fabriquer ses composants ?", ans:"Pièces complexes : des pays avec des personnes compétentes. Pièces simples : des pays où le salaire est bas.", back:["Pièces complexes : personnes compétentes ; pièces simples : salaires bas"], wrong:["Toujours dans le pays du siège social","Uniquement près des mines","Uniquement là où se vend le produit"], mcqOnly:true, src:"dossier B, activité 5a" },
    { front:"Où une multinationale place-t-elle ses centres de distribution ?", ans:"Là où les consommateurs peuvent payer : un natel neuf est cher, on le vend là où les salaires sont élevés.", back:["Près des consommateurs qui peuvent payer (salaires élevés)"], wrong:["Là où les salaires sont les plus bas","Près des mines de matières premières","Dans des paradis fiscaux"], mcqOnly:true, src:"dossier B, activité 5a" },
    { front:"Où se trouve le siège social d'Apple ?", ans:"Dans la Silicon Valley, en Californie : beaucoup d'entreprises des nouvelles technologies, et le lieu de création de la marque.", back:["Silicon Valley (Californie)","Silicon Valley","Californie"], wrong:["Chine","Suède","Israël"], src:"livre p. 75, doc. 27 · dossier B, activité 5a" },
    { front:"Où Apple fait-il assembler ses téléphones, et pourquoi là ?", ans:"En Chine : une main-d'œuvre flexible et bon marché, et un assemblage assez simple.", back:["En Chine : main-d'œuvre bon marché et assemblage assez simple"], wrong:["En Suède : personnes très qualifiées","Aux États-Unis : près du siège social","En Australie : près des mines"], mcqOnly:true, src:"dossier B, activité 5a" },
    { front:"En 2015, dans quelle région travaillent 72 % des employés de Nike (doc. 23) ?", ans:"Dans les marchés émergents, où la main-d'œuvre coûte peu. Nike n'y fait que 14 % de ses ventes.", back:["Dans les marchés émergents"], wrong:["En Amérique du Nord","En Europe occidentale","Au Japon"], mcqOnly:true, src:"livre p. 73, doc. 23" },
    { front:"En 2015, dans quelle région Nike fait-il 47 % de ses ventes (doc. 23) ?", ans:"En Amérique du Nord, où travaille seulement 1 % de ses employés.", back:["En Amérique du Nord"], wrong:["Dans les marchés émergents","En Chine et en Corée du Sud","Au Japon"], mcqOnly:true, src:"livre p. 73, doc. 23" },
    { front:"Que montre la carte de Nike (doc. 23) sur l'organisation d'une multinationale ?", ans:"On produit là où la main-d'œuvre coûte peu, et on vend là où les gens peuvent payer.", back:["On produit là où la main-d'œuvre coûte peu, on vend là où les gens peuvent payer"], wrong:["On produit et on vend toujours dans le même pays","On produit surtout en Amérique du Nord","On vend surtout dans les marchés émergents"], mcqOnly:true, src:"livre p. 73, doc. 23" },
    { front:"D'après le doc. 24, dans quel pays le salaire moyen de l'industrie est-il le plus élevé en 2016 ?", ans:"En Suisse, plus de 7000 francs par mois ; seulement quelques centaines de francs en Indonésie.", back:["la Suisse","Suisse"], wrong:["la Chine","l'Indonésie","les États-Unis"], src:"livre p. 73, doc. 24" },
    { front:"D'après le doc. 25, quel pays compte le plus de sièges sociaux des 250 plus grandes entreprises en 2018 ?", ans:"Les États-Unis (84), devant l'Europe (71), la Chine (32) et le Japon (21).", back:["les États-Unis","États-Unis","USA","Etats-Unis"], wrong:["la Chine","le Japon","la Suisse"], src:"livre p. 74, doc. 25" },
    { front:"Pourquoi une entreprise délocalise-t-elle son siège social dans un paradis fiscal (doc. 29) ?", ans:"Pour payer le moins d'impôts possible et augmenter son bénéfice. Souvent, ce n'est qu'une boîte aux lettres, comme aux îles Caïmans.", back:["Pour payer le moins d'impôts possible (fiscalité avantageuse)"], wrong:["Pour être près de ses usines d'assemblage","Pour trouver des ouvriers moins chers","Pour être près des universités"], mcqOnly:true, src:"livre p. 75, doc. 29" },
  ]},
  { key:"transport", code:"E1", title:"Les modes de transport", src:"livre pp. 90-91, doc. 76 à 80", items:[
    ...defItems(["mode","tkm","tir","ferr"]),
    { front:"Quels modes de transport cite la bulle « mode de transport » ?", back:["maritime, aérien, ferroviaire, routier, fluvial"], wrong:["cargo, péniche, conteneur, port, grue","autoroute, tunnel, pont, col, vallée","train-cargo, ferroutage, gare, wagon, rail"], mcqOnly:true, src:"livre p. 88, bulle « Mode de transport »", ans:"Maritime, aérien, ferroviaire, routier, fluvial. Chaque mode a besoin d'infrastructures qui lui sont propres." },
    { front:"Quel mode de transport assure plus de 90 % des tonnes-kilomètres de marchandises dans le monde ?", back:["le transport maritime","maritime","le cargo","cargo"], opts:["le transport maritime","le transport ferroviaire","le transport routier","le transport aérien"], keepOrder:true, src:"livre p. 90, doc. 76", ans:"Le transport maritime, avec le cargo : le mode privilégié pour les longues distances." },
    { front:"Quels sont les deux avantages du cargo selon le livre ?", back:["Une taille énorme et le droit de la mer (ni douane ni péage)"], wrong:["Il va partout et ne dépend d'aucun horaire","Il est très rapide et livre en urgence","Il remonte les canaux jusqu'à Bâle"], mcqOnly:true, src:"livre p. 90, doc. 76", ans:"Des dizaines de milliers de tonnes dans un seul navire, et le droit de la mer qui permet de traverser les océans sans douane ni péage." },
    { front:"Quel est l'avantage de la péniche ?", back:["Transporter de très grandes quantités pour des coûts très faibles"], wrong:["Aller très vite d'un continent à l'autre","Livrer partout, même dans les déserts","Transporter le courrier urgent"], mcqOnly:true, src:"livre p. 90, doc. 77" },
    { front:"Quels sont les inconvénients de la péniche ?", back:["Elle est lente et n'atteint que les lieux reliés aux canaux"], wrong:["Elle coûte très cher","Elle ne transporte que 1 ou 2 conteneurs","Elle paie des péages en haute mer"], mcqOnly:true, src:"livre p. 90, doc. 77", ans:"Lente, et limitée au réseau de canaux : surtout dans le Centre-Nord de l'Europe, où le relief plat lui est favorable." },
    { front:"Jusqu'à quel port suisse le transport fluvial arrive-t-il ?", back:["Bâle"], wrong:["Genève","Neuchâtel","Lugano"], src:"livre p. 90, doc. 77", ans:"Bâle : la péniche remonte des Pays-Bas et de l'Allemagne jusqu'au port suisse de Bâle." },
    { front:"Quels sont les inconvénients du train selon le livre ?", back:["Frontières et douanes, écartement des voies différent selon les pays, moins flexible que la route"], wrong:["Il est très cher et très lent","Il ne transporte qu'un seul conteneur","Il ne peut pas transporter de matières premières"], mcqOnly:true, src:"livre p. 91, doc. 78", ans:"Pourtant, le train est peu coûteux et relativement rapide." },
    { front:"Pourquoi le camion est-il le principal mode de transport sur les distances courtes et moyennes ?", back:["Il circule partout, sans horaire, plus de 1000 km par jour : il est très flexible"], wrong:["Il transporte plus de conteneurs que le cargo","C'est le mode le moins cher par tonne","Il ne pollue pas"], mcqOnly:true, src:"livre p. 91, doc. 79" },
    { front:"Quels sont les inconvénients du camion ?", back:["Sa charge est très limitée : beaucoup de poids lourds et des nuisances (bruit, pollution, accidents, embouteillages)"], wrong:["Il ne peut pas rouler sur une route non goudronnée","Il dépend d'horaires très stricts","Il ne traverse aucune frontière"], mcqOnly:true, src:"livre p. 91, doc. 79" },
    { front:"Pour quelles marchandises utilise-t-on l'avion-cargo ?", back:["Les marchandises urgentes ou de grande valeur par rapport à leur poids"], wrong:["Le pétrole et le charbon","Les très grandes quantités de céréales","Les conteneurs le long des canaux"], mcqOnly:true, src:"livre p. 91, doc. 80", ans:"Produits de luxe, courrier, aide en cas de catastrophe. Mais l'avion-cargo reste très cher." },
    { front:"Quel est le plus gros avion du monde, présenté dans ton livre (doc. 80) ?", back:["l'AN-225","AN-225","AN 225","Antonov"], wrong:["l'A380","le Boeing 747","le Concorde"], src:"livre p. 91, doc. 80", ans:"L'AN-225 : c'est un avion-cargo." },
    { src:"fiche E, act. 3c (p. 92)", front:"Quel moyen de transport emporte le plus de conteneurs ?", back:["le cargo","cargo"], opts:["le cargo","la péniche","le train","le camion"], keepOrder:true, ans:"Le cargo : plus de 1000 conteneurs, contre environ 30 pour une péniche, 20 à 30 pour un train, 1 ou 2 pour un camion." },
    { src:"fiche E, act. 3c (p. 92)", front:"Quel moyen de transport emporte le moins de conteneurs ?", back:["le camion","camion"], opts:["le cargo","la péniche","le train","le camion"], keepOrder:true, ans:"Le camion : 1 ou 2 conteneurs seulement. C'est sa « charge très limitée » (livre p. 91)." },
    { src:"fiche E, act. 4, tableau des coûts (p. 92)", front:"Sans rupture de charge, quel moyen est le moins cher par tonne ?", back:["le bateau","bateau","le bateau grand gabarit"], opts:["le bateau","le train","le camion"], keepOrder:true, ans:"Le bateau : 3,5 CHF par tonne en grand gabarit, contre 6 pour le train et 13 pour le camion." },
    { src:"fiche E, act. 4, tableau des coûts (p. 92)", front:"Porte à porte, avec les ruptures de charge, quel moyen voit son coût augmenter le moins ?", back:["le camion","camion"], opts:["le bateau","le train","le camion"], keepOrder:true, ans:"Le camion : de 13 à 24 CHF par tonne. Le train passe de 6 à 25, le bateau grand gabarit de 3,5 à 13." },
    { src:"fiche E, act. 4, tableau des coûts (p. 92)", front:"Pourquoi le transport coûte-t-il plus cher « porte à porte » ?", back:["On change de moyen de transport (rupture de charge) : cela coûte de l'argent et du temps"], wrong:["Les camions roulent plus lentement sur les petites routes","Le bateau doit faire un détour par un passage stratégique","Les marchandises pèsent plus lourd à l'arrivée"], mcqOnly:true, ans:"Parce qu'il faut changer de mode de transport : chaque rupture de charge ajoute de l'argent et du temps." },
    { src:"fiche E, act. 4, tableau des coûts (p. 92)", front:"Pourquoi le coût du camion augmente-t-il proportionnellement moins ?", back:["Il est plus facile et plus rapide de charger et décharger un camion"], wrong:["Le camion transporte plus de conteneurs que le train","Le carburant du camion est moins cher que celui du bateau","Le camion n'a jamais besoin de chauffeur"], mcqOnly:true, ans:"Un camion se charge et se décharge plus facilement et plus vite : il va directement porte à porte." },
    { src:"fiche E, act. 4c · livre p. 91, doc. 79", front:"Que devient le coût du transport routier avec les embouteillages et les accidents ?", back:["il augmente","augmente"], opts:["il augmente","il diminue","il ne change pas"], keepOrder:true, ans:"Il augmente. Le livre range aussi les embouteillages et les accidents parmi les nuisances du camion." },
  ]},
  { key:"passages", code:"E2", title:"Termes du transport et passages", src:"livre pp. 89-93 · fiche E, carte des passages stratégiques", items:[
    ...defItems(["inter","rupt","plat","detr","isth"]),
    { front:"D'après le livre, qu'est-ce qu'un passage stratégique ?", back:["Un lieu par lequel il faut obligatoirement passer pour éviter un immense détour"], wrong:["Un port où l'on change de mode de transport","Une route réservée aux camions","Un pays où les impôts sont très bas"], mcqOnly:true, src:"livre p. 89, « Un enjeu important : le contrôle des passages stratégiques »" },
    { front:"Pourquoi le contrôle des passages stratégiques est-il si important ?", back:["C'est une source de pouvoir politique et économique"], wrong:["Parce qu'on y fabrique les conteneurs","Parce que les camions y roulent sans péage","Parce que c'est là que se trouvent les sièges sociaux"], mcqOnly:true, src:"livre p. 89" },
    { front:"Quels caps les bateaux devaient-ils contourner avant l'ouverture des canaux ?", back:["Le cap Horn et le cap de Bonne-Espérance"], wrong:["Le Pas de Calais et le détroit de Gibraltar","Le canal de Suez et le canal de Panama","Le détroit d'Ormuz et le détroit de Malacca"], mcqOnly:true, src:"livre p. 89, doc. 73" },
    { front:"Quel canal a été creusé en 1869 ?", back:["le canal de Suez","Suez","canal de Suez"], wrong:["le canal de Panama","le Pas de Calais","le détroit de Malacca"], src:"livre p. 89, doc. 73" },
    { front:"Quel canal a été creusé en 1914 ?", back:["le canal de Panama","Panama","canal de Panama"], wrong:["le canal de Suez","le détroit de Gibraltar","le cap Horn"], src:"livre p. 89, doc. 73" },
    { front:"Comment traverse-t-on le Pas de Calais sans bateau (doc. 75) ?", back:["Par le tunnel sous la Manche"], wrong:["Par un pont entre la France et l'Angleterre","Par le canal de Suez","On ne peut pas le traverser sans bateau"], mcqOnly:true, src:"livre p. 89, doc. 75", ans:"Par le tunnel sous la Manche (Eurotunnel), entre la France et le Royaume-Uni. C'est là que passe le camion du jean (doc. 5)." },
    { front:"Gibraltar, Panama, Malacca, Ormuz : comment appelle-t-on ces lieux ?", back:["des passages stratégiques","passages stratégiques","passage stratégique"], wrong:["des plateformes intermodales","des ports à conteneurs","des paradis fiscaux"], src:"fiche E, carte · livre p. 89, doc. 74", ans:"Des passages stratégiques : ta carte en montre sept, celle du livre neuf." },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 1, à l'entrée de la Méditerranée, entre l'Espagne et le Maroc ?", back:["détroit de Gibraltar","Gibraltar"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 2, en Amérique centrale ?", back:["canal de Panama","Panama"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 3, à côté de Singapour ?", back:["détroit de Malacca","Malacca"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 4, à la pointe sud de l'Afrique ?", back:["cap de Bonne-Espérance","Bonne-Espérance","Bonne Espérance","cap de Bonne Espérance"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 5, à la pointe sud de l'Amérique du Sud ?", back:["cap Horn","Horn"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 6, entre la France et l'Angleterre ?", back:["Pas de Calais","pas-de-Calais"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur ta carte, quel passage stratégique porte le numéro 7, à côté de Dubaï, à la sortie du golfe Persique ?", back:["détroit d'Ormuz","Ormuz"], grp:"pass", src:"fiche E, carte · livre p. 89, doc. 74" },
    { front:"Sur la carte du livre (doc. 74), quel détroit se trouve sur la route entre le canal de Suez et l'océan Indien ?", back:["détroit de Bab-el-Mandeb","Bab-el-Mandeb","Bab el Mandeb"], grp:"pass", src:"livre p. 89, doc. 74 · p. 92, doc. 81" },
    { front:"Le jean quitte la Tunisie en train, puis en bateau, traverse la Manche en camion et arrive en camionnette. Combien de ruptures de charge ?", back:["3","trois"], opts:["aucune","1","3","6"], keepOrder:true, src:"livre p. 68, doc. 5", ans:"3 : du train au bateau, du bateau au camion, du camion à la camionnette. C'est un transport intermodal." },
    { front:"Pourquoi les ports sont-ils des plateformes intermodales stratégiques ?", back:["Ils attirent de nombreuses activités industrielles et des emplois"], wrong:["On n'y paie aucun impôt","On y fabrique les navires","Ils sont toujours au bord d'un canal"], mcqOnly:true, src:"livre p. 93" },
  ]},
  { key:"choix", code:"E3", title:"Choisir un transport", src:"livre p. 90 · fiche E, act. 3c et 4", items:[
    { front:"De quoi dépend le choix du mode de transport, selon le livre ?", back:["Du type de produit, de la distance, du temps de parcours, des infrastructures, du terrain et de la situation géopolitique"], wrong:["Uniquement du prix de l'essence","Uniquement de la couleur du conteneur","Uniquement du pays du siège social"], mcqOnly:true, src:"livre p. 90", ans:"Six facteurs : le type de produit, la distance, le temps de parcours, les infrastructures existantes, la configuration du terrain, la situation géopolitique." },
    { front:"Tu dois envoyer plus de 1000 conteneurs de Shenzhen à Rotterdam. Quel mode choisis-tu ?", back:["le cargo","cargo"], opts:["le cargo","la péniche","le train","le camion","l'avion-cargo"], keepOrder:true, src:"livre p. 90, doc. 76 · fiche E, act. 3c", ans:"Le cargo : il emporte plus de 1000 conteneurs, c'est le moins cher par tonne, et il traverse les océans sans douane ni péage." },
    { front:"Tu dois livrer 1 conteneur jusqu'à la porte d'un magasin, à 200 km. Quel mode choisis-tu ?", back:["le camion","camion"], opts:["le cargo","la péniche","le train","le camion","l'avion-cargo"], keepOrder:true, src:"livre p. 91, doc. 79 · fiche E, act. 4", ans:"Le camion : il va partout, porte à porte, et c'est le principal mode sur les distances courtes et moyennes." },
    { front:"Tu dois envoyer environ 30 conteneurs de Rotterdam à Bâle, au plus bas prix, par le fleuve. Quel mode choisis-tu ?", back:["la péniche","péniche"], opts:["le cargo","la péniche","le train","le camion","l'avion-cargo"], keepOrder:true, src:"livre p. 90, doc. 77 · fiche E, act. 3c et 4", ans:"La péniche : environ 30 conteneurs, des coûts très faibles (3,5 à 4,5 CHF par tonne), et elle va jusqu'au port suisse de Bâle." },
    { front:"Tu dois livrer d'urgence des médicaments après une catastrophe, sur un autre continent. Quel mode choisis-tu ?", back:["l'avion-cargo","avion-cargo","avion"], opts:["le cargo","la péniche","le train","le camion","l'avion-cargo"], keepOrder:true, src:"livre p. 91, doc. 80", ans:"L'avion-cargo : très cher, mais réservé aux livraisons urgentes, comme l'aide en cas de catastrophe." },

/* ---------- utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s, apoMode){
  return String(s || "").toLowerCase().replace(/ß/g,"ss").replace(/œ/g,"oe").replace(/³/g,"3").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/…|\.\.\./g," ").replace(/[’'`]/g, apoMode === "del" ? "" : " ")
    .replace(/[.!?;,:«»"()\/\-+×]/g," ").replace(/\s+/g," ").trim();
}
const stripFr = s => s.replace(/^(le |la |les |l |un |une |des |du |de la |d )/,"").trim();
function matchAnswer(input, accept){
  return ["sp","del"].some(m => {
    const a = norm(input, m); if (!a) return false;
    return accept.some(raw => { const b = norm(raw, m); return a === b || stripFr(a) === stripFr(b); });
  });
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");
function dateLabel(ts){ const d = new Date(ts), p = x => String(x).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} · ${p(d.getHours())}h${p(d.getMinutes())}`; }
function explain(it, deck){ return (it.expl || it.ans || (it.front + " → " + it.back[0])) + " — " + (it.src || deck.src) + "."; }

function optionsFor(it, deck){
  const good = it.back[0];
  if (it.opts) return it.keepOrder ? [...it.opts] : shuffle(it.opts);
  if (it.wrong) return shuffle([good, ...it.wrong]);
  const pool = deck.items.filter(x => x !== it && (x.grp || "") === (it.grp || "") && !x.opts && !x.wrong);
  const out = [], seen = new Set([norm(good)]);
  shuffle(pool).forEach(x => { if (out.length >= 3) return; const v = x.back[0]; if (!seen.has(norm(v))){ seen.add(norm(v)); out.push(v); } });
  return shuffle([good, ...out]);
}
function chooseKind(it, difficulty){
  if (it.mcqOnly) return "mcq";
  if (difficulty === "easy") return "mcq";
  if (difficulty === "hard") return "type";
  return Math.random() < 0.5 ? "mcq" : "type";
}

/* ---------- fabrication du test : un exercice par paquet et par consigne, numérotation unique ---------- */
function buildTest(deckKeys, difficulty){
  const qs = []; let num = 0, ex = 0;
  DECKS.filter(d => deckKeys.includes(d.key)).forEach(d => {
    const groups = { mcq:[], type:[] };
    shuffle(d.items.filter(it => !rvOf(d, it).exclu)).forEach(it => groups[chooseKind(it, difficulty)].push(it));
    ["mcq","type"].forEach(kind => {
      if (!groups[kind].length) return;
      ex++; const K = KINDS[kind];
      groups[kind].forEach(it => {
        num++;
        const q = { id:"q"+num, num, ex, exTitle:d.title, deckKey:d.key, kind, type:K.type, tag:d.key, consigne:K.consigne, word:it.front, answer:it.back[0], expl:explain(it, d), src:it.src || d.src, hint:"" };
        if (kind === "mcq") q.options = optionsFor(it, d); else q.accept = it.back;
        q.prompt = `${K.consigne} « ${q.word} »`;
        qs.push(q);
      });
    });
  });
  return qs;
}

/* ---------- stockage : db privée de l'utilisateur, sinon navigateur, sinon mémoire ---------- */
const store = {
  mode:"memory", col:null, mem:{},
  async init(){
    try {
      if (window.claude && window.claude.use){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user){ const uid = await user.id(); if (uid){ this.col = db.collection("data/users/" + uid); this.mode = "db"; return; } }
      }
    } catch(e){}
    try { localStorage.setItem(QUIZ_ID + "-probe","1"); localStorage.removeItem(QUIZ_ID + "-probe"); this.mode = "local"; } catch(e){ this.mode = "memory"; }
  },
  async list(){
    if (this.mode === "db"){
      const snap = await this.col.limit(1000).get();
      return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean);
    }
    if (this.mode === "local"){
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]");
      return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean);
    }
    return Object.values(this.mem);
  },
  async save(att){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + att.id).set(att); return; }
    if (this.mode === "local"){
      localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att));
      const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id);
      localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return;
    }
    this.mem[att.id] = att;
  },
  memDocs:{},
  async getDoc(id){
    if (this.mode === "db"){ const sn = await this.col.doc(id).get(); return sn && sn.exists ? sn.data() : null; }
    if (this.mode === "local"){ const v = localStorage.getItem(id); return v ? JSON.parse(v) : null; }
    return this.memDocs[id] || null;
  },
  async setDoc(id, obj){
    if (this.mode === "db"){ await this.col.doc(id).set(obj); return; }
    if (this.mode === "local"){ localStorage.setItem(id, JSON.stringify(obj)); return; }
    this.memDocs[id] = obj;
  },
  async remove(id){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + id).delete(); return; }
    if (this.mode === "local"){ localStorage.removeItem(ATTEMPT_PREFIX + id); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]").filter(x => x !== id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }
    delete this.mem[id];
  },
};

function startQuiz(questions, rattrapage){
  S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, label: rattrapage ? S.rattrLabel : deckLabel(S.selected) };
  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function viewQuiz(){
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode !== "exam";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>

  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice";
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="Ta réponse…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){
    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? ["✓ Juste !","✓ Bien vu.","✓ Exact.","✓ Tu l'as.","✓ Nickel."][Q.i % 5] : "✗ Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b>${esc(q.answer)}</b></p>`}<p class="fb-x">${esc(q.expl)}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q.accept); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], right = isRight(q, val);
  if (S.mode !== "exam"){ Q.ok = right; Q.checked = true; render(); }
  else record(val, right);
}
function record(val, correct){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.exTitle, prompt:q.prompt, user:val || "", answer:q.answer, correct, expl:q.expl, tag:q.tag, question:q });
  if (Q.i + 1 >= Q.questions.length){ Q.done = true; Q.finishing = true; render(); finishQuiz(); }
  else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; render(); }
}
async function finishQuiz(){
  const Q = S.quiz, score = Q.detail.filter(x => x.correct).length, total = Q.detail.length, id = String(Date.now());
  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:"Géographie", theme:THEME, deck:Q.label,
    difficulty:DIFFICULTIES[S.difficulty].label, mode:MODES[S.mode].label, rattrapage:S.rattrapage, score, total, note:noteFrom(score/total), questions:Q.detail };
  S.attempts = [att, ...S.attempts.filter(a => a.id !== id)];
  try { await store.save(att); S.storeMsg = store.mode === "memory" ? "Ce résultat est affiché ici, mais il ne sera pas gardé si tu fermes la page. Note ta note ou copie-la pour le chat." : ""; }
  catch(e){ S.storeMsg = "Je n'ai pas pu enregistrer ce résultat : il disparaîtra si tu fermes la page. Note ta note ou copie-la pour le chat."; }
  S.lastResult = att; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; S.screen = "results"; render(); window.scrollTo(0,0);
}

function bilanState(id){ return S.bilan[id] || (S.bilan[id] = { busy:false, err:"", copied:false, fallback:"" }); }
function bilanBlock(att){

function findAttempt(id){ return (S.lastResult && S.lastResult.id === id) ? S.lastResult : S.attempts.find(a => a.id === id); }
async function analyse(id){
  const att = findAttempt(id), b = bilanState(id); b.busy = true; b.err = ""; render();

Détail :
${lignes}

Analyse les ERREURS pour trouver ce qui coince vraiment : une étape de la filière, la chronologie des révolutions, les critères de localisation (salaires / compétences / clients), la lecture du tableau des coûts, la carte ? Cherche le point commun, ne recopie pas la liste. S'il n'y a pas de motif clair, dis-le honnêtement.

- "a_travailler" : 1 à 3 axes de progrès formulés positivement, avec l'exemple précis tiré du test et le chapitre du Dossier à relire (A3, B4…).

  } catch(e){

function copyText(att){
  const a = att.analysis, l = [];

  const wrong = att.questions.filter(q => !q.correct);

}
function copyFor(id){

/* ---------- voir mes erreurs : mot par mot, puis lettre par lettre ---------- */
function dxN(c){ return String(c).toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,""); }
function dxW(w){ return dxN(w).replace(/[.,!?;:«»"()…]/g,""); }
function lev(a, b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function lcsOps(A, B, eq){
  const m=A.length, n=B.length, L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j]=eq(A[i],B[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<m&&j<n){ if(eq(A[i],B[j])){ ops.push({t:"=",a:A[i],b:B[j]}); i++; j++; } else if(L[i+1][j]>=L[i][j+1]) ops.push({t:"-",a:A[i++]}); else ops.push({t:"+",b:B[j++]}); }
  while(i<m) ops.push({t:"-",a:A[i++]}); while(j<n) ops.push({t:"+",b:B[j++]});
  return ops;
}
function dxBlocks(ops){ const out=[]; let cur=null; ops.forEach(o=>{ if(o.t==="="){ cur=null; out.push(o); } else { if(!cur){ cur={t:"x",del:[],ins:[]}; out.push(cur); } (o.t==="-"?cur.del:cur.ins).push(o.t==="-"?o.a:o.b); } }); return out; }
const dxBad = t => `<del class="dx-bad">${esc(t)}</del>`;
const dxGood = t => `<ins class="dx-good">${esc(t)}</ins>`;
const dxMiss = `<span class="dx-miss" aria-label="il manque quelque chose ici">?</span>`;
function dxChars(u, r){
  let U="", R="";
  dxBlocks(lcsOps([...u],[...r],(x,y)=>dxN(x)===dxN(y))).forEach(b=>{
    if(b.t==="="){ U+=esc(b.a); R+=esc(b.b); return; }
    U += b.del.length ? dxBad(b.del.join("")) : dxMiss;
    if(b.ins.length) R += dxGood(b.ins.join(""));
  });
  return { U, R };
}
function dxDiff(user, right){
  const A=user.trim().split(/\s+/).filter(Boolean), B=right.trim().split(/\s+/).filter(Boolean);
  const U=[], R=[]; let common=0;
  dxBlocks(lcsOps(A,B,(x,y)=>dxW(x)===dxW(y))).forEach(b=>{
    if(b.t==="="){ common++; U.push(esc(b.a)); R.push(esc(b.b)); return; }
    const k=Math.min(b.del.length,b.ins.length);
    for(let i=0;i<k;i++){
      const x=b.del[i], y=b.ins[i], lim=Math.max(1, Math.floor(Math.max(dxW(x).length,dxW(y).length)*0.4));
      if(lev(dxW(x),dxW(y))<=lim){ const c=dxChars(x,y); U.push(c.U); R.push(c.R); common++; }
      else { U.push(dxBad(x)); R.push(dxGood(y)); }
    }
    b.del.slice(k).forEach(x=>U.push(dxBad(x)));
    if(b.ins.length>k){ U.push(dxMiss); b.ins.slice(k).forEach(y=>R.push(dxGood(y))); }
  });
  return { U:U.join(" "), R:R.join(" "), other: common===0 };
}
function dxLegend(){ return `<p class="dx-legend"><span>${dxBad("barré")} = ce qui était faux</span><span>${dxGood("souligné")} = ce qu'il fallait</span><span>${dxMiss} = il manque quelque chose</span></p>`; }
function errCard(q){
  const Q = q.question || {}, isMcq = Q.type === "mcq", user = (q.user || "").trim();
  let right = q.answer, U, R, note = "";
  if (!user){ U = `<span class="dx-none">rien</span>`; R = dxGood(right); }
  else if (isMcq){ U = dxBad(user); R = dxGood(right); }
  else {
    const cands = (Q.accept && Q.accept.length ? Q.accept : [q.answer]).filter(Boolean);
    right = cands.reduce((best, c) => lev(dxN(user), dxN(c)) < lev(dxN(user), dxN(best)) ? c : best, cands[0]);
    if (/^[0-9]/.test(right)){ U = dxBad(user); R = dxGood(right); }
    else { const d = dxDiff(user, right); U = d.U; R = d.R; if (d.other) note = "Ce n'est pas la même réponse : relis-la en entier."; }
  }
  return `<div class="revcard"><p class="rev-q">N° ${q.num} · ${esc(q.prompt)}</p>
    <p class="dx-line"><span class="dx-lab">✗ ${isMcq ? "Tu as choisi" : "Tu as écrit"}</span><span class="dx-ans">${U}</span></p>
    <p class="dx-line"><span class="dx-lab">✓ Il fallait</span><span class="dx-ans">${R}</span></p>
    ${note ? `<p class="dx-note">${note}</p>` : ""}${right !== q.answer ? `<p class="fine">Réponse complète : ${esc(q.answer)}</p>` : ""}
    <p class="rev-x">${esc(q.expl)}</p></div>`;
}
function errView(id){ const b = bilanState(id); return b.errOnly != null ? b.errOnly : S.screen === "results"; }
function revCard(q, showGood){
  return `<div class="revcard${q.correct?" ok":""}"><p class="rev-q">${q.correct?"✓":"✗"} N° ${q.num} · ${esc(q.prompt)}</p><p>Ta réponse : ${q.user ? esc(q.user) : "—"}</p>${(!q.correct || showGood) ? `<p class="${q.correct?"rev-good":""}">Réponse : <b>${esc(q.answer)}</b></p>` : ""}<p class="rev-x">${esc(q.expl)}</p></div>`;
}
function questionList(att){
  const only = errView(att.id), wrong = att.questions.filter(q => !q.correct), list = only ? wrong : att.questions;
  return (wrong.length ? dxLegend() : "") + list.map(q => q.correct ? revCard(q, !only) : errCard(q)).join("");
}

function viewScores(){

  const meta = `${deckLabel(S.selected)} · ${DIFFICULTIES[S.difficulty].label} · ${qs.length} questions`;
  const sheet = exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2><p class="cons">${esc(e.consigne)}</p>${e.qs.map(q => q.type === "mcq"
    ? `<div class="q"><b>${q.num}.</b> ${esc(q.word)}<span class="sr">Où vérifier : ${esc(q.src || "")}</span><div class="opts">${q.options.map(o => `<span>☐ ${esc(o)}</span>`).join("")}</div></div>`
    : `<div class="q"><b>${q.num}.</b> ${esc(q.word)}<span class="sr">Où vérifier : ${esc(q.src || "")}</span><div class="line"></div></div>`).join("")}</section>`).join("");
  const key = `<h1>Corrigé</h1><p class="meta">${esc(meta)}</p>` + exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2>${e.qs.map(q => `<div class="k"><b>${q.num}.</b> ${esc(q.word)} → <b>${esc(q.answer)}</b><span class="sr">Source : ${esc(q.src || "")}</span></div>`).join("")}</section>`).join("");
  const head = `<h1>Géographie — L'industrie (chapitres A, B, E)</h1><p class="meta">Prénom : Livio · contrôle : ${esc(DUE.long)} · ${esc(meta)}</p><p class="meta">Date : ____________ &nbsp; Note : ______ / 6</p>`;
  const body = part === "ex" ? head + sheet : part === "key" ? key : head + sheet + `<div class="pb"></div>` + key;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Géographie L'industrie</title><style>
@page{size:A4 portrait;margin:12mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;max-width:186mm;padding:10px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 2px;border-bottom:1px solid #999}.meta{margin:2px 0;font-size:13px}.cons{font-style:italic;margin:2px 0 6px;font-size:13px}
.ex{break-inside:avoid}.q{margin:8px 0;font-size:14px;break-inside:avoid}.opts{display:flex;flex-direction:column;gap:3px;margin:4px 0 0 18px}.line{border-bottom:1px solid #444;height:22px;margin:0 0 0 18px}
.k{font-size:13.5px;margin:3px 0}.sr{display:block;font-size:11.5px;color:#555;margin:1px 0 0 18px}.pb{break-before:page}.print{position:fixed;top:10px;right:10px;padding:8px 14px;font-size:14px}@media print{.print{display:none}}
</style></head><body><button class="print" onclick="window.print()">Imprimer</button>${body}</body></html>`;
}
async function savePaper(part){
  const qs = S.frozen; S.paperMsg = ""; S.paperCopy = "";
  const names = { ex:"exercices", both:"exercices-et-corrige", key:"corrige" };
  const filename = `${DUE.iso || "2026-10-22"}_geographie-industrie-livio-${names[part]}.html`;
  try {
    if (!HAS_CLAUDE){
      const url = URL.createObjectURL(new Blob([paperHtml(qs, part)], { type:"text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.paperMsg = "Fichier téléchargé : ouvre-le, puis touche « Imprimer ».";
      render(); return;
    }
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code:"unavailable" };
    await dl.save({ filename, data:paperHtml(qs, part) });
  } catch(e){
    if (e && e.code === "declined"){ S.paperMsg = "Téléchargement annulé."; }
    else {
      S.paperMsg = "Le téléchargement ne passe pas ici. Copie le texte ci-dessous et colle-le dans le chat : je t'envoie la feuille de ce test exact.";
      S.paperCopy = "#PDF-GEO-INDUSTRIE\n" + qs.map(q => `${q.num}. [Ex ${q.ex} ${q.exTitle} — ${q.consigne}] ${q.word}${q.options ? " | " + q.options.join(" / ") : ""} → ${q.answer} (source : ${q.src || ""})`).join("\n");
    }
  }
  render();
}

/* ---------- chargement de l'historique ---------- */
async function loadHistory(){
  try {
    await store.init();
    try { S.review = (await store.getDoc(REVIEW_ID)) || {}; } catch(e){ S.review = {}; }
    try { S.vidSeen = (await store.getDoc(VIDS_ID)) || {}; } catch(e){ S.vidSeen = {}; }
    if (S.screen === "dossier") render();
    if (S.screen === "cards") render();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  S.loaded = true;
  if (S.screen === "scores") render();
}

  if (e.target.id === "rv-note" && S.cards.curId){
    const r = S.review[S.cards.curId] = Object.assign({}, S.review[S.cards.curId], { note: e.target.value });
    if (!rvMarked(r)) delete S.review[S.cards.curId];
    saveReview(); return;
  }
  if (e.target.id === "answer-input" && S.quiz){ S.quiz.typed = e.target.value; const b = document.getElementById("validate-btn"); if (b) b.disabled = !S.quiz.typed.trim(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });

render();
loadHistory();
</script>

</body>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Géographie · pour le 30.10</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Quai de port : acier froid, conteneur bleu, jaune des grues ; le dossier se lit comme un livre (Literata), l'outil se manie en Barlow. */
:root{
  --dock:#E6EBEF; --sheet:#FFFFFF; --ink:#16232E; --soft:#55656F; --st:#9AA7B0; --rule:#C3CED6;
  --box:#1F5F8B; --box-wash:#E1ECF4; --crane:#F2B705; --crane-ink:#4A3800; --board:#16232E; --on-box:#FFFFFF;
  --good:#1F6E4E; --good-wash:#DDF1E6; --bad:#B23A2B; --bad-wash:#F9E3DF;
  --mp:#2E7D4F; --sf:#2D5BA8; --as:#B23A2B; --ve:#8A5A2B;
  --gen:#55616B; --gen-wash:#EEF1F4; --book-wash:#FFF3B5; --book-ink:#5A4500;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --read:'Literata',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --dock:#0E161C; --sheet:#17232C; --ink:#E4ECF1; --soft:#9AACB8; --st:#5D6B75; --rule:#2B3B47;
  --box:#6FB0DE; --box-wash:#16303F; --crane:#F2B705; --crane-ink:#1A1400; --board:#0A1117; --on-box:#0A1620;
  --good:#5FD3A0; --good-wash:#14332A; --bad:#FF8C7E; --bad-wash:#3A1F1C;
  --mp:#6FCF97; --sf:#8EB4F5; --as:#FF8C7E; --ve:#D9A66B;
  --gen:#A9B6BF; --gen-wash:#1D2830; --book-wash:#3A3110; --book-ink:#F4D46A; color-scheme:dark}}
:root[data-theme="dark"]{
  --dock:#0E161C; --sheet:#17232C; --ink:#E4ECF1; --soft:#9AACB8; --st:#5D6B75; --rule:#2B3B47;
  --box:#6FB0DE; --box-wash:#16303F; --crane:#F2B705; --crane-ink:#1A1400; --board:#0A1117; --on-box:#0A1620;
  --good:#5FD3A0; --good-wash:#14332A; --bad:#FF8C7E; --bad-wash:#3A1F1C;
  --mp:#6FCF97; --sf:#8EB4F5; --as:#FF8C7E; --ve:#D9A66B;
  --gen:#A9B6BF; --gen-wash:#1D2830; --book-wash:#3A3110; --book-ink:#F4D46A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--dock);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--crane);outline-offset:2px}

/* en-tête : un conteneur vu de côté (ondulations de la tôle) */
.head{position:relative;display:flex;gap:14px;align-items:center;margin-bottom:18px;padding:14px 14px 14px 16px;border-radius:4px;color:var(--on-box);
  background:repeating-linear-gradient(90deg,var(--box) 0 9px,color-mix(in srgb,var(--box) 82%,#000) 9px 12px)}
.head-code{flex:none;background:var(--crane);color:var(--crane-ink);font-family:var(--display);font-weight:800;font-size:15px;padding:4px 8px;border-radius:2px;letter-spacing:.5px;line-height:1.1;text-align:center}
.head-code b{display:block;font-size:24px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:.95;margin:0}
.head p{margin:4px 0 0;font-size:14px;opacity:.92}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:700;font-size:22px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 6px 6px 0;margin:0}
.note{background:var(--box-wash);border-radius:6px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--box);font-weight:700;padding:0;cursor:pointer}
.cta{width:100%;padding:15px;border:0;border-radius:4px;background:var(--box);color:var(--on-box);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ===== DOSSIER (e-book) ===== */
.toc-ch{display:flex;flex-direction:column;gap:6px}
.toc-ch h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:14px 0 2px;display:flex;flex-direction:column;gap:2px}
.toc-ch h2 span{font-family:var(--ui);font-weight:600;font-size:14px;color:var(--soft)}
.toc-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:11px 12px;cursor:pointer}
.code{font-family:var(--display);font-weight:800;font-size:16px;background:var(--board);color:var(--crane);padding:3px 8px;border-radius:2px;letter-spacing:.5px;min-width:42px;text-align:center}
.toc-t{font-weight:700;font-size:15px;line-height:1.3}
.toc-s{display:block;font-weight:400;font-size:12.5px;color:var(--soft)}
.legend{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px}
.legend p{margin:0;font-size:14px;display:flex;gap:8px;align-items:baseline}

.page{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.page h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,32px);line-height:1.05;margin:0;text-wrap:balance}
.objective{margin:0;padding:10px 12px;border:2px solid var(--board);border-radius:3px;font-size:14.5px;background:var(--dock)}
.objective b{display:block;font-family:var(--display);font-size:15px;letter-spacing:.3px;color:var(--soft);font-weight:700}
.read{font-family:var(--read);font-size:17px;line-height:1.65;margin:0;max-width:65ch}
.page h3{font-family:var(--display);font-weight:700;font-size:21px;margin:6px 0 -4px}
.def{border-left:4px solid var(--box);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.def-term{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.def .read{font-size:16.5px}
.def.gen{border-left:4px dashed var(--gen);background:var(--gen-wash);padding:8px 10px 8px 12px;border-radius:0 4px 4px 0}
.def.book{border-left:4px solid var(--crane);background:var(--book-wash);padding:9px 10px 9px 12px;border-radius:0 14px 14px 0}
.def.book .read{font-weight:600}
.tag.book{background:var(--crane);color:var(--crane-ink)}
.step.st .step-bar{width:6px;justify-self:center;opacity:.55}
.rv-d{font-family:var(--display);font-weight:700;font-size:15px;color:var(--soft)}
.rv-c{font-size:12.5px;font-weight:700;color:var(--box);margin-top:3px}
.nike{gap:10px}
.nk{display:flex;flex-direction:column;gap:3px}
.nk-r{font-weight:700;font-size:14px}
.tag{display:inline-block;white-space:nowrap;flex:none;font-family:var(--ui);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;vertical-align:2px}
.tag.mine{background:var(--box-wash);color:var(--box)}
.tag.gen{background:var(--gen-wash);color:var(--gen);border:1px dashed var(--gen)}
.mywork{background:var(--box-wash);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.mywork-t{font-weight:700;font-size:14px;color:var(--box);margin:0}
.mywork ul{margin:0;padding-left:18px}
.mywork li{font-family:var(--read);font-size:15.5px;margin:2px 0}
.tip{margin:0;padding:10px 12px;border-radius:4px;background:var(--board);color:#E9EEF2;font-size:15px}
.tip b{color:var(--crane);font-family:var(--display);font-size:17px;display:block}
.todo{margin:0;padding:10px 12px;border:1px dashed var(--bad);border-radius:4px;font-size:14px;color:var(--ink)}
.src{font-size:12.5px;color:var(--soft);margin:0}
.exl{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.exl-t{margin:0;padding:8px 12px;font-weight:700;font-size:14px;background:var(--box-wash);color:var(--box)}
.exr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:9px 12px;border-top:1px solid var(--rule);font-size:14.5px}
.exr .code{font-size:13px;min-width:0;padding:2px 6px;align-self:start}
.exr b{font-weight:600}
.exr span.so{display:block;color:var(--soft);font-size:13.5px;margin-top:2px}
.links{display:flex;flex-direction:column;gap:10px}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:4px}
.lk-ids{display:flex;flex-direction:column;gap:4px;align-items:center}
.lk-ids button{border:0;background:var(--board);color:var(--crane);font-family:var(--display);font-weight:800;font-size:14px;padding:2px 7px;border-radius:2px;cursor:pointer}
.lk-ids i{font-style:normal;color:var(--soft);font-size:12px;line-height:1}
.lk p{margin:0;font-size:15px}
.trio{display:flex;flex-direction:column;gap:0}
.trio-s{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 0}
.trio-s + .trio-s{border-top:1px dashed var(--rule)}
.trio-k{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--on-box);background:var(--box);border-radius:3px;display:flex;align-items:center;justify-content:center;height:44px}
.trio-s b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.trio-s p{margin:2px 0 6px;font-size:14.5px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--rule);background:var(--dock);border-radius:3px;padding:3px 8px;font-size:13px;font-weight:700;cursor:pointer}
.rv-s{width:34px;height:34px;color:var(--box)}
.sect6{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sx{border:2px solid var(--board);border-radius:3px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sx b{font-family:var(--display);font-size:17px;line-height:1.1}
.sx span{font-size:13.5px;color:var(--soft)}
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;gap:12px;background:var(--dock);border-bottom:1px solid var(--rule);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding:9px max(16px, env(safe-area-inset-right, 0px)) 9px max(16px, env(safe-area-inset-left, 0px))}
.pbar-back{flex:none;background:none;border:0;color:var(--box);font-weight:700;font-size:15px;padding:4px 0;cursor:pointer}
.pbar-t{min-width:0;flex:1;display:flex;gap:8px;align-items:center}
.pbar-t .code{flex:none;font-size:13px;min-width:0;padding:2px 6px}
.pbar-x{min-width:0;font-weight:700;font-size:14.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--dock)}
.vid{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:4px;background:var(--board);color:#E9EEF2;text-decoration:none;margin:0}
.vid b{display:block;font-size:15.5px;color:#fff}.vid small{display:block;font-size:12.5px;color:#C9D3E0}
.vid-i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--crane);color:var(--crane-ink);display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:2px}
.vid.off{background:var(--gen-wash);color:var(--gen);border:1px dashed var(--gen)}.vid.off b{color:var(--gen)}.vid.off small{color:var(--gen)}.vid.off .vid-i{background:var(--rule);color:var(--soft)}
.vthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--board);cursor:pointer;color:#fff;text-align:left}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.vthumb-play{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:var(--crane);color:var(--crane-ink);display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.vthumb-t{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(10,17,23,.9))}
.vthumb-t b{display:block;font-size:15.5px}.vthumb-t small{display:block;font-size:12.5px;color:#D5DEE6}
.vplay{display:flex;flex-direction:column;gap:8px}
.vframe{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbar{display:grid;grid-template-columns:1fr auto;gap:8px}
.vfb{margin:0}.vfb a{color:var(--soft)}
.vdone{background:var(--good-wash);border:1px solid var(--good);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px}
.vdone-t{margin:0;font-family:var(--display);font-weight:800;font-size:22px;color:var(--good)}
.toc-v.seen{background:var(--good-wash);color:var(--good);border:1px solid var(--good)}
.ctest{border:1px solid var(--box);background:var(--box-wash);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ctest.end{margin-top:4px}
.ctest-t{margin:0;font-weight:700;font-size:15px;color:var(--box)}.ctest-t small{display:block;font-weight:400;font-size:12.5px;color:var(--soft)}
.ctest-b{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);cursor:pointer;min-width:0}
.ctest-b span{font-size:17px}.ctest-b b{font-size:13px;line-height:1.2;text-align:center}
.toc-v{display:inline-block;font-size:11.5px;font-weight:700;background:var(--crane);color:var(--crane-ink);padding:0 6px;border-radius:3px;vertical-align:2px;white-space:nowrap}
.pm{margin:0 0 6px;font-size:14.5px}
.pm b{display:inline-block;width:16px}
.bsrc{margin:-8px 0 0;font-size:12.5px;color:var(--soft);line-height:1.35}
.see{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.see button{border:1px solid var(--rule);background:var(--dock);border-radius:3px;padding:5px 9px;cursor:pointer;font-weight:700}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);cursor:pointer;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--soft);font-size:12px}
.pager b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* schémas */
.chain{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:stretch}
.step-bar{border-radius:3px}
.step-body{padding:8px 0 12px}
.step-body b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}
.step-body span{font-size:14.5px;color:var(--soft)}
.step + .step .step-body{border-top:1px dashed var(--rule)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-family:var(--display);font-size:16px;font-weight:700;color:var(--soft)}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.rev4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv{border:2px solid var(--board);border-radius:3px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rv-n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--box)}
.rv-i{font-weight:700;font-size:14.5px}
.rv-x{font-size:13px;color:var(--soft)}
.rv-i{line-height:1.3}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.bar-track{display:flex;gap:4px;align-items:center}
.bar-fill{height:14px;border-radius:2px;background:var(--box)}
.bar-fill.b{background:var(--crane)}
.bar-v{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap}
.box3d{border:2px solid var(--board);border-radius:3px;padding:12px;text-align:center;font-family:var(--display);font-size:20px;font-weight:700;background:repeating-linear-gradient(90deg,var(--box-wash) 0 8px,var(--sheet) 8px 11px)}
.box3d small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--soft)}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:4px;border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1px dashed var(--rule);border-radius:4px;color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.srcrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--rule);font-size:14.5px}
.srcrow b{color:var(--box)}

/* paquets */
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.deck.on{border-color:var(--box);box-shadow:inset 0 0 0 1px var(--box);background:var(--box-wash)}
.deck-c{align-self:flex-start;font-family:var(--display);font-weight:800;font-size:13px;background:var(--board);color:var(--crane);padding:1px 6px;border-radius:2px}
.deck-t{font-weight:700;font-size:14.5px;line-height:1.25}
.deck-n{font-size:12.5px;color:var(--soft)}
.deck-tick{position:absolute;top:9px;right:10px;color:var(--box);font-weight:800}

/* cartes */
.flash{position:relative;height:480px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;background:var(--sheet);border:1px solid var(--rule);border-top:8px solid var(--box);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px 16px 34px;overflow:auto;transition:transform .45s}
.face.b{transform:rotateY(180deg);background:var(--box-wash);border-color:var(--box)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:13.5px;font-weight:700;color:var(--soft)}

  { t:"h3", h:"L'exemple du jean Lee Cooper (doc. 5)" },
  { t:"p", s:"Livre p. 68, doc. 5, « Commençons par la fin »", h:"Dans un magasin d'Ipswich, au Royaume-Uni, le livre choisit un jean Lee Cooper, modèle LC10, 100 % coton. Sur ce jean : <b>aucune mention de l'origine</b>. Pourtant, les étapes de son voyage, mises bout à bout, feraient <b>une fois et demie le tour du monde</b>." },
  { t:"ex", s:"Fiche A, act. 3a (livre pp. 68-69)", items:[["A · 3a","Tu as noté le pays de chacune des 10 étapes du jean : 11 pays en tout.","C'est la preuve qu'une seule étiquette « Made in… » ne peut pas tout dire."]] },
  { t:"tip", h:"« L'étiquette donne-t-elle toutes les informations ? » Réponds non, avec deux raisons : 1) les étapes de fabrication sont dispersées dans plusieurs pays, et une étiquette en donne au mieux un seul ; 2) parfois, elle ne dit même rien de l'origine, comme le jean Lee Cooper. Puis cite deux ou trois pays du jean." },
  { t:"see", ids:["A3","E2"] },
  { t:"src", h:"Livre p. 66 (introduction) et p. 68 (doc. 5) · dossier A, activité 3a" },
]},
/* ---------------- A3 ---------------- */
{ id:"A3", ch:"A", titre:"La filière de production", court:"Le schéma du doc. 12 et le voyage du jean",
  obj:"Comprendre / expliquer le schéma de la filière d'une production industrielle.",
  blocks:[
  { t:"p", s:"Livre p. 69, doc. 12, « Filière de production industrielle »", h:"Une filière, c'est la chaîne de toutes les étapes d'un produit, des matières premières jusqu'aux lieux de consommation. Voici le schéma de ton livre (doc. 12), étape par étape :" },
  { t:"html", s:"Livre p. 69, doc. 12", h:`<div class="chain">${CHAIN12.map(([k,b,s]) => `<div class="step${k==="st"?" st":""}"><span class="step-bar" style="background:var(--${k})" aria-hidden="true"></span><div class="step-body"><b>${b}</b><span>${s}</span></div></div>`).join("")}</div>
    <p class="fine">Entre chaque étape, une flèche « Transport ». Les couleurs sont celles de ton tableau : vert, bleu, rouge, brun ; le gris marque le stockage.</p>` },
  bookDef("sto"),
  { t:"p", s:"Livre p. 69, doc. 12", h:"On oublie souvent deux choses dans une filière : le <b>stockage</b> (les entrepôts du schéma) et le <b>transport</b> (les flèches). Ils reviennent entre chaque étape." },
  { t:"h3", h:"Le schéma appliqué au jean" },
  { t:"html", s:"Livre pp. 68-69, doc. 5 à 11 · fiche A, act. 3a et 3b", h:`<div class="tbl"><table><thead><tr><th>Étape du doc. 12</th><th>Dans le jean (livre doc. 5 et ton tableau)</th></tr></thead><tbody>
    <tr><td><span class="sw" style="background:var(--mp)" aria-hidden="true"></span><b>Matières premières</b></td><td>coton (Bénin), pétrole (Arabie saoudite), cuivre et zinc (Namibie, Australie)</td></tr>
    <tr><td><span class="sw" style="background:var(--sf)" aria-hidden="true"></span><b>Produits semi-finis</b></td><td>toile denim (Italie), indigo (Allemagne), fil à coudre (Royaume-Uni, Hongrie, Turquie), polyester et laiton (Japon)</td></tr>
    <tr><td><span class="sw" style="background:var(--as)" aria-hidden="true"></span><b>Assemblage du produit fini</b></td><td>Ras Jebel, en Tunisie : 500 ouvrières, chacune avec sa spécialité</td></tr>
    <tr><td><span class="sw" style="background:var(--ve)" aria-hidden="true"></span><b>Transport vers les marchés</b></td><td>train, bateau, camion, camionnette, jusqu'à un magasin du Royaume-Uni</td></tr></tbody></table></div>` },
  { t:"ex", s:"Fiche A, act. 3 et 4 (livre pp. 68-69)", items:[
    ["A · 3a","Tu as retrouvé le pays de chaque étape du jean.","Chaque étape de la filière peut se faire dans un pays différent."],
    ["A · 3b","Tu as colorié chaque étape en vert, bleu, rouge ou brun d'après le doc. 12.","Ce sont les grandes étapes du schéma : matières premières, semi-finis, assemblage, distribution et vente."],
    ["A · 4","Tu as tracé l'itinéraire du jean sur une carte.","Entre chaque étape, il y a un transport : c'est le lien avec le chapitre E."],
    ["A · 4d","Pourquoi Lee Cooper, entreprise anglaise, ne fabrique-t-il pas au Royaume-Uni ?","La réponse est au chapitre B : délocalisation (B1) et salaires (doc. 24, en B4)."]] },
  { t:"tip", h:"Si on te donne un schéma de filière, nomme les étapes dans l'ordre : matières premières, produits semi-finis, assemblage, transport vers les marchés, sans oublier le stockage et le transport entre chaque étape. Puis place un exemple du jean dans chaque étape." },
  { t:"see", ids:["A1","B3","E1"] },
  { t:"src", h:"Livre pp. 68-69 (doc. 5 à 12) · dossier A, activités 3 et 4" },
]},
/* ---------------- B1 ---------------- */
{ id:"B1", ch:"B", titre:"Quatre notions clés", court:"Révolution industrielle, délocalisation, multinationale, R&D",
  obj:"Définir les notions clés suivantes : révolution industrielle, délocalisation, multinationale, R&D.",
  blocks:[
  { t:"def", s:"Pas dans tes photos : à vérifier dans le livre (le mot « révolution » est dans le lexique en fin de livre)", gen:true, term:"Révolution industrielle", h:"Grand changement dans la façon de produire, provoqué par de nouvelles sources d'énergie et de nouvelles techniques. Après chaque révolution, on produit plus, plus vite, et autrement." },
  { t:"p", s:"Livre p. 70, doc. 13", h:"Ce que donne le livre (doc. 13) : quatre révolutions, <b>1.0</b> (1765), <b>2.0</b> (1870), <b>3.0</b> (1969) et <b>4.0</b> (aujourd'hui), chacune avec ses énergies et ses techniques. Le détail est au chapitre B2." },
  { t:"todo", h:"Le livre n'a pas de bulle jaune pour ce mot. « Révolution » porte une étoile (*) : sa définition est dans le lexique à la fin du livre. Une photo de cette ligne remplacera l'encadré gris." },
  bookDef("del"),
  { t:"p", s:"Livre p. 72, doc. 19 et « Des critères de compétitivité » · fiche B, act. 3a", h:"Exemples : une production automobile américaine délocalisée au Mexique en 2015 (doc. 19) ; l'usine textile du Bangladesh de ton dossier. Le livre dit aussi que, depuis la révolution 3.0, « l'expansion des entreprises s'accentue grâce à la délocalisation de la production »." },
  bookDef("mn"),
  { t:"p", s:"Livre p. 67 (doc. 4), p. 73 (doc. 23), p. 75 (doc. 27) · fiche B, act. 5a", h:"Exemples : Apple (doc. 27), Nike (doc. 23), Adidas (doc. 4). Chez Apple : siège social aux États-Unis, R&D dans plusieurs pays, assemblage en Chine, distribution sur plusieurs continents." },
  bookDef("rd"),
  { t:"p", s:"Fiche B, act. 5a (livre p. 75, doc. 27)", h:"Chez Apple, tu as trouvé des centres de R&D au Japon, en Chine, en Suède, en Israël et aux États-Unis : on y cherche des gens très compétents, formés à l'université et dans les hautes écoles. C'est exactement les « personnes hautement qualifiées » du livre." },
  { t:"h3", h:"Deux autres bulles jaunes du chapitre B" },
  bookDef("mon"),
  bookDef("mo"),
  { t:"ex", s:"Fiche B, act. 5b (livre p. 75, doc. 27)", items:[["B · 5b","Les cinq mots-clés à cocher pour la carte d'Apple : mondialisation, délocalisation, main-d'œuvre, R&D, multinationale.","Ce sont cinq bulles jaunes : entraîne-toi à dire en une phrase comment chacun se voit sur le doc. 27."]] },
  { t:"tip", h:"Une définition complète = la phrase du livre + un exemple. « Une multinationale est une entreprise dont les différents secteurs d'activité s'étendent dans plusieurs pays, par exemple Apple. » Pour la délocalisation, ajoute au moins deux motifs : les salaires, la fiscalité." },
  { t:"see", ids:["B2","B4"] },
  { t:"src", h:"Livre pp. 70-74 (bulles jaunes, doc. 13, 19) · dossier B, activités 3 et 5" },
]},
/* ---------------- B2 ---------------- */
{ id:"B2", ch:"B", titre:"De la révolution 1.0 à aujourd'hui", court:"Innovations, énergies et critères de localisation",
  obj:"Expliquer comment la production industrielle a évolué de la révolution industrielle 1.0 à aujourd'hui (grandes innovations ; critères de localisation des entreprises).",
  blocks:[
  { t:"p", s:"Livre p. 70, texte d'introduction du chapitre B", h:"Jusqu'à la fin du XIX<sup>e</sup> siècle, on plaçait une usine près des sources d'énergie, des matières premières et des moyens de transport : souvent au bord d'une voie navigable, au cœur même des villes. Au XX<sup>e</sup> siècle, les transports, les télécommunications, la classe moyenne et un commerce plus libre ont permis aux entreprises de travailler à l'échelle de la planète : c'est la mondialisation. Aujourd'hui, la production est très spécialisée et dispersée dans le monde, souvent loin des marchés (p. 70)." },
  { t:"h3", h:"Les quatre révolutions (doc. 13)" },
  { t:"p", s:"Livre p. 70, doc. 13 · fiche B, act. 1", h:"Le schéma à savoir redessiner : une frise avec, pour chaque révolution, son symbole, sa date et ses innovations. Engrenages, chaîne, puce, wifi." },
  { t:"html", s:"Livre p. 70, doc. 13 (frise) · critères : livre pp. 71-72", h:`<div class="rev4">
    <div class="rv"><svg class="rv-s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="2.6 2.4"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg><span class="rv-n">1.0</span><span class="rv-d">1765</span><span class="rv-i">Charbon et machine à vapeur, mécanisation</span><span class="rv-c">Critères de proximité</span></div>
    <div class="rv"><svg class="rv-s" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="5" height="4" fill="currentColor"/><rect x="9.5" y="6" width="5" height="4" fill="currentColor"/><rect x="16" y="6" width="5" height="4" fill="currentColor"/><rect x="2" y="11.5" width="20" height="2.5" rx="1.2" fill="currentColor"/><path d="M5 14v6M19 14v6M3 20h4M17 20h4" stroke="currentColor" stroke-width="1.8" fill="none"/></svg><span class="rv-n">2.0</span><span class="rv-d">1870</span><span class="rv-i">Électricité et pétrole, production de masse (travail à la chaîne), usines</span><span class="rv-c">Critères de productivité</span></div>
    <div class="rv"><svg class="rv-s" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/><path d="M9 2v3M12 2v3M15 2v3M9 19v3M12 19v3M15 19v3M2 9h3M2 12h3M2 15h3M19 9h3M19 12h3M19 15h3" stroke="currentColor" stroke-width="1.6"/></svg><span class="rv-n">3.0</span><span class="rv-d">1969</span><span class="rv-i">Énergie nucléaire, électronique et informatique, automatisation de la production</span><span class="rv-c">Critères de compétitivité</span></div>
    <div class="rv"><svg class="rv-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.5 12.8a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="12" cy="19.2" r="1.8" fill="currentColor"/></svg><span class="rv-n">4.0</span><span class="rv-d">aujourd'hui</span><span class="rv-i">Numérique : big data, objets connectés, robotisation, intelligence artificielle</span><span class="rv-c">Critères liés à l'innovation et aux savoir-faire</span></div></div>` },
  { t:"h3", h:"Les critères de localisation évoluent (pp. 71-72)" },
  { t:"html", s:"Livre p. 71 (1.0 et 2.0, doc. 14 à 17) et p. 72 (3.0 et 4.0, doc. 18 à 21)", h:`<div class="tbl"><table><thead><tr><th>Révolution</th><th>Ce que dit le livre</th></tr></thead><tbody>
    <tr><td><b>1.0</b><br>proximité</td><td>L'industrialisation se fait autour des ressources minières (charbon, houille, fer) : Angleterre, nord de la France, Ruhr (Allemagne), Grands Lacs (États-Unis), Donbass (Russie). Le charbon fait tourner les machines à vapeur ; il voyage par bateau et par rail. La mécanisation augmente la production.</td></tr>
    <tr><td><b>2.0</b><br>productivité</td><td>Le travail à la chaîne diminue les coûts et permet de produire en très grandes quantités : c'est la production de masse (Ford, Détroit, 1913). Il faut des ouvriers spécialisés dans une seule tâche. La classe moyenne peut acheter voitures, télévisions, réfrigérateurs. Nouvelles énergies : pétrole et électricité. De meilleurs transports élargissent le marché.</td></tr>
    <tr><td><b>3.0</b><br>compétitivité</td><td>Les marchés s'ouvrent à l'échelle mondiale ; pays et régions se spécialisent. L'électronique et l'informatique permettent la mise en réseau (transports, communication) et l'automatisation. Les entreprises grandissent grâce à la délocalisation (voitures américaines produites au Mexique, 2015).</td></tr>
    <tr><td><b>4.0</b><br>innovation et savoir-faire</td><td>La production est reliée aux technologies de l'information et de la communication. L'industrie produit des objets capables d'interagir avec leur environnement : voiture autonome, domotique, robots (production robotisée de Peugeot en Chine, 2016). Près de chez toi : la programmation d'une unité de production dans une entreprise de décolletage à Boudry (NE), en 2000 (doc. 21).</td></tr></tbody></table></div>` },
  bookDef("ind"),
  bookDef("prod"),
  bookDef("cm"),
  { t:"def", s:"Livre p. 72, glossaire en bas de page", book:"p. 72", term:"Domotique", h:"Ensemble de techniques permettant l'automatisation de la maison (confort, sécurité, énergie)." },
  { t:"h3", h:"Au XX<sup>e</sup> siècle (p. 73)" },
  { t:"p", s:"Livre p. 73, « L'évolution de l'industrie au cours du XXe siècle »", h:"Au début du siècle, toute la filière, de la production à la consommation, se trouve dans les pays industrialisés. Dans la deuxième moitié, la production se délocalise dans des pays émergents, alors que la R&D et les marchés restent en grande partie dans les pays industrialisés." },
  { t:"h3", h:"Les machines remplacent la main-d'œuvre" },
  { t:"p", s:"Livre p. 71 (doc. 17) et p. 72 (doc. 19 et 20) · fiche B, act. 2d et 3b", h:"D'une révolution à l'autre, les machines font une part de plus en plus grande du travail. Le livre le montre avec l'automobile : la première chaîne de montage Ford (Détroit, 1913 : 2.0), des voitures américaines produites au Mexique (2015 : 3.0, délocalisation), puis une usine Peugeot robotisée en Chine (2016 : 4.0), où il n'y a plus d'ouvriers dans cette partie de l'usine." },
  { t:"ex", s:"Fiche B, act. 1, 2d et 3a à 3d (livre pp. 70-72)", items:[
    ["B · 1","Tu as expliqué les quatre symboles du doc. 13.","C'est le schéma à connaître : engrenages (vapeur), chaîne (production de masse), puce (informatique), wifi (objets connectés)."],
    ["B · 3a","Tu as rattaché quatre images à une révolution : Pittsburgh 1857, Chaplin 1936, usine du Bangladesh, robots.","Pour reconnaître une révolution, regarde l'énergie utilisée et qui travaille : des humains ou des machines."],
    ["B · 2d, 3b","Docs 17, 19 et 20 : les employés sont remplacés par des robots.","C'est l'évolution de 2.0 à 4.0."],
    ["B · 3c, 3d","Tes exemples : caisses automatiques, aspirateur-robot ; des emplois menacés sur les chaînes de production.","La même évolution, dans ta vie de tous les jours."]] },
  { t:"tip", h:"Pour chaque révolution, sache quatre choses : la date, l'énergie, l'innovation, le critère de localisation. Pour les critères, retiens la suite : proximité → productivité → compétitivité → innovation et savoir-faire." },
  { t:"see", ids:["B1","B4"] },
  { t:"src", h:"Livre pp. 70-73 (doc. 13 à 21) · dossier B, activités 1 et 3" },
]},
/* ---------------- B3 ---------------- */
{ id:"B3", ch:"B", titre:"Ce qu'il faut pour produire", court:"Les critères qui comptent pour une entreprise (doc. 22)",
  obj:"Énumérer et expliquer ce dont a besoin une entreprise pour produire un bien.",
  blocks:[
  { t:"p", s:"Livre p. 73, doc. 22, « Les critères qui comptent pour une entreprise »", h:"Le doc. 22 de ton livre donne la liste. La fabrication d'un produit industriel nécessite six choses :" },
  { t:"html", s:"Livre p. 73, doc. 22 · exemples : livre p. 68 (doc. 5) et p. 75 (doc. 28)", h:`<div class="tbl"><table><thead><tr><th>Le livre (doc. 22)</th><th>Ce que ça veut dire, avec un exemple</th></tr></thead><tbody>
    <tr><td><b>Des ressources naturelles</b><br>(matières premières, énergie)</td><td>Ce qu'on tire de la nature : le coton du Bénin, le pétrole d'Arabie saoudite, l'énergie qui fait tourner les machines.</td></tr>
    <tr><td><b>Des ressources humaines</b><br>(main-d'œuvre, savoir-faire)</td><td>Les personnes qui travaillent, et ce qu'elles savent faire : les 500 ouvrières de Ras Jebel, chacune avec sa spécialité.</td></tr>
    <tr><td><b>Des ressources financières</b><br>(capital)</td><td>L'argent pour payer les salaires, les machines, les pièces, les bâtiments.</td></tr>
    <tr><td><b>Des ressources techniques</b><br>(usines, machines, outils)</td><td>Les bâtiments et les appareils qui fabriquent et assemblent.</td></tr>
    <tr><td><b>Un marché pour écouler le produit fini</b><br>(consommateurs)</td><td>Des clients qui achètent : sans eux, on ne produit pas.</td></tr>
    <tr><td><b>Un contexte politique et économique favorable</b><br>(stabilité, circulation des biens et des personnes)</td><td>Un pays calme, où les marchandises et les gens peuvent circuler. L'OMC (doc. 28) fixe des règles pour le commerce entre plus de 160 pays et sert de cadre pour négocier des accords qui favorisent la liberté des échanges.</td></tr></tbody></table></div>` },
  { t:"ex", s:"Fiche B, act. 2a à 2c (livre p. 73, doc. 22)", items:[["B · 2","Tu as listé ce qu'il faut pour fabriquer une voiture, puis complété ta liste avec le doc. 22.","Tu avais presque tout trouvé ; il manquait le contexte politique et économique favorable."]] },
  { t:"tip", h:"« Énumérer et expliquer » : la liste ET une phrase pour chaque élément. Apprends les six dans l'ordre du livre : naturelles, humaines, financières, techniques, un marché, un contexte favorable." },
  { t:"see", ids:["A1","B4"] },
  { t:"src", h:"Livre p. 73 (doc. 22) et p. 75 (doc. 28) · dossier B, activité 2" },
]},
/* ---------------- B4 ---------------- */
{ id:"B4", ch:"B", titre:"Une multinationale au XXIe siècle", court:"Apple, Nike : où et pourquoi chaque activité",
  obj:"Expliquer l'organisation d'une grande entreprise au XXIe siècle et les critères de localisation de ses secteurs d'activité (siège social, R&D, extraction des matières premières, usines de fabrication de composants, usines d'assemblage du produit fini, centres de distribution…).",
  blocks:[
  { t:"p", s:"Livre p. 74, « L'organisation de l'industrie au XXIe siècle »", h:"Le livre résume (p. 74) : les grandes entreprises sont souvent des multinationales. Leur <b>siège social</b> (gestion et décisions) et leur <b>R&D</b> se trouvent la plupart du temps dans des pays du Nord, à proximité de hautes écoles et d'universités. Leur <b>production</b> se place souvent dans des pays ou régions où les salaires sont bas." },
  { t:"h3", h:"Le schéma à retenir : les six secteurs (légende du doc. 27)" },
  { t:"p", s:"Livre p. 75, doc. 27 (légende de la carte)", h:"La légende de la carte d'Apple reprend exactement la liste de ton objectif. Pour chaque secteur, retiens le critère qui décide où on le place :" },
  { t:"html", s:"Livre p. 75 (doc. 27), p. 74 et p. 73 (doc. 22) · fiche B, act. 5a", h:`<div class="sect6">
    <div class="sx"><b>Siège social</b><span>Gestion et décisions : dans un pays du Nord.</span></div>
    <div class="sx"><b>Recherche et développement</b><span>Personnes hautement qualifiées : près des hautes écoles et des universités.</span></div>
    <div class="sx"><b>Extraction et transformation des matières premières</b><span>Là où se trouvent les ressources naturelles.</span></div>
    <div class="sx"><b>Fabrication des composants</b><span>Pièces complexes : personnes compétentes. Pièces simples : salaires bas.</span></div>
    <div class="sx"><b>Assemblage du produit fini</b><span>Là où les salaires sont bas.</span></div>
    <div class="sx"><b>Centres de distribution</b><span>Près des consommateurs qui peuvent payer.</span></div></div>
    <p class="fine">Critères tirés du livre (p. 74, doc. 22) et de tes réponses à l'activité 5a.</p>` },
  { t:"h3", h:"Exemple : Apple (doc. 27, 2017)" },
  { t:"html", s:"Livre p. 75, doc. 27 · fiche B, act. 5a", h:`<div class="tbl"><table><thead><tr><th>Secteur et lieu</th><th>Pourquoi (critère)</th></tr></thead><tbody><tr><td><b>Siège social</b><br>Silicon Valley (Californie)</td><td>Beaucoup d'entreprises des nouvelles technologies ; lieu de création de la marque.</td></tr><tr><td><b>R&D</b><br>Japon, Chine, Suède, Israël, USA</td><td>Des gens très compétents, formés à l'université et dans les hautes écoles.</td></tr><tr><td><b>Extraction et transformation des matières premières</b><br>Amérique du Sud, Afrique, Australie, Asie</td><td>Là où se trouvent les ressources naturelles.</td></tr><tr><td><b>Composants</b><br>Est de l'Asie (Chine, Japon, Taïwan, Singapour), USA, Allemagne, Italie</td><td>Pièces complexes : pays avec des personnes compétentes. Pièces simples : pays où le salaire est bas.</td></tr><tr><td><b>Assemblage</b><br>Chine</td><td>Des personnes flexibles qui ne coûtent pas cher (bas salaires) ; l'assemblage est assez simple.</td></tr><tr><td><b>Distribution</b><br>USA, Europe, Asie, Australie</td><td>Un natel neuf coûte cher : on le vend là où les salaires sont élevés.</td></tr></tbody></table></div>
    <p class="fine">Lieux lus sur la carte du doc. 27 ; critères tirés de tes réponses et du livre.</p>` },
  { t:"h3", h:"Nike : où l'on produit, où l'on vend (doc. 23, 2015)" },
  { t:"html", s:"Livre p. 73, doc. 23", h:`<div class="bars nike">${[["Marchés émergents",72,14],["Chine et Corée du Sud",26,12],["Amérique du Nord",1,47],["Europe occidentale",0.5,20],["Europe de l'Est et Asie",1,5],["Japon",0.5,2]].map(([r,e,v]) => `<div class="nk"><span class="nk-r">${r}</span><span class="bar-track"><span class="bar-fill" style="width:${e}%;min-width:3px"></span><span class="bar-v">${e<1?"< 1":e} % des employés</span></span><span class="bar-track"><span class="bar-fill b" style="width:${v}%"></span><span class="bar-v">${v} % des ventes</span></span></div>`).join("")}</div>
    <p class="fine">Barres bleues : employés · barres jaunes : ventes. Nike comptait plus de 900 000 employés en 2015.</p>` },
  { t:"p", s:"Livre p. 73, doc. 23 et 24", h:"Presque tous les employés de Nike travaillent dans les marchés émergents, en Chine et en Corée du Sud. Mais près de la moitié des ventes se fait en Amérique du Nord. On produit là où la main-d'œuvre coûte peu, on vend là où les gens peuvent payer." },
  { t:"p", s:"Livre p. 73, doc. 24", h:"Le doc. 24 compare les salaires mensuels moyens dans l'industrie en 2016 : quelques centaines de francs en Indonésie, en Namibie ou en Thaïlande, moins de 1000 francs en Chine, et de loin le plus élevé en Suisse, plus de 7000 francs." },
  { t:"h3", h:"Où sont les sièges sociaux ? (doc. 25, 2018)" },
  { t:"p", s:"Livre p. 74, doc. 25 et 26", h:"Sur les 250 plus grandes entreprises du monde : 84 ont leur siège aux États-Unis, 71 en Europe, 32 en Chine, 21 au Japon. Presque tous dans des pays du Nord. Le doc. 26 montre aussi que la Silicon Valley attire des spécialistes de l'intelligence artificielle venus du monde entier." },
  { t:"h3", h:"Les paradis fiscaux (doc. 29)" },
  { t:"p", s:"Livre p. 75, doc. 29", h:"Certaines entreprises veulent payer le moins d'impôts possible pour augmenter leur bénéfice. Elles délocalisent leur siège social, souvent une simple boîte aux lettres, dans un pays où la fiscalité est avantageuse (impôts très bas) : un <b>paradis fiscal</b>, comme les îles Caïmans." },
  { t:"ex", s:"Fiche B, act. 5a (livre pp. 74-75)", items:[["B · 5a","Pour Apple, tu as trouvé le lieu et le critère de chaque secteur.","C'est l'objectif mot pour mot : sois capable de le refaire pour une autre multinationale (Nike, Adidas)."]] },
  { t:"tip", h:"Pour chaque secteur, donne le lieu ET le critère. « Chine » seul ne suffit pas : « l'assemblage se fait en Chine, parce que les salaires sont bas et que l'assemblage est assez simple. »" },
  { t:"see", ids:["A3","B1","B3"] },
  { t:"src", h:"Livre pp. 73-75 (doc. 23 à 29) · dossier B, activité 5" },
]},
/* ---------------- E1 ---------------- */
{ id:"E1", ch:"E", titre:"Les modes de transport", court:"Cargo, péniche, train, camion, avion : avantages et inconvénients",
  obj:"Décrire les différents types de moyen de transport (avantage, inconvénient).",
  blocks:[
  { t:"p", s:"Livre p. 88, introduction du chapitre E", h:"Depuis les années 70, la quantité de marchandises transportées dans le monde double tous les dix ans. Avec la mondialisation, la production et la consommation sont dispersées : il faut acheminer les matières premières, les produits semi-finis et les produits finis d'un lieu à l'autre. Les biens que nous consommons viennent souvent de très loin, après un long voyage qui alterne plusieurs <b>modes de transport</b>." },
  bookDef("mode"),
  { t:"h3", h:"Les cinq modes de transport (doc. 76 à 80)" },
  { t:"html", s:"Livre p. 90 (doc. 76 et 77) et p. 91 (doc. 78 à 80)", h:`<div class="tbl"><table><thead><tr><th>Mode</th><th>✓ Avantages · ✗ Inconvénients</th></tr></thead><tbody><tr><td><b>Maritime</b><br>le cargo<br><span class="fine">doc. 76</span></td><td><p class="pm"><b>✓</b> Taille énorme : des dizaines de milliers de tonnes dans un seul navire. Le droit de la mer : traverser les océans sans douane ni péage. Plus de 90 % des tonnes-kilomètres de marchandises.</p><p class="pm"><b>✗</b> Le livre n'en cite pas. Ta fiche montre qu'à l'arrivée au port, il faut changer de mode (rupture de charge).</p></td></tr><tr><td><b>Fluvial</b><br>la péniche, la barge<br><span class="fine">doc. 77</span></td><td><p class="pm"><b>✓</b> De très grandes quantités pour des coûts très faibles.</p><p class="pm"><b>✗</b> Lente ; n'atteint que les lieux reliés au réseau de canaux. Surtout dans le Centre-Nord de l'Europe, jusqu'au port suisse de Bâle.</p></td></tr><tr><td><b>Ferroviaire</b><br>le train<br><span class="fine">doc. 78</span></td><td><p class="pm"><b>✓</b> Peu coûteux et relativement rapide.</p><p class="pm"><b>✗</b> Difficultés administratives (frontières, droits de douane), écartement des voies différent d'un pays à l'autre, moins flexible que la route (des régions reculées ne sont pas desservies).</p></td></tr><tr><td><b>Routier</b><br>le camion<br><span class="fine">doc. 79</span></td><td><p class="pm"><b>✓</b> Circule partout ou presque, sans horaire, plus de 1000 km par jour : très flexible. Principal mode sur les distances courtes et moyennes.</p><p class="pm"><b>✗</b> Charge très limitée : beaucoup de poids lourds et des nuisances (bruit, pollution, risques d'accident, dégâts aux routes, embouteillages).</p></td></tr><tr><td><b>Aérien</b><br>l'avion-cargo<br><span class="fine">doc. 80</span></td><td><p class="pm"><b>✓</b> Pour livrer en urgence : produits de luxe, courrier, aide en cas de catastrophe. Le plus gros avion du monde, l'AN-225, est un avion-cargo.</p><p class="pm"><b>✗</b> Très cher : réservé aux marchandises urgentes ou de grande valeur par rapport à leur poids.</p></td></tr></tbody></table></div>` },
  { t:"p", s:"Livre p. 90 (doc. 76 et 77) et p. 91 (doc. 78)", h:"Quelques détails du livre : en 2015, environ 90 000 navires commerciaux sillonnaient les mers. Le transport fluvial existe aussi en Russie, en Chine, aux États-Unis et en Amérique du Sud. Les premières voies ferrées datent du XIX<sup>e</sup> siècle, en pleine révolution industrielle ; aujourd'hui, la Suisse encourage le ferroutage, et la Chine a ouvert une ligne de trains-cargos vers l'Europe continentale en 14 jours." },
  { t:"h3", h:"Trois mots en bas de page" },
  bookDef("tkm"),
  bookDef("tir"),
  bookDef("ferr"),
  { t:"h3", h:"Ce que montre ta fiche : capacité et coût" },
  { t:"html", s:"Fiche E, act. 3c (livre pp. 90-91, doc. 76 à 79)", h:`<div class="bars">
    <div class="bar-row"><span>Cargo</span><span class="bar-track"><span class="bar-fill" style="width:100%"></span></span></div>
    <div class="bar-row"><span></span><span class="bar-v">plus de 1000 conteneurs</span></div>
    <div class="bar-row"><span>Péniche</span><span class="bar-track"><span class="bar-fill" style="width:3%"></span><span class="bar-v">environ 30</span></span></div>
    <div class="bar-row"><span>Train</span><span class="bar-track"><span class="bar-fill" style="width:2.5%"></span><span class="bar-v">environ 20 à 30</span></span></div>
    <div class="bar-row"><span>Camion</span><span class="bar-track"><span class="bar-fill" style="width:.4%;min-width:3px"></span><span class="bar-v">1 (ou 2)</span></span></div></div>
    <p class="fine">Barres à la même échelle. Le premier train Royaume-Uni–Chine transportait 32 conteneurs (doc. 86, p. 93).</p>` },
  { t:"html", s:"Fiche E, act. 4, tableau des coûts (renvoie au livre p. 92 ; source : seme.cer.free.fr)", h:`<div class="tbl"><table><thead><tr><th>Une tonne sur 350 km</th><th>Sans rupture de charge</th><th>Porte à porte, avec ruptures</th></tr></thead><tbody>
    <tr><td>Bateau grand gabarit</td><td class="num">3,5 CHF/t</td><td class="num">13 CHF/t</td></tr>
    <tr><td>Bateau petit gabarit</td><td class="num">4,5 CHF/t</td><td class="num">20 CHF/t</td></tr>
    <tr><td>Camion</td><td class="num">13 CHF/t</td><td class="num">24 CHF/t</td></tr>
    <tr><td>Train</td><td class="num">6 CHF/t</td><td class="num">25 CHF/t</td></tr></tbody></table></div>` },
  { t:"p", s:"Fiche E, act. 4, tableau des coûts", h:"Lis le tableau dans les deux sens. Sans rupture de charge, le bateau est le moins cher et le camion le plus cher. Porte à porte, le camion ne passe que de 13 à 24 : il augmente beaucoup moins que les autres." },
  { t:"mine", s:"Fiche E, act. 4a à 4c", titre:"Ce que tu as compris (activité 4)", items:["Colonne bleue plus chère : on change de moyen de transport → rupture de charge. Cela coûte de l'argent et du temps.","Le camion augmente moins : il est plus facile et plus rapide de charger et décharger un camion.","Embouteillages et accidents : vu la densité du trafic, les prix vont augmenter."] },
  { t:"tip", h:"Pour chaque mode, sache un avantage, un inconvénient et une utilisation. Le cargo pour les océans, la péniche le long des canaux, le train sur les rails, le camion jusqu'à la porte, l'avion pour l'urgent et le précieux." },
  { t:"see", ids:["E2","E3"] },
  { t:"src", h:"Livre pp. 88, 90-91 (doc. 72, 76 à 80) · fiche E, act. 3 et 4" },
]},
/* ---------------- E2 ---------------- */
{ id:"E2", ch:"E", titre:"Quatre termes du transport", court:"Passage stratégique, transport intermodal, rupture de charge, plateforme intermodale",
  obj:"Connaître les termes « passage stratégique, transport intermodal, rupture de charge et plateforme intermodale ».",
  blocks:[
  { t:"h3", h:"Passage stratégique (p. 89)" },
  { t:"def", book:"p. 89", s:"Livre p. 89, texte « Un enjeu important : le contrôle des passages stratégiques » (pas de bulle jaune pour ce mot)", term:"Passage stratégique", h:"Lieu par lequel il faut obligatoirement passer, afin d'éviter un immense détour. Le contrôle de ces passages stratégiques est source de pouvoir politique et économique." },
  { t:"p", s:"Livre p. 89, doc. 73 « Les passages stratégiques »", h:"Pour les bateaux, ce sont d'abord les extrémités des continents qu'il fallait contourner : le <b>cap Horn</b> et le <b>cap de Bonne-Espérance</b>. Aujourd'hui, des canaux creusés par l'homme relient des océans et des mers : le <b>canal de Suez</b> (1869) et le <b>canal de Panama</b> (1914). Sur terre, les isthmes, les cols, les fonds de vallée et les détroits sont des obstacles qu'on franchit avec des tunnels, des ponts ou des ferries." },
  bookDef("detr"),
  bookDef("isth"),
  { t:"h3", h:"La carte des passages (doc. 74) et ta carte" },
  { t:"html", s:"Fiche E, carte « Passages stratégiques » (n° 1 à 7) · livre p. 89, doc. 74 (Suez et Bab-el-Mandeb en plus) et doc. 75", h:`<div class="tbl"><table><thead><tr><th>N° de ta carte</th><th>Passage</th><th>Où</th></tr></thead><tbody>
    <tr><td class="num">1</td><td>Détroit de Gibraltar</td><td>Entrée de la Méditerranée, entre l'Espagne et le Maroc</td></tr>
    <tr><td class="num">2</td><td>Canal de Panama (1914)</td><td>Amérique centrale</td></tr>
    <tr><td class="num">3</td><td>Détroit de Malacca</td><td>À côté de Singapour</td></tr>
    <tr><td class="num">4</td><td>Cap de Bonne-Espérance</td><td>Pointe sud de l'Afrique</td></tr>
    <tr><td class="num">5</td><td>Cap Horn</td><td>Pointe sud de l'Amérique du Sud</td></tr>
    <tr><td class="num">6</td><td>Pas de Calais</td><td>Entre la France et l'Angleterre ; le tunnel sous la Manche le traverse (doc. 75)</td></tr>
    <tr><td class="num">7</td><td>Détroit d'Ormuz</td><td>À côté de Dubaï, sortie du golfe Persique</td></tr>
    <tr><td class="num">livre</td><td>Canal de Suez (1869)</td><td>En Égypte, sur la route entre l'Europe et l'Asie</td></tr>
    <tr><td class="num">livre</td><td>Détroit de Bab-el-Mandeb</td><td>Sur la même route, entre le canal de Suez et l'océan Indien</td></tr></tbody></table></div>
    <p class="fine">Les deux dernières lignes ne sont pas sur ta carte, mais sur celle du livre (doc. 74) et sur la route du Marco Polo (doc. 81).</p>` },
  { t:"p", s:"Livre p. 89, doc. 74 « Flux et passages » (légende)", h:"La carte du livre montre aussi les grands ports (plus de 200 millions de tonnes : New York, Houston, Rotterdam, Shanghai, Ningbo, Singapour), les canaux en travaux d'agrandissement (Panama, Suez), les zones de conflits (piraterie, frontières maritimes), les routes maritimes principales, et les passages du Nord-Est et du Nord-Ouest." },
  { t:"h3", h:"Transport intermodal (p. 90)" },
  bookDef("inter"),
  { t:"p", s:"Livre p. 68, doc. 5 · p. 91, doc. 78", h:"Un exemple de ton livre (doc. 5) : le jean Lee Cooper quitte la Tunisie en <b>train</b>, puis en <b>bateau</b> ; il traverse la Manche par le tunnel en <b>camion</b>, puis arrive au magasin en <b>camionnette</b>. En Suisse, on encourage le transport intermodal par le ferroutage : le camion entier est chargé sur un train." },
  { t:"h3", h:"Rupture de charge (p. 92)" },
  bookDef("rupt"),
  { t:"mine", s:"Fiche E, act. 4a", titre:"Ta réponse (activité 4a)", items:["On change de moyen de transport → rupture de charge. Cela coûte de l'argent et du temps. C'est exactement ce que dit la bulle du livre."] },
  { t:"h3", h:"Plateforme intermodale (p. 93)" },
  bookDef("plat"),
  { t:"p", s:"Livre p. 93, texte et doc. 84", h:"Les lieux de ruptures de charge sont appelés plateformes intermodales. Les <b>ports</b> sont des plateformes intermodales stratégiques : ils attirent de nombreuses activités industrielles et des emplois. Exemple : l'intermodalité au port de Rouen, en France, avec ses grues, ses conteneurs et ses camions (doc. 84)." },
  { t:"ex", s:"Fiche E, carte et act. 4a", items:[["E · carte","Tu as placé et nommé 7 passages stratégiques.","Le livre en montre deux de plus : le canal de Suez et le détroit de Bab-el-Mandeb."],["E · 4a","Tu as expliqué pourquoi le transport « porte à porte » coûte plus cher.","C'est la rupture de charge : le mot de la bulle jaune p. 92."]] },
  { t:"tip", h:"Relie les trois mots : le transport intermodal utilise plusieurs modes à la suite ; chaque changement est une rupture de charge ; elle se fait sur une plateforme intermodale (port, gare, aéroport), avec des grues. Le passage stratégique, lui, est un endroit où tous les navires doivent passer." },
  { t:"see", ids:["E1","E4","A2"] },
  { t:"src", h:"Livre pp. 89-93 (doc. 73 à 75, 84 · bulles jaunes p. 90, 92, 93) · fiche E, carte et act. 4a" },
]},
/* ---------------- E3 ---------------- */
{ id:"E3", ch:"E", titre:"Choisir un transport", court:"Les facteurs du livre et la méthode pour faire un choix logique",
  obj:"Faire un choix logique pour transporter un produit.",
  blocks:[
  { t:"p", s:"Livre p. 90, « Différents modes de transport pour les marchandises »", h:"Le livre le dit : le choix du mode de transport dépend de nombreux facteurs." },
  { t:"html", s:"Livre p. 90", h:`<div class="sect6">
    <div class="sx"><b>Le type de produit</b><span>lourd ou léger, urgent ou non, précieux ou bon marché</span></div>
    <div class="sx"><b>La distance</b><span>courte, moyenne, un autre continent</span></div>
    <div class="sx"><b>Le temps de parcours</b><span>faut-il arriver vite ?</span></div>
    <div class="sx"><b>Les infrastructures</b><span>port, canal, voie ferrée, route, aéroport</span></div>
    <div class="sx"><b>La configuration du terrain</b><span>océan, montagne, relief plat</span></div>
    <div class="sx"><b>La situation géopolitique</b><span>frontières, conflits, piraterie</span></div></div>
    <p class="fine">Les six facteurs sont du livre ; les exemples en gris t'aident à les comprendre.</p>` },
  { t:"h3", h:"La méthode" },
  { t:"html", s:"Méthode construite avec le livre pp. 90-91 (doc. 76 à 80) et les chiffres de la fiche E, act. 3c et 4", h:`<div class="tbl"><table><tbody>
    <tr><td class="num">1</td><td><b>Quel produit ?</b> Urgent ou précieux → avion-cargo. Lourd, en grande quantité, pas pressé → bateau ou péniche.</td></tr>
    <tr><td class="num">2</td><td><b>Quel trajet ?</b> Traverser un océan → cargo. Le long des canaux → péniche. Sur des rails → train. Jusqu'à la porte, sur une distance courte ou moyenne → camion.</td></tr>
    <tr><td class="num">3</td><td><b>Quelle quantité ?</b> Plus de 1000 conteneurs → cargo ; 20 à 30 → péniche ou train ; 1 ou 2 → camion.</td></tr>
    <tr><td class="num">4</td><td><b>Combien de ruptures de charge ?</b> Chaque changement coûte de l'argent et du temps.</td></tr>
    <tr><td class="num">5</td><td><b>Combien ça coûte ?</b> Sans rupture, le bateau est le moins cher ; porte à porte, le camion augmente le moins.</td></tr>
    <tr><td class="num">6</td><td><b>Quels risques ?</b> Embouteillages et accidents sur la route, frontières pour le train, zones de conflits sur les routes maritimes (doc. 74).</td></tr></tbody></table></div>` },
  { t:"h3", h:"Un exemple du livre : le rail entre la Chine et l'Europe (p. 93)" },
  { t:"p", s:"Livre p. 93, doc. 85, 86 et 87 · p. 92, doc. 81", h:"En 2017, le premier train de marchandises entre le Royaume-Uni et la Chine a relié le port de Londres-Gateway à Yiwu : <b>12 000 km en 18 jours</b>, avec 32 conteneurs (whisky, boissons, médicaments) sur un train de 600 m (doc. 86). Le nombre de voyages en train entre la Chine et l'Europe est passé de quelques dizaines en 2011 à environ 4000 en 2017 (doc. 87). À comparer : le porte-conteneurs Marco Polo met presque trois mois pour sa rotation complète entre l'Europe et l'Asie (doc. 81). Le livre pose la question (p. 88) : le rail pourra-t-il bientôt concurrencer le cargo entre la Chine et l'Europe ?" },
  { t:"tip", h:"Une réponse logique = un choix + au moins deux raisons tirées du livre ou des chiffres. « Je choisis le train : il transporte 20 à 30 conteneurs et ne coûte que 6 CHF par tonne sans rupture de charge. »" },
  { t:"see", ids:["E1","E2"] },
  { t:"src", h:"Livre pp. 88, 90-93 (doc. 74, 76 à 81, 85 à 87) · fiche E, act. 3c et 4" },
]},
/* ---------------- E4 ---------------- */
{ id:"E4", ch:"E", titre:"Le même conteneur partout", court:"Pourquoi une taille standard",
  obj:"Expliquer pourquoi on utilise le même container sur toute la planète.",
  blocks:[
  { t:"p", s:"Livre p. 92, « Conteneurs et intermodalité »", h:"Le conteneur est une boîte métallique qui sert à transporter des marchandises. Il a été imaginé en <b>1956 aux États-Unis</b>, et son usage s'est généralisé à partir de <b>1966</b>." },
  { t:"html", s:"Livre p. 92, « Conteneurs et intermodalité »", h:`<div class="box3d">6 ou 12 m × 2,4 m × 2,6 m<small>dimensions standardisées : les mêmes partout dans le monde</small></div>` },
  { t:"p", s:"Livre p. 92, « Conteneurs et intermodalité »", h:"Pourquoi le même partout ? Parce qu'il peut être <b>facilement transbordé d'un mode de transport à l'autre</b>. Il a été créé pour faire face à la très forte augmentation du transport de marchandises et pour <b>simplifier les ruptures de charge</b>." },
  { t:"p", s:"Livre p. 92, bulle « Rupture de charge »", h:"La bulle jaune le confirme : l'utilisation d'un conteneur standardisé facilite les transferts et <b>diminue le coût et le temps de transport</b>. Sur les plateformes intermodales, les grues sont prévues pour ces boîtes (p. 93)." },
  bookDef("evp"),
  { t:"p", s:"Fiche E, act. 3a · livre p. 92, glossaire", h:"Ton calcul de l'activité 3a : 12 m × 2,4 m × 2,6 m = 74,88 m³. Ce conteneur de 12 m a la longueur de deux conteneurs de 6 m : il vaut donc <b>2 EVP</b>. Ta salle de classe (150 m³) ≈ 2 conteneurs de 12 m." },
  { t:"h3", h:"Les ports et les navires (doc. 81 à 83)" },
  { t:"html", s:"Livre p. 92, doc. 82 (source : Lloyd's List Intelligence)", h:`<div class="tbl"><table><thead><tr><th>Les 12 plus grands ports à conteneurs, 2016</th><th>Pays</th><th>Milliers d'EVP</th></tr></thead><tbody>
    <tr><td>Shanghai</td><td>Chine</td><td class="num">37 133</td></tr><tr><td>Singapour</td><td>Singapour</td><td class="num">30 903</td></tr><tr><td>Shenzhen</td><td>Chine</td><td class="num">23 979</td></tr><tr><td>Ningbo-Zhoustan</td><td>Chine</td><td class="num">21 560</td></tr><tr><td>Busan</td><td>Corée du Sud</td><td class="num">19 850</td></tr><tr><td>Hong Kong</td><td>Chine</td><td class="num">19 813</td></tr><tr><td>Guangzhou</td><td>Chine</td><td class="num">18 857</td></tr><tr><td>Qingdao</td><td>Chine</td><td class="num">18 010</td></tr><tr><td>Dubaï</td><td>Émirats arabes unis</td><td class="num">14 772</td></tr><tr><td>Tianjin</td><td>Chine</td><td class="num">14 190</td></tr><tr><td>Port Klang</td><td>Malaisie</td><td class="num">13 169</td></tr><tr><td>Rotterdam</td><td>Pays-Bas</td><td class="num">12 385</td></tr></tbody></table></div>
    <p class="fine">7 des 12 plus grands ports sont en Chine ; Rotterdam est le seul en Europe.</p>` },
  { t:"html", s:"Livre p. 92, doc. 83 (source : Allianz)", h:`<div class="tbl"><table><thead><tr><th>Porte-conteneurs (doc. 83)</th><th>Année</th><th>Longueur × largeur × hauteur</th></tr></thead><tbody>
    <tr><td>Fully cellular</td><td class="num">1970</td><td class="num">215 × 20 × 10 m</td></tr><tr><td>Panamax</td><td class="num">1980</td><td class="num">250 × 32 × 12,5 m</td></tr><tr><td>Post Panamax</td><td class="num">1988</td><td class="num">285 × 40 × 13 m</td></tr><tr><td>Post Panamax Plus</td><td class="num">2000</td><td class="num">300 × 43 × 14,5 m</td></tr><tr><td>Triple E</td><td class="num">2013</td><td class="num">300 × 59 × 15,5 m</td></tr></tbody></table></div>
    <p class="fine">Les navires sont de plus en plus grands. La longueur du Triple E équivaut à 2 terrains de football, 2 patinoires et 2 terrains de basket.</p>` },

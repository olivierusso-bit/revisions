<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Komparativ und Superlativ · à savoir pour le mardi 3 novembre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Thème « le podium » : comparer, c'est monter les marches. gut → besser → am besten.
   Bleu ruban de médaille, or, argent, bronze sur un gris piste. */
:root{
  --paper:#ECEFF3; --sheet:#FFFFFF; --ink:#18233A; --soft:#5E6A80; --rule:#CDD4DF;
  --court:#24477E; --court-wash:#E3EAF5; --jersey:#C98A1C; --score:#E8B024; --board:#18233A;
  --silver:#98A3B3; --bronze:#AE6A3A;
  --good:#1F7A5A; --good-wash:#DCF1E7; --bad:#B8382A; --bad-wash:#F9E2DE; --on-court:#FFFFFF;
  --p-okdark:#16634A; --p-ok:#1F8A63; --p-mid:#D07F22; --p-low:#B8382A; --p-lowsoft:#F0C7C0;
  --box:#24477E; --crane:#C98A1C;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151F; --sheet:#19202D; --ink:#E5EAF2; --soft:#9AA6BA; --rule:#2B3546;
  --court:#86A8E6; --court-wash:#1C2A44; --jersey:#E8B024; --score:#E8B024; --board:#0A0F18;
  --silver:#8C97A8; --bronze:#C98557;
  --good:#5ED3A0; --good-wash:#15362A; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-court:#0A0F18;
  --p-okdark:#3FB488; --p-ok:#5ED3A0; --p-mid:#E8A24D; --p-low:#FF8A7D; --p-lowsoft:#5A2A25;
  --box:#86A8E6; --crane:#E8B024; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151F; --sheet:#19202D; --ink:#E5EAF2; --soft:#9AA6BA; --rule:#2B3546;
  --court:#86A8E6; --court-wash:#1C2A44; --jersey:#E8B024; --score:#E8B024; --board:#0A0F18;
  --silver:#8C97A8; --bronze:#C98557;
  --good:#5ED3A0; --good-wash:#15362A; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-court:#0A0F18;
  --p-okdark:#3FB488; --p-ok:#5ED3A0; --p-mid:#E8A24D; --p-low:#FF8A7D; --p-lowsoft:#5A2A25;
  --box:#86A8E6; --crane:#E8B024; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--score);outline-offset:2px}

/* en-tête : le podium 2 · 1 · 3 */
.head{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px}
.podium{flex:none;display:flex;align-items:flex-end;gap:3px;height:62px}
.podium span{width:21px;display:flex;align-items:flex-start;justify-content:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;border-radius:3px 3px 0 0;padding-top:2px}
.podium .p2{height:40px;background:var(--silver)} .podium .p1{height:58px;background:var(--score);color:#3A2A00} .podium .p3{height:28px;background:var(--bronze)}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8.4vw,38px);line-height:.95;margin:0;letter-spacing:.2px}
.head p{margin:5px 0 0;color:var(--soft);font-size:14px}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:700;font-size:22px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 8px 8px 0;margin:0}
.note{background:var(--court-wash);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--court);font-weight:700;padding:0;cursor:pointer}

.cta{width:100%;padding:15px;border:0;border-radius:8px;background:var(--court);color:var(--on-court);font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.3px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);color:var(--court)}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.entry.open{border-left:5px solid var(--court)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-icon{font-size:19px;width:24px;text-align:center}
.entry-title{flex:1;font-family:var(--display);font-weight:700;font-size:20px}
.entry-count{font-size:12.5px;color:var(--soft)}
.entry-body{padding:0 14px 14px}
.pair{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-de{font-weight:700;color:var(--court)}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--court-wash);font-size:14px}
.astuce b{display:block;color:var(--court);margin-bottom:2px}
.src-date{font-weight:400;color:var(--soft);font-size:13px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1px dashed var(--rule);border-radius:6px;color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}
.tip{margin:0;padding:8px 0 8px 12px;border-left:3px solid var(--score);font-size:15px}
/* les trois marches d'un adjectif */
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;align-items:end;padding:8px 0;border-top:1px solid var(--rule)}
.steps span{display:block;text-align:center;font-weight:700;font-size:13px;padding:6px 2px;border-radius:4px 4px 0 0;overflow-wrap:anywhere;line-height:1.2}
.steps .s1{background:var(--court-wash);min-height:34px}
.steps .s2{background:color-mix(in srgb,var(--silver) 32%,var(--sheet));min-height:44px}
.steps .s3{background:color-mix(in srgb,var(--score) 34%,var(--sheet));min-height:54px}
.steps .fr{grid-column:1/4;font-size:13px;color:var(--soft);font-weight:400;text-align:left;padding:0}
.steps.irr .s1{box-shadow:inset 3px 0 0 var(--jersey)}

/* paquets */
.deckrow{display:flex;align-items:stretch;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.deckrow.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);background:var(--court-wash)}
.deck-sel{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.deck-e{font-size:22px;flex:none}
.deck-txt{min-width:0}
.deck-t{display:block;font-weight:700;font-size:15px;line-height:1.2}
.deck-n{display:block;font-size:12.5px;color:var(--soft)}
.deck-tick{flex:none;color:var(--court);font-weight:800;font-size:18px;align-self:center;padding-right:4px}
.deck-pst{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 12px 8px 0;text-align:center}
.deck-redo{margin:-4px 0 8px;padding:0 12px}

.pst-l{font-size:12px;font-weight:700}
.pst-start{color:var(--soft)} .pst-low{color:var(--p-low)} .pst-mid{color:var(--p-mid)} .pst-win{color:var(--p-ok)} .pst-ok{color:var(--p-okdark)}
.pst-notes{font-size:10.5px;color:var(--soft)}
.pring-t{font-family:var(--display);font-weight:700;fill:var(--ink);font-size:14px}
.pglob{display:flex;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px}
.pglob-x b{display:block;font-family:var(--display);font-size:19px}
.pglob-x span{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.plegend{background:var(--court-wash);border-radius:8px;padding:0 12px}
.plegend summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:10px 0;color:var(--court)}
.plegend p{margin:0 0 8px;font-size:13px}

/* cartes */
.flash{position:relative;height:262px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--jersey);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;padding:22px;transition:transform .45s;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--court-wash);border-color:var(--court);border-top-color:var(--court)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:12px;font-weight:700;color:var(--soft)}
.face-word{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,28px);text-align:center;line-height:1.15}
.face-mini{font-size:13.5px;color:var(--court);font-weight:700;text-align:center}
.face-hint{position:absolute;bottom:12px;font-size:12px;color:var(--soft)}

/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);background:var(--court-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.paper{background:var(--sheet);border:1px dashed var(--court);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--court);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:16px;background:var(--board);color:var(--score);padding:1px 9px;border-radius:4px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--court-wash);color:var(--court)}
.chip.komparativ{background:#E6ECF5;color:#2D4B7A}
.chip.superlativ{background:#FBEBC0;color:#7A5806}
.chip.sens,.chip.allemand{background:#E7F3E6;color:#2C6E34}
.chip.phrase{background:#EFE0F2;color:#6E3A7C}
.chip.regle{background:#DDEFF7;color:#1C5A77}
.chip.article,.chip.pluriel{background:#F7E2DC;color:#9A3C27}
.ref{font-size:12px;color:var(--soft)}
.consigne{margin:0;font-size:14.5px;color:var(--soft)}
.qword{font-family:var(--display);font-weight:700;font-size:clamp(25px,7vw,31px);line-height:1.15;margin:0;overflow-wrap:anywhere}
.qhint{margin:0;font-size:14px;color:var(--soft)}
.choice{padding:14px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:17px;font-weight:700;cursor:pointer}
.choice.sel{border-color:var(--court);box-shadow:inset 0 0 0 2px var(--court)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font:inherit;font-size:19px;font-weight:700;color:var(--ink)}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.umlauts{display:flex;gap:8px}
.umlauts button{flex:1;padding:9px 0;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);font-size:18px;font-weight:700;cursor:pointer}
.fb{padding:14px;border-radius:8px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}

/* résultats */
.scorebox{background:var(--board);border:4px solid #2E3D5C;border-radius:10px;padding:18px;text-align:center}
.scorebox.rattr-box{border-color:var(--bad)}
.score-n{font-family:var(--display);font-weight:800;font-size:60px;line-height:1;color:var(--score);font-variant-numeric:tabular-nums}
.score-n small{font-size:30px;color:#B9A256}
.score-note{display:inline-block;margin-top:8px;background:var(--score);color:#18233A;font-weight:800;padding:4px 14px;border-radius:4px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#FF8A78}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}

/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:22px;margin:0}
.bilan-lab{font-size:13px;font-weight:700;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan ul.forts li{color:var(--good)}
.bilan ul.work li{color:var(--bad)}
.bilan-tip{background:var(--court-wash);border-radius:8px;padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--body)}

/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--board);border-radius:8px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--score);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#C9D0E6}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.rattr-tag{display:inline-block;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:6px}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:19px;color:var(--on-court)}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* suivi */
.suivi{display:flex;flex-direction:column;gap:10px}
.suivi h3{font-family:var(--display);font-size:21px;margin:6px 0 0}
.suivi-ctl{display:flex;flex-direction:column;gap:8px}
.suivi-sel{width:100%;padding:10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-weight:700}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft)}
.ch-legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.lg-line{width:16px;height:0;border-top:2px solid var(--box)}
.lg-ring{width:11px;height:11px;border:2px solid var(--good);border-radius:50%}
.ch-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ch-svg{display:block}
.ch-t{fill:var(--soft);font-size:11px;font-family:var(--body)}
.ch-b{fill:var(--ink);font-weight:700}
.ch-g{fill:var(--good);font-weight:700}
.ch-pt{cursor:pointer}
.ch-detail{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.ch-detail b{font-size:14.5px}
.tbl{overflow-x:auto}
.heat table{border-collapse:collapse;width:100%;font-size:13px}
.heat th,.heat td{border:1px solid var(--rule);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.heat th{background:var(--court-wash);font-weight:700}
.heat td.k{text-align:left;font-weight:700}
.heat td.hc-0{color:var(--soft)}
.heat td.hc-ok{background:var(--good-wash);color:var(--good);font-weight:700}
.heat td.hc-mid{background:#FBF0D8;color:#7A5806;font-weight:700}
.heat td.hc-low{background:var(--bad-wash);color:var(--bad);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .heat td.hc-mid{background:#3A3016;color:#E8C27A}}
:root[data-theme="dark"] .heat td.hc-mid{background:#3A3016;color:#E8C27A}
.resist{display:flex;flex-direction:column;gap:6px}
.resist p{margin:0;font-size:14px}
.resist .code{display:inline-block;background:var(--court-wash);color:var(--court);font-weight:700;font-size:12px;padding:1px 7px;border-radius:4px;margin-right:4px}
.resist small{color:var(--soft)}

/* test en cours */
.draft{background:var(--court-wash);border:1px solid var(--court);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.draft.block{border-color:var(--bad);background:var(--bad-wash)}
.draft p{margin:0}
.draft p b{display:block;font-family:var(--display);font-size:18px}
.draft p span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.draft-stop b{color:var(--bad)}
.draft-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}

/* voir mes erreurs */
.dx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px;color:var(--soft)}
.dx-line{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline;margin:2px 0!important}
.dx-lab{font-size:12.5px!important;font-weight:700;color:var(--soft)}
.dx-ans{font-size:17px;font-weight:700;overflow-wrap:anywhere;letter-spacing:.3px;line-height:1.7}
.dx-bad{background:#A3241B;color:#fff;text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:1px 2px}
.dx-good{background:#D4F0E1;color:#08402A;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;padding:1px 2px;font-weight:800}

/* correction en direct */
.live{display:flex;flex-direction:column;gap:4px}
.live-lab{margin:0;font-size:12.5px;font-weight:700;color:var(--soft)}
.live-box{min-height:46px;padding:8px 12px;border:1px dashed var(--rule);border-radius:8px;background:var(--sheet);font-size:21px;font-weight:700;letter-spacing:1px;line-height:1.7;overflow-wrap:anywhere}
.lv-bad{display:inline-block;background:#A3241B;color:#fff;border-radius:4px;padding:0 4px;margin:0 2px;line-height:1.35;box-shadow:0 0 0 2px var(--sheet)}
.lv-empty{font-size:14px;font-weight:400;color:var(--soft);letter-spacing:0}
.live-state{margin:0;font-size:13.5px;font-weight:700}

/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:3px solid var(--court);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--soft)}
.tab-e{font-size:18px} .tab-l{font-size:11px;font-weight:700}
.tab.on{color:var(--court);background:var(--court-wash)}

/* ---------- utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Les Umlaute restent distincts (ä ≠ a) ; les autres accents (français) sont tolérés ; ß = ss. */
function deAcc(s){ return String(s).replace(/ä/g,"\u0001").replace(/ö/g,"\u0002").replace(/ü/g,"\u0003").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"ä").replace(/\u0002/g,"ö").replace(/\u0003/g,"ü"); }
function norm(s, apoMode){
  return deAcc(String(s || "").toLowerCase().replace(/ß/g,"ss").normalize("NFC"))
    .replace(/…|\.\.\./g," ").replace(/[’'`]/g, apoMode === "del" ? "" : " ")
    .replace(/[.!?;,:«»"()\/\-+–]/g," ").replace(/\s+/g," ").trim();
}
const stripFr = s => s.replace(/^(le |la |les |l |un |une |des |du |de la |d )/,"").trim();
const stripDe = s => s.replace(/^(der |die |das )/,"").trim();
function matchAnswer(input, accept, lang, keep){
  return ["sp","del"].some(m => {
    const a = norm(input, m); if (!a) return false;
    return accept.some(raw => { const b = norm(raw, m); if (a === b) return true; if (keep) return false;
      if (lang === "fr") return stripFr(a) === stripFr(b);
      return stripDe(a) === stripDe(b); });
  });
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function fillOpts(good, cands, pool, n = 4){
  const out = [good], seen = new Set([norm(good)]);
  const add = v => { if (out.length >= n || !v) return; const k = norm(v); if (seen.has(k)) return; seen.add(k); out.push(v); };
  cands.forEach(add); shuffle(pool).forEach(add);
  return shuffle(out);
}
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");
function dateLabel(ts){ const d = new Date(ts), p = x => String(x).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} · ${p(d.getHours())}h${p(d.getMinutes())}`; }
function dayOf(t){ const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
const unUml = s => s.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u");

/* ---------- cartes : chaque item donne 1 à 3 cartes (aspects) ----------
   carte = { k, dk, aspect, tag, label, mcqOnly, mcq:{consigne, word, hint, options, answer}, typ:{consigne, word, hint, accept, answer, lang, keep}, expl } */
const TAG_LABEL = { sens:"sens de l'adjectif", allemand:"vocabulaire", komparativ:"comparatif", superlativ:"superlatif", phrase:"phrase à compléter", regle:"règle", article:"der / die / das", pluriel:"pluriel" };
function cardKey(dk, label, aspect){ return dk + "|" + label + "|" + aspect; }
function itemLabel(it){ return it.s ? it.s + (it.h ? " (" + it.h + ")" : "") : it.q || it.de; }
function cardsOf(d, it){
  const lab = itemLabel(it), out = [], src = it.src || d.src;
  const mk = (aspect, tag, o) => out.push({ k:cardKey(d.key, lab, aspect), dk:d.key, aspect, tag, label:lab, ...o });
  if (it.q){
    mk("regle", "regle", { mcqOnly:true, mcq:{ consigne:"Choisis la bonne réponse.", word:it.q, hint:"", options:shuffle(it.o.slice()), answer:it.o[0] }, typ:null, expl:it.expl + " — " + src });
  } else if (it.s){
    const ans = it.a || it.acc[0];
    const why = it.why ? " " + it.why[0].toUpperCase() + it.why.slice(1) : "";
    const note = it.note ? " Note : " + it.note : "";
    const full = it.s.replace("___", ans.includes(" / ") ? "[" + ans + "]" : ans);
    mk("phrase", "phrase", { mcqOnly:false,
      mcq:{ consigne:"Complète la phrase.", word:it.s, hint:it.h, options:shuffle(it.o.slice()), answer:it.o[0] },
      typ:{ consigne:"Complète la phrase (écris ce qui manque).", word:it.s, hint:it.h, accept:it.acc.slice(), answer:ans, lang:"de", keep:true },
      expl:`${full}${why}${note} — ${src}` });
  } else if (it.komp && it.sup){
    const others = d.items;
    const base = `${it.de} – ${it.komp} – ${it.sup} = ${it.fr[0]}`;
    const tail = (it.extra ? " (adjectif en plus, pas dans le voc)" : "") + (it.n2 ? " (ligne N2)" : "") + " — " + L + ".";
    mk("sens", "sens", { mcqOnly:false,
      mcq:{ consigne:"Choisis la traduction en français.", word:it.de, hint:"", options:fillOpts(it.fr[0], [], others.map(x => x.fr[0])), answer:it.fr[0] },
      typ:{ consigne:"Écris l'adjectif en allemand.", word:it.fr[0], hint:"", accept:[it.de], answer:it.de, lang:"de", keep:true },
      expl:base + tail });
    const kAcc = [it.komp, ...(it.kAlt || [])];
    mk("komp", "komparativ", { mcqOnly:false,
      mcq:{ consigne:"Choisis le comparatif.", word:it.de, hint:it.fr[0], options:fillOpts(it.komp, [it.de + "er", unUml(it.komp), it.sup, "mehr " + it.de], others.map(x => x.komp)), answer:it.komp },
      typ:{ consigne:"Écris le comparatif (Komparativ).", word:it.de, hint:it.fr[0], accept:kAcc, answer:it.komp, lang:"de", keep:true },
      expl:base + (it.kNote ? " (" + it.kNote + ")" : "") + tail });
    const sAcc = [it.sup, ...(it.sAlt || [])];
    mk("sup", "superlativ", { mcqOnly:false,
      mcq:{ consigne:"Choisis le superlatif avec « am ».", word:it.de, hint:it.fr[0], options:fillOpts(it.sup, ["am " + it.de + "sten", "am " + it.de + "esten", unUml(it.sup), it.komp], others.map(x => x.sup)), answer:it.sup },
      typ:{ consigne:"Écris le superlatif avec « am » (Superlativ).", word:it.de, hint:it.fr[0], accept:sAcc, answer:it.sup, lang:"de", keep:true },
      expl:base + (it.sNote ? " (" + it.sNote + ")" : "") + tail });
  } else if (it.komp){
    const kAcc = [it.komp, ...(it.kAlt || [])];
    mk("komp", "komparativ", { mcqOnly:false,
      mcq:{ consigne:"Choisis le comparatif.", word:it.de, hint:"", options:fillOpts(it.komp, it.wrong, d.items.map(x => x.komp)), answer:it.komp },
      typ:{ consigne:"Écris le comparatif (Komparativ).", word:it.de, hint:"", accept:kAcc, answer:it.komp, lang:"de", keep:true },
      expl:`${it.de} > ${it.komp}${it.kNote ? " (" + it.kNote + ")" : ""} — ${src}.` });
  } else {
    const voc = d.items.filter(x => x.de && !x.komp);
    const base = `${it.de}${it.pl ? " (pluriel : " + it.pl + ")" : ""} = ${it.fr[0]} — ${src}.`;
    mk("sens", "allemand", { mcqOnly:false,
      mcq:{ consigne:"Choisis la traduction en français.", word:it.de, hint:"", options:fillOpts(it.fr[0], [], voc.map(x => x.fr[0])), answer:it.fr[0] },
      typ:{ consigne:it.art ? "Écris en allemand, avec l'article." : "Écris en allemand.", word:it.fr[0], hint:"", accept:[it.de, ...(it.alt || [])], answer:it.de, lang:"de", keep:!!it.art },
      expl:base });
    if (it.art) mk("art", "article", { mcqOnly:true,
      mcq:{ consigne:"Choisis l'article : der, die ou das.", word:stripDe(it.de), hint:it.fr[0], options:["der","die","das"], answer:it.art }, typ:null, expl:base });
    if (it.pl) mk("pl", "pluriel", { mcqOnly:false,
      mcq:{ consigne:"Choisis le pluriel.", word:it.de, hint:it.fr[0], options:shuffle(it.plo.slice()), answer:it.pl },
      typ:{ consigne:"Écris le pluriel, avec l'article.", word:it.de, hint:it.fr[0], accept:[it.pl], answer:it.pl, lang:"de", keep:true },
      expl:base });
  }
  return out;
}
function allCards(){ const out = []; DECKS.forEach(d => d.items.forEach(it => cardsOf(d, it).forEach(c => { c.levels = [0,1,2]; out.push(c); }))); return out; }
const CARDS = allCards();
const CARD = Object.fromEntries(CARDS.map(c => [c.k, c]));
function deckCards(dk){ return CARDS.filter(c => c.dk === dk); }

/* ---------- fabrication du test ---------- */
const ASPECT_ORDER = ["regle","sens","komp","sup","phrase","art","pl"];
function buildTest(deckKeys, difficulty, limit){
  const sel = DECKS.filter(d => deckKeys.includes(d.key));
  /* cartes fraîches (les options se mélangent à chaque test) */
  let pick = [];
  sel.forEach(d => d.items.forEach(it => cardsOf(d, it).forEach(c => pick.push(c))));
  if (limit && limit < pick.length){
    /* répartition équilibrée : une carte de chaque paquet à tour de rôle */
    const by = sel.map(d => shuffle(pick.filter(c => c.dk === d.key)));
    const chosen = []; let i = 0;
    while (chosen.length < limit){ const b = by[i % by.length]; if (b.length) chosen.push(b.shift()); i++; if (by.every(x => !x.length)) break; }
    pick = chosen;
  }
  const qs = []; let num = 0, ex = 0;
  sel.forEach(d => {
    const mine = shuffle(pick.filter(c => c.dk === d.key));
    const groups = {};
    mine.forEach(c => {
      const useMcq = c.mcqOnly || !c.typ || difficulty === "easy" || (difficulty === "normal" && Math.random() < 0.5);
      const g = c.aspect + "|" + (useMcq ? "m" : "t");
      (groups[g] = groups[g] || []).push({ c, useMcq });
    });
    const keys = Object.keys(groups).sort((a, b) => ASPECT_ORDER.indexOf(a.split("|")[0]) - ASPECT_ORDER.indexOf(b.split("|")[0]) || (a < b ? -1 : 1));
    keys.forEach(g => {
      ex++;
      groups[g].forEach(({ c, useMcq }) => {
        num++;
        const part = useMcq ? c.mcq : c.typ;
        const q = { id:"q"+num, num, ex, exTitle:d.title, deckKey:d.key, aspect:c.aspect, card:c.k, tag:c.tag,
          type: useMcq ? "mcq" : "type", consigne:part.consigne, word:part.word, hint:part.hint || "",
          answer:part.answer, expl:c.expl, lang: useMcq ? "de" : part.lang, keep: useMcq ? true : part.keep };
        if (useMcq) q.options = part.options.slice(); else q.accept = part.accept.slice();
        q.prompt = `${q.consigne} « ${q.word} »${q.hint ? " (" + q.hint + ")" : ""}`;
        qs.push(q);
      });
    });
  });
  return qs;
}

      if (window.claude && window.claude.use){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);

      }
    } catch(e){}
    try { localStorage.setItem(QUIZ_ID + "-probe","1"); localStorage.removeItem(QUIZ_ID + "-probe"); this.mode = "local"; } catch(e){ this.mode = "memory"; }
  },
  async list(){
    if (this.mode === "db"){ const snap = await this.col.limit(1000).get(); return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean); }
    if (this.mode === "local"){ const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean); }

  },

    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + att.id).set(att); return; }
    if (this.mode === "local"){ localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att)); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }

  async getDoc(id){
    if (this.mode === "db"){ const sn = await this.col.doc(id).get(); return sn && sn.exists ? sn.data() : null; }

  frozen:null, paperMsg:"", paperCopy:"",

const deckLabel = keys => keys.length === DECKS.length ? "Toute la séquence" : keys.map(k => DECK[k].title).join(" + ");

function rootTests(){ return S.attempts.filter(a => !a.rattrapage).sort((a, b) => a.date - b.date); }
function parentOf(a){
  if (a.parent) return a.parent;
  const prev = S.attempts.filter(x => !x.rattrapage && x.date < a.date && dayOf(x.date) === dayOf(a.date)).sort((x, y) => y.date - x.date)[0];
  return prev ? prev.id : null;
}
function isExam(a){ return a.mode === MODES.exam.label; }
function chapOfQ(x){ return x.question ? x.question.deckKey : null; }
function inChap(ch){ return x => ch === "all" || chapOfQ(x) === ch; }
function qCardKey(x){ return x.question ? x.question.card : ("p|" + x.prompt); }
function testScore(root, ch){
  const qs = root.questions.filter(inChap(ch)), score = qs.filter(x => x.correct).length, total = qs.length;
  if (!total) return null;
  const wrong = new Set(qs.filter(x => !x.correct).map(qCardKey)), fixed = new Set(), steps = [];
  S.attempts.filter(a => a.rattrapage && parentOf(a) === root.id).sort((a, b) => a.date - b.date).forEach(r => {
    const rq = r.questions.filter(inChap(ch)); if (!rq.length) return;
    rq.forEach(x => { if (x.correct && wrong.has(qCardKey(x))) fixed.add(qCardKey(x)); });
    const sc = score + fixed.size;
    steps.push({ score:sc, note:noteFrom(sc / total), asked:rq.length, ok:rq.filter(x => x.correct).length });
  });
  return { score, total, note:noteFrom(score / total), typos:qs.filter(x => x.typo).length, steps };
}
function histByCard(exceptId){
  const h = {};
  rootTests().filter(a => a.id !== exceptId).forEach(a => {
    const lvl = LVL_OF_LABEL[a.difficulty]; if (lvl == null) return;
    a.questions.forEach(x => { if (!x.question) return; const k = qCardKey(x); (h[k] = h[k] || []).push({ ok:x.correct, lvl, day:dayOf(a.date), date:a.date }); });
  });
  Object.values(h).forEach(arr => arr.sort((a, b) => a.date - b.date));
  return h;
}
function ringState(entries, ringLvl){
  const es = entries.filter(e => e.lvl >= ringLvl);
  if (!es.length) return "new";
  return es[es.length - 1].ok ? "ok" : "bad";
}
function acquiredOuter(entries){
  const hd = entries.filter(e => e.lvl === 2);
  if (!hd.length || !hd[hd.length - 1].ok) return false;
  const days = new Set(); for (let i = hd.length - 1; i >= 0 && hd[i].ok; i--) days.add(hd[i].day);
  return days.size >= 2;
}
function ringSummary(cards, ringLvl, hist){
  const sub = cards.filter(c => c.levels.includes(ringLvl));
  const c = { ok:0, mid:0, bad:0, new:0 }, total = sub.length;
  sub.forEach(card => {
    const st = ringState(hist[card.k] || [], ringLvl);
    if (st === "new") c.new++;
    else if (st === "bad") c.bad++;
    else { if (ringLvl === 2 && acquiredOuter(hist[card.k] || [])) c.ok++; else c.mid++; }
  });
  const right = c.ok + c.mid, pct = total ? Math.round(right / total * 100) : 0;

  const state = c.new === total ? "start" : (ringLvl === 2 && noteAcq >= 5) ? "ok" : note >= 5 ? "win" : note >= 4 ? "mid" : "low";
  return { ...c, total, right, pct, note, state, ringLvl };
}
function paquetRings(dk, hist){ const cards = deckCards(dk); return [0,1,2].map(l => ringSummary(cards, l, hist)); }
const P_LABEL = { start:"à commencer", low:"à revoir", mid:"en route", win:"réussi", ok:"OK ✓" };
const LVL_LABEL = ["à revoir", "en route", "réussi"];
function lvlOf(sum){ return !sum || sum.state === "start" ? -1 : sum.note >= 5 ? 2 : sum.note >= 4 ? 1 : 0; }
function pColor(state){ return state === "ok" ? "var(--p-okdark)" : state === "win" ? "var(--p-ok)" : state === "mid" ? "var(--p-mid)" : "var(--p-low)"; }
function ringArc(sum, r, w){
  if (sum.state === "start") return `<circle r="${r}" fill="none" stroke-width="${w}" stroke-dasharray="3 3" style="stroke:var(--rule)"/>`;
  const C = 2 * Math.PI * r, c = pColor(sum.state);
  return `<circle r="${r}" fill="none" stroke-width="${w}" stroke="${c}" stroke-opacity=".22"/>` +
    (sum.right ? `<circle r="${r}" fill="none" stroke-width="${w}" stroke="${c}" stroke-dasharray="${(C * sum.right / sum.total).toFixed(2)} 999" transform="rotate(-90)"/>` : "");
}
function ring3Svg(rings, size, centerText){
  const h = size / 2, w = 6, radii = [h - 24, h - 16, h - 8];
  const body = rings.map((s, i) => ringArc(s, radii[i], w)).join("");
  const fs = centerText.length >= 5 ? 11.5 : 13.5;
  return `<svg class="pring" width="${size}" height="${size}" viewBox="${-h} ${-h} ${size} ${size}" aria-hidden="true">${body}<text x="0" y="${(fs/3).toFixed(1)}" text-anchor="middle" class="pring-t" style="font-size:${fs}px">${centerText}</text></svg>`;
}
function topRing(rings){ let t = -1; rings.forEach((s, i) => { if (s.state !== "start") t = i; }); return t; }
function ring1Svg(sum, size, centerText){

}
function trendOf(dk, hist, lvl = 2){
  const tests = rootTests().filter(a => a.questions.some(inChap(dk))); if (tests.length < 2) return "";
  const now = paquetRings(dk, hist)[lvl];
  const prev = ringSummary(deckCards(dk), lvl, histByCard(tests[tests.length - 1].id));
  if (prev.state === "start") return "";

}
function dropOf(dk, hist, lvl = 2){
  const tests = rootTests().filter(a => a.questions.some(inChap(dk))); if (tests.length < 2) return null;
  const last = tests[tests.length - 1];
  const now = paquetRings(dk, hist)[lvl], prevHist = histByCard(last.id), prev = ringSummary(deckCards(dk), lvl, prevHist);
  if (lvlOf(now) < 0 || lvlOf(prev) <= lvlOf(now)) return null;
  const lost = deckCards(dk).filter(c => { const ps = ringState(prevHist[c.k] || [], lvl), ns = ringState(hist[c.k] || [], lvl); return ps === "ok" && ns === "bad"; });
  return { prev, lost, date:tests[tests.length - 2].date };
}
function pastille3(dk){
  if (!S.loaded) return "";
  const hist = histByCard(), rings = paquetRings(dk, hist), top = topRing(rings);
  const ref = top < 0 ? rings[2] : rings[top];
  const dr = top < 0 ? null : dropOf(dk, hist, top);
  const NIV = ["Échauffement", "Entraînement", "Niveau épreuve"];
  const label = top < 0 ? "Pas encore testé" : `${NIV[top]} : ${ref.right} sur ${ref.total}, ${P_LABEL[ref.state]}${dr ? ", avant : " + LVL_LABEL[lvlOf(dr.prev)] : ""}`;
  return `<div class="deck-pst" aria-label="${label}">${ring3Svg(rings, 84, top < 0 ? "" : ref.right + "/" + ref.total)}<span class="pst-l pst-${ref.state}">${P_LABEL[ref.state]}${top < 0 ? "" : trendOf(dk, hist, top)}</span>${dr ? `<span class="pst-notes">avant : ${LVL_LABEL[lvlOf(dr.prev)]}</span>` : ""}</div>`;
}
function globalPastille(){
  if (!S.loaded || !rootTests().length) return "";
  const hist = histByCard(), sum = ringSummary(CARDS, 2, hist);
  const nOk = DECKS.filter(d => paquetRings(d.key, hist)[2].state === "ok").length;

  return `<div class="pglob">${ring1Svg(sum, 66, sum.state === "start" ? "—" : sum.pct + " %")}<div class="pglob-x"><b>Avancement général (niveau épreuve) · ${P_LABEL[sum.state]}</b><span>${sum.right} cartes justes au niveau épreuve sur ${sum.total}, dont ${sum.ok} acquises · ${sum.bad} à revoir · ${sum.new} pas encore posées</span><span>${nOk} paquet${nOk>1?"s":""} OK · ${nWin} réussi${nWin>1?"s":""}, à confirmer · sur ${DECKS.length}</span></div></div>
  <details class="plegend"><summary>Comment se lisent les 3 anneaux ?</summary>
  <p>Chaque paquet a <b>trois anneaux</b> : à l'intérieur l'Échauffement, au milieu l'Entraînement, à l'extérieur le Niveau épreuve. Une carte réussie au niveau épreuve remplit aussi les anneaux plus faciles.</p>
  <p>Dans chaque anneau, la partie en couleur pleine, ce sont tes cartes justes ; la partie claire, celles qu'il te reste. Un anneau gris en pointillé n'a pas encore été testé. Au centre : tes cartes justes sur le total, au niveau le plus difficile que tu as déjà fait.</p>
  <p>Couleur de chaque anneau selon la note : <b>rouge</b> à revoir (moins de 4), <b>orange</b> en route (4–4,5), <b>vert</b> réussi (5 et plus), <b>vert foncé</b> OK ✓ (réussi au niveau épreuve et confirmé un autre jour).</p>

}
function paqBad(dk, hist){ return deckCards(dk).filter(c => ringState((hist || histByCard())[c.k] || [], 2) === "bad"); }
function redoCards(v){
  let keys; const hist = histByCard();
  if (v === "resist") keys = new Set(resistant().map(x => x.k));
  else if (v.startsWith("lost:")){ const dk = v.slice(5), dr = dropOf(dk, hist); keys = new Set(dr ? dr.lost.map(c => c.k) : []); }

function resistant(){

  if (store.mode === "db") draftChain = draftChain.then(() => store.setDoc(DRAFT_ID, obj)).then(() => { S.draftErr = false; }, () => { S.draftErr = !okLocal; draftErrShow(); });
  else if (store.mode === "memory"){ store.setDoc(DRAFT_ID, obj); S.draftErr = !okLocal; draftErrShow(); }
}
function draftErrShow(){ const m = document.getElementById("draft-err"); if (m) m.hidden = !S.draftErr; }
function draftSave(){
  const Q = S.quiz; if (!Q || Q.done) return;
  const d = { v:2, questions:Q.questions, i:Q.i, answers:Q.detail.map(x => { const o = { u:x.user, c:x.correct }; if (x.typo) o.t = 1; if (x.liveFixed){ o.lf = 1; o.ls = x.liveSnap; } return o; }),
    picked:Q.checked ? Q.picked : null, typed:Q.checked ? Q.typed : "", checked:Q.checked, ok:Q.ok, liveFixed:!!Q.liveFixed, errSnap:Q.errSnap || "",
    label:Q.label, start:Q.start || Date.now(), saved:Date.now(), rattrapage:!!S.rattrapage, rattrLabel:S.rattrLabel || "", rattrParent:S.rattrParent || null,
    selected:S.selected, difficulty:S.difficulty, mode:S.mode };
  S.draft = d; draftWrite(d);
}
function draftDetail(d){
  return (d.answers || []).map((x, k) => { const q = d.questions[k];
    return { num:q.num, ex:q.ex, ref:q.exTitle, prompt:q.prompt, user:x.u, answer:q.answer, correct:x.c, ...(x.t ? { typo:true } : {}), liveFixed:!!x.lf, liveSnap:x.ls || "", expl:q.expl, tag:q.tag, question:q }; });
}
const draftN = d => (d.answers || []).length;
const draftOk = d => !!(d && d.questions && d.questions.length && d.answers);
function draftPick(a, b){ const ta = a ? a.saved || 0 : -1, tb = b ? b.saved || 0 : -1; const w = ta >= tb ? a : b; return draftOk(w) ? w : null; }

/* ---------- correction en direct ---------- */
function lvUnit(c){ return /[\p{L}\p{N}]/u.test(c) ? dxN(c) : ""; }
function lvCands(q){
  const out = new Set();
  (q.accept || [q.answer]).forEach(a => {
    [a, a.replace(/\s*\([^)]*\)\s*/g, " "), a.replace(/[()]/g, "")].forEach(v => {
      out.add(v);
      if (q.lang === "fr" && !q.keep) out.add(v.trim().replace(/^(le |la |les |l'|l’|un |une |des |du |de la |d'|d’)/i, ""));
      if (q.lang === "de" && !q.keep) out.add(v.trim().replace(/^(der |die |das )/i, ""));
    });
  });
  return [...out].map(v => [...v].map(lvUnit).join("")).filter(Boolean);
}
function lvCheck(typed, cands){
  const chars = [...typed], T = [];
  chars.forEach((c, i) => { for (const u of lvUnit(c)) T.push({ ch:u, i }); });
  const t = T.map(x => x.ch), m = t.length;
  let best = null;
  cands.forEach(cs => {
    const c = [...cs], n = c.length;
    const D = Array.from({ length:m+1 }, () => new Array(n+1).fill(0));
    for (let i = 0; i <= m; i++) D[i][0] = i;
    for (let j = 0; j <= n; j++) D[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) D[i][j] = Math.min(D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + (t[i-1] === c[j-1] ? 0 : 1));
    let bj = 0; for (let j = 0; j <= n; j++) if (D[m][j] < D[m][bj]) bj = j;
    if (!best || D[m][bj] < best.cost) best = { cost:D[m][bj], D, c, bj };
  });
  const bad = new Set(), miss = new Set();
  if (best && best.cost > 0){
    const { D, c } = best; let i = m, j = best.bj;
    while (i > 0 && j > 0){
      if (D[i][j] === D[i-1][j-1] + (t[i-1] === c[j-1] ? 0 : 1)){ if (t[i-1] !== c[j-1]) bad.add(T[i-1].i); i--; j--; }
      else if (D[i][j] === D[i-1][j] + 1){ bad.add(T[i-1].i); i--; }
      else { miss.add(i < m ? T[i].i : -1); j--; }
    }
    while (i > 0){ bad.add(T[i-1].i); i--; }
    while (j > 0){ miss.add(m ? T[0].i : -1); j--; }
  }
  return { bad, miss, n: bad.size + miss.size };
}
function lvHtml(typed, r){
  let h = "";
  [...typed].forEach((c, i) => {
    if (r.miss.has(i)) h += dxMiss;
    h += r.bad.has(i) ? `<span class="lv-bad">${esc(c)}</span>` : esc(c);
  });
  if (r.miss.has(-1)) h += dxMiss;
  return h || `<span class="lv-empty">Tes lettres s'affichent ici</span>`;
}
function updateLive(){
  const Q = S.quiz; if (!Q || S.mode !== "live") return;
  const q = Q.questions[Q.i]; if (!q || q.type !== "type" || Q.checked) return;
  Q.lvcache = Q.lvcache || {};
  const cands = Q.lvcache[Q.i] || (Q.lvcache[Q.i] = lvCands(q));
  const r = lvCheck(Q.typed, cands);
  if (r.n > 0){ Q.hadErr = true; Q.errSnap = Q.typed; }
  const box = document.getElementById("live-box"); if (box) box.innerHTML = lvHtml(Q.typed, r);
  const st = document.getElementById("live-state");
  if (st) st.textContent = r.n ? `✗ ${r.n} ${r.n > 1 ? "lettres à corriger" : "lettre à corriger"}`
    : Q.hadErr ? "✓ Corrigé — ce mot ne comptera pas dans la note" : Q.typed.trim() ? "✓ Pour l'instant, c'est juste" : "";
}

  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.quitAsk = false; S.screen = "quiz";
  draftSave(); render(); window.scrollTo(0,0);
}
function viewQuiz(){
  if (S.quitAsk) return quitView();
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode !== "exam";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>${draftErrLine()}
  <div class="badges"><span class="num">N° ${q.num}</span><span class="chip ${q.tag}">${TAG_LABEL[q.tag]}</span><span class="ref">Exercice ${q.ex} · ${esc(q.exTitle)}</span></div>
  <p class="consigne">${esc(q.consigne)}</p><p class="qword">${esc(q.word)}</p>${q.hint ? `<p class="qhint">${esc(q.hint)}</p>` : ""}`;
  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice";
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="${q.lang === "de" ? "Deine Antwort…" : "Ta réponse…"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
    if (q.lang === "de" && !Q.checked && !Q.finishing) h += `<div class="umlauts" aria-label="Lettres avec Umlaut">${["ä","ö","ü","Ä","Ö","Ü"].map(u => `<button data-act="uml" data-v="${u}" aria-label="Ajouter ${u}">${u}</button>`).join("")}</div>`;
    if (S.mode === "live" && !Q.checked) h += `<div class="live"><p class="live-lab">Ta réponse, lettre par lettre</p><div class="live-box" id="live-box"></div><p class="live-state" id="live-state" aria-live="polite"></p></div>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){

function dxN(c){ return deAcc(String(c).toLowerCase().replace(/ß/g,"ss").normalize("NFC")); }
function dxW(w){ return dxN(w).replace(/[.,!?;:«»"()…]/g,""); }
function lev(a, b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function lcsOps(A, B, eq){
  const m=A.length, n=B.length, Lt=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) Lt[i][j]=eq(A[i],B[j])?Lt[i+1][j+1]+1:Math.max(Lt[i+1][j],Lt[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<m&&j<n){ if(eq(A[i],B[j])){ ops.push({t:"=",a:A[i],b:B[j]}); i++; j++; } else if(Lt[i+1][j]>=Lt[i][j+1]) ops.push({t:"-",a:A[i++]}); else ops.push({t:"+",b:B[j++]}); }
  while(i<m) ops.push({t:"-",a:A[i++]}); while(j<n) ops.push({t:"+",b:B[j++]});
  return ops;
}
function dxBlocks(ops){ const out=[]; let cur=null; ops.forEach(o=>{ if(o.t==="="){ cur=null; out.push(o); } else { if(!cur){ cur={t:"x",del:[],ins:[]}; out.push(cur); } (o.t==="-"?cur.del:cur.ins).push(o.t==="-"?o.a:o.b); } }); return out; }
const dxBad = t => `<del class="dx-bad">${esc(t)}</del>`;
const dxGood = t => `<ins class="dx-good">${esc(t)}</ins>`;
const dxMiss = `<span class="dx-miss" aria-label="il manque quelque chose ici">?</span>`;
function dxChars(u, r){
  let U="", R="";
  dxBlocks(lcsOps([...u],[...r],(x,y)=>dxN(x)===dxN(y))).forEach(b=>{
    if(b.t==="="){ U+=esc(b.a); R+=esc(b.b); return; }
    U += b.del.length ? dxBad(b.del.join("")) : dxMiss;
    if(b.ins.length) R += dxGood(b.ins.join(""));
  });
  return { U, R };
}
function dxDiff(user, right){
  const A=user.trim().split(/\s+/).filter(Boolean), B=right.trim().split(/\s+/).filter(Boolean);
  const U=[], R=[]; let common=0;
  dxBlocks(lcsOps(A,B,(x,y)=>dxW(x)===dxW(y))).forEach(b=>{
    if(b.t==="="){ common++; U.push(esc(b.a)); R.push(esc(b.b)); return; }
    const k=Math.min(b.del.length,b.ins.length);
    for(let i=0;i<k;i++){
      const x=b.del[i], y=b.ins[i], lim=Math.max(1, Math.floor(Math.max(dxW(x).length,dxW(y).length)*0.4));
      if(lev(dxW(x),dxW(y))<=lim){ const c=dxChars(x,y); U.push(c.U); R.push(c.R); common++; }
      else { U.push(dxBad(x)); R.push(dxGood(y)); }
    }
    b.del.slice(k).forEach(x=>U.push(dxBad(x)));
    if(b.ins.length>k){ U.push(dxMiss); b.ins.slice(k).forEach(y=>R.push(dxGood(y))); }
  });
  return { U:U.join(" "), R:R.join(" "), other: common===0 };
}
function dxLegend(){ return `<p class="dx-legend"><span>${dxBad("barré")} = ce qui était faux</span><span>${dxGood("souligné")} = ce qu'il fallait écrire</span><span>${dxMiss} = il manque quelque chose</span></p>`; }
function errCard(q){
  const Q = q.question || {}, isMcq = Q.type === "mcq", user = ((q.liveFixed && q.liveSnap) ? q.liveSnap : (q.user || "")).trim();
  let right = q.answer, U, R, note = "";
  if (!user){ U = `<span class="dx-none">rien</span>`; R = dxGood(right); }
  else if (isMcq){ U = dxBad(user); R = dxGood(right); }
  else {
    const cands = (Q.accept && Q.accept.length ? Q.accept : [q.answer]).filter(Boolean);
    right = cands.reduce((best, c) => lev(dxN(user), dxN(c)) < lev(dxN(user), dxN(best)) ? c : best, cands[0]);
    const d = dxDiff(user, right); U = d.U; R = d.R;
    if (d.other) note = "Ce n'est pas le même mot : apprends-le en entier.";
  }
  if (q.liveFixed) note = "Corrigé en direct : juste à la fin, mais avec de l'aide. Ce mot ne compte pas dans la note.";
  return `<div class="revcard"><p class="rev-q">N° ${q.num} · ${esc(q.prompt)}</p>
    <p class="dx-line"><span class="dx-lab">✗ ${isMcq ? "Tu as choisi" : q.liveFixed ? "Tu avais écrit" : "Tu as écrit"}</span><span class="dx-ans">${U}</span></p>
    <p class="dx-line"><span class="dx-lab">✓ Il fallait</span><span class="dx-ans">${R}</span></p>
    ${note ? `<p class="dx-note">${note}</p>` : ""}${right !== q.answer ? `<p class="fine">Réponse complète : ${esc(q.answer)}</p>` : ""}
    <p class="rev-x">${esc(q.expl)}</p></div>`;
}

  const meta = `${deckLabel(S.selected)} · ${DIFFICULTIES[S.difficulty].label} · ${qs.length} questions`;
  const line = q => `<b>${q.num}.</b> ${esc(q.word)}${q.hint ? ` <span class="hint">(${esc(q.hint)})</span>` : ""}`;
  const srcOf = q => esc((q.expl.split(" — ").pop() || "").replace(/\.$/,""));
  const sheet = exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2><p class="cons">${esc(e.consigne)}</p>${e.qs.map(q => q.type === "mcq"
    ? `<div class="q">${line(q)}<div class="opts">${q.options.map(o => `<span>☐ ${esc(o)}</span>`).join("")}</div></div>`
    : `<div class="q">${line(q)}<div class="qline"></div></div>`).join("")}</section>`).join("");
  const key = `<h1>Corrigé</h1><p class="meta">${esc(meta)}</p>` + exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2>${e.qs.map(q => `<div class="k"><b>${q.num}.</b> ${esc(q.word)} → <b>${esc(q.answer)}</b> <span class="hint">(${srcOf(q)})</span></div>`).join("")}</section>`).join("");
  const head = `<h1>Allemand — Komparativ und Superlativ</h1><p class="meta">Prénom : Livio · test du ${DUE.long} · ${esc(meta)}</p><p class="meta">Date : ____________ &nbsp; Note : ______ / 6</p>`;
  const body = part === "ex" ? head + sheet : part === "key" ? key : head + sheet + `<div class="pb"></div>` + key;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allemand Komparativ — ${DUE.short}</title><style>
@page{size:A4 portrait;margin:12mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;max-width:186mm;padding:10px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 2px;border-bottom:1px solid #999}.meta{margin:2px 0;font-size:13px}.cons{font-style:italic;margin:2px 0 6px;font-size:13px}
.ex{break-inside:avoid}.q{margin:8px 0;font-size:14px;break-inside:avoid}.hint{color:#555;font-size:12px}.opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 0 18px}.qline{border-bottom:1px solid #444;height:22px;margin:6px 0 0 18px}
.k{font-size:13.5px;margin:3px 0}.pb{break-before:page}.print{position:fixed;top:10px;right:10px;padding:8px 14px;font-size:14px}@media print{.print{display:none}}
</style></head><body><button class="print" onclick="window.print()">Imprimer</button>${body}</body></html>`;
}
async function savePaper(part){
  const qs = S.frozen; S.paperMsg = ""; S.paperCopy = "";
  const names = { ex:"exercices", both:"exercices-et-corrige", key:"corrige" };
  const filename = `${DUE.iso}_allemand-komparativ-livio-${names[part]}.html`;
  try {
    if (!HAS_CLAUDE){
      const url = URL.createObjectURL(new Blob([paperHtml(qs, part)], { type:"text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.paperMsg = "Fichier téléchargé : ouvre-le, puis touche « Imprimer »."; render(); return;
    }
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code:"unavailable" };
    await dl.save({ filename, data:paperHtml(qs, part) });
  } catch(e){
    if (e && e.code === "declined"){ S.paperMsg = "Téléchargement annulé."; }
    else {
      S.paperMsg = "Le téléchargement ne passe pas ici. Copie le texte ci-dessous et colle-le dans le chat : je t'envoie la feuille de ce test exact.";
      S.paperCopy = "#PDF-ALLEMAND-KOMPARATIV\n" + qs.map(q => `${q.num}. [Ex ${q.ex} ${q.exTitle} — ${q.consigne}] ${q.word}${q.hint ? " (" + q.hint + ")" : ""}${q.options ? " | " + q.options.join(" / ") : ""} → ${q.answer}`).join("\n");
    }
  }
  render();
}

/* ---------- chargement ---------- */
async function loadHistory(){
  try {
    await store.init();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  try { let dd = null; try { dd = await store.getDoc(DRAFT_ID); } catch(e){} const dl = draftLocalGet(); const d = draftPick(dd, dl); if (!S.quiz) S.draft = d; } catch(e){}
  S.loaded = true;
  render();
}

/* ---------- événements ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  const Q = S.quiz;
  switch(act){
    case "nav": S.draftBlock = false; S.screen = v; S.scores.confirm = false; render(); window.scrollTo(0,0); break;
    case "fiche": S.ficheOpen = S.ficheOpen === +v ? -1 : +v; render(); break;
    case "toggle": S.selected = S.selected.includes(v) ? S.selected.filter(x => x !== v) : DECKS.map(d => d.key).filter(k => k === v || S.selected.includes(k)); S.frozen = null; S.cards.order = []; render(); break;
    case "allDecks": S.selected = S.selected.length === DECKS.length ? [] : DECKS.map(d => d.key); S.frozen = null; S.cards.order = []; render(); break;
    case "toCards": S.screen = "cards"; render(); break;
    case "flip": S.cards.flip = !S.cards.flip; render(); break;
    case "card": { const n = cardList().length; S.cards.flip = false; S.cards.pos = (S.cards.pos + (+v) + n) % n; render(); break; }
    case "cardShuffle": S.cards.order = shuffle(S.cards.order); S.cards.pos = 0; S.cards.flip = false; render(); break;
    case "count": S.count = +v; S.frozen = null; render(); break;
    case "diff": S.difficulty = v; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; render(); break;
    case "mode": S.mode = v; render(); break;
    case "freeze": S.frozen = buildTest(S.selected, S.difficulty, S.count); render(); break;
    case "unfreeze": S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; render(); break;
    case "paper": savePaper(v); break;
    case "start": S.rattrParent = null; startQuiz(S.frozen || buildTest(S.selected, S.difficulty, S.count), false); break;
    case "quit": S.quitAsk = true; render(); break;
    case "quitKeep": draftSave(); S.quiz = null; S.quitAsk = false; S.screen = "home"; render(); window.scrollTo(0,0); break;
    case "quitDrop": draftClear(); S.quiz = null; S.quitAsk = false; S.screen = "home"; render(); window.scrollTo(0,0); break;
    case "quitNo": S.quitAsk = false; render(); break;
    case "draftResume": draftResume(); break;
    case "draftAsk": S.draftAsk = true; render(); break;
    case "draftNo": S.draftAsk = false; render(); break;
    case "draftDrop": draftClear(); render(); break;
    case "uml": { const inp = document.getElementById("answer-input"); if (!inp || inp.disabled) return; const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s; inp.value = inp.value.slice(0, s) + v + inp.value.slice(en); Q.typed = inp.value; inp.focus(); inp.setSelectionRange(s + 1, s + 1); const b = document.getElementById("validate-btn"); if (b) b.disabled = !Q.typed.trim(); updateLive(); break; }
    case "pick": { if (Q.checked || Q.done) return; const q = Q.questions[Q.i]; Q.picked = q.options[+v]; if (S.mode === "train" || S.mode === "live") validate(Q.picked); else render(); break; }
    case "validate": { const q = Q.questions[Q.i]; if (q.type === "type"){ const inp = document.getElementById("answer-input"); Q.typed = inp ? inp.value : Q.typed; if (Q.typed.trim()) validate(Q.typed); } else if (Q.picked !== null) validate(Q.picked); break; }
    case "dontknow": { const q = Q.questions[Q.i]; if (S.mode !== "exam"){ Q.ok = false; Q.liveFixed = false; Q.checked = true; if (q.type === "mcq") Q.picked = null; draftSave(); render(); } else record("", false); break; }
    case "typo": record(Q.typed, true, true); break;
    case "next": { const q = Q.questions[Q.i]; record(q.type === "mcq" ? Q.picked : Q.typed, Q.ok); break; }
    case "showErr": { const b = bilanState(v); b.errOnly = !errView(v); render(); break; }
    case "analyse": analyse(v); break;
    case "copy": copyFor(v); break;
    case "retryWrong": retryWrong(v); break;
    case "redoBad": redoCards(v); break;
    case "redoCards": redoCards(v); break;
    case "suiviF": S.suivi.f = v; S.suivi.pt = null; render(); break;
    case "suiviPt": S.suivi.pt = S.suivi.pt === v ? null : v; render(); break;
    case "openAttempt": S.scores.open = S.scores.open === v ? null : v; render(); break;
    case "exportToggle": S.scores.exportOpen = !S.scores.exportOpen; render(); break;
    case "clearAsk": S.scores.confirm = true; render(); break;
    case "clearNo": S.scores.confirm = false; render(); break;
    case "clearYes": (async () => {
      const ids = S.attempts.map(a => a.id); S.attempts = []; S.scores = { open:null, exportOpen:false, confirm:false }; render();
      let failed = false; for (const id of ids){ try { await store.remove(id); } catch(e){ failed = true; } }
      if (failed){ S.loadErr = "L'effacement n'a pas pu être enregistré partout. Recharge la page et réessaie."; render(); }
    })(); break;
  }
});
document.addEventListener("change", e => { if (e.target && e.target.id === "suivi-ch"){ S.suivi.ch = e.target.value; S.suivi.pt = null; render(); } });
document.addEventListener("input", e => {
  if (e.target.id === "answer-input" && S.quiz){ S.quiz.typed = e.target.value; const b = document.getElementById("validate-btn"); if (b) b.disabled = !S.quiz.typed.trim(); updateLive(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.classList && e.target.classList.contains("ch-pt")){ e.preventDefault(); const v = e.target.dataset.v; S.suivi.pt = S.suivi.pt === v ? null : v; render(); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });

render();
loadHistory();
</script>

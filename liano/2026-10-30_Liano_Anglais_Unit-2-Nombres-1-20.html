<style>
/* Layout : appli mobile à onglets, thème « compteur de nombres » (bleu électrique + jaune soleil, fond crème-bleuté / bleu nuit). */
:root{
  --bg:#eef3fb; --card:#ffffff; --ink:#15223b; --soft:#5a6b86; --rule:#d6e0f0;

  --shadow:0 2px 10px rgba(21,34,59,.08);

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1830; --card:#182642; --ink:#eaf1ff; --soft:#9fb0cf; --rule:#2a3b5e;
  --accent:#5a92ff; --accent-ink:#06142e; --sun:#ffc74d; --sun-ink:#3a2800;
  --p-okdark:#2fd08a; --p-ok:#36c483; --p-mid:#f2a43a; --p-low:#ef6b5e; --p-lowsoft:#6b2b26;
  --good-bg:#0c3b28; --good-ink:#9df0c6; --bad-bg:#8f1f17; --bad-ink:#ffe9e6;
  --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1830; --card:#182642; --ink:#eaf1ff; --soft:#9fb0cf; --rule:#2a3b5e;
  --accent:#5a92ff; --accent-ink:#06142e; --sun:#ffc74d; --sun-ink:#3a2800;
  --p-okdark:#2fd08a; --p-ok:#36c483; --p-mid:#f2a43a; --p-low:#ef6b5e; --p-lowsoft:#6b2b26;
  --good-bg:#0c3b28; --good-ink:#9df0c6; --bad-bg:#8f1f17; --bad-ink:#ffe9e6;
  --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(120deg,var(--accent),#3f78ff);color:var(--accent-ink);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-left,0px))}

.feedback.no{border-color:var(--bad-bg);background:color-mix(in srgb,var(--bad-bg) 12%,var(--card))}
/* onglets du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--rule);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .tabs-in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:none;background:transparent;color:var(--soft);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px}
nav.tabs button .ic{font-size:21px}
nav.tabs button.on{color:var(--accent)}
nav.tabs[hidden]{display:none}
/* pastilles */

.pastille svg{flex:0 0 auto}
.pst-txt .lvl{font-weight:800;font-family:var(--dsp)}

/* heatmap */
.heat{width:100%;border-collapse:collapse;font-size:12px}
.heat th,.heat td{border:1px solid var(--rule);padding:6px 4px;text-align:center}
.heat td.hc{font-weight:800;color:#fff}
.hc-low{background:var(--p-low)} .hc-mid{background:var(--p-mid)} .hc-ok{background:var(--p-ok)} .hc-none{background:var(--bg);color:var(--soft)}
/* courbe */
.curve-wrap{overflow-x:auto}
/* voir mes erreurs */
.legend{font-size:12px;color:var(--soft);margin-bottom:8px}
.errc{border:1px solid var(--rule);border-radius:12px;padding:11px;margin:9px 0}
.errc .ql{font-weight:800;margin-bottom:5px}
.dx-bad{background:var(--bad-bg);color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:1px;border-radius:4px;padding:1px 4px}
.dx-good{background:var(--good-bg);color:var(--good-ink);text-decoration:underline;text-decoration-thickness:1.5px;border-radius:4px;padding:1px 4px}
.dx-miss{display:inline-grid;place-items:center;min-width:16px;height:18px;background:var(--bad-bg);color:var(--bad-ink);border-radius:4px;font-size:12px;padding:0 2px}
.dx-line{display:flex;gap:7px;align-items:baseline;margin:2px 0}
.dx-line .mk{font-weight:800;width:14px;flex:0 0 auto}
/* correction en direct */
.live{margin-top:10px}
.live .cells{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.live .cells span{display:inline-grid;place-items:center;min-width:26px;height:34px;border:2px solid var(--rule);border-radius:8px;font-family:var(--dsp);font-weight:800;font-size:19px;background:var(--card)}
.live .cells span.lv-bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-bg)}
.live .cells span.lv-miss{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-bg)}
.live .msg{font-size:13px;font-weight:700}
.live .msg.no{color:var(--p-low)} .live .msg.ok{color:var(--p-ok)} .live .msg.fix{color:var(--p-mid)}
/* draft / test en cours */
.draft{border:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--card));border-radius:14px;padding:13px;margin:12px 0}
.draft.block{border-color:var(--bad-bg);background:color-mix(in srgb,var(--bad-bg) 10%,var(--card))}
.flash{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;box-shadow:var(--shadow);max-width:90%}
details.fiche{border:1px solid var(--rule);border-radius:12px;padding:0;margin:10px 0;overflow:hidden}
details.fiche>summary{cursor:pointer;padding:13px;font-weight:800;font-family:var(--dsp);list-style:none;background:var(--card)}
details.fiche>summary::-webkit-details-marker{display:none}

details.fiche .in{padding:0 13px 13px}
.flash-card{min-height:230px;border:2px solid var(--rule);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;background:var(--card);cursor:pointer}
.flash-card .face{font-family:var(--dsp);font-weight:800;font-size:34px}
.flash-card .hint{font-size:13px;color:var(--soft)}
.vhide[hidden]{display:none!important}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.note-ver{font-size:12px;color:var(--soft);text-align:center;margin:14px 0 2px}
a{color:var(--accent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
/* ===== Environnement ===== */
const HAS_CLAUDE = !!(window.claude && window.claude.use);
const QUIZ_ID = "liano-quiz-anglais-unit2nombres";
const VERSION = { n:4, date:"27.10.2026" };
/* v1 : 26.10.2026, première version — couche Langues (anglais), suivi à 3 anneaux et test en cours gardé.
   v2 : 26.10.2026, barre du bas resserrée au centre sur grand écran, comme les autres outils.
   v3 : 27.10.2026, pastille : chaque anneau lit son propre niveau ; une erreur en Niveau épreuve ne fait plus baisser l'Échauffement ni l'Entraînement.
   v4 : 27.10.2026, « OK ✓ » vert foncé sur l'anneau extérieur quand le Niveau épreuve est réussi deux jours différents (cartes acquises). */
const DUE = "vendredi 30 octobre";
const FILE = "2026-10-30_Liano_Anglais_Unit-2-Nombres-1-20";

/* ===== Sources (visibles partout, y compris sur le site public) ===== */
const SOURCES = [
  { titre:"Photo 1 — page de vocabulaire Unit 2 (numéro de page pas visible)", recue:"26.10.2026",
    contenu:"Nombres surlignés 2.1 (1 à 10) et 2.2 (11 à 20), avec leur traduction française." }
];
const PHOTOS = [ { titre:"Photo 1 — page de vocabulaire Unit 2", url:"/_blob/048177ff31e7e64baa4bb4123f6e4384" } ];
const SOURCES_NOTE = "Seuls les nombres 2.1 et 2.2 sont repris : c'est ce qui tombe à l'épreuve du 30.10. La famille (2.3) et les phrases (2.4, 2.5) de la même page ne sont pas dans cet outil.";

/* ===== Données : couche Langues (anglais) ===== */
/* item : { en, fr:[...], frShow }  — nombres : pas d'article, rien à « keep ». */
const DECKS = [
  { key:"n1a10", title:"Numbers 1 → 10", emoji:"🔟", src:"livre, Unit 2 « Numbers », groupe 2.1", items:[
    {en:"one",fr:["un"],frShow:"un"},
    {en:"two",fr:["deux"],frShow:"deux"},
    {en:"three",fr:["trois"],frShow:"trois"},
    {en:"four",fr:["quatre"],frShow:"quatre"},
    {en:"five",fr:["cinq"],frShow:"cinq"},
    {en:"six",fr:["six"],frShow:"six"},
    {en:"seven",fr:["sept"],frShow:"sept"},
    {en:"eight",fr:["huit"],frShow:"huit"},
    {en:"nine",fr:["neuf"],frShow:"neuf"},
    {en:"ten",fr:["dix"],frShow:"dix"}
  ]},
  { key:"n11a20", title:"Numbers 11 → 20", emoji:"🔢", src:"livre, Unit 2 « Numbers », groupe 2.2", items:[
    {en:"eleven",fr:["onze"],frShow:"onze"},
    {en:"twelve",fr:["douze"],frShow:"douze"},
    {en:"thirteen",fr:["treize"],frShow:"treize"},
    {en:"fourteen",fr:["quatorze"],frShow:"quatorze"},
    {en:"fifteen",fr:["quinze"],frShow:"quinze"},
    {en:"sixteen",fr:["seize"],frShow:"seize"},
    {en:"seventeen",fr:["dix-sept"],frShow:"dix-sept"},
    {en:"eighteen",fr:["dix-huit"],frShow:"dix-huit"},
    {en:"nineteen",fr:["dix-neuf"],frShow:"dix-neuf"},
    {en:"twenty",fr:["vingt"],frShow:"vingt"}
  ]}
];
DECKS.forEach(d=>d.items.forEach((it,i)=>{ it.deck=d.key; it.cardKey=d.key+"_"+it.en; }));
function deckOf(k){ return DECKS.find(d=>d.key===k); }
function allItems(){ return DECKS.flatMap(d=>d.items); }

/* ===== Normalisation / correction (anglais) ===== */
function norm(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\- ]/g,"").replace(/\s+/g," ").trim(); }
function stripEn(s){ return s.replace(/^(to |the |a |an )/,"").trim(); }
function stripFrArt(s){ return s.replace(/^(le |la |les |l'|l |un |une |des )/,"").trim(); }
// réponses anglaises acceptées
function enList(it){ return [it.en]; }
function frList(it){ return it.fr.slice(); }
function checkEN(input, it){
  const want = enList(it).map(norm);
  const got = norm(input);
  return want.includes(got) || want.map(stripEn).includes(stripEn(got));
}
function checkFR(input, it){
  const want = frList(it).map(norm);
  const got = norm(input);
  return want.includes(got) || want.map(stripFrArt).includes(stripFrArt(got));
}

/* ===== Note suisse ===== */
const LVL_TXT={echauff:"Échauffement",entrain:"Entraînement",epreuve:"Niveau épreuve"};
const MODE_TXT={entrain:"Je m'entraîne",live:"Correction en direct",blanche:"Épreuve blanche"};
function noteOf(score,total){ if(!total) return 1; return Math.round((1+5*(score/total))*2)/2; }
function noteTxt(n){ return n.toFixed(1).replace(".",","); }
function msgFor(pct){
  if(pct>=90) return "Excellent, tu connais tes nombres ! 🌟";
  if(pct>=75) return "Super, c'est réussi ! 💪";
  if(pct>=55) return "C'est en bonne route, continue !";
  return "Pas grave, on recommence : tu vas y arriver. 🙂";
}
function lvlInfo(score,total){ // niveau de note -> couleur + mot
  const n=noteOf(score,total);
  if(total===0) return {key:"start",col:"var(--rule)",mot:"à commencer"};
  if(n<4) return {key:"low",col:"var(--p-low)",mot:"à revoir"};
  if(n<5) return {key:"mid",col:"var(--p-mid)",mot:"en route"};
  return {key:"ok",col:"var(--p-ok)",mot:"réussi"};
}
function pColor(state){ return {low:"var(--p-low)",mid:"var(--p-mid)",ok:"var(--p-ok)",okdark:"var(--p-okdark)",start:"var(--rule)"}[state]||"var(--rule)"; }

/* ===== Stockage (db dans Claude, localStorage sur le site) ===== */
let DB=null, BASE=null;
const K=QUIZ_ID; // préfixe des documents : liano-quiz-anglais-unit2nombres
async function initStore(){
  if(!HAS_CLAUDE) return;
  try{ const db=await window.claude.use("db"); const user=await window.claude.use("user");
    if(db&&user){ const uid=await user.id(); if(uid){ DB=db; BASE="data/users/"+uid; } } }catch(e){ DB=null; }
}
function col(){ return DB.collection(BASE); }
function lsGet(k,def){ try{ const v=localStorage.getItem(K+"-"+k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(K+"-"+k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(K+"-"+k); }catch(e){} }
let STORE_WARN=false;
// Historique
async function histLoad(){
  if(DB){ try{ const snap=await col().get(); return snap.docs.filter(d=>d.id.startsWith(K+"-attempt-")).map(d=>d.data()).sort((a,b)=>a.ts-b.ts); }catch(e){} }
  const idx=lsGet("index",[]); return idx.map(id=>lsGet("attempt-"+id,null)).filter(Boolean).sort((a,b)=>a.ts-b.ts);
}
async function histSave(att){
  if(DB){ try{ await col().doc(K+"-attempt-"+att.id).set(att); return; }catch(e){} }
  const idx=lsGet("index",[]); if(!idx.includes(att.id)){ idx.push(att.id); lsSet("index",idx); }
  if(!lsSet("attempt-"+att.id,att)) flash("Je n'arrive pas à enregistrer ce résultat sur cet appareil.");
}
async function histClear(){
  if(DB){ try{ const snap=await col().get(); for(const d of snap.docs){ if(d.id.startsWith(K+"-attempt-")) await col().doc(d.id).delete(); } }catch(e){} }
  const idx=lsGet("index",[]); idx.forEach(id=>lsDel("attempt-"+id)); lsSet("index",[]);
}
// Test en cours (gardé à deux endroits : appareil + données privées Claude)
let draftQueue=Promise.resolve();
function draftWrite(d){
  d.saved=Date.now();
  const okLocal=lsSet("test-en-cours",d);
  if(DB){ draftQueue=draftQueue.then(()=>col().doc(K+"-test-en-cours").set(d)).then(()=>{ STORE_WARN=false; },()=>{ if(!okLocal) STORE_WARN=true; }); }
  else if(!okLocal) STORE_WARN=true;
  return draftQueue;
}
async function draftRead(){
  const local=lsGet("test-en-cours",null);
  let remote=null;
  if(DB){ try{ const doc=await col().doc(K+"-test-en-cours").get(); remote=doc.exists?doc.data():null; }catch(e){} }
  const all=[local,remote].filter(Boolean).sort((a,b)=>(b.saved||0)-(a.saved||0));
  return all.length&&!all[0].vide&&all[0].questions? all[0] : null;
}
async function draftClear(){ await draftWrite({vide:true}); }

/* ===== État appli ===== */
let HIST=[];
let sel=new Set(DECKS.map(d=>d.key)); // paquets cochés
let level="echauff"; // echauff | entrain | epreuve
let mode="entrain"; // entrain | live | blanche
let TEST=null; // test en cours en mémoire
let cardIdx=0, cardFlipped=false, cardOrder=[];
let liveState=null;

/* ===== Navigation ===== */
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.hidden=true);
  document.getElementById("v-"+v).hidden=false;

/* ===== Génération des questions ===== */
// type question : { it, dir:'en'|'fr', kind:'mcq'|'write', num, options? }
function buildQuestions(){
  const items=shuffle(allItems().filter(it=>sel.has(it.deck)));
  const qs=items.map((it,i)=>{
    let dir,kind;
    if(level==="echauff"){ dir="fr"; kind="mcq"; }        // montre EN -> choisir FR
    else if(level==="entrain"){ dir="fr"; kind=(i%2===0)?"write":"mcq"; } // écrire FR ou choisir
    else { dir="en"; kind="write"; }                       // production : montrer FR, écrire EN
    const q={ it, dir, kind, num:i+1, deck:it.deck, label:"nombre", cardKey:it.cardKey };
    if(kind==="mcq") q.options=mkOptions(it,dir);
    return q;
  });
  return qs;
}
function mkOptions(it,dir){
  const pool=allItems().filter(x=>x.cardKey!==it.cardKey);
  const distract=shuffle(pool).slice(0,3).map(x=>dir==="fr"?x.frShow:x.en);
  const correct=dir==="fr"?it.frShow:it.en;
  return shuffle([correct,...distract]);
}
function promptOf(q){ return q.dir==="fr"? q.it.en : q.it.frShow; }
function answerShown(q){ return q.dir==="fr"? q.it.frShow : q.it.en; }
function isRight(q,input){ return q.dir==="fr"? checkFR(input,q.it) : checkEN(input,q.it); }

function renderRun(){

          <button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="dontKnow()">Je ne sais pas</button>`;

  const inp=document.getElementById("ansIn");

/* --- QCM --- */
function answerMcq(btn,chosen){
  const q=TEST.questions[TEST.cur];
  if(TEST.answers.length>TEST.cur) return;
  const correct=answerShown(q);
  const ok=norm(chosen)===norm(correct)|| isRight(q,chosen);
  document.querySelectorAll("#opts .opt").forEach(b=>{ b.disabled=true;
    if(norm(b.textContent)===norm(correct)) b.classList.add("good");
    else if(b===btn && !ok) b.classList.add("bad");
  });
  record(q,chosen,ok,false,null,null);
  if(TEST.mode==="blanche"){ next(); }
  else showCorr(q,ok,chosen);
}
/* --- écrit --- */
function submitWrite(){
  const q=TEST.questions[TEST.cur];
  if(TEST.answers.length>TEST.cur) return;
  const inp=document.getElementById("ansIn"); if(!inp) return;
  const val=inp.value.trim(); if(!val && mode!=="live"){ inp.focus(); return; }
  let ok=isRight(q,val);
  let liveFixed=false,liveSnap=null;
  if(TEST.mode==="live" && liveState && liveState.fixedOnce){ liveFixed=true; liveSnap=liveState.snap; if(ok) ok=false; /* juste à la fin mais aidé = 0 */ }
  inp.disabled=true;
  record(q,val,ok,false,liveFixed,liveSnap);
  if(TEST.mode==="blanche"){ next(); return; }
  showCorr(q,ok,val,liveFixed);
}
function dontKnow(){
  const q=TEST.questions[TEST.cur];
  if(TEST.answers.length>TEST.cur) return;
  record(q,"",false,false,null,null,true);
  if(TEST.mode==="blanche"){ next(); return; }
  showCorr(q,false,"",false,true);
}

function showCorr(q,ok,given,liveFixed,idk){
  TEST.showingCorr=true; saveDraft();
  const correct=answerShown(q);
  let extra="";
  if(!ok && q.kind==="write" && !idk && !liveFixed){
    extra=`<button class="btn sun sm" style="width:100%;margin-top:8px" onclick="markTypo()">C'était juste, j'ai fait une faute de frappe</button>`;
  }
  const liveMsg=liveFixed?`<div class="small" style="margin-top:4px">Ce mot compte 0 et reviendra dans « Refaire mes erreurs ». Tu avais d'abord écrit « ${esc(TEST.answers[TEST.answers.length-1].liveSnap||"")} ».</div>`:"";
  document.getElementById("fb").innerHTML=
    `<div class="feedback ${ok?"ok":"no"}">
       ${ok?"✅ Bravo, c'est juste !": liveFixed?`✍️ Juste à la fin, avec de l'aide : <b>${esc(correct)}</b>`:`❌ La bonne réponse : <b>${esc(correct)}</b>`}
       ${!ok&&given&&!liveFixed?`<div class="small" style="margin-top:4px">Tu avais écrit : « ${esc(given)} »</div>`:""}
       ${liveMsg}
     </div>${extra}

  const rb=document.getElementById("runBody"); if(rb) rb.querySelectorAll("button,input").forEach(x=>x.disabled=true);

function record(q,given,ok,unused,liveFixed,liveSnap,idk){
  TEST.answers.push({ num:q.num, label:q.label, cardKey:q.cardKey, dir:q.dir, kind:q.kind,
    given, correct:answerShown(q), c:ok, typo:false,
    liveFixed:!!liveFixed, liveSnap:liveSnap||null, idk:!!idk,
    question:q });

}
function next(){

  questions:TEST.questions, answers:TEST.answers, cur:TEST.cur, showingCorr:TEST.showingCorr, rattrapage:TEST.rattrapage, parent:TEST.parent }); }

/* ===== Correction en direct ===== */
function liveCands(q){
  if(q.dir==="fr") return frList(q.it).map(norm);
  // anglais : forme complète + sans article (ici pas d'article, mais on garde la règle)
  return enList(q.it).flatMap(s=>{ const n=norm(s); return [n, stripEn(n)]; });
}
function onLiveInput(){
  const q=TEST.questions[TEST.cur];
  const inp=document.getElementById("ansIn"); const raw=inp.value;
  const typed=norm(raw);
  const cands=liveCands(q);
  // meilleur candidat : préfixe le plus long correspondant
  let best=cands[0], bestLen=-1;
  cands.forEach(c=>{ let k=0; while(k<typed.length&&k<c.length&&typed[k]===c[k])k++; if(k>bestLen){ bestLen=k; best=c; } });
  // marquer lettre par lettre
  const chars=typed.split("");
  let badCount=0; const cells=chars.map((ch,i)=>{
    if(i<best.length && ch===best[i]) return `<span>${esc(ch)}</span>`;
    badCount++; return `<span class="lv-bad">${esc(ch)}</span>`;
  });
  const exact=cands.includes(typed);
  liveState=liveState||{fixedOnce:false,snap:null,everBad:false};
  if(badCount>0){ liveState.everBad=true; liveState.snap=raw; }
  if(exact && liveState.everBad){ liveState.fixedOnce=true; }
  let msg;
  if(badCount>0) msg=`<div class="msg no">✗ ${badCount} lettre(s) à corriger</div>`;
  else if(liveState.fixedOnce) msg=`<div class="msg fix">✓ Corrigé — ce mot ne comptera pas dans la note</div>`;
  else msg=`<div class="msg ok">✓ Pour l'instant, c'est juste</div>`;
  document.getElementById("liveBox").innerHTML=`<div class="cells">${cells.join("")||"<span class='muted' style='border:none'>…</span>"}</div>${msg}`;
}

/* ===== Voir mes erreurs ===== */
function dxDiff(given,correct){
  const g=norm(given), c=norm(correct);
  if(!g) return `<span class="dx-miss">rien</span>`;
  // mot entier si trop différent
  let diff=0; const L=Math.max(g.length,c.length); for(let i=0;i<L;i++){ if(g[i]!==c[i]) diff++; }
  if(diff/L>0.4) return `<span class="dx-bad">${esc(given)}</span>`;
  // lettre par lettre
  let out=""; for(let i=0;i<g.length;i++){ out+= (g[i]===c[i])?esc(given[i]||g[i]):`<span class="dx-bad">${esc(given[i]||g[i])}</span>`; }
  return out;
}
function errCard(a){
  const given=a.liveFixed? a.liveSnap : a.given;
  return `<div class="errc"><div class="ql">N° ${a.num} · ${esc(promptOf(a.question))}</div>
    <div class="dx-line"><span class="mk">✗</span><span>${a.kind==="mcq"?`<span class="dx-bad">${esc(a.given||"rien")}</span>`:dxDiff(given||"",a.correct)}</span></div>
    <div class="dx-line"><span class="mk">✓</span><span class="dx-good">${esc(a.correct)}</span></div>
    <div class="src">— ${esc(deckOf(a.question.deck).src)}</div></div>`;
}
function errView(att,errorsOnly){
  const list=errorsOnly?att.answers.filter(a=>!a.c):att.answers;
  if(!att.answers.length) return "";
  const head=`<div class="legend">✗ barré = ta réponse · ✓ souligné = la bonne réponse</div>`;
  if(errorsOnly && !list.length) return `<h3>Tes erreurs</h3><p class="muted">Aucune erreur, bravo ! 🎉</p>`;
  return `<h3>${errorsOnly?"Tes erreurs":"Toutes les questions"}</h3>${head}${list.map(a=>a.c&&!errorsOnly?okCard(a):errCard(a)).join("")}`;
}
function okCard(a){ return `<div class="errc"><div class="ql">N° ${a.num} · ${esc(promptOf(a.question))}</div><div class="dx-line"><span class="mk">✓</span><span class="dx-good">${esc(a.correct)}</span></div></div>`; }

/* ===== SUIVI GRAPHIQUE ===== */
// état d'une carte à partir des tests (premier passage, pas les rattrapages)
function firstPassAnswers(){
  const tests=HIST.filter(a=>!a.rattrapage).sort((x,y)=>x.ts-y.ts);
  return tests;
}
function cardLastResult(cardKey){ // dernier test (non rattrapage) où la carte tombe
  const tests=firstPassAnswers();
  for(let i=tests.length-1;i>=0;i--){ const a=tests[i].answers.find(x=>x.cardKey===cardKey); if(a) return {att:tests[i],ans:a}; }
  return null;
}
function levelRank(lv){ return {echauff:0,entrain:1,epreuve:2}[lv]??0; }
// nb cartes justes à un niveau donné (dernier test de ce niveau où la carte tombe), par paquet
function deckRingLevel(deckKey,lv){
  const items=deckOf(deckKey).items;
  // Chaque anneau = son propre niveau. Pour une carte : juste si son dernier résultat À CE NIVEAU est juste,
  // ou si son dernier résultat à un niveau PLUS DIFFICILE est juste (une réussite compte pour les niveaux plus faciles).
  // Une erreur à un niveau plus difficile ne fait jamais baisser l'anneau d'un niveau plus facile.
  const tests=firstPassAnswers();
  const lastAt=(cardKey,level)=>{ for(let i=tests.length-1;i>=0;i--){ if(tests[i].level!==level) continue; const a=tests[i].answers.find(x=>x.cardKey===cardKey); if(a) return a; } return null; };
  const levels=["echauff","entrain","epreuve"].filter(l=>levelRank(l)>=levelRank(lv));
  let right=0, tested=false;
  items.forEach(it=>{
    const res=levels.map(l=>lastAt(it.cardKey,l)).filter(Boolean);
    if(res.length){ tested=true; if(res.some(a=>a.c)) right++; }
  });
  const total=items.length;
  const anyTested=firstPassAnswers().some(t=>levelRank(t.level)>=levelRank(lv) && t.answers.some(a=>items.find(it=>it.cardKey===a.cardKey)));
  let state=anyTested?lvlInfo(right,total).key:"start";
  // « OK ✓ » (anneau extérieur seulement) : cartes ACQUISES = justes au dernier Niveau épreuve
  // et déjà justes à un Niveau épreuve d'un AUTRE JOUR, sans erreur entre les deux. Note sur les acquises ≥ 5 → vert foncé.
  let acquired=0;
  if(lv==="epreuve" && anyTested){
    items.forEach(it=>{
      const seq=tests.filter(t=>t.level==="epreuve").map(t=>{ const a=t.answers.find(x=>x.cardKey===it.cardKey); return a?{ok:a.c,day:dayKey(t.ts)}:null; }).filter(Boolean);
      if(!seq.length || !seq[seq.length-1].ok) return;
      const last=seq[seq.length-1];
      for(let i=seq.length-2;i>=0 && seq[i].ok;i--){ if(seq[i].day!==last.day){ acquired++; break; } }
    });
    if(noteOf(acquired,total)>=5) state="okdark";
  }
  return { right, total, state, acquired };
}
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
const STATE_WORD={start:"à commencer",low:"à revoir",mid:"en route",ok:"réussi",okdark:"OK ✓"};
function hardestTested(deckKey){
  const items=deckOf(deckKey).items;
  for(const lv of ["epreuve","entrain","echauff"]){
    const any=firstPassAnswers().some(t=>t.level===lv && t.answers.some(a=>items.find(it=>it.cardKey===a.cardKey)));
    if(any) return lv;
  }
  return null;
}
function deckSummary(deckKey){ // pour le centre : niveau le plus difficile testé
  const hl=hardestTested(deckKey);
  if(!hl) return { right:0,total:deckOf(deckKey).items.length,state:"start",rings:[ring("echauff"),ring("entrain"),ring("epreuve")] };
  function ring(lv){ return deckRingLevel(deckKey,lv); }
  const centerR=deckRingLevel(deckKey,hl);
  return { right:centerR.right, total:centerR.total, state:centerR.state, acquired:centerR.acquired||0, hl,
    rings:[deckRingLevel(deckKey,"echauff"),deckRingLevel(deckKey,"entrain"),deckRingLevel(deckKey,"epreuve")] };
}
function ringArc(sum,r,w){
  if(sum.state==="start") return `<circle r="${r}" fill="none" stroke-width="${w}" stroke-dasharray="3 3" stroke="var(--rule)"/>`;
  const C=2*Math.PI*r, c=pColor(sum.state);
  return `<circle r="${r}" fill="none" stroke-width="${w}" stroke="${c}" stroke-opacity=".22"/>`+
    (sum.right?`<circle r="${r}" fill="none" stroke-width="${w}" stroke="${c}" stroke-dasharray="${(C*sum.right/sum.total).toFixed(2)} 999" transform="rotate(-90)"/>`:"");
}
function ringSvg(summary,size){
  const cx=size/2; const rings=summary.rings||[];
  const radii=[size/2-20,size/2-13,size/2-6]; const w=5;
  const hl=rings.length? (summary.state==="start"?"":`${summary.right}/${summary.total}`) : "";
  return `<svg width="${size}" height="${size}" viewBox="${-cx} ${-cx} ${size} ${size}" role="img" aria-label="progression">
    ${rings.map((rg,i)=>ringArc(rg,radii[i],w)).join("")}
    ${hl?`<text x="0" y="0" text-anchor="middle" dominant-baseline="central" class="center-num" font-size="${hl.length>4?12:15}">${hl}</text>`:""}
  </svg>`;
}
function pastilleFull(deckKey){
  const sum=deckSummary(deckKey);
  const hl=hardestTested(deckKey);
  const info={mot:STATE_WORD[hl?sum.state:"start"]};
  const conf= hl==="epreuve" ? (sum.state==="okdark" ? ` · dont ${sum.acquired} acquises` : sum.state==="ok" ? " · refais un Niveau épreuve un autre jour pour le confirmer" : "") : "";
  // flèche + baisse
  const drop=dropOf(deckKey);
  return `<div class="pastille">${ringSvg(sum,86)}
    <div class="pst-txt"><div class="lvl">${esc(deckOf(deckKey).title)}</div>
      <div class="sub">${hl?`${sum.right}/${sum.total} au dernier test · ${info.mot} ${drop.arrow}${conf}`:"pas encore testé"}</div>
      ${drop.was?`<div class="pst-was">avant : ${drop.was}</div>`:""}
    </div></div>`;
}
function dropOf(deckKey){
  // compare la note du dernier test touchant le paquet au test précédent
  const items=deckOf(deckKey).items.map(it=>it.cardKey);
  const tests=firstPassAnswers().filter(t=>t.answers.some(a=>items.includes(a.cardKey)));
  if(tests.length<2) return {arrow:"",was:null};
  function scoreAt(t){ const rel=t.answers.filter(a=>items.includes(a.cardKey)); return {s:rel.filter(a=>a.c).length,t:rel.length}; }
  const last=scoreAt(tests[tests.length-1]), prev=scoreAt(tests[tests.length-2]);
  const nl=noteOf(last.s,last.t), np=noteOf(prev.s,prev.t);
  if(last.s>prev.s) return {arrow:"↗",was:null};
  if(last.s<prev.s){ const dl=lvlInfo(last.s,last.t).key, dp=lvlInfo(prev.s,prev.t).key; return {arrow:"↘",was: dl!==dp?lvlInfo(prev.s,prev.t).mot+" (note "+noteTxt(np)+")":null}; }
  return {arrow:"",was:null};
}
function globalPastilleHTML(){
  if(!HIST.length) return `<p class="muted small">Pas encore de test. Fais-en un et ta progression s'affichera ici 🎯</p>`;
  return DECKS.map(d=>`<div style="margin:10px 0">${pastilleFull(d.key)}</div>`).join("");
}

function finalNote(t){ // note après rattrapages rattachés
  const kids=HIST.filter(a=>a.rattrapage && a.parent===t.id).sort((x,y)=>x.ts-y.ts);
  if(!kids.length) return t.note;
  const wrongKeys=new Set(t.answers.filter(a=>!a.c).map(a=>a.num));
  let recovered=0; const done=new Set();
  kids.forEach(k=>k.answers.forEach(a=>{ if(a.c && wrongKeys.has(a.num) && !done.has(a.num)){ done.add(a.num); recovered++; } }));
  return noteOf(t.score+recovered, t.total);
}
function curveSVG(tests){
  if(!tests.length) return `<p class="muted small">Pas encore de note.</p>`;
  const W=Math.max(300, tests.length*60+40), H=170, pad=30;
  const x=i=>pad+ i*( (W-2*pad)/Math.max(1,tests.length-1) );
  const y=n=>H-pad - (n-1)/5*(H-2*pad);
  const shape={echauff:"○",entrain:"□",epreuve:"◆"}; const shp=t=>t.mode==="blanche"?"★":shape[t.level];
  const pts=tests.map((t,i)=>({x:x(i),y:y(t.note),t}));
  const line=pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const grid=[1,2,3,4,5,6].map(n=>`<line x1="${pad}" y1="${y(n)}" x2="${W-pad}" y2="${y(n)}" stroke="var(--rule)" stroke-dasharray="${n===4?"4 3":"1 5"}"/><text x="4" y="${y(n)+3}" font-size="9" fill="var(--soft)">${n}</text>`).join("");
  return `<div class="curve-wrap"><svg width="${W}" height="${H+14}" viewBox="0 0 ${W} ${H+14}">
    ${grid}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map(p=>{ const fn=finalNote(p.t); if(fn<=p.t.note) return ""; const y2=y(fn);
      return `<line x1="${p.x}" y1="${p.y-8}" x2="${p.x}" y2="${y2+6}" stroke="var(--p-ok)" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="${p.x}" cy="${y2}" r="6" fill="var(--card)" stroke="var(--p-ok)" stroke-width="2"/>
      <text x="${p.x+10}" y="${y2-6}" font-size="10" font-weight="700" fill="var(--p-ok)">${noteTxt(fn)}</text>`; }).join("")}
    ${pts.map((p,i)=>`<text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="15" fill="var(--accent)">${shp(p.t)}</text>
      <text x="${p.x}" y="${H-pad+13}" text-anchor="middle" font-size="8" fill="var(--soft)">${new Date(p.t.ts).toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit"})}</text>`).join("")}
  </svg></div>
  <p class="small muted">○ échauffement · □ entraînement · ◆ niveau épreuve · ★ épreuve blanche · ◯ en pointillé vert = note après rattrapage · ligne « 4 » = suffisant. Épreuve : ${esc(DUE)}.</p>`;
}
function heatHTML(){
  const days=[...new Set(firstPassAnswers().map(t=>new Date(t.ts).toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit"})))].slice(-6);
  if(!days.length) return `<p class="muted small">Pas encore de test.</p>`;
  let rows=DECKS.map(d=>{
    const items=d.items.map(it=>it.cardKey);
    const cells=days.map(day=>{
      const t=firstPassAnswers().filter(x=>new Date(x.ts).toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit"})===day && x.answers.some(a=>items.includes(a.cardKey))).pop();
      if(!t) return `<td class="hc hc-none">–</td>`;
      const rel=t.answers.filter(a=>items.includes(a.cardKey)); const s=rel.filter(a=>a.c).length;
      const pct=Math.round(s/rel.length*100); const info=lvlInfo(s,rel.length);
      const cls=info.key==="ok"?"hc-ok":info.key==="mid"?"hc-mid":"hc-low";
      return `<td class="hc ${cls}">${pct}%${noteOf(s,rel.length)>=5?" ✓":""}</td>`;
    }).join("");
    return `<tr><td style="text-align:left">${esc(d.title)}</td>${cells}</tr>`;
  }).join("");
  return `<div style="overflow-x:auto"><table class="heat"><tr><th style="text-align:left">Paquet</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr>${rows}</table></div>`;
}
function resistantHTML(){
  const counts={};
  firstPassAnswers().forEach(t=>t.answers.forEach(a=>{ if(!counts[a.cardKey])counts[a.cardKey]={miss:0,tot:0,label:a.correct,card:a.question}; counts[a.cardKey].tot++; if(!a.c)counts[a.cardKey].miss++; }));
  const list=Object.entries(counts).filter(([,v])=>v.miss>0).sort((a,b)=>b[1].miss-a[1].miss).slice(0,5);

    `<button class="btn sun sm" style="width:100%;margin-top:8px" onclick="redoResistant()">🔁 Refaire ces cartes</button>`;
}
window.redoResistant=async ()=>{

};
function histListHTML(){
  return HIST.slice().sort((a,b)=>b.ts-a.ts).map(a=>{
    const fn=a.rattrapage?null:finalNote(a);
    const up=fn!==null&&fn!==a.note?` <span class="small" style="color:var(--p-ok)">${noteTxt(a.note)} → ${noteTxt(fn)} après rattrapage</span>`:"";
    return `<div class="errc"><div style="display:flex;justify-content:space-between"><b>${new Date(a.ts).toLocaleString("fr-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</b><span>${a.rattrapage?"Rattrapage":"note "+noteTxt(a.note)}</span></div>
      <span class="small muted">${a.rattrapage?"":LVL_TXT[a.level]+" · "+MODE_TXT[a.mode]+" · "}${a.score}/${a.total}${up}</span></div>`;
  }).join("")||`<p class="muted small">Vide.</p>`;
}
async function exportScores(){
  const data={ quiz:QUIZ_ID, eleve:"Liano", version:VERSION, exporté:new Date().toISOString(), tests:HIST };
  const txt=JSON.stringify(data,null,2);
  if(HAS_CLAUDE){ try{ const dl=await window.claude.use("downloads"); if(dl){ await dl.save({filename:FILE+"_scores.json",data:txt}); flash("Export prêt 💾"); return; } }catch(e){} }
  const blob=new Blob([txt],{type:"application/json"}); const u=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=u; a.download=FILE+"_scores.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); flash("Export prêt 💾");
}
function askErase(){ document.getElementById("eraseBox").innerHTML=`<div class="draft block"><b>Effacer tous tes scores ?</b> <span class="small">On ne peut pas revenir en arrière.</span><div class="row" style="margin-top:8px"><button class="btn sm" onclick="doErase()">Oui, effacer</button><button class="btn ghost sm" onclick="document.getElementById('eraseBox').innerHTML=''">Non</button></div></div>`; }
async function doErase(){ await histClear(); HIST=await histLoad(); renderScores(); refreshHdr(); }

/* ===== Version papier ===== */
async function makePaper(){
  const qs=buildQuestions();
  const title="Anglais · Nombres 1–20 — test du "+DUE;
  const exHtml=paperDoc(title,qs,false);
  const corHtml=paperDoc(title,qs,true);
  const files=[["exercices",exHtml],["exercices-et-corrige",paperDoc(title,qs,false,true)],["corrige",corHtml]];
  if(HAS_CLAUDE){ try{ const dl=await window.claude.use("downloads"); if(dl){ for(const [n,h] of files){ await dl.save({filename:FILE+"_"+n+".html",data:h}); } flash("3 fichiers prêts 🖨️"); return; } }catch(e){} }
  for(const [n,h] of files){ const b=new Blob([h],{type:"text/html"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=FILE+"_"+n+".html"; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
  flash("Version papier téléchargée 🖨️");
}
function paperDoc(title,qs,corrige,both){
  const q=qs.map(x=>`<div class="ex"><div class="n">N° ${x.num}</div><div class="p">${x.dir==="fr"?"Traduis en français :":"Écris en anglais :"} <b>${esc(promptOf(x))}</b></div><div class="line"></div></div>`).join("");
  const cor=`<div class="cor"><h3>Corrigé</h3>${qs.map(x=>`<div>N° ${x.num} : <b>${esc(answerShown(x))}</b> <span class="s">— ${esc(deckOf(x.deck).src)}</span></div>`).join("")}</div>`;
  const body = corrige&&!both ? cor : (both? q+`<div style="page-break-before:always"></div>`+cor : q);
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
  <style>body{font-family:Georgia,serif;max-width:186mm;margin:0 auto;padding:16px;color:#111}h1{font-size:18px}h3{margin-top:18px}.ex{page-break-inside:avoid;margin:14px 0}.n{font-size:12px;color:#555;font-weight:bold}.p{font-size:15px}.line{border-bottom:1px solid #999;height:26px;margin-top:6px}.cor div{margin:4px 0}.s{color:#888;font-size:12px}button{margin:10px 0;padding:8px 14px}@media print{button{display:none}}</style></head>
  <body><button onclick="window.print()">🖨️ Imprimer</button><h1>${esc(title)}</h1>${body}</body></html>`;
}

/* ===== Entête ===== */
function refreshHdr(){
  const tests=HIST.filter(a=>!a.rattrapage);
  const el=document.getElementById("hdrScore");
  if(!tests.length){ el.textContent="0 test"; return; }
  const best=Math.max(...tests.map(t=>finalNote(t)));
  el.textContent=`${tests.length} test${tests.length>1?"s":""} · ${noteTxt(best)}`;
}

/* ===== Démarrage ===== */
(async function(){
  document.getElementById("verLine").textContent=`Version ${VERSION.n} · mise à jour le ${VERSION.date}`;
  await initStore();
  HIST=await histLoad();
  refreshHdr();
  renderFiche();
  // bannière test en cours
  const d=await draftRead();
  if(d && d.questions){
    const reste=d.questions.length-d.cur;
    document.getElementById("draftBanner").innerHTML=
      `<div class="draft"><b>⏸ Tu as un test en cours</b><br>
       <span class="small">${d.decks.map(k=>deckOf(k).title).join(", ")} · niveau ${LVL_TXT[d.level]} · ${d.answers.length} sur ${d.questions.length} répondues · gardé le ${new Date(d.saved).toLocaleString("fr-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>
       <div class="row" style="margin-top:8px"><button class="btn sm" onclick="resumeDraft()">Reprendre mon test</button><button class="btn ghost sm" onclick="askAbandon()">Abandonner</button></div></div>`;
  }
})();
</script>

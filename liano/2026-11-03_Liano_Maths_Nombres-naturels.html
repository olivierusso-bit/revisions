<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nombres naturels · Liano · 03.11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Thème « tableau des positions » : chaque rang a sa colonne (CM DM UM | C D U), comme au cahier.
   Classe des mille en sarcelle, classe des unités en ambre ; les nombres en chasse fixe. */
:root{
  --paper:#EDF3F1; --sheet:#FFFFFF; --ink:#17302B; --soft:#5E716C; --rule:#CCDAD5;
  --pos:#0E6E5C; --pos-wash:#DCEFE9; --amber:#C77A0A; --amber-wash:#FBEBD0; --board:#17302B; --mark:#F2B632;
  --good:#1E7A55; --good-wash:#DCF1E6; --bad:#B23A26; --bad-wash:#F9E1DB; --on-accent:#FFFFFF;
  --p-okdark:#14583F; --p-ok:#2E8B6F; --p-mid:#D9822B; --p-low:#C63B2A; --p-lowsoft:#F0C7C0;
  --display:'Fredoka','Trebuchet MS',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1715; --sheet:#16231F; --ink:#E3EEEA; --soft:#98ADA7; --rule:#293A35;
  --pos:#4FC7AE; --pos-wash:#123129; --amber:#F2B04A; --amber-wash:#3A2A12; --board:#0A1210; --mark:#F2B632;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-accent:#0A1A16;
  --p-okdark:#3FB488; --p-ok:#5ED3A0; --p-mid:#E8A24D; --p-low:#FF8A7D; --p-lowsoft:#5A2A25; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1715; --sheet:#16231F; --ink:#E3EEEA; --soft:#98ADA7; --rule:#293A35;
  --pos:#4FC7AE; --pos-wash:#123129; --amber:#F2B04A; --amber-wash:#3A2A12; --board:#0A1210; --mark:#F2B632;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-accent:#0A1A16;
  --p-okdark:#3FB488; --p-ok:#5ED3A0; --p-mid:#E8A24D; --p-low:#FF8A7D; --p-lowsoft:#5A2A25; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.m{font-family:var(--mono);font-weight:500}

.head{display:flex;gap:14px;align-items:center}
.head h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,36px);line-height:1;margin:0}
.head p{margin:5px 0 0;color:var(--soft);font-size:14px}
.ptab{display:block;width:100%;height:auto;margin:12px 0 16px}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:600;font-size:20px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 8px 8px 0;margin:0}
.note{background:var(--pos-wash);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--pos);font-weight:700;padding:0;cursor:pointer}

.cta{width:100%;padding:15px;border:0;border-radius:12px;background:var(--pos);color:var(--on-accent);font-family:var(--display);font-weight:600;font-size:19px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost:disabled{opacity:.5;cursor:not-allowed}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);color:var(--pos)}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.entry.open{border-left:5px solid var(--pos)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-num{flex:none;min-width:30px;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--pos);border:1.5px solid var(--pos);border-radius:6px;text-align:center;padding:1px 4px}
.entry-num.miss{color:var(--amber);border-color:var(--amber)}
.entry-title{flex:1;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.entry-body{padding:0 14px 14px}
.objtxt{margin:0 0 6px;font-style:italic;font-size:14.5px;color:var(--soft)}
.pair{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-k{font-family:var(--mono);font-weight:700;color:var(--pos);overflow-wrap:anywhere}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--pos-wash);font-size:14px}
.astuce b{display:block;color:var(--pos);margin-bottom:2px}
.astuce.amb{background:var(--amber-wash)} .astuce.amb b{color:var(--amber)}
.tip{margin:0;padding:6px 0 6px 12px;border-left:3px solid var(--mark);font-size:15px}
.src-date{font-weight:400;color:var(--soft);font-size:13px;font-family:var(--body)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:8px;border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1px dashed var(--rule);border-radius:8px;color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}

/* paquets */
.deckrow{display:flex;align-items:stretch;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.deckrow.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash)}
.deck-sel{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.deck-c{flex:none;width:34px;height:34px;border-radius:8px;background:var(--board);color:var(--mark);font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.deck-txt{min-width:0}
.deck-t{display:block;font-weight:700;font-size:15px;line-height:1.2}
.deck-n{display:block;font-size:12.5px;color:var(--soft)}
.deck-tick{flex:none;color:var(--pos);font-weight:800;font-size:18px;align-self:center}
.deck-pst{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 12px 8px 0;text-align:center;min-width:76px}
.deck-redo{margin:-4px 0 8px;padding:0 12px}
.pst-l{font-size:12px;font-weight:700}
.pst-start{color:var(--soft)} .pst-low{color:var(--p-low)} .pst-mid{color:var(--p-mid)} .pst-win{color:var(--p-ok)} .pst-ok{color:var(--p-okdark)}
.pst-notes{font-size:10.5px;color:var(--soft)}
.pring{flex:none;display:block}
.pring-t{font-family:var(--display);font-weight:700;fill:var(--ink)}
.pglob{display:flex;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px}
.pglob-x b{display:block;font-family:var(--display);font-size:17px}
.pglob-x span{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.plegend{background:var(--pos-wash);border-radius:10px;padding:0 12px}
.plegend summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:10px 0;color:var(--pos)}
.plegend p{margin:0 0 8px;font-size:13px}
.pdrop{background:var(--amber-wash);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:-4px 0 8px}

/* cartes */
.flash{position:relative;height:260px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--amber);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;padding:22px;transition:transform .45s;text-align:center;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--pos-wash);border-color:var(--pos);border-top-color:var(--pos)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:12.5px;font-weight:700;color:var(--soft)}
.face-word{font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.face-mini{font-size:13.5px;line-height:1.45}
.face-hint{position:absolute;bottom:12px;font-size:12px;color:var(--soft)}

/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:11px 4px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash);color:var(--pos)}
.paper{background:var(--sheet);border:1px dashed var(--pos);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--board);color:var(--mark);padding:2px 9px;border-radius:5px}
.ref{font-size:12.5px;color:var(--soft)}
.consigne{margin:0;font-size:15px;color:var(--soft)}
.qword{font-family:var(--mono);font-weight:700;font-size:clamp(20px,6vw,27px);line-height:1.3;margin:0;overflow-wrap:anywhere}
.qword.txt{font-family:var(--display);font-weight:600}
.qhint{margin:0;font-size:14px;color:var(--soft)}
.choice{padding:14px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:17px;font-weight:700;cursor:pointer;line-height:1.35}
.choice.nb{font-family:var(--mono)}
.choice.sel{border-color:var(--pos);box-shadow:inset 0 0 0 2px var(--pos)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink)}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:48px;padding:9px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-family:var(--mono);font-weight:700;font-size:17px;cursor:pointer}
.fb{padding:14px;border-radius:12px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}

/* résultats */
.scorebox{background:var(--board);border:4px solid #2C4A43;border-radius:14px;padding:18px;text-align:center}
.scorebox.rattr-box{border-color:var(--amber)}
.score-n{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.score-n small{font-size:30px;color:#9FB7B0}
.score-note{display:inline-block;margin-top:8px;background:var(--mark);color:#17302B;font-weight:800;padding:4px 14px;border-radius:6px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#F2B04A}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}

/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:20px;margin:0}
.bilan-lab{font-size:13px;font-weight:700;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan ul.forts li{color:var(--good)}
.bilan ul.work li{color:var(--bad)}
.bilan-tip{background:var(--pos-wash);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--mono)}

/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--board);border-radius:10px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--mark);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#C3D3CE}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.attempt-left span.rattr-tag,.rattr-tag{display:inline-block;background:var(--amber);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--on-accent)}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* suivi */
.suivi{display:flex;flex-direction:column;gap:10px}
.suivi h3{font-family:var(--display);font-size:19px;margin:6px 0 0}
.suivi-ctl{display:flex;flex-direction:column;gap:8px}
.suivi-sel{width:100%;padding:10px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-weight:700}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft)}
.ch-legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.lg-line{width:16px;height:0;border-top:2px solid var(--pos)}
.lg-ring{width:11px;height:11px;border:2px solid var(--good);border-radius:50%}
.ch-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.ch-svg{display:block}
.ch-t{fill:var(--soft);font-size:11px;font-family:var(--body)}
.ch-b{fill:var(--ink);font-weight:700}
.ch-g{fill:var(--good);font-weight:700}
.ch-pt{cursor:pointer}
.ch-detail{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.ch-detail b{font-size:14.5px}
.tbl{overflow-x:auto}
.heat table{border-collapse:collapse;width:100%;font-size:13px}
.heat th,.heat td{border:1px solid var(--rule);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.heat th{background:var(--pos-wash);font-weight:700}
.heat td.k{text-align:left;font-weight:700}
.heat td.hc-0{color:var(--soft)}
.heat td.hc-ok{background:var(--good-wash);color:var(--good);font-weight:700}
.heat td.hc-mid{background:#FBF0D8;color:#7A5806;font-weight:700}
.heat td.hc-low{background:var(--bad-wash);color:var(--bad);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .heat td.hc-mid{background:#3A3016;color:#E8C27A}}
:root[data-theme="dark"] .heat td.hc-mid{background:#3A3016;color:#E8C27A}
.resist{display:flex;flex-direction:column;gap:6px}
.resist p{margin:0;font-size:14px}
.resist .code{display:inline-block;background:var(--pos-wash);color:var(--pos);font-weight:700;font-size:12px;padding:1px 7px;border-radius:5px;margin-right:4px}
.resist small{color:var(--soft)}

/* test en cours */
.draft{background:var(--pos-wash);border:1px solid var(--pos);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.draft.block{border-color:var(--bad);background:var(--bad-wash)}
.draft p{margin:0}
.draft p b{display:block;font-family:var(--display);font-size:16px}
.draft p span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.draft-stop b{color:var(--bad)}
.draft-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}

/* voir mes erreurs : lisible sans les couleurs */
.dx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px;color:var(--soft)}
.dx-line{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline;margin:2px 0!important}
.dx-lab{font-size:12.5px!important;font-weight:700;color:var(--soft)}
.dx-ans{font-family:var(--mono);font-size:17px;font-weight:700;overflow-wrap:anywhere;line-height:1.7}
.dx-ans.txt{font-family:var(--body)}
.dx-bad{background:#A3241B;color:#fff;text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:1px 3px}
.dx-good{background:#D4F0E1;color:#08402A;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;padding:1px 3px;font-weight:800}
.dx-none{font-style:italic;font-weight:400;color:var(--soft);font-family:var(--body)}

/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:3px solid var(--pos);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normMath(s){
  let t = String(s || "").toLowerCase().trim().replace(/[−–—]/g, "-").replace(/[\s'’  ]/g, "");
  if (/^\d+$/.test(t)) t = String(parseInt(t, 10));
  return t;
}
function cleanNum(p){ const t = String(p).replace(/[\s'’.  ]/g, ""); return /^\d+$/.test(t) ? parseInt(t, 10) : null; }
function checkSeq(input, q){
  const signs = String(input).match(/[<>]/g) || [];
  if (signs.some(s => s !== q.sign)) return false;
  const parts = String(input).split(/[<>;,]/).map(p => p.trim()).filter(Boolean).map(cleanNum);
  if (parts.some(x => x === null)) return false;
  return parts.length === q.seq.length && parts.every((x, i) => x === q.seq[i]);
}
function checkBounds(input, q){
  const parts = String(input).toLowerCase().split(/\s*(?:et|;|<|,|\/|à)\s*/).map(p => p.trim()).filter(Boolean).map(cleanNum);
  if (parts.some(x => x === null)) return false;
  const nums = parts.filter(x => x !== q.mid).sort((a, b) => a - b);
  return nums.length === 2 && nums[0] === q.bounds[0] && nums[1] === q.bounds[1];
}
function matchAnswer(input, q){
  if (!input || !String(input).trim()) return false;
  if (q.seq) return checkSeq(input, q);
  if (q.bounds) return checkBounds(input, q);
  const me = normMath(input);
  return q.accept.some(a => normMath(a) === me);
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

  const seen = new Set([normMath(good)]), out = [];
  shuffle(wrong || []).forEach(v => { if (out.length >= 3) return; const k = normMath(v); if (seen.has(k)) return; seen.add(k); out.push(v); });

}
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");

function dayOf(t){ const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }

/* ---------- fabrication du test ---------- */
function sampleDeck(d, n){
  const items = d.items.map((it, idx) => ({ it, idx }));
  if (n === "all" || items.length <= +n) return items.map(x => x.it);
  const groups = []; let last = null;
  items.forEach(x => { if (x.it.consigne !== last){ groups.push([]); last = x.it.consigne; } groups[groups.length-1].push(x); });
  const pools = groups.map(g => shuffle(g)), picked = []; let gi = 0;
  while (picked.length < +n && pools.some(p => p.length)){ const p = pools[gi % pools.length]; if (p.length) picked.push(p.pop()); gi++; }
  return picked.sort((a,b) => a.idx - b.idx).map(x => x.it);
}
function makeQ(it, d, difficulty, i, ex){
  const asMcq = !it.writeOnly && (it.mcqOnly || difficulty === "easy" || (difficulty === "normal" && Math.random() < 0.5));
  const q = { id:"q"+(i+1), num:i+1, ex, exTitle:d.title, deckKey:d.key, tag:d.key, code:d.code, ref:d.code + " " + it.ref, card:cardKey(d.key, it.ref),
    consigne:it.consigne, word:it.front, prompt:`${it.consigne} ${it.front}`, answer:it.back[0],
    expl:it.expl + " — " + it.src + ".", mcqOnly:!!it.mcqOnly };
  if (it.seq){ q.seq = it.seq; q.sign = it.sign; }
  if (it.bounds){ q.bounds = it.bounds; q.mid = it.mid; }
  q.accept = it.back;
  if (asMcq){ q.type = "mcq"; q.options = pickOptions(it.back[0], it.wrong); }
  else q.type = "type";
  return q;
}
function buildTest(keys, difficulty, order, limit){
  let list = [];
  DECKS.filter(d => keys.includes(d.key)).forEach(d => sampleDeck(d, limit).forEach(it => list.push({ it, d })));
  if (order === "mixed") list = shuffle(list);
  let ex = 0, lastBlock = null;
  return list.map(({ it, d }, i) => {
    const block = d.key + "|" + it.consigne;
    if (block !== lastBlock){ ex++; lastBlock = block; }
    return makeQ(it, d, difficulty, i, ex);
  });
}

        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user){ const uid = await user.id(); if (uid){ this.col = db.collection("data/users/" + uid); this.mode = "db"; return; } }

  async list(){
    if (this.mode === "db"){ const snap = await this.col.limit(1000).get(); return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean); }
    if (this.mode === "local"){ const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean); }

    if (this.mode === "local"){ localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att)); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }

  },
  async remove(id){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + id).delete(); return; }
    if (this.mode === "local"){ localStorage.removeItem(ATTEMPT_PREFIX + id); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]").filter(x => x !== id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); return; }
    delete this.mem[id];
  },
  async getDoc(id){
    if (this.mode === "db"){ const sn = await this.col.doc(id).get(); return sn && sn.exists ? sn.data() : null; }
    if (this.mode === "local"){ const v = localStorage.getItem(id); return v ? JSON.parse(v) : null; }
    return this.memDocs[id] || null;
  },
  async setDoc(id, obj){
    if (this.mode === "db"){ await this.col.doc(id).set(obj); return; }

    this.memDocs[id] = obj;
  },

/* ============================================================
   SUIVI GRAPHIQUE (§ 6 quater) — maths : un anneau « écrit » par paquet (§ 11.5)
   ============================================================ */
function rootTests(){ return S.attempts.filter(a => !a.rattrapage).sort((a, b) => a.date - b.date); }
function parentOf(a){
  if (a.parent) return a.parent;
  const prev = S.attempts.filter(x => !x.rattrapage && x.date < a.date && dayOf(x.date) === dayOf(a.date)).sort((x, y) => y.date - x.date)[0];
  return prev ? prev.id : null;
}
const isExam = a => a.mode === MODES.exam.label;
const chapOfQ = x => x.question ? x.question.deckKey : null;
const inChap = ch => x => ch === "all" || chapOfQ(x) === ch;
const qCardKey = x => x.question ? x.question.card : ("p|" + x.prompt);
function testScore(root, ch){
  const qs = root.questions.filter(inChap(ch)), score = qs.filter(x => x.correct).length, total = qs.length;
  if (!total) return null;
  const wrong = new Set(qs.filter(x => !x.correct).map(qCardKey)), fixed = new Set(), steps = [];
  S.attempts.filter(a => a.rattrapage && parentOf(a) === root.id).sort((a, b) => a.date - b.date).forEach(r => {
    const rq = r.questions.filter(inChap(ch)); if (!rq.length) return;
    rq.forEach(x => { if (x.correct && wrong.has(qCardKey(x))) fixed.add(qCardKey(x)); });
    const sc = score + fixed.size;
    steps.push({ score:sc, note:noteFrom(sc / total), asked:rq.length, ok:rq.filter(x => x.correct).length });
  });
  return { score, total, note:noteFrom(score / total), typos:qs.filter(x => x.typo).length, steps };
}
function histByCard(exceptId){
  const h = {};
  rootTests().filter(a => a.id !== exceptId).forEach(a => a.questions.forEach(x => {
    if (!x.question) return; const k = qCardKey(x);
    (h[k] = h[k] || []).push({ ok:x.correct, w:x.question.type === "type" || !!x.question.mcqOnly, day:dayOf(a.date), date:a.date });
  }));
  Object.values(h).forEach(arr => arr.sort((a, b) => a.date - b.date));
  return h;
}
/* état d'une carte : ok (acquise), mid (juste, pas encore acquise), bad, new */
function cardState(es){
  if (!es || !es.length) return "new";
  const last = es[es.length - 1];
  if (!last.ok) return "bad";
  if (!last.w) return "mid";
  const days = new Set();
  for (let i = es.length - 1; i >= 0 && es[i].ok; i--) if (es[i].w) days.add(es[i].day);
  return days.size >= 2 ? "ok" : "mid";
}
function deckCards(dk){ return DECK[dk].items.map(it => cardKey(dk, it.ref)); }
function chapSummary(cards, hist){
  const c = { ok:0, mid:0, bad:0, new:0 }, total = cards.length;
  cards.forEach(k => c[cardState(hist[k])]++);
  const right = c.ok + c.mid, pct = total ? Math.round(right / total * 100) : 0;
  const note = noteFrom(right / total), noteAcq = noteFrom(c.ok / total);
  const state = c.new === total ? "start" : noteAcq >= 5 ? "ok" : note >= 5 ? "win" : note >= 4 ? "mid" : "low";

}
const P_LABEL = { start:"à commencer", low:"à revoir", mid:"en route", win:"réussi", ok:"OK ✓" };
const LVL_LABEL = ["à revoir", "en route", "réussi"];
const lvlOf = s => !s || s.state === "start" ? -1 : s.note >= 5 ? 2 : s.note >= 4 ? 1 : 0;
const pColor = st => st === "ok" ? "var(--p-okdark)" : st === "win" ? "var(--p-ok)" : st === "mid" ? "var(--p-mid)" : "var(--p-low)";
function ringSvg(sum, size, centerText, fs){
  const h = size / 2, r = h - 7, w = 8, C = 2 * Math.PI * r;
  let body;
  if (sum.state === "start") body = `<circle r="${r}" fill="none" stroke-width="${w}" stroke-dasharray="3 3" style="stroke:var(--rule)"/>`;
  else {
    body = `<circle r="${r}" fill="none" stroke-width="${w}" style="stroke:var(--rule)"/>`;
    let off = 0;
    [[sum.ok, "var(--p-okdark)"], [sum.mid, pColor(sum.state === "ok" ? "win" : sum.state)], [sum.bad, "var(--p-lowsoft)"]].forEach(([n, col]) => {
      if (!n) return; const len = C * n / sum.total;
      body += `<circle r="${r}" fill="none" stroke-width="${w}" stroke="${col}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90)"/>`;
      off += len;
    });
  }
  return `<svg class="pring" width="${size}" height="${size}" viewBox="${-h} ${-h} ${size} ${size}" aria-hidden="true">${body}<text x="0" y="${(fs/3).toFixed(1)}" text-anchor="middle" class="pring-t" style="font-size:${fs}px">${centerText}</text></svg>`;
}
function trendOf(dk, hist){
  const tests = rootTests().filter(a => a.questions.some(inChap(dk))); if (tests.length < 2) return "";
  const now = chapSummary(deckCards(dk), hist), prev = chapSummary(deckCards(dk), histByCard(tests[tests.length - 1].id));
  if (prev.state === "start") return "";

}
function dropOf(dk, hist){
  const tests = rootTests().filter(a => a.questions.some(inChap(dk))); if (tests.length < 2) return null;
  const last = tests[tests.length - 1], prevHist = histByCard(last.id);
  const now = chapSummary(deckCards(dk), hist), prev = chapSummary(deckCards(dk), prevHist);
  if (lvlOf(now) < 0 || lvlOf(prev) <= lvlOf(now)) return null;
  const lost = deckCards(dk).filter(k => { const ps = cardState(prevHist[k]), ns = cardState(hist[k]); return (ps === "ok" || ps === "mid") && ns === "bad"; });
  const prevTest = tests[tests.length - 2];

}
function pastille(dk, hist){
  if (!S.loaded) return "";
  const s = chapSummary(deckCards(dk), hist), dr = dropOf(dk, hist);
  const lab = s.state === "start" ? "Pas encore testé" : `${s.right} sur ${s.total} justes au dernier test, ${P_LABEL[s.state]}${dr ? ", avant : " + LVL_LABEL[lvlOf(dr.prev)] : ""}`;
  return `<div class="deck-pst" aria-label="${lab}">${ringSvg(s, 56, s.state === "start" ? "" : s.right + "/" + s.total, 13)}<span class="pst-l pst-${s.state}">${P_LABEL[s.state]}${s.state === "start" ? "" : trendOf(dk, hist)}</span>${dr ? `<span class="pst-notes">avant : ${LVL_LABEL[lvlOf(dr.prev)]}</span>` : ""}</div>`;
}
function globalPastille(hist){
  if (!S.loaded || !rootTests().length) return "";

  const sums = DECKS.map(d => chapSummary(deckCards(d.key), hist));
  const nOk = sums.filter(x => x.state === "ok").length, nWin = sums.filter(x => x.state === "win").length;
  return `<div class="pglob">${ringSvg(s, 70, s.pct + " %", 15)}<div class="pglob-x"><b>Avancement général · ${P_LABEL[s.state]}</b><span>${s.right} questions justes au dernier test sur ${s.total}, dont ${s.ok} acquises · ${s.bad} à revoir · ${s.new} pas encore posées</span><span>${nOk} objectif${nOk>1?"s":""} OK · ${nWin} réussi${nWin>1?"s":""}, à confirmer · sur ${DECKS.length}</span></div></div>
  <details class="plegend"><summary>Comment se lit l'anneau ?</summary>
  <p>Chaque objectif a un anneau. Au centre : tes questions justes au dernier test, sur le total de l'objectif.</p>
  <p>Dans l'anneau : en <b>vert foncé</b> les questions acquises (écrites justes deux jours différents), dans la couleur du niveau celles qui sont justes mais pas encore confirmées, en <b>rouge pâle</b> celles à revoir, en gris celles pas encore posées. Gris en pointillé : objectif pas encore testé.</p>
  <p>Couleur selon la note : <b>rouge</b> à revoir (moins de 4), <b>orange</b> en route (4 à 4,5), <b>vert</b> réussi (5 et plus), <b>vert foncé</b> OK ✓ (réussi et confirmé un autre jour). En maths, une question n'est acquise que si tu l'as écrite juste, pas seulement choisie.</p>
  <p>Seul le premier passage d'un test compte ; refaire ses erreurs aide à apprendre mais ne remplit pas l'anneau.</p></details>`;
}
const deckBad = (dk, hist) => deckCards(dk).filter(k => cardState(hist[k]) === "bad");
function redoCards(v){
  const hist = histByCard(); let keys;
  if (v === "resist") keys = resistant().map(x => x.k);
  else if (v.startsWith("lost:")){ const dr = dropOf(v.slice(5), hist); keys = dr ? dr.lost : []; }
  else keys = deckBad(v, hist);
  if (!keys.length) return;
  const set = new Set(keys), qs = []; let ex = 0, last = null;
  DECKS.forEach(d => d.items.forEach(it => { if (!set.has(cardKey(d.key, it.ref))) return; const b = d.key + "|" + it.consigne; if (b !== last){ ex++; last = b; } qs.push(makeQ(it, d, "hard", qs.length, ex)); }));
  S.selected = [...new Set(qs.map(q => q.deckKey))]; S.difficulty = "hard"; S.mode = "train"; S.frozen = null; S.rattrParent = null;

function resistant(){
  const m = {};
  rootTests().forEach(a => a.questions.forEach(x => { if (!x.question) return; const k = qCardKey(x); m[k] = m[k] || { k, word:x.question.prompt, ch:x.question.deckKey, n:0, miss:0 }; m[k].n++; if (!x.correct) m[k].miss++; }));
  return Object.values(m).filter(x => x.miss).sort((a, b) => b.miss - a.miss || b.miss / b.n - a.miss / a.n).slice(0, 5);

    ${sc.steps.map((st, k) => `<span>${k+1}${k?"e":"er"} rattrapage : ${st.ok} sur ${st.asked} → note ${fmtNote(st.note)}</span>`).join("")}

function suiviHeat(){
  const tests = rootTests(); if (!tests.length) return "";
  const days = [...new Set(tests.map(a => dayOf(a.date)))].slice(-6);
  const tested = new Set(tests.flatMap(a => a.questions.map(chapOfQ)));
  const chs = DECKS.filter(d => tested.has(d.key)), rest = DECKS.filter(d => !tested.has(d.key));
  const lab = d => { const [, m, j] = d.split("-"); return j.padStart(2,"0") + "." + m.padStart(2,"0"); };
  let h = `<div class="tbl heat"><table><thead><tr><th>Objectif</th>${days.map(d => `<th>${lab(d)}</th>`).join("")}</tr></thead><tbody>`;
  chs.forEach(d => {
    h += `<tr><td class="k">${esc(d.n)}</td>` + days.map(day => {
      const qs = tests.filter(a => dayOf(a.date) === day).flatMap(a => a.questions.filter(inChap(d.key)));
      if (!qs.length) return `<td class="hc-0">·</td>`;
      const pc = Math.round(qs.filter(x => x.correct).length / qs.length * 100), n = noteFrom(pc/100);
      return `<td class="${n>=5?"hc-ok":n>=4?"hc-mid":"hc-low"}">${pc}${n>=5?" ✓":""}</td>`;
    }).join("") + `</tr>`;
  });
  return h + `</tbody></table></div>${rest.length ? `<p class="fine">Pas encore testés : objectif${rest.length>1?"s":""} ${rest.map(d => d.n).join(", ")}.</p>` : ""}<p class="fine">Pourcentage de réponses justes au premier passage, par objectif et par jour (6 derniers jours). Vert et ✓ : note de 5 ou plus ; orange : 4 à 4,5 ; rouge : sous 4.</p>`;
}
function suiviBlock(){

  return `<section class="suivi"><h3>Ma courbe de notes</h3>
  <div class="suivi-ctl"><label class="fine" for="suivi-ch">Objectif</label><select id="suivi-ch" class="suivi-sel"><option value="all"${s.ch==="all"?" selected":""}>Tous les objectifs</option>${DECKS.map(d => `<option value="${d.key}"${s.ch===d.key?" selected":""}>${esc(d.n + " · " + d.title.replace("Variante — ",""))}</option>`).join("")}</select>
  <div class="row"><button class="ghost small${s.f==="all"?" on":""}" data-act="suiviF" data-v="all" aria-pressed="${s.f==="all"}">Tous les tests</button><button class="ghost small${s.f==="exam"?" on":""}" data-act="suiviF" data-v="exam" aria-pressed="${s.f==="exam"}">Niveau épreuve et épreuve blanche</button></div></div>

function chainTxt(a){
  if (a.rattrapage) return "";

let draftChain = Promise.resolve();
function draftLocalSet(obj){ try { localStorage.setItem(DRAFT_ID, JSON.stringify(obj)); return true; } catch(e){ return false; } }
function draftLocalGet(){ try { const v = localStorage.getItem(DRAFT_ID); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function draftWrite(obj){
  const okLocal = draftLocalSet(obj);
  if (store.mode === "db") draftChain = draftChain.then(() => store.setDoc(DRAFT_ID, obj)).then(() => { S.draftErr = false; }, () => { S.draftErr = !okLocal; draftErrShow(); });
  else if (store.mode === "memory"){ store.setDoc(DRAFT_ID, obj); S.draftErr = !okLocal; draftErrShow(); }
}
function draftErrShow(){ const m = document.getElementById("draft-err"); if (m) m.hidden = !S.draftErr; }
function draftSave(){
  const Q = S.quiz; if (!Q || Q.done) return;
  const d = { v:2, questions:Q.questions, i:Q.i, answers:Q.detail.map(x => x.typo ? { u:x.user, c:x.correct, t:1 } : { u:x.user, c:x.correct }),
    picked:Q.checked ? Q.picked : null, typed:Q.checked ? Q.typed : "", checked:Q.checked, ok:Q.ok,
    label:Q.label, start:Q.start || Date.now(), saved:Date.now(), rattrapage:!!S.rattrapage, rattrLabel:S.rattrLabel || "", rattrParent:S.rattrParent || null,
    selected:S.selected, difficulty:S.difficulty, mode:S.mode, order:S.order };
  S.draft = d; draftWrite(d);
}
function draftDetail(d){
  return (d.answers || []).map((x, k) => { const q = d.questions[k];
    return { num:q.num, ex:q.ex, ref:q.ref, prompt:q.prompt, user:x.u, answer:q.answer, correct:x.c, ...(x.t ? { typo:true } : {}), expl:q.expl, tag:q.tag, question:q }; });
}
const draftN = d => (d.answers || []).length;
const draftOk = d => !!(d && d.questions && d.questions.length && d.answers);
function draftPick(a, b){ const ta = a ? a.saved || 0 : -1, tb = b ? b.saved || 0 : -1; const w = ta >= tb ? a : b; return draftOk(w) ? w : null; }
function draftClear(){ S.draft = null; S.draftAsk = false; S.draftBlock = false; draftWrite({ vide:true, saved:Date.now() }); }
function draftResume(){
  const d = S.draft; if (!d) return;
  S.selected = d.selected.filter(k => DECK[k]); S.difficulty = d.difficulty; S.mode = d.mode; S.order = d.order || "paper"; S.frozen = null;
  S.rattrapage = d.rattrapage; S.rattrLabel = d.rattrLabel; S.rattrParent = d.rattrParent || null;
  S.quiz = { questions:d.questions, i:d.i, picked:d.picked, typed:d.typed || "", checked:!!d.checked, ok:!!d.ok, detail:draftDetail(d), finishing:false, done:false, start:d.start, label:d.label };
  S.lastResult = null; S.storeMsg = ""; S.quitAsk = false; S.draftAsk = false; S.draftBlock = false; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function draftBanner(){
  const d = S.draft; if (!d) return "";

    <div class="draft-row"><button class="ghost small" data-act="draftDrop">Oui, abandonner</button><button class="cta" data-act="draftNo">Non, je le garde</button></div></div>`;

/* ---------- quiz ---------- */
function startQuiz(questions, rattrapage){
  if (S.draft){ S.draftBlock = true; S.draftAsk = false; S.screen = "home"; render(); window.scrollTo(0,0); return; }
  S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, start:Date.now(), label: rattrapage ? S.rattrLabel : deckLabel(S.selected) };
  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.quitAsk = false; S.screen = "quiz";
  draftSave(); render(); window.scrollTo(0,0);
}
function typeHint(q){
  if (q.seq) return `Écris les 4 nombres dans l'ordre, avec le signe ${q.sign} entre chaque nombre.`;
  if (q.bounds) return "Écris les deux graduations avec « et » entre les deux : 47 000 et 48 000";
  return "";
}
function keysFor(q){ if (q.seq) return [q.sign]; if (q.bounds) return [" et "]; return []; }
function viewQuiz(){
  if (S.quitAsk) return quitView();
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode === "train";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>${draftErrLine()}
  <div class="badges"><span class="num">N° ${q.num}</span><span class="ref">Exercice ${q.ex} · ${esc(q.ref)}</span></div>
  <p class="consigne">${esc(q.consigne)}</p><p class="qword${isTxt(q.word) && !/\d{3}/.test(q.word) ? " txt" : ""}">${esc(q.word)}</p>`;
  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice" + (isTxt(o) ? "" : " nb");
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${Q.checked && o === q.answer ? "✓ " : Q.checked && o === Q.picked ? "✗ " : ""}${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    const numeric = !q.seq && !q.bounds && /^[\d\s ]+$/.test(q.answer);
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="Ta réponse…" inputmode="${numeric?"numeric":"text"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
    const ks = keysFor(q);
    if (ks.length && !Q.checked && !Q.finishing) h += `<div class="keys">${ks.map(k => `<button data-act="key" data-v="${esc(k)}" aria-label="Ajouter ${esc(k.trim())}">${esc(k.trim())}</button>`).join("")}</div>`;
    const hint = typeHint(q); if (hint && !Q.checked) h += `<p class="qhint">${esc(hint)}</p>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){
    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? "✓ " + ["Juste !","Bien vu.","Nickel.","Exact.","Tu l'as."][Q.i % 5] : "✗ Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b class="m">${esc(q.answer)}</b></p>`}<p class="fb-x">${esc(q.expl)}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], correct = isRight(q, val);
  if (S.mode === "train"){ Q.ok = correct; Q.checked = true; draftSave(); render(); }
  else record(val, correct);
}
function record(val, correct, typo){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.ref, prompt:q.prompt, user:val || "", answer:q.answer, correct, ...(typo ? { typo:true } : {}), expl:q.expl, tag:q.tag, question:q });
  if (Q.i + 1 >= Q.questions.length){ Q.done = true; Q.finishing = true; render(); finishQuiz(); }
  else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; draftSave(); render(); window.scrollTo(0,0); }
}
async function finishQuiz(){
  const Q = S.quiz, score = Q.detail.filter(x => x.correct).length, total = Q.detail.length, id = String(Date.now());
  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:"Mathématiques", theme:THEME, deck:Q.label,
    difficulty:DIFFICULTIES[S.difficulty].label, mode:MODES[S.mode].label, order:ORDERS[S.order].label, rattrapage:S.rattrapage, parent:S.rattrapage ? (S.rattrParent || null) : null,
    score, total, note:noteFrom(score/total), questions:Q.detail };
  S.attempts = [att, ...S.attempts.filter(a => a.id !== id)];
  try { await store.save(att); S.storeMsg = store.mode === "memory" ? "Ce résultat est affiché ici, mais il ne sera pas gardé si tu fermes la page. Note ta note ou copie-la pour le chat." : ""; }
  catch(e){ S.storeMsg = "Je n'ai pas pu enregistrer ce résultat : il disparaîtra si tu fermes la page. Note ta note ou copie-la pour le chat."; }
  draftClear();
  S.lastResult = att; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; S.screen = "results"; render(); window.scrollTo(0,0);
}

/* ---------- bilan ---------- */
function bilanState(id){ return S.bilan[id] || (S.bilan[id] = { busy:false, err:"", copied:false, fallback:"" }); }
function bilanBlock(att){
  const b = bilanState(att.id), a = att.analysis;

  if (!a && !HAS_CLAUDE) h += `<p class="fine">Pour savoir ce qui coince vraiment, copie tes résultats et colle-les dans le chat de révisions : on les analyse ensemble.</p>`;
  if (b.busy) h += `<p class="fine">Je regarde tes réponses une par une…</p>`;
  if (b.err) h += `<p class="warn">${esc(b.err)}</p>`;
  if (a){
    h += `<h3>Ton bilan</h3>`;
    if (a.points_forts.length) h += `<p class="bilan-lab">Ce qui est acquis</p><ul class="forts">${a.points_forts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (a.a_travailler.length) h += `<p class="bilan-lab">À travailler</p><ul class="work">${a.a_travailler.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (a.conseil) h += `<p class="bilan-tip">${esc(a.conseil)}</p>`;
  }
  if (canRetry) h += `<button class="cta" data-act="retryWrong" data-v="${att.id}">Refaire mes erreurs (${wrong.length})</button>`;

  if (b.fallback) h += `<p class="fine">La copie automatique est bloquée ici. Le texte est sélectionné : copie-le à la main.</p><textarea class="exportarea" readonly rows="8" id="fb-${att.id}">${esc(b.fallback)}</textarea>`;
  return h + `</div>`;
}
function findAttempt(id){ return (S.lastResult && S.lastResult.id === id) ? S.lastResult : S.attempts.find(a => a.id === id); }
const TAG_DESC = "v_o1 = décomposer un nombre (chiffre des milliers…, écrire en chiffres une décomposition, relier) ; v_o2 = mot-nombre vers écriture chiffrée et lecture ; v_o3 = comparer (< >), ordonner (croissant, décroissant), intercaler avec les mêmes chiffres ; v_o4 = entre quelles graduations d'une droite graduée ; v_o5 = ajouter ou enlever une dizaine, centaine, millier, dizaine de milliers (retenues) ; v_o6 = chiffre des… ou nombre entier de…";
async function analyse(id){
  const att = findAttempt(id), b = bilanState(id); b.busy = true; b.err = ""; render();
  try {
    const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
    if (!sample) throw new Error("no sample");
    const lignes = att.questions.map(q => `N° ${q.num}. [${q.tag}] (${q.ref}) ${q.prompt} | réponse de l'élève : ${q.user || "(rien)"} | attendu : ${q.answer} | ${q.correct ? "JUSTE" : "FAUX"}`).join("\n");
    const prompt = `Tu es un enseignant de mathématiques suisse, bienveillant, qui analyse le test d'un élève de 10 ans (7e HarmoS, canton de Neuchâtel). Il révise les nombres naturels inférieurs à 1 000 000 pour un test le ${DUE.long}.

Score : ${att.score}/${att.total} (note suisse ${fmtNote(att.note)}/6)${att.rattrapage ? " — RATTRAPAGE : seules les questions ratées d'un test précédent ont été rejouées" : ""}
Paquets : ${att.deck}
Niveau : ${att.difficulty} — Mode : ${att.mode}

Étiquettes : ${TAG_DESC}.

Détail :
${lignes}

Analyse les ERREURS pour trouver ce qui coince vraiment : rang confondu (dizaines de milliers / milliers), zéro oublié pour un rang vide, retenue oubliée quand il y a des 9, « chiffre des » confondu avec « nombre entier de », croissant confondu avec décroissant, graduation mal choisie ? Cherche le point commun, ne recopie pas la liste. S'il n'y a pas de motif clair, dis-le honnêtement.

Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, exactement dans ce format :
{"points_forts":["..."],"a_travailler":["..."],"conseil":"..."}
- "points_forts" : 1 à 3 points courts et concrets.
- "a_travailler" : 1 à 3 axes de progrès formulés positivement, avec l'exemple précis tiré du test.
- "conseil" : 2 phrases maximum, une action à faire ce soir.
Tu tutoies l'élève. Français de Suisse romande, phrases courtes, ton encourageant pour un enfant de 10 ans, pas bébé.`;
    const parsed = await sample.json(prompt, { modelTier:"default" });

  } catch(e){

}
function copyText(att){
  const a = att.analysis, l = [];

function copyFor(id){

  const key = `<h1>Corrigé</h1><p class="meta">${esc(meta)}</p>` + exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2>${e.qs.map(q => `<div class="k"><b>${q.num}.</b> <span class="t">${esc(q.word)}</span> → <b class="t">${esc(q.answer)}</b>${q.accept && q.accept.length > 1 && !q.bounds ? " (ou " + esc(q.accept.slice(1).join(", ")) + ")" : ""}<div class="x">${esc(q.expl)}</div></div>`).join("")}</section>`).join("");
  const head = `<h1>Mathématiques — Nombres naturels</h1><p class="meta">Prénom : Liano · test du ${DUE.long} · ${esc(meta)}</p><p class="meta">Date : ____________ &nbsp; Note : ______ / 6</p>`;
  const body = part === "ex" ? head + sheet : part === "key" ? key : head + sheet + `<div class="pb"></div>` + key;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths — Nombres naturels (${DUE.short})</title><style>
@page{size:A4 portrait;margin:12mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;max-width:186mm;padding:10px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14.5px;margin:14px 0 2px;border-bottom:1px solid #999}.meta{margin:2px 0;font-size:12.5px}.cons{font-style:italic;margin:2px 0 6px;font-size:13px}
.ex{break-inside:avoid}.q{margin:8px 0;font-size:14px;break-inside:avoid}.t{font-family:Menlo,Consolas,monospace}.ref{color:#777;font-size:11px}
.opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 0 18px;font-family:Menlo,Consolas,monospace}
.box{height:12mm;margin:4px 0 0 18px;border:1px solid #999;background-image:linear-gradient(#DDD 1px,transparent 1px),linear-gradient(90deg,#DDD 1px,transparent 1px);background-size:3mm 3mm}.box.wide{height:15mm}
.k{font-size:13.5px;margin:4px 0;break-inside:avoid}.x{font-size:11.5px;color:#555;margin-left:18px}.pb{break-before:page}
.print{position:fixed;top:10px;right:10px;padding:8px 14px;font-size:14px}@media print{.print{display:none}}
</style></head><body><button class="print" onclick="window.print()">Imprimer</button>${body}</body></html>`;
}
async function savePaper(part){
  const qs = S.frozen; S.paperMsg = ""; S.paperCopy = "";
  const names = { ex:"exercices", both:"exercices-et-corrige", key:"corrige" };
  const filename = `${DUE.iso}_maths-nombres-naturels-liano-${names[part]}.html`;
  try {
    if (!HAS_CLAUDE){
      const url = URL.createObjectURL(new Blob([paperHtml(qs, part)], { type:"text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.paperMsg = "Fichier téléchargé : ouvre-le, puis touche « Imprimer »."; render(); return;
    }
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code:"unavailable" };
    await dl.save({ filename, data:paperHtml(qs, part) });
  } catch(e){
    if (e && e.code === "declined"){ S.paperMsg = "Téléchargement annulé."; }
    else {
      S.paperMsg = "Le téléchargement ne passe pas ici. Copie le texte ci-dessous et colle-le dans le chat : je t'envoie la feuille de ce test exact.";
      S.paperCopy = "#PDF-MATHS-NOMBRES\n" + qs.map(q => `${q.num}. [Ex ${q.ex} ${q.ref} — ${q.consigne}] ${q.word}${q.options ? " | " + q.options.join(" / ") : ""} → ${q.answer}`).join("\n");
    }
  }
  render();
}

/* ---------- chargement de l'historique + test en cours ---------- */
async function loadHistory(){
  try {
    await store.init();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && !!prev.rattrapage === !!a.rattrapage && prev.total === a.total && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  try { let dd = null; try { dd = await store.getDoc(DRAFT_ID); } catch(e){} const d = draftPick(dd, draftLocalGet()); if (!S.quiz) S.draft = d; } catch(e){}
  S.loaded = true;
  render();
}

/* ---------- événements ---------- */
function resetFrozen(){ S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; }
function setTyped(v){ const Q = S.quiz; Q.typed = v; const b = document.getElementById("validate-btn"); if (b) b.disabled = !v.trim(); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, Q = S.quiz;
  switch(act){
    case "nav": S.draftBlock = false; S.screen = v; S.scores.confirm = false; render(); window.scrollTo(0,0); break;
    case "fiche": S.ficheOpen = S.ficheOpen === +v ? -1 : +v; render(); break;
    case "toggle": S.selected = S.selected.includes(v) ? S.selected.filter(x => x !== v) : ALL_KEYS.filter(k => k === v || S.selected.includes(k)); resetFrozen(); render(); break;
    case "allDecks": S.selected = S.selected.length === DECKS.length ? [] : [...ALL_KEYS]; resetFrozen(); render(); break;
    case "toCards": S.screen = "cards"; render(); break;
    case "flip": S.cards.flip = !S.cards.flip; render(); break;
    case "card": { const n = cardItems().length; S.cards.flip = false; S.cards.pos = (S.cards.pos + (+v) + n) % n; render(); break; }
    case "cardShuffle": S.cards.order = shuffle(S.cards.order); S.cards.pos = 0; S.cards.flip = false; render(); break;
    case "limit": S.limit = v; resetFrozen(); render(); break;
    case "diff": S.difficulty = v; resetFrozen(); render(); break;
    case "order": S.order = v; resetFrozen(); render(); break;
    case "mode": S.mode = v; render(); break;
    case "freeze": S.frozen = buildTest(S.selected, S.difficulty, S.order, S.limit); render(); break;
    case "unfreeze": resetFrozen(); render(); break;
    case "paper": savePaper(v); break;
    case "start": S.rattrParent = null; startQuiz(S.frozen || buildTest(S.selected, S.difficulty, S.order, S.limit), false); break;
    case "quit": S.quitAsk = true; render(); break;
    case "quitKeep": draftSave(); S.quiz = null; S.quitAsk = false; S.screen = "home"; render(); window.scrollTo(0,0); break;
    case "quitDrop": draftClear(); S.quiz = null; S.quitAsk = false; S.screen = "home"; render(); window.scrollTo(0,0); break;
    case "quitNo": S.quitAsk = false; render(); break;
    case "draftResume": draftResume(); break;
    case "draftAsk": S.draftAsk = true; render(); break;
    case "draftNo": S.draftAsk = false; render(); break;
    case "draftDrop": draftClear(); render(); break;
    case "pick": { if (Q.checked || Q.done) return; const q = Q.questions[Q.i]; Q.picked = q.options[+v]; if (S.mode === "train") validate(Q.picked); else render(); break; }
    case "key": { const inp = document.getElementById("answer-input"); if (!inp) break;
      const s = inp.selectionStart != null ? inp.selectionStart : inp.value.length, en = inp.selectionEnd != null ? inp.selectionEnd : s;
      inp.value = inp.value.slice(0, s) + v + inp.value.slice(en); setTyped(inp.value); inp.focus(); try { inp.setSelectionRange(s + v.length, s + v.length); } catch(err){} break; }
    case "validate": { const q = Q.questions[Q.i]; if (q.type === "type"){ const inp = document.getElementById("answer-input"); Q.typed = inp ? inp.value : Q.typed; if (Q.typed.trim()) validate(Q.typed); } else if (Q.picked !== null) validate(Q.picked); break; }
    case "dontknow": { const q = Q.questions[Q.i]; if (S.mode === "train"){ Q.ok = false; Q.checked = true; if (q.type === "mcq") Q.picked = null; else Q.typed = ""; draftSave(); render(); } else record("", false); break; }
    case "typo": record(Q.typed, true, true); break;
    case "next": { const q = Q.questions[Q.i]; record(q.type === "mcq" ? Q.picked : Q.typed, Q.ok); break; }
    case "showErr": { const b = bilanState(v); b.errOnly = !errView(v); render(); break; }
    case "analyse": analyse(v); break;
    case "copy": copyFor(v); break;
    case "retryWrong": retryWrong(v); break;
    case "redoCards": redoCards(v); break;
    case "suiviF": S.suivi.f = v; S.suivi.pt = null; render(); break;
    case "suiviPt": S.suivi.pt = S.suivi.pt === v ? null : v; render(); break;
    case "openAttempt": S.scores.open = S.scores.open === v ? null : v; render(); break;
    case "exportToggle": S.scores.exportOpen = !S.scores.exportOpen; render(); break;
    case "clearAsk": S.scores.confirm = true; render(); break;
    case "clearNo": S.scores.confirm = false; render(); break;
    case "clearYes": (async () => {
      const ids = S.attempts.map(a => a.id); S.attempts = []; S.scores = { open:null, exportOpen:false, confirm:false }; render();
      let failed = false; for (const id of ids){ try { await store.remove(id); } catch(err){ failed = true; } }
      if (failed){ S.loadErr = "L'effacement n'a pas pu être enregistré partout. Recharge la page et réessaie."; render(); }
    })(); break;
  }
});
document.addEventListener("change", e => { if (e.target && e.target.id === "suivi-ch"){ S.suivi.ch = e.target.value; S.suivi.pt = null; render(); } });
document.addEventListener("input", e => { if (e.target.id === "answer-input" && S.quiz) setTyped(e.target.value); });
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.classList && e.target.classList.contains("ch-pt")){ e.preventDefault(); const v = e.target.dataset.v; S.suivi.pt = S.suivi.pt === v ? null : v; render(); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });

render();
loadHistory();
</script>

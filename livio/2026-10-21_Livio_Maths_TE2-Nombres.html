<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>
<title>Nombres TE2 · Livio · 21.10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Droite graduée : le côté négatif en corail, le côté positif en sarcelle, le zéro au milieu.
   Les calculs sont en chasse fixe, comme écrits au cahier. */
:root{
  --paper:#EEF2F4; --sheet:#FFFFFF; --ink:#16212E; --soft:#566475; --rule:#C7D1DA;
  --pos:#0F6E74; --pos-wash:#DDEFF0; --neg:#C2491D; --neg-wash:#FBE6DC; --mark:#E8B500; --board:#16212E;
  --good:#11704B; --good-wash:#DCF1E6; --bad:#B23A26; --bad-wash:#F9E1DB; --on-accent:#FFFFFF;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E151C; --sheet:#17212B; --ink:#E5ECF1; --soft:#9AA9B7; --rule:#2A3743;
  --pos:#4CC3C9; --pos-wash:#12302F; --neg:#FF8F66; --neg-wash:#3A2219; --mark:#E8B500; --board:#0A1016;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-accent:#0B1A1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E151C; --sheet:#17212B; --ink:#E5ECF1; --soft:#9AA9B7; --rule:#2A3743;
  --pos:#4CC3C9; --pos-wash:#12302F; --neg:#FF8F66; --neg-wash:#3A2219; --mark:#E8B500; --board:#0A1016;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-accent:#0B1A1B; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.m{font-family:var(--mono);font-weight:500}

.head{display:flex;gap:14px;align-items:center}
.badge{width:60px;height:60px;flex:none;border-radius:6px;background:var(--board);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge small{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--mark)}
.badge b{font-family:var(--display);font-weight:800;font-size:28px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,38px);line-height:.95;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--soft);font-size:14px}
.axis{display:block;width:100%;height:auto;margin:10px 0 16px}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:700;font-size:19px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 8px 8px 0;margin:0}
.note{background:var(--pos-wash);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--pos);font-weight:700;padding:0;cursor:pointer}

.cta{width:100%;padding:15px;border:0;border-radius:6px;background:var(--pos);color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost:disabled{opacity:.5;cursor:not-allowed}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.entry.open{border-color:var(--pos)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-num{flex:none;min-width:38px;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--pos);border:1px solid var(--pos);border-radius:3px;text-align:center;padding:1px 4px}
.entry-num.miss{color:var(--neg);border-color:var(--neg)}
.entry-title{flex:1;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.entry-body{padding:0 14px 14px}
.pair{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-k{font-family:var(--mono);font-weight:700;color:var(--pos);overflow-wrap:anywhere}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:var(--pos-wash);font-size:14px}
.astuce b{display:block;color:var(--pos);margin-bottom:2px}
.astuce.neg{background:var(--neg-wash)} .astuce.neg b{color:var(--neg)}
.tip{margin:0;padding:6px 0 6px 12px;border-left:3px solid var(--mark);font-size:15px}
.src-date{font-weight:400;color:var(--soft);font-size:13px;font-family:var(--body)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;max-width:100%;border:1px dashed var(--rule);border-radius:6px;color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}

/* paquets */
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.deck.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash)}
.deck-c{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--pos)}
.deck-t{font-weight:700;font-size:14.5px;line-height:1.25;padding-right:14px}
.deck-n{font-size:12.5px;color:var(--soft)}
.deck-tick{position:absolute;top:9px;right:10px;color:var(--pos);font-weight:800}
.deck-star{display:inline-block;font-size:11px;font-weight:700;color:var(--neg);margin-top:2px}

/* cartes */
.flash{position:relative;height:240px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--neg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;transition:transform .45s;text-align:center}
.face.b{transform:rotateY(180deg);background:var(--pos-wash);border-color:var(--pos);border-top-color:var(--pos)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:12px;font-weight:700;color:var(--soft)}
.face-word{font-family:var(--mono);font-weight:700;font-size:25px;line-height:1.25;overflow-wrap:anywhere}
.face-mini{font-size:13.5px;line-height:1.45}
.face-hint{position:absolute;bottom:12px;font-size:12px;color:var(--soft)}

/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:11px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash);color:var(--pos)}
.paper{background:var(--sheet);border:1px dashed var(--pos);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:10px;border-radius:2px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--board);color:var(--mark);padding:2px 9px;border-radius:3px;font-variant-numeric:tabular-nums}
.ref{font-size:12.5px;color:var(--soft)}
.consigne{margin:0;font-size:14.5px;color:var(--soft)}
.qword{font-family:var(--mono);font-weight:700;font-size:clamp(23px,6.5vw,30px);line-height:1.3;margin:0;overflow-wrap:anywhere}
.qhint{margin:0;font-size:14px;color:var(--soft)}
.choice{padding:14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:16px;font-weight:700;cursor:pointer;line-height:1.35}
.choice.expr{font-family:var(--mono);font-size:18px}
.choice.sel{border-color:var(--pos);box-shadow:inset 0 0 0 2px var(--pos)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink)}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:44px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font-family:var(--mono);font-weight:700;font-size:16px;cursor:pointer}
.preview{font-family:var(--mono);font-size:15px;color:var(--soft);margin:0;min-height:1.4em}
.fb{padding:14px;border-radius:6px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:700;font-size:19px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}

/* résultats */
.scorebox{background:var(--board);border-radius:8px;padding:18px;text-align:center;border:4px solid #2A3743}
.scorebox.rattr-box{border-color:var(--neg)}
.score-n{font-family:var(--display);font-weight:800;font-size:58px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.score-n small{font-size:30px;color:#9AA9B7}
.score-note{display:inline-block;margin-top:8px;background:var(--mark);color:#16212E;font-weight:800;padding:4px 14px;border-radius:3px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#FF8F66}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-q .m{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}

/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:19px;margin:0}
.bilan-lab{font-size:13px;font-weight:700;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan ul.forts li{color:var(--good)}
.bilan ul.work li{color:var(--bad)}
.bilan-tip{background:var(--pos-wash);border-radius:6px;padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--mono)}

/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--board);border-radius:6px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--mark);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#C9D3E0}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.rattr-tag{display:inline-block;background:var(--neg);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;margin-right:6px}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--on-accent)}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:3px solid var(--pos);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--soft)}
.tab-e{font-size:18px} .tab-l{font-size:11px;font-weight:700}
.tab.on{color:var(--pos);background:var(--pos-wash)}

/* voir mes erreurs : lisible sans les couleurs (barré + fond foncé = faux ; souligné + fond clair = ce qu'il fallait) */
.dx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px;color:var(--soft)}
.dx-line{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline;margin:2px 0!important}
.dx-lab{font-size:12.5px!important;font-weight:700;color:var(--soft)}
.dx-ans.txt{font-family:var(--body)}
.dx-ans{font-family:var(--mono);font-size:17px;font-weight:700;overflow-wrap:anywhere;line-height:1.7}
.dx-bad{background:#A3241B;color:#fff;text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:1px 3px}
.dx-good{background:#D4F0E1;color:#08402A;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;padding:1px 3px;font-weight:800}
.dx-none{font-style:italic;font-weight:400;color:var(--soft);font-family:var(--body)}

@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}
</style>

const QUIZ_ID = "livio-quiz-maths-te2-nombres";

const INDEX_KEY = QUIZ_ID + "-index";

const SOURCES_NOTE = "Tous les énoncés, nombres et consignes viennent de ces documents. La fiche « Puissances et racines » n'est pas encore corrigée par le maître : ses réponses ont été calculées et vérifiées par un programme avec les règles des encadrés. Pas encore couverts, faute de document : multiplication et division dans les entiers relatifs, racines carrées et cubiques, exercices du livre, des fiches et du FLP. La correction de chaque question indique d'où elle vient.";
/* Photos : seulement dans la version Claude (privée), jamais sur le site public. */
const PHOTOS = [
  { titre:"Objectifs TE2", url:"/_blob/1987fed1447b674bd8706879c4d775af" },
  { titre:"Cahier § 1 à 4", url:null },
  { titre:"Cahier § 5 et 6", url:null },

  { titre:"Cahier § 14 à 16", url:"/_blob/2039940ff786a3eca26b73e37233130d" },

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","−":"⁻","-":"⁻","·":"·"};
/* « 2^9 » → « 2⁹ », « 2^(4+5) » → « 2⁴⁺⁵ » */
function uni(s){
  return String(s == null ? "" : s).replace(/\^\(([^)]*)\)|\^([0-9]+)/g, (m, a, b) => [...(a != null ? a : b)].map(c => SUP[c] || c).join(""));
}
const UNSUP = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-","⁺":"+"};
function normMath(s, dotIsTimes){
  let t = String(s || "").toLowerCase().trim();
  t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "^(" + [...m].map(c => UNSUP[c]).join("") + ")");
  t = t.replace(/[−–—]/g, "-").replace(/[×*x∙•]/g, "·").replace(/[\s'’]/g, "");
  if (dotIsTimes) t = t.replace(/\./g, "·");
  t = t.replace(/,/g, ".").replace(/:/g, "/");
  t = t.replace(/\^\((\d+)\)/g, "^$1").replace(/^\+/, "");
  if (/^-?\d+(\.\d+)?$/.test(t)) t = String(parseFloat(t));
  return t;
}
function numbersOf(s){ const m = String(s || "").replace(/[\s'’]/g, "").replace(/[−–]/g, "-").match(/-?\d+(?:[.,]\d+)?/g); return m ? m.map(x => parseFloat(x.replace(",", "."))) : []; }
function factors(s){
  const t = normMath(s, true); if (!t) return null;
  const out = [];
  for (const part of t.split("·")){
    const m = part.match(/^(\d+)(?:\^(\d+))?$/); if (!m) return null;
    for (let k = 0; k < (m[2] ? +m[2] : 1); k++) out.push(+m[1]);
  }
  return out.sort((a,b) => a - b).join("|");
}
function matchAnswer(input, q){
  if (!input || !String(input).trim()) return false;
  if (q.set){
    const ref = numbersOf(q.accept[0]).sort((a,b) => a-b).join("|"), mine = numbersOf(input).sort((a,b) => a-b).join("|");
    return ref === mine;
  }
  if (q.fact){ const f = factors(input); return f !== null && q.accept.some(a => factors(a) === f); }
  const me = normMath(input);
  return q.accept.some(a => normMath(a) === me);
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pickOptions(good, wrong, pool){
  const seen = new Set([normMath(good)]), out = [];
  const add = v => { if (v == null || out.length >= 3) return; const k = normMath(v); if (seen.has(k)) return; seen.add(k); out.push(v); };
  if (wrong && wrong.length){ shuffle(wrong).forEach(add); return shuffle([good, ...out]); }
  shuffle(pool).forEach(x => add(x.back[0]));
  return shuffle([good, ...out]);
}

/* ---------- fabrication du test ---------- */
function sampleDeck(d, n){
  const items = d.items.map((it, idx) => ({ it, idx }));
  if (n === "all" || items.length <= +n) return items.map(x => x.it);
  const groups = []; let last = null;
  items.forEach(x => { const c = (x.it.ex || "") + "|" + x.it.consigne; if (c !== last){ groups.push([]); last = c; } groups[groups.length-1].push(x); });
  const pools = groups.map(g => shuffle(g)), picked = []; let gi = 0;
  while (picked.length < +n && pools.some(p => p.length)){ const p = pools[gi % pools.length]; if (p.length) picked.push(p.pop()); gi++; }
  return picked.sort((a,b) => a.idx - b.idx).map(x => x.it);
}
function buildTest(keys, difficulty, order, limit){
  let list = [];
  DECKS.filter(d => keys.includes(d.key)).forEach(d => sampleDeck(d, limit).forEach(it => list.push({ it, d })));
  if (order === "mixed") list = shuffle(list);
  let ex = 0, lastBlock = null;
  return list.map(({ it, d }, i) => {
    const block = d.key + "|" + it.consigne + "|" + (it.ex || "");
    if (block !== lastBlock){ ex++; lastBlock = block; }
    const asMcq = !it.writeOnly && (it.mcqOnly || difficulty === "easy" || (difficulty === "normal" && Math.random() < 0.5));
    const q = { id:"q"+(i+1), num:i+1, ex, exTitle:d.title, deckKey:d.key, tag:d.key, code:d.code, ref:d.code + " " + it.ref, consigne:it.consigne,
      word:it.front, prompt:`${it.consigne} ${uni(it.front)}`, answer:it.back[0],
      expl:it.expl + " — " + (it.src || d.src) + ", " + it.ref + ".", set:!!it.set, fact:!!it.fact, expr:!!it.expr };
    if (asMcq){ q.type = "mcq"; q.options = pickOptions(it.back[0], it.wrong, d.items); }
    else { q.type = "type"; q.accept = it.back; }
    return q;
  });
}

/* ---------- quiz ---------- */
function startQuiz(questions, rattrapage){
  S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, label: rattrapage ? S.rattrLabel : deckLabel(S.selected) };
  S.rattrapage = rattrapage; S.lastResult = null; S.storeMsg = ""; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function typeHint(q){
  if (q.set) return "Écris les nombres séparés par des points-virgules : 1 ; 2 ; 3";
  if (q.fact) return "Tape 2^2·5^2 (ou 2·2·5·5). Le point · ou * pour multiplier.";
  if (q.expr && /\^/.test(q.answer)) return "Tape l'exposant avec ^ : 2^9, (−2)^5";
  if (q.expr && /\//.test(q.answer)) return "Tape la fraction avec / : 1/27";
  if (q.expr) return "Écris le calcul sans parenthèses, sans le faire.";
  return "";
}
function keysFor(q){
  const k = ["−"];
  if (q.expr || q.fact) k.push("^", "(", ")");
  if (q.fact) k.push("·");
  if (q.expr && /\//.test(q.answer)) k.push("/");
  if (q.expr && /[+−] /.test(q.answer)) k.push("+");
  if (q.set) k.push(";");
  return k;
}
function viewQuiz(){
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode === "train";
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Quitter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>
  <div class="badges"><span class="num">N° ${q.num}</span><span class="ref">Exercice ${q.ex} · ${esc(q.ref)}</span></div>
  <p class="consigne">${esc(q.consigne)}</p><p class="qword">${esc(uni(q.word))}</p>`;
  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice" + (isExpr(o) && o.length < 16 ? " expr" : "");
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${Q.checked && o === q.answer ? "✓ " : Q.checked && o === Q.picked ? "✗ " : ""}${esc(uni(o))}</button>`;
    }).join("") + `</div>`;
  } else {
    const hint = typeHint(q);
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="Ta réponse…" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
    if (!Q.checked && !Q.finishing) h += `<div class="keys">${keysFor(q).map(k => `<button data-act="key" data-v="${esc(k)}" aria-label="Ajouter ${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
    h += `<p class="preview" id="preview">${Q.typed ? "Tu as écrit : " + esc(uni(Q.typed.replace(/\^(\d+)/g, "^$1"))) : ""}</p>`;
    if (hint && !Q.checked) h += `<p class="qhint">${esc(hint)}</p>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){
    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? "✓ " + ["Juste !","Bien vu.","Nickel.","Exact.","Tu l'as."][Q.i % 5] : "✗ Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b class="m">${esc(uni(q.answer))}</b></p>`}<p class="fb-x">${esc(q.expl)}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], correct = isRight(q, val);
  if (S.mode === "train"){ Q.ok = correct; Q.checked = true; render(); }
  else record(val, correct);
}
function record(val, correct){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.ref, prompt:q.prompt, user:val || "", answer:q.answer, correct, expl:q.expl, tag:q.tag, question:q });
  if (Q.i + 1 >= Q.questions.length){ Q.done = true; Q.finishing = true; render(); finishQuiz(); }
  else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; render(); window.scrollTo(0,0); }
}
async function finishQuiz(){
  const Q = S.quiz, score = Q.detail.filter(x => x.correct).length, total = Q.detail.length, id = String(Date.now());
  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:"Mathématiques", theme:THEME, deck:Q.label,
    difficulty:DIFFICULTIES[S.difficulty].label, mode:MODES[S.mode].label, order:ORDERS[S.order].label, rattrapage:S.rattrapage, score, total, note:noteFrom(score/total), questions:Q.detail };
  S.attempts = [att, ...S.attempts.filter(a => a.id !== id)];
  try { await store.save(att); S.storeMsg = store.mode === "memory" ? "Ce résultat est affiché ici, mais il ne sera pas gardé si tu fermes la page. Note ta note ou copie-la pour le chat." : ""; }
  catch(e){ S.storeMsg = "Je n'ai pas pu enregistrer ce résultat : il disparaîtra si tu fermes la page. Note ta note ou copie-la pour le chat."; }
  S.lastResult = att; S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; S.screen = "results"; render(); window.scrollTo(0,0);
}

function bilanState(id){ return S.bilan[id] || (S.bilan[id] = { busy:false, err:"", copied:false, fallback:"" }); }
function bilanBlock(att){

  if (b.fallback) h += `<p class="fine">La copie automatique est bloquée ici. Le texte est sélectionné : copie-le à la main.</p><textarea class="exportarea" readonly rows="8" id="fb-${att.id}">${esc(b.fallback)}</textarea>`;
  return h + `</div>`;
}
function findAttempt(id){ return (S.lastResult && S.lastResult.id === id) ? S.lastResult : S.attempts.find(a => a.id === id); }
const TAG_DESC = "cah1 = nombres, rangs, vocabulaire, priorités ; cah6 = multiples, diviseurs, nombres premiers, pgdc et ppmc par les listes ; crit = critères de divisibilité ; cah9 = décomposition en facteurs premiers ; cah10 = pgdc et ppmc par la décomposition ; cah11 = puissances, carrés et cubes parfaits du cahier ; pui1 = fiche puissances ex. 1 à 4 (a⁰, a¹, calculs de puissances, produit et quotient de puissances de même base) ; pui2 = fiche puissances ex. 5 et 6 (puissance d'une puissance, puissance d'une fraction) ; tcar / tcub = tables des carrés et cubes parfaits ; cah14 = addition et soustraction d'entiers relatifs ; cah16 = simplifications d'écriture dans les relatifs";
async function analyse(id){
  const att = findAttempt(id), b = bilanState(id); b.busy = true; b.err = ""; render();
  try {
    const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
    if (!sample) throw new Error("no sample");
    const lignes = att.questions.map(q => `N° ${q.num}. [${q.tag}] (${q.ref}) ${q.prompt} | réponse de l'élève : ${q.user || "(rien)"} | attendu : ${uni(q.answer)} | ${q.correct ? "JUSTE" : "FAUX"}`).join("\n");
    const prompt = `Tu es un professeur de mathématiques suisse, bienveillant, qui analyse le test d'un élève de 13 ans (10e HarmoS, niveau 2, canton de Neuchâtel). Il prépare le TE2 « Nombres » pour le ${DUE.long}, sans calculatrice : puissances, carrés et cubes parfaits, décomposition en facteurs premiers, pgdc et ppmc, critères de divisibilité, entiers relatifs (addition, soustraction, simplification d'écriture).

Score : ${att.score}/${att.total} (note suisse ${fmtNote(att.note)}/6)${att.rattrapage ? " — RATTRAPAGE : seules les questions ratées d'un test précédent ont été rejouées" : ""}
Paquets : ${att.deck}
Niveau : ${att.difficulty} — Mode : ${att.mode}

Étiquettes : ${TAG_DESC}.
Dans les réponses, ^ note un exposant (2^9 = 2⁹).

Détail :
${lignes}

Analyse les ERREURS pour trouver ce qui coince vraiment : facteur sans exposant oublié (3 · 3² = 3³), parenthèses perdues autour d'une base négative, exposants additionnés au lieu de soustraits ou multipliés, carré confondu avec le double, règle des signes dans les relatifs, facteur oublié dans un pgdc ou un ppmc, liste de diviseurs incomplète ? Cherche le point commun, ne recopie pas la liste. S'il n'y a pas de motif clair, dis-le honnêtement.

Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, exactement dans ce format :
{"points_forts":["..."],"a_travailler":["..."],"conseil":"..."}
- "points_forts" : 1 à 3 points courts et concrets.
- "a_travailler" : 1 à 3 axes de progrès formulés positivement, avec l'exemple précis tiré du test.
- "conseil" : 2 phrases maximum, une action à faire ce soir.
Tu tutoies l'élève. Français de Suisse romande, ton encourageant, pas enfantin.`;
    const parsed = await sample.json(prompt, { modelTier:"default" });
    att.analysis = { points_forts: Array.isArray(parsed.points_forts) ? parsed.points_forts : [], a_travailler: Array.isArray(parsed.a_travailler) ? parsed.a_travailler : [], conseil: parsed.conseil || "" };
    try { await store.save(att); } catch(e){}
  } catch(e){
    b.err = "Le bilan n'a pas pu être calculé ici. Le bouton de copie fonctionne quand même : colle tes résultats dans le chat et je les analyse là.";
  }
  b.busy = false; render();
}
function copyText(att){
  const a = att.analysis, l = [];
  l.push((att.rattrapage ? "RATTRAPAGE — " : "RÉSULTAT — ") + "Maths, TE2 « Nombres » (épreuve du " + DUE.short + ")");
  l.push(`${dateLabel(att.date)} · ${att.deck} · ${att.difficulty} · ${att.mode}`);
  l.push(`Score : ${att.score}/${att.total} — note ${fmtNote(att.note)}/6`, "");
  if (a){ l.push("BILAN"); if (a.points_forts.length) l.push("Acquis : " + a.points_forts.join(" · ")); if (a.a_travailler.length) l.push("À travailler : " + a.a_travailler.join(" · ")); if (a.conseil) l.push("Conseil : " + a.conseil); l.push(""); }
  const wrong = att.questions.filter(q => !q.correct);
  l.push(`ERREURS (${wrong.length}/${att.total})`);
  if (!wrong.length) l.push("Aucune erreur.");
  wrong.forEach(q => l.push(`- N° ${q.num} [${q.ref}] ${q.prompt} → j'ai répondu « ${uni(q.user) || "rien"} », attendu : ${uni(q.answer)}`));
  return l.join("\n");
}
function copyFor(id){
  const att = findAttempt(id), b = bilanState(id), text = copyText(att);
  const fail = () => { b.fallback = text; render(); setTimeout(() => { const t = document.getElementById("fb-" + id); if (t){ t.focus(); t.select(); } }, 30); };
  try { navigator.clipboard.writeText(text).then(() => { b.copied = true; render(); setTimeout(() => { b.copied = false; render(); }, 2500); }, fail); }
  catch(e){ fail(); }
}
function retryWrong(id){
  const att = findAttempt(id);
  const qs = att.questions.filter(x => !x.correct && x.question).map(x => x.question);
  if (!qs.length) return;
  S.rattrLabel = att.deck;
  startQuiz(shuffle(qs), true);
}

/* ---------- voir mes erreurs : réponse fausse marquée en entier (couche Maths) ---------- */
const dxBad = t => `<del class="dx-bad">${esc(t)}</del>`;
const dxGood = t => `<ins class="dx-good">${esc(t)}</ins>`;
function dxLegend(){ return `<p class="dx-legend"><span>${dxBad("barré")} = ce qui était faux</span><span>${dxGood("souligné")} = la bonne réponse</span></p>`; }
function errCard(q){
  const Q = q.question || {}, isMcq = Q.type === "mcq", user = (q.user || "").trim();
  const U = user ? dxBad(uni(user)) : `<span class="dx-none">rien</span>`;
  return `<div class="revcard"><p class="rev-q">N° ${q.num} · ${esc(q.prompt)}</p>
    <p class="dx-line"><span class="dx-lab">✗ ${isMcq ? "Tu as choisi" : "Tu as écrit"}</span><span class="dx-ans${/[a-zà-ÿ]{3}/i.test(user) ? " txt" : ""}">${U}</span></p>
    <p class="dx-line"><span class="dx-lab">✓ Il fallait</span><span class="dx-ans${/[a-zà-ÿ]{3}/i.test(q.answer) ? " txt" : ""}">${dxGood(uni(q.answer))}</span></p>
    <p class="rev-x">${esc(q.expl)}</p></div>`;
}
function revCard(q){
  return `<div class="revcard ok"><p class="rev-q">N° ${q.num} · ${esc(q.prompt)}</p><p class="rev-good">✓ Ta réponse : <b class="m">${esc(uni(q.user))}</b></p><p class="rev-x">${esc(q.expl)}</p></div>`;
}
function errView(id){ const b = bilanState(id); return b.errOnly != null ? b.errOnly : S.screen === "results"; }
function questionList(att){
  const only = errView(att.id), wrong = att.questions.filter(q => !q.correct), list = only ? wrong : att.questions;
  return (wrong.length ? dxLegend() : "") + list.map(q => q.correct ? revCard(q) : errCard(q)).join("");
}
function viewResults(){
  const att = S.lastResult, pct = Math.round(att.score/att.total*100), wrong = att.questions.filter(q => !q.correct);
  const msg = pct === 100 ? "Sans faute. Tu peux aborder mercredi tranquille." : pct >= 80 ? "Solide. Repasse juste sur les quelques ratés." : pct >= 60 ? "La base est là. Refais tes erreurs, tu vas vite grimper." : pct >= 40 ? "Bon début. Relis la fiche, puis refais un tour en Échauffement." : "C'est le moment de relire la fiche tranquillement, règle par règle. Ça viendra.";
  return `<div class="scorebox${att.rattrapage ? " rattr-box" : ""}"><div class="score-n">${att.score}<small>/${att.total}</small></div><span class="score-note">note ${fmtNote(att.note)}</span>${att.rattrapage ? `<span class="rattr">Rattrapage — ${att.total} question${att.total>1?"s":""} ratée${att.total>1?"s":""} rejouée${att.total>1?"s":""}</span>` : ""}</div>
  <p class="intro">${msg}</p>${S.storeMsg ? `<p class="warn">${esc(S.storeMsg)}</p>` : ""}
  ${bilanBlock(att)}
  <p class="lab">${!wrong.length ? "Aucune erreur" : errView(att.id) ? `Mes erreurs (${wrong.length})` : `Toutes les questions (${att.total})`}</p>
  <div class="rev">${questionList(att)}</div>
  <div class="row"><button class="ghost" data-act="start">Refaire le test</button><button class="ghost" data-act="nav" data-v="home">Paquets</button></div>`;
}

function viewScores(){
  if (!S.loaded) return `<p class="lab">Mes scores</p><p class="fine">Je récupère tes résultats…</p>`;
  const list = S.attempts;
  if (!list.length) return `<p class="lab">Mes scores</p>${S.loadErr ? `<p class="warn">${esc(S.loadErr)}</p>` : ""}<p class="intro">Rien pour l'instant. Fais un premier test : la date, la note et le détail de chaque question s'enregistreront ici.</p><button class="cta" data-act="nav" data-v="setup">Faire un test</button>`;
  const best = Math.max(...list.map(a => a.note)), avg = list.reduce((s,a) => s + a.note, 0)/list.length;
  const exportText = list.map(a => `${dateLabel(a.date)} — ${a.rattrapage ? "RATTRAPAGE · " : ""}${a.deck} (${a.difficulty}, ${a.mode}) : ${a.score}/${a.total} → note ${fmtNote(a.note)}`).join("\n");
  let h = `<p class="lab">Mes scores</p>${S.loadErr ? `<p class="warn">${esc(S.loadErr)}</p>` : ""}
  ${store.mode === "local" ? `<p class="note">Tes scores sont gardés dans ce navigateur uniquement. Exporte-les de temps en temps.</p>` : ""}
  <div class="stats"><div class="stat"><b>${list.length}</b><span>tests</span></div><div class="stat"><b>${fmtNote(best)}</b><span>meilleure</span></div><div class="stat"><b>${fmtNote(avg)}</b><span>moyenne</span></div></div>
  <div class="rev">`;
  list.forEach(a => {
    const open = S.scores.open === a.id;
    h += `<div class="attempt"><button class="attempt-head" data-act="openAttempt" data-v="${a.id}" aria-expanded="${open}"><span class="attempt-left"><b>${a.rattrapage ? `<span class="rattr-tag">Rattrapage</span>` : ""}${esc(a.deck)}</b><span>${esc(a.difficulty)} · ${esc(a.mode)} · ${dateLabel(a.date)} · ${a.score}/${a.total}</span></span><span class="attempt-note ${a.note >= 4 ? "good" : "low"}">${fmtNote(a.note)}</span></button>`;
    if (open) h += `<div class="attempt-body">${bilanBlock(a)}${questionList(a)}</div>`;
    h += `</div>`;
  });
  h += `</div><button class="ghost" data-act="exportToggle">${S.scores.exportOpen ? "Cacher la sauvegarde" : "💾 Exporter mes scores"}</button>`;
  if (S.scores.exportOpen) h += `<p class="fine">Touche le texte, copie-le et colle-le dans une note ou envoie-le à tes parents.</p><textarea class="exportarea" readonly rows="${Math.min(list.length+1, 8)}" id="export-area">${esc(exportText)}</textarea>`;
  h += S.scores.confirm
    ? `<div class="confirm"><span>Tout effacer, sans retour possible ?</span><button class="mini yes" data-act="clearYes">Effacer</button><button class="mini" data-act="clearNo">Annuler</button></div>`
    : `<button class="ghost danger" data-act="clearAsk">🗑️ Effacer tout l'historique</button>`;
  return h;
}

/* ---------- version papier ---------- */
function paperHtml(qs, part){
  const exercises = []; qs.forEach(q => { let e = exercises[exercises.length-1]; if (!e || e.ex !== q.ex){ e = { ex:q.ex, title:q.exTitle, consigne:q.consigne, qs:[] }; exercises.push(e); } e.qs.push(q); });
  const meta = `${deckLabel(S.selected)} · ${DIFFICULTIES[S.difficulty].label} · ${qs.length} questions`;
  const line = q => `<b>${q.num}.</b> <span class="t">${esc(uni(q.word))}</span> <span class="ref">${esc(q.ref)}</span>`;
  const sheet = exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2><p class="cons">${esc(e.consigne)}</p>${e.qs.map(q => q.type === "mcq"
    ? `<div class="q">${line(q)}<div class="opts">${q.options.map(o => `<span>☐ ${esc(uni(o))}</span>`).join("")}</div></div>`
    : `<div class="q">${line(q)}<div class="box"></div></div>`).join("")}</section>`).join("");
  const key = `<h1>Corrigé</h1><p class="meta">${esc(meta)}</p>` + exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2>${e.qs.map(q => `<div class="k"><b>${q.num}.</b> <span class="t">${esc(uni(q.word))}</span> → <b class="t">${esc(uni(q.answer))}</b><div class="x">${esc(q.expl)}</div></div>`).join("")}</section>`).join("");
  const head = `<h1>Mathématiques 10CR niveau 2 — TE2 « Nombres »</h1><p class="meta">Prénom : Livio · épreuve du ${DUE.long} · sans calculatrice · ${esc(meta)}</p><p class="meta">Date : ____________ &nbsp; Note : ______ / 6</p>`;
  const body = part === "ex" ? head + sheet : part === "key" ? key : head + sheet + `<div class="pb"></div>` + key;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths TE2 — ${DUE.short}</title><style>
@page{size:A4 portrait;margin:12mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;max-width:186mm;padding:10px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14.5px;margin:14px 0 2px;border-bottom:1px solid #999}.meta{margin:2px 0;font-size:12.5px}.cons{font-style:italic;margin:2px 0 6px;font-size:13px}
.ex{break-inside:avoid}.q{margin:8px 0;font-size:14px;break-inside:avoid}.t{font-family:Menlo,Consolas,monospace}.ref{color:#777;font-size:11px}
.opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 0 18px}
.box{height:16mm;margin:4px 0 0 18px;border:1px solid #999;background-image:linear-gradient(#DDD 1px,transparent 1px),linear-gradient(90deg,#DDD 1px,transparent 1px);background-size:3mm 3mm}
.k{font-size:13.5px;margin:4px 0;break-inside:avoid}.x{font-size:11.5px;color:#555;margin-left:18px}.pb{break-before:page}
.print{position:fixed;top:10px;right:10px;padding:8px 14px;font-size:14px}@media print{.print{display:none}}
</style></head><body><button class="print" onclick="window.print()">Imprimer</button>${body}</body></html>`;
}
async function savePaper(part){
  const qs = S.frozen; S.paperMsg = ""; S.paperCopy = "";
  const names = { ex:"exercices", both:"exercices-et-corrige", key:"corrige" };
  const filename = `${DUE.iso}_maths-te2-livio-${names[part]}.html`;
  try {
    if (!HAS_CLAUDE){
      const url = URL.createObjectURL(new Blob([paperHtml(qs, part)], { type:"text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.paperMsg = "Fichier téléchargé : ouvre-le, puis touche « Imprimer ».";
      render(); return;
    }
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code:"unavailable" };
    await dl.save({ filename, data:paperHtml(qs, part) });
  } catch(e){
    if (e && e.code === "declined"){ S.paperMsg = "Téléchargement annulé."; }
    else {
      S.paperMsg = "Le téléchargement ne passe pas ici. Copie le texte ci-dessous et colle-le dans le chat : je t'envoie la feuille de ce test exact.";
      S.paperCopy = "#PDF-MATHS-TE2\n" + qs.map(q => `${q.num}. [Ex ${q.ex} ${q.ref} — ${q.consigne}] ${uni(q.word)}${q.options ? " | " + q.options.map(uni).join(" / ") : ""} → ${uni(q.answer)}`).join("\n");
    }
  }
  render();
}

/* ---------- chargement de l'historique ---------- */
async function loadHistory(){
  try {
    await store.init();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && !!prev.rattrapage === !!a.rattrapage && prev.total === a.total && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  S.loaded = true;
  if (S.screen === "scores") render();
}

/* ---------- événements ---------- */
function resetFrozen(){ S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; }
function setTyped(v){
  const Q = S.quiz; Q.typed = v;
  const b = document.getElementById("validate-btn"); if (b) b.disabled = !v.trim();
  const p = document.getElementById("preview"); if (p) p.innerHTML = v ? "Tu as écrit : " + esc(uni(v)) : "";
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, Q = S.quiz;
  switch(act){
    case "nav": S.screen = v; S.scores.confirm = false; render(); window.scrollTo(0,0); break;
    case "fiche": S.ficheOpen = S.ficheOpen === +v ? -1 : +v; render(); break;
    case "toggle": S.selected = S.selected.includes(v) ? S.selected.filter(x => x !== v) : DECKS.map(d => d.key).filter(k => k === v || S.selected.includes(k)); resetFrozen(); render(); break;
    case "allBase": { const allOn = BASE_KEYS.every(k => S.selected.includes(k));
      S.selected = allOn ? S.selected.filter(k => !BASE_KEYS.includes(k) || DECK[k].star) : DECKS.map(d => d.key).filter(k => BASE_KEYS.includes(k) || S.selected.includes(k)); resetFrozen(); render(); break; }
    case "allExtra": { const on = EXTRA_KEYS.every(k => S.selected.includes(k));
      S.selected = on ? S.selected.filter(k => !EXTRA_KEYS.includes(k)) : DECKS.map(d => d.key).filter(k => EXTRA_KEYS.includes(k) || S.selected.includes(k)); resetFrozen(); render(); break; }
    case "toCards": S.screen = "cards"; render(); break;
    case "flip": S.cards.flip = !S.cards.flip; render(); break;
    case "card": { const n = cardItems().length; S.cards.flip = false; S.cards.pos = (S.cards.pos + (+v) + n) % n; render(); break; }
    case "cardShuffle": S.cards.order = shuffle(S.cards.order); S.cards.pos = 0; S.cards.flip = false; render(); break;
    case "limit": S.limit = v; resetFrozen(); render(); break;
    case "diff": S.difficulty = v; resetFrozen(); render(); break;
    case "order": S.order = v; resetFrozen(); render(); break;
    case "mode": S.mode = v; render(); break;
    case "freeze": S.frozen = buildTest(S.selected, S.difficulty, S.order, S.limit); render(); break;
    case "unfreeze": resetFrozen(); render(); break;
    case "paper": savePaper(v); break;
    case "start": startQuiz(S.frozen || buildTest(S.selected, S.difficulty, S.order, S.limit), false); break;
    case "quit": S.screen = "home"; S.quiz = null; render(); break;
    case "pick": { if (Q.checked || Q.done) return; const q = Q.questions[Q.i]; Q.picked = q.options[+v]; if (S.mode === "train") validate(Q.picked); else render(); break; }
    case "key": { const inp = document.getElementById("answer-input"); if (!inp) break;
      const s = inp.selectionStart != null ? inp.selectionStart : inp.value.length, en = inp.selectionEnd != null ? inp.selectionEnd : s;
      inp.value = inp.value.slice(0, s) + v + inp.value.slice(en); setTyped(inp.value); inp.focus(); try { inp.setSelectionRange(s + v.length, s + v.length); } catch(err){} break; }
    case "validate": { const q = Q.questions[Q.i]; if (q.type === "type"){ const inp = document.getElementById("answer-input"); Q.typed = inp ? inp.value : Q.typed; if (Q.typed.trim()) validate(Q.typed); } else if (Q.picked !== null) validate(Q.picked); break; }
    case "dontknow": { const q = Q.questions[Q.i]; if (S.mode === "train"){ Q.ok = false; Q.checked = true; if (q.type === "mcq") Q.picked = null; else Q.typed = ""; render(); } else record("", false); break; }
    case "typo": record(Q.typed, true); break;
    case "next": { const q = Q.questions[Q.i]; record(q.type === "mcq" ? Q.picked : Q.typed, Q.ok); break; }
    case "showErr": { const b = bilanState(v); b.errOnly = !errView(v); render(); break; }
    case "analyse": analyse(v); break;
    case "copy": copyFor(v); break;
    case "retryWrong": retryWrong(v); break;
    case "openAttempt": S.scores.open = S.scores.open === v ? null : v; render(); break;
    case "exportToggle": S.scores.exportOpen = !S.scores.exportOpen; render(); break;
    case "clearAsk": S.scores.confirm = true; render(); break;
    case "clearNo": S.scores.confirm = false; render(); break;
    case "clearYes": (async () => {
      const ids = S.attempts.map(a => a.id); S.attempts = []; S.scores = { open:null, exportOpen:false, confirm:false }; render();
      let failed = false; for (const id of ids){ try { await store.remove(id); } catch(err){ failed = true; } }
      if (failed){ S.loadErr = "L'effacement n'a pas pu être enregistré partout. Recharge la page et réessaie."; render(); }
    })(); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "answer-input" && S.quiz) setTyped(e.target.value); });
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });

render();
loadHistory();
</script>

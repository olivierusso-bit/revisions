<!doctype html>
<!-- gabarit.html — squelette des outils assemblés. Versions : 1 (01.11.2026, C1) · 2 (01.11.2026, C2 : base.css avant CSS_THEME) -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Komparativ und Superlativ · à savoir pour le mardi 3 novembre</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* base commune (base.css), puis la palette et les retouches propres à l'outil (CSS_THEME du contenu) */
/* base.css — CSS commune des outils de révision (noyau). Versions : 1 (01.11.2026, C1) · 2 (01.11.2026, C2 : rayons et couleurs
   d'appoint en variables, .row4 et .umlauts, marge du body à zéro, titre et sous-titre de paquet sur deux lignes)
   · 3 (01.11.2026, C3 : code de paquet, numéro de section de fiche, astuce « attention », état du paquet dans la fiche,
   clavier et aperçu de saisie, badge « chiffres changés », variable --mono ; étiquette « Rattrapage » de l'historique
   corrigée : elle s'affichait en barre pleine sans texte lisible).
   Rayons et couleurs d'appoint réglables par le thème de l'outil (CSS_THEME est appliqué après ce fichier) */
:root{ --r-xl:16px; --r-l:14px; --r:12px; --r-m:10px; --r-s:8px; --r-xs:5px; --focus:var(--court); --scorebox-border:#35406A; --mono:ui-monospace,Menlo,Consolas,monospace; }
/* CSS de base commune à tous les outils (noyau). La palette (:root, mode sombre) et les couleurs des étiquettes (.chip.<tag>) viennent du contenu. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.jersey{flex:none;background:var(--court);border-radius:var(--r-xl);padding:12px 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.jersey b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--score);letter-spacing:3px}
.head h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,7.5vw,33px);line-height:1;margin:0}
.head p{margin:5px 0 0;color:var(--soft);font-size:14px}

.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:600;font-size:20px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 var(--r-s) var(--r-s) 0;margin:0}
.note{background:var(--court-wash);border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--court);font-weight:700;padding:0;cursor:pointer}

.cta{width:100%;padding:15px;border:0;border-radius:var(--r);background:var(--court);color:var(--on-court);font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.3px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);color:var(--court)}
.ghost.danger{color:var(--bad)}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.entry.open{border-left:5px solid var(--court)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-icon{font-size:19px;width:24px;text-align:center}
.entry-title{flex:1;font-family:var(--display);font-weight:600;font-size:18px}
.entry-count{font-size:12.5px;color:var(--soft)}
.entry-body{padding:0 14px 14px}
.pair{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-de{font-weight:700;color:var(--court)}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:var(--r-m);background:var(--court-wash);font-size:14px}
.astuce b{display:block;color:var(--court);margin-bottom:2px}
.src-date{font-weight:400;color:var(--soft);font-size:13px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:var(--r-s);border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1px dashed var(--rule);border-radius:var(--r-s);color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}
.tip{margin:0;padding:8px 0 8px 12px;border-left:3px solid var(--score);font-size:15px}

/* paquets : une ligne par paquet, pastille à 3 anneaux à droite */
.deckrow{display:flex;align-items:stretch;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.deckrow.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);background:var(--court-wash)}
.deck-sel{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.deck-e{font-size:22px;flex:none}
.deck-txt{min-width:0}
.deck-t{display:block;font-weight:700;font-size:15px;line-height:1.2}
.deck-n{display:block;font-size:12.5px;color:var(--soft)}
.deck-tick{flex:none;color:var(--court);font-weight:800;font-size:18px;align-self:center;padding-right:4px}
.deck-pst{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 12px 8px 0;text-align:center}
.deck-redo{margin:-4px 0 8px;padding:0 12px}

/* pastille (anneaux) */
.pst-l{font-size:12px;font-weight:700}
.pst-start{color:var(--soft)} .pst-low{color:var(--p-low)} .pst-mid{color:var(--p-mid)} .pst-win{color:var(--p-ok)} .pst-ok{color:var(--p-okdark)}
.pst-notes{font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pring-t{font-family:var(--display);font-weight:700;fill:var(--ink);font-size:14px}
.pglob{display:flex;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.pglob-x b{display:block;font-family:var(--display);font-size:17px}
.pglob-x span{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.plegend{background:var(--court-wash);border-radius:var(--r-m);padding:0 12px}
.plegend summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:10px 0;color:var(--court)}
.plegend p{margin:0 0 8px;font-size:13px}

/* cartes */
.flash{position:relative;height:262px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-l);background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--jersey);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;padding:22px;transition:transform .45s;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--court-wash);border-color:var(--court);border-top-color:var(--court)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:12px;font-weight:700;color:var(--soft)}
.face-word{font-family:var(--display);font-weight:600;font-size:clamp(18px,4.8vw,22px);text-align:center;line-height:1.2}
.face-mini{font-size:13.5px;color:var(--court);font-weight:700;text-align:center}
.face-hint{position:absolute;bottom:12px;font-size:12px;color:var(--soft)}

/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court);background:var(--court-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.paper{background:var(--sheet);border:1px dashed var(--court);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:10px;border-radius:var(--r-xs);background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--court);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:700;font-size:15px;background:var(--board);color:var(--score);padding:2px 9px;border-radius:var(--r-xs);font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--court-wash);color:var(--court)}
.ref{font-size:12px;color:var(--soft)}
.consigne{margin:0;font-size:14.5px;color:var(--soft)}
.qword{font-family:var(--display);font-weight:600;font-size:clamp(22px,6vw,28px);line-height:1.2;margin:0;overflow-wrap:anywhere}
.qhint{margin:0;font-size:14px;color:var(--soft)}
.choice{padding:14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:16px;font-weight:700;cursor:pointer}
.choice.sel{border-color:var(--court);box-shadow:inset 0 0 0 2px var(--court)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);font:inherit;font-size:18px;font-weight:700;color:var(--ink)}
.umlauts{display:flex;gap:8px}
.umlauts button{flex:1;padding:9px 0;border-radius:var(--r-s);border:1px solid var(--rule);background:var(--sheet);font-size:18px;font-weight:700;cursor:pointer}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.fb{padding:14px;border-radius:var(--r);border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}

/* résultats */
.scorebox{background:var(--board);border:4px solid var(--scorebox-border);border-radius:var(--r-l);padding:18px;text-align:center}
.scorebox.rattr-box{border-color:var(--bad)}
.score-n{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--score);font-variant-numeric:tabular-nums}
.score-n small{font-size:30px;color:#B9A256}
.score-note{display:inline-block;margin-top:8px;background:var(--score);color:var(--board);font-weight:800;padding:4px 14px;border-radius:6px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#FF8A78}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:var(--r-m);padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}

/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:20px;margin:0}
.bilan-lab{font-size:13px;font-weight:700;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan ul.forts li{color:var(--good)}
.bilan ul.work li{color:var(--bad)}
.bilan-tip{background:var(--court-wash);border-radius:var(--r-m);padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:var(--r-m);padding:10px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--body)}

/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--board);border-radius:var(--r-m);padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--score);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#C9D0E6}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.rattr-tag,.attempt-left .rattr-tag{display:inline-block;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--r-xs);margin-right:6px}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--on-court)}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:var(--r-m);border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* suivi : courbe + jour par jour + cartes qui résistent */
.suivi{display:flex;flex-direction:column;gap:10px}
.suivi h3{font-family:var(--display);font-size:19px;margin:6px 0 0}
.suivi-ctl{display:flex;flex-direction:column;gap:8px}
.suivi-sel{width:100%;padding:10px;border-radius:var(--r-m);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-weight:700}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft)}
.ch-legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.lg-line{width:16px;height:0;border-top:2px solid var(--box)}
.lg-ring{width:11px;height:11px;border:2px solid var(--good);border-radius:50%}
.ch-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--sheet)}
.ch-svg{display:block}
.ch-t{fill:var(--soft);font-size:11px;font-family:var(--body)}
.ch-b{fill:var(--ink);font-weight:700}
.ch-g{fill:var(--good);font-weight:700}
.ch-pt{cursor:pointer}
.ch-detail{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-m);padding:11px 12px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.ch-detail b{font-size:14.5px}
.tbl{overflow-x:auto}
.heat table{border-collapse:collapse;width:100%;font-size:13px}
.heat th,.heat td{border:1px solid var(--rule);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.heat th{background:var(--court-wash);font-weight:700}
.heat td.k{text-align:left;font-weight:700}
.heat td.hc-0{color:var(--soft)}
.heat td.hc-ok{background:var(--good-wash);color:var(--good);font-weight:700}
.heat td.hc-mid{background:#FBF0D8;color:#7A5806;font-weight:700}
.heat td.hc-low{background:var(--bad-wash);color:var(--bad);font-weight:700}
:root[data-theme="dark"] .heat td.hc-mid{background:#3A3016;color:#E8C27A}
.resist{display:flex;flex-direction:column;gap:6px}
.resist p{margin:0;font-size:14px}
.resist .code{display:inline-block;background:var(--court-wash);color:var(--court);font-weight:700;font-size:12px;padding:1px 7px;border-radius:var(--r-xs);margin-right:4px}
.resist small{color:var(--soft)}

/* test en cours */
.draft{background:var(--court-wash);border:1px solid var(--court);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.draft.block{border-color:var(--bad);background:var(--bad-wash)}
.draft p{margin:0}
.draft p b{display:block;font-family:var(--display);font-size:16px}
.draft p span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.draft-stop b{color:var(--bad)}
.draft-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.quitbox{text-align:left}

/* voir mes erreurs */
.dx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px;color:var(--soft)}
.dx-line{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline;margin:2px 0!important}
.dx-lab{font-size:12.5px!important;font-weight:700;color:var(--soft)}
.dx-ans{font-size:17px;font-weight:700;overflow-wrap:anywhere;letter-spacing:.3px;line-height:1.7}
.dx-bad{background:#A3241B;color:#fff;text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:1px 2px}
.dx-good{background:#D4F0E1;color:#08402A;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;padding:1px 2px;font-weight:800}
.dx-miss{display:inline-block;background:#A3241B;color:#fff;border-radius:3px;padding:0 4px;margin:0 1px;font-weight:800;font-size:14px;line-height:1.35;vertical-align:1px;text-decoration:none}
.dx-none{font-style:italic;font-weight:400;color:var(--soft)}
.dx-note{font-size:13.5px!important;font-weight:700}

/* correction en direct */
.live{display:flex;flex-direction:column;gap:4px}
.live-lab{margin:0;font-size:12.5px;font-weight:700;color:var(--soft)}
.live-box{min-height:46px;padding:8px 12px;border:1px dashed var(--rule);border-radius:var(--r-m);background:var(--sheet);font-size:20px;font-weight:700;letter-spacing:1px;line-height:1.7;overflow-wrap:anywhere}
.lv-bad{display:inline-block;background:#A3241B;color:#fff;border-radius:4px;padding:0 4px;margin:0 2px;line-height:1.35;box-shadow:0 0 0 2px var(--sheet)}
.lv-empty{font-size:14px;font-weight:400;color:var(--soft);letter-spacing:0}
.live-state{margin:0;font-size:13.5px;font-weight:700}

/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:3px solid var(--court);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--soft)}
.tab-e{font-size:18px} .tab-l{font-size:11px;font-weight:700}
.tab.on{color:var(--court);background:var(--court-wash)}

@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}

/* C3 — paquets à code, fiche liée aux paquets, saisie mathématique */
.deck-c{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--court)}

/* ---------- types de questions propres à cet outil ---------- */
/* KINDS (types de questions), ordre, étiquettes, et dans GENS les fonctions label / cards / kinds / fill / face.
   La couche Langues fournit le reste (buildTest, correction, correction en direct, cartes, trois anneaux). */
const KINDS = {
  mcq_regle: { type:"mcq",  tag:"regle",      aspect:"regle",  consigne:"Choisis la bonne réponse." },
  mcq_sens:  { type:"mcq",  tag:"sens",       aspect:"sens",   consigne:"Choisis la traduction en français." },
  type_sens: { type:"type", tag:"sens",       aspect:"sens",   consigne:"Écris l'adjectif en allemand." },
  mcq_mot:   { type:"mcq",  tag:"allemand",   aspect:"sens",   consigne:"Choisis la traduction en français." },
  type_mot:  { type:"type", tag:"allemand",   aspect:"sens",   consigne:"Écris en allemand." },
  mcq_komp:  { type:"mcq",  tag:"komparativ", aspect:"komp",   consigne:"Choisis le comparatif." },
  type_komp: { type:"type", tag:"komparativ", aspect:"komp",   consigne:"Écris le comparatif (Komparativ)." },
  mcq_sup:   { type:"mcq",  tag:"superlativ", aspect:"sup",    consigne:"Choisis le superlatif avec « am »." },
  type_sup:  { type:"type", tag:"superlativ", aspect:"sup",    consigne:"Écris le superlatif avec « am » (Superlativ)." },
  mcq_phrase:{ type:"mcq",  tag:"phrase",     aspect:"phrase", consigne:"Complète la phrase." },
  type_phrase:{ type:"type", tag:"phrase",    aspect:"phrase", consigne:"Complète la phrase (écris ce qui manque)." },
  mcq_art:   { type:"mcq",  tag:"article",    aspect:"art",    consigne:"Choisis l'article : der, die ou das." },
  mcq_pl:    { type:"mcq",  tag:"pluriel",    aspect:"pl",     consigne:"Choisis le pluriel." },
  type_pl:   { type:"type", tag:"pluriel",    aspect:"pl",     consigne:"Écris le pluriel, avec l'article." },
};
/* ordre des exercices dans un test : règles, sens, comparatif, superlatif, phrases, article, pluriel ; à choix avant écrit */
const KIND_ORDER = ["mcq_regle","mcq_sens","type_sens","mcq_mot","type_mot","mcq_komp","type_komp","mcq_sup","type_sup","mcq_phrase","type_phrase","mcq_art","mcq_pl","type_pl"];
const TAG_LABEL = { sens:"sens de l'adjectif", allemand:"vocabulaire", komparativ:"comparatif", superlativ:"superlatif", phrase:"phrase à compléter", regle:"règle", article:"der / die / das", pluriel:"pluriel" };

/* utilitaires du contenu */
const unUml = s => s.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u");
/* 4 choix : la bonne réponse, puis les distracteurs proposés, complétés par le réservoir du paquet (sans doublon) */
function fillOpts(good, cands, pool, n = 4){
  const out = [good], seen = new Set([norm(good)]);
  const add = v => { if (out.length >= n || !v) return; const k = norm(v); if (seen.has(k)) return; seen.add(k); out.push(v); };
  cands.forEach(add); shuffle(pool).forEach(add);
  return shuffle(out);
}
/* énoncé stable d'un item (identité des cartes, inchangée depuis la v1 : l'historique de Livio reste lisible) */
const itemLabel = it => it.s ? it.s + (it.h ? " (" + it.h + ")" : "") : it.q || it.de;
const choix = (diff, m, t) => diff === "easy" ? m : diff === "hard" ? t : (Math.random() < 0.5 ? m : t);
const ALL = [0,1,2];
/* fin de remplissage commune : allemand, indice entre parenthèses dans l'énoncé gardé, libellé court avec l'indice */
function finir(q){
  q.lang = "de";
  q.prompt = `${q.consigne} « ${q.word} »${q.hint ? " (" + q.hint + ")" : ""}`;
  q.label = q.word + (q.hint ? " (" + q.hint + ")" : "");
}
const face = (tag, front, frontMini, back, mini) => ({ tagF:TAG_LABEL[tag], front, frontMini, tagB:"Réponse", backHtml:`<span class="face-word">${esc(back)}</span><span class="face-mini">${esc(mini)}</span>` });

/* GENS : un générateur par valeur de `gen` dans DECKS.
   label(d,it)        → énoncé de l'item (identité des cartes)
   cards(d,it)        → les cartes d'un item : { aspect, mcqOnly, levels }
   kinds(d,it,diff)   → les types de questions à poser pour cet item au niveau diff (easy / normal / hard)
   fill(q,kind,it,d,pool) → remplit q.word, q.options ou q.accept, q.answer, q.expl, q.hint, q.keep (+ lang, prompt, label via finir)
   pool(d)            → réservoir de distracteurs du paquet (facultatif)
   face(d,it)         → les faces des cartes à retourner (une par aspect) */
const GENS = {
  /* règle : toujours à choix */
  regle:{
    label: (d, it) => itemLabel(it),
    cards: () => [{ aspect:"regle", mcqOnly:true, levels:ALL }],
    kinds: () => ["mcq_regle"],
    fill: (q, kind, it, d) => { q.word = it.q; q.options = shuffle(it.o.slice()); q.answer = it.o[0]; q.expl = it.expl + " — " + (it.src || d.src); finir(q); },
    face: (d, it) => [face("regle", it.q, "", it.o[0], it.expl + " — " + (it.src || d.src))],
  },
  /* phrase à compléter : à choix (o) ou écrite (acc) */
  phrase:{
    label: (d, it) => itemLabel(it),
    cards: () => [{ aspect:"phrase", mcqOnly:false, levels:ALL }],
    kinds: (d, it, diff) => [choix(diff, "mcq_phrase", "type_phrase")],
    fill: (q, kind, it, d) => {
      q.word = it.s; q.hint = it.h || ""; q.expl = GENS.phrase.expl(it, d); q.keep = true;
      if (kind === "mcq_phrase"){ q.options = shuffle(it.o.slice()); q.answer = it.o[0]; }
      else { q.accept = it.acc.slice(); q.answer = it.a || it.acc[0]; }
      finir(q);
    },
    expl: (it, d) => {
      const ans = it.a || it.acc[0], src = it.src || d.src;
      const why = it.why ? " " + it.why[0].toUpperCase() + it.why.slice(1) : "";
      const note = it.note ? " Note : " + it.note : "";
      const full = it.s.replace("___", ans.includes(" / ") ? "[" + ans + "]" : ans);
      return `${full}${why}${note} — ${src}`;
    },
    face: (d, it) => [face("phrase", it.s, it.h || "", it.a || it.acc[0], GENS.phrase.expl(it, d))],
  },
  /* ligne de la liste des adjectifs : sens, comparatif, superlatif */
  adjectif:{
    label: (d, it) => itemLabel(it),
    cards: () => [{ aspect:"sens", mcqOnly:false, levels:ALL }, { aspect:"komp", mcqOnly:false, levels:ALL }, { aspect:"sup", mcqOnly:false, levels:ALL }],
    kinds: (d, it, diff) => [choix(diff, "mcq_sens", "type_sens"), choix(diff, "mcq_komp", "type_komp"), choix(diff, "mcq_sup", "type_sup")],
    base: it => `${it.de} – ${it.komp} – ${it.sup} = ${it.fr[0]}`,
    tail: it => (it.extra ? " (adjectif en plus, pas dans le voc)" : "") + (it.n2 ? " (ligne N2)" : "") + " — " + L + ".",
    fill: (q, kind, it, d) => {
      const G = GENS.adjectif, others = d.items, base = G.base(it), tail = G.tail(it);
      q.keep = true;
      switch(kind){
        case "mcq_sens":  q.word = it.de; q.options = fillOpts(it.fr[0], [], others.map(x => x.fr[0])); q.answer = it.fr[0]; q.expl = base + tail; break;
        case "type_sens": q.word = it.fr[0]; q.accept = [it.de]; q.answer = it.de; q.expl = base + tail; break;
        case "mcq_komp":  q.word = it.de; q.hint = it.fr[0]; q.options = fillOpts(it.komp, [it.de + "er", unUml(it.komp), it.sup, "mehr " + it.de], others.map(x => x.komp)); q.answer = it.komp; q.expl = base + (it.kNote ? " (" + it.kNote + ")" : "") + tail; break;
        case "type_komp": q.word = it.de; q.hint = it.fr[0]; q.accept = [it.komp, ...(it.kAlt || [])]; q.answer = it.komp; q.expl = base + (it.kNote ? " (" + it.kNote + ")" : "") + tail; break;
        case "mcq_sup":   q.word = it.de; q.hint = it.fr[0]; q.options = fillOpts(it.sup, ["am " + it.de + "sten", "am " + it.de + "esten", unUml(it.sup), it.komp], others.map(x => x.sup)); q.answer = it.sup; q.expl = base + (it.sNote ? " (" + it.sNote + ")" : "") + tail; break;
        case "type_sup":  q.word = it.de; q.hint = it.fr[0]; q.accept = [it.sup, ...(it.sAlt || [])]; q.answer = it.sup; q.expl = base + (it.sNote ? " (" + it.sNote + ")" : "") + tail; break;
      }
      finir(q);
    },
    face: (d, it) => { const G = GENS.adjectif, base = G.base(it), tail = G.tail(it); return [
      face("sens", it.de, "", it.fr[0], base + tail),
      face("komparativ", it.de, it.fr[0], it.komp, base + (it.kNote ? " (" + it.kNote + ")" : "") + tail),
      face("superlativ", it.de, it.fr[0], it.sup, base + (it.sNote ? " (" + it.sNote + ")" : "") + tail),
    ]; },
  },
  /* exception du Récapitulatif : le comparatif seulement */
  exception:{
    label: (d, it) => itemLabel(it),
    cards: () => [{ aspect:"komp", mcqOnly:false, levels:ALL }],
    kinds: (d, it, diff) => [choix(diff, "mcq_komp", "type_komp")],
    expl: (it, d) => `${it.de} > ${it.komp}${it.kNote ? " (" + it.kNote + ")" : ""} — ${it.src || d.src}.`,
    fill: (q, kind, it, d) => {
      q.word = it.de; q.answer = it.komp; q.expl = GENS.exception.expl(it, d); q.keep = true;
      if (kind === "mcq_komp") q.options = fillOpts(it.komp, it.wrong, d.items.map(x => x.komp));
      else q.accept = [it.komp, ...(it.kAlt || [])];
      finir(q);
    },
    face: (d, it) => [face("komparativ", it.de, "", it.komp, GENS.exception.expl(it, d))],
  },
  /* mot du Wortschatz : sens ; article et pluriel pour les noms */
  mot:{
    label: (d, it) => itemLabel(it),
    cards: (d, it) => { const out = [{ aspect:"sens", mcqOnly:false, levels:ALL }]; if (it.art) out.push({ aspect:"art", mcqOnly:true, levels:ALL }); if (it.pl) out.push({ aspect:"pl", mcqOnly:false, levels:ALL }); return out; },
    kinds: (d, it, diff) => { const out = [choix(diff, "mcq_mot", "type_mot")]; if (it.art) out.push("mcq_art"); if (it.pl) out.push(choix(diff, "mcq_pl", "type_pl")); return out; },
    base: (it, d) => `${it.de}${it.pl ? " (pluriel : " + it.pl + ")" : ""} = ${it.fr[0]} — ${it.src || d.src}.`,
    fill: (q, kind, it, d) => {
      const base = GENS.mot.base(it, d), voc = d.items.filter(x => x.de && !x.komp);
      q.expl = base; q.keep = true;
      switch(kind){
        case "mcq_mot":  q.word = it.de; q.options = fillOpts(it.fr[0], [], voc.map(x => x.fr[0])); q.answer = it.fr[0]; break;
        case "type_mot": q.word = it.fr[0]; q.accept = [it.de, ...(it.alt || [])]; q.answer = it.de; q.keep = !!it.art; if (it.art) q.consigne = "Écris en allemand, avec l'article."; break;
        case "mcq_art":  q.word = stripDe(it.de); q.hint = it.fr[0]; q.options = ["der","die","das"]; q.answer = it.art; break;
        case "mcq_pl":   q.word = it.de; q.hint = it.fr[0]; q.options = shuffle(it.plo.slice()); q.answer = it.pl; break;
        case "type_pl":  q.word = it.de; q.hint = it.fr[0]; q.accept = [it.pl]; q.answer = it.pl; break;
      }
      finir(q);
    },
    face: (d, it) => { const base = GENS.mot.base(it, d), out = [face("allemand", it.de, "", it.fr[0], base)];
      if (it.art) out.push(face("article", stripDe(it.de), it.fr[0], it.art, base));
      if (it.pl) out.push(face("pluriel", it.de, it.fr[0], it.pl, base));
      return out; },
  },
};
/* le paquet Wortschatz mélange des mots et des phrases à compléter : on aiguille selon l'item */
const wortGen = it => it.s ? GENS.phrase : GENS.mot;
GENS.wort = {
  label: (d, it) => itemLabel(it),
  cards: (d, it) => wortGen(it).cards(d, it),
  kinds: (d, it, diff) => wortGen(it).kinds(d, it, diff),
  fill: (q, kind, it, d, pool) => wortGen(it).fill(q, kind, it, d, pool),
  face: (d, it) => wortGen(it).face(d, it),
};


/* ============================================================
   COUCHE LANGUES — allemand, anglais, français de grammaire
   (prompt-artefact-revision.md § 11.4). Assemblée entre le contenu et le noyau.

   Ce que la couche attend du CONTENU :
     DECKS[]  : paquets { key, title, emoji, unit, gen, src, items[] }
     GENS     : un générateur par valeur de `gen` : { cards, kinds, fill, pool?, face }
     KINDS    : types de questions { type:"mcq"|"type", tag, aspect, consigne }
     KIND_ORDER, TAG_LABEL
   Ce que la couche fournit au NOYAU (contrat COUCHE) :
     COUCHE.rings      : 3 (Échauffement / Entraînement / Niveau épreuve)
     COUCHE.allCards() : toutes les cartes { dk, word, aspect, mcqOnly, levels, k }
     COUCHE.buildTest(deckKeys, difficulty, limit) : les questions d'un test (limit = nombre de questions, 0 = toutes)
     COUCHE.isRight(q, val) : correction d'une réponse
     COUCHE.cardFace(d, it) : recto / verso d'une carte, ou un tableau de faces (une par aspect)
     COUCHE.liveCands(q)    : candidats pour la correction en direct
     COUCHE.hasLive         : le mode « Correction en direct » existe (langues : oui)
   Les utilitaires (esc, norm, matchAnswer, shuffle, pickOptions, dxN…) viennent du noyau.
   Versions : 1 (01.11.2026, C1) · 2 (01.11.2026, C2 : limite de questions équilibrée entre paquets, label/lang/prompt/consigne posés par fill,
   plusieurs faces par élément, article allemand facultatif en correction en direct).

   Ce que fill(q, kind, it, d, pool) peut poser sur la question (étape C2) :
     q.word, q.options | q.accept, q.answer, q.expl, q.hint, q.keep (défaut true)
     q.lang   : "fr" (défaut) ou "de" — touches ä ö ü, article der/die/das facultatif si keep est faux
     q.consigne : remplace la consigne du type de question pour cet élément
     q.prompt : énoncé complet gardé dans l'historique (défaut : consigne « mot »)
     q.label  : libellé court de la carte pour « les cartes qui résistent » (défaut : q.word)
     q.card   : identité de la carte (défaut : paquet | it.front | aspect ; à poser si l'élément n'a pas de front)
   ============================================================ */

/* cartes : identité stable = paquet | énoncé | aspect ; une phrase peut donner deux cartes (type / forme) */
function cardKey(dk, word, aspect){ return dk + "|" + word + "|" + aspect; }
/* énoncé d'un élément : it.front, ou ce que le générateur donne (label) */
function itemFront(g, d, it){ return g.label ? g.label(d, it) : it.front; }

const COUCHE = {
  rings: 3,
  hasLive: true,

  allCards(){
    const out = [];
    DECKS.forEach(d => d.items.forEach(it => {
      const g = GENS[d.gen]; if (!g) throw new Error("Générateur inconnu : " + d.gen);
      const front = itemFront(g, d, it);
      g.cards(d, it).forEach(c => out.push({ dk:d.key, word:front, aspect:c.aspect, mcqOnly:!!c.mcqOnly, levels:c.levels, k:cardKey(d.key, front, c.aspect) }));
    }));
    return out;
  },

  /* un exercice par paquet et par type de question, dans l'ordre de KIND_ORDER ; numéros uniques (§ 11.6).
     Avec limit > 0 : on ne garde que limit questions, prises dans chaque paquet coché à tour de rôle. */
  buildTest(deckKeys, difficulty, limit){
    const sel = DECKS.filter(d => deckKeys.includes(d.key));
    /* 1. toutes les (élément, type de question) de chaque paquet */
    let parDeck = sel.map(d => {
      const g = GENS[d.gen];
      return shuffle(d.items.flatMap(it => g.kinds(d, it, difficulty).map(kind => ({ d, g, it, kind }))));
    });
    if (limit && limit > 0 && parDeck.reduce((n, l) => n + l.length, 0) > limit){
      const kept = sel.map(() => []); let i = 0, total = 0;
      while (total < limit && parDeck.some(l => l.length)){ const l = parDeck[i % parDeck.length]; if (l.length){ kept[i % parDeck.length].push(l.shift()); total++; } i++; }
      parDeck = kept;
    }
    /* 2. regroupement par paquet puis par type de question */
    const qs = []; let num = 0, ex = 0;
    parDeck.forEach((list, di) => {
      const d = sel[di], g = GENS[d.gen];
      const buckets = {}; KIND_ORDER.forEach(k => buckets[k] = []);
      list.forEach(x => buckets[x.kind].push(x.it));
      const pool = g.pool ? g.pool(d) : [];
      KIND_ORDER.forEach(kind => {
        const items = buckets[kind]; if (!items.length) return;
        ex++; const K = KINDS[kind];
        items.forEach(it => {
          num++;
          const q = { id:"q"+num, num, ex, exTitle:d.title, deckKey:d.key, kind, type:K.type, tag:K.tag, aspect:K.aspect, lang:"fr", consigne:K.consigne, keep:true, hint:"" };
          g.fill(q, kind, it, d, pool);
          if (!q.card) q.card = cardKey(d.key, itemFront(g, d, it), K.aspect);
          if (!q.prompt) q.prompt = `${q.consigne} « ${q.word} »`;
          qs.push(q);
        });
      });
    });
    return qs;
  },

  isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q.accept, q.lang, q.keep); },

  cardFace(d, it){ return GENS[d.gen].face(d, it); },

  /* candidats de la correction en direct : réponses acceptées, sans parenthèses, article facultatif (fr : le/la… ; de : der/die/das) */
  liveCands(q){
    const out = new Set();
    (q.accept || [q.answer]).forEach(a => {
      [a, a.replace(/\s*\([^)]*\)\s*/g, " "), a.replace(/[()]/g, "")].forEach(v => {
        out.add(v);
        if (q.lang === "fr" && !q.keep) out.add(v.trim().replace(/^(le |la |les |l'|l’|un |une |des |du |de la |d'|d’)/i, ""));
        if (q.lang === "de" && !q.keep) out.add(v.trim().replace(/^(der |die |das )/i, ""));
      });
    });
    return [...out].map(v => [...v].map(lvUnit).join("")).filter(Boolean);
  },
};


/* ============================================================
   NOYAU QUIZ — code commun à tous les outils de révision
   (prompt-artefact-revision.md § 2 à § 10 ; refonte 2026, étape C1).
   Assemblé en dernier, après le contenu et la couche, dans un seul <script>.

   Ce que le noyau attend du CONTENU : QUIZ_ID, DUE, THEME, VERSION, OUTIL, SOURCES, SOURCES_NOTE, PHOTOS, DECKS, FICHE, TAG_LABEL.
   Réglages facultatifs d'OUTIL (étape C2) : badgeHtml (remplace le maillot de l'en-tête), comptes ([10,20,30,0] = « Combien de questions »,
   0 = toutes) et compteDefaut, compte ("cartes" pour compter les cartes au lieu des éléments), umlautsStricts (ä ≠ a à la correction),
   prefixeIndice (devant l'indice, défaut « petit indice : »), sousNiveaux ({easy, normal, hard}), conseilSetup (phrase sous « Commencer »
   hors correction en direct), noteAutre (phrase quand la réponse écrite n'a rien à voir).
   Une section de FICHE peut porter html (chaîne ou fonction qui la rend, déjà échappée) et count, en plus de pairs / tips / astuce.
   Ce qu'il attend de la COUCHE : l'objet COUCHE (rings, allCards, buildTest, isRight, cardFace, liveCands, hasLive).
   Il fournit : stockage (Claude db / navigateur / mémoire), test en cours gardé, suivi graphique (anneaux, courbe,
   jour par jour, cartes qui résistent), Bilan, « Voir mes erreurs », rattrapage, note suisse, version papier,
   onglets et écrans, prompt d'analyse (âge déduit de la classe, jamais écrit en dur).
   Les clés de stockage et le format des historiques sont ceux des outils précédents : rien n'est perdu.
   Versions : 1 (01.11.2026, C1, né du modèle de français v4) · 2 (01.11.2026, C2 : réglages facultatifs d'OUTIL ci-dessus, Umlaute,
   nombre de questions, faute de frappe enregistrée, test en cours plus complet, source dans le corrigé et la copie, cartes homonymes distinguées)

   Réglages facultatifs ajoutés à C3 : comptesParPaquet (le nombre de questions vaut pour chaque paquet), compteLabel, ordres

   titreAstuceNeg, motPaquets (pluriel). Un paquet peut porter code (« Obj. 1 ») et detail ; une section de FICHE num, deck, miss, astuceNeg.

function ageDeClasse(classe){
  const m = /(\d+)\s*e/.exec(classe || ""); if (!m) return "";
  const n = +m[1], a = n + 3; return `${a} à ${a + 1} ans`;
}

/* ---------- utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* enlève les accents ; avec umlautsStricts, ä ö ü restent distincts de a o u (c'est ce que la leçon d'allemand fait apprendre) */
function deAcc(s){
  s = String(s);
  if (UMLAUTS_STRICTS) s = s.replace(/ä/g,"\u0001").replace(/ö/g,"\u0002").replace(/ü/g,"\u0003");
  s = s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  return UMLAUTS_STRICTS ? s.replace(/\u0001/g,"ä").replace(/\u0002/g,"ö").replace(/\u0003/g,"ü") : s;
}
function norm(s, apoMode){
  return deAcc(String(s || "").toLowerCase().replace(/ß/g,"ss").normalize("NFC"))
    .replace(/…|\.\.\./g," ").replace(/[’'`]/g, apoMode === "del" ? "" : " ")
    .replace(/[.!?;,:«»"()\/\-+–]/g," ").replace(/\s+/g," ").trim();
}
const stripFr = s => s.replace(/^(le |la |les |l |un |une |des |du |de la |d )/,"").trim();
const stripDe = s => s.replace(/^(der |die |das )/,"").trim();
/* article facultatif (sauf keep) : français le/la/les…, allemand der/die/das */
function matchAnswer(input, accept, lang, keep){
  return ["sp","del"].some(m => {
    const a = norm(input, m); if (!a) return false;
    return accept.some(raw => { const b = norm(raw, m); if (a === b) return true; if (keep) return false;
      if (lang === "fr") return stripFr(a) === stripFr(b);
      if (lang === "de") return stripDe(a) === stripDe(b);
      return false; });
  });
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pickOptions(good, pool, wide, valueFn){
  const out = [], seen = new Set([good]);
  const take = list => shuffle(list).forEach(x => { if (out.length >= 3) return; const v = valueFn(x); if (v && !seen.has(v)){ seen.add(v); out.push(v); } });
  take(pool); if (out.length < 3) take(wide);
  return shuffle([good, ...out]);
}
const noteFrom = r => Math.round((1 + 5*r)*2)/2;
const fmtNote = n => Number(n).toFixed(1).replace(".", ",");
function dateLabel(ts){ const d = new Date(ts), p = x => String(x).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} · ${p(d.getHours())}h${p(d.getMinutes())}`; }
function dayOf(t){ const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }

/* ---------- stockage ---------- */
const store = {
  mode:"memory", col:null, mem:{}, memDocs:{},
  async init(){
    try {
      if (window.claude && window.claude.use){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user){ const uid = await user.id(); if (uid){ this.col = db.collection("data/users/" + uid); this.mode = "db"; return; } }
      }
    } catch(e){}
    try { localStorage.setItem(QUIZ_ID + "-probe","1"); localStorage.removeItem(QUIZ_ID + "-probe"); this.mode = "local"; } catch(e){ this.mode = "memory"; }
  },
  async list(){
    if (this.mode === "db"){ const snap = await this.col.limit(1000).get(); return snap.docs.filter(d => d.id.startsWith(ATTEMPT_PREFIX)).map(d => d.data()).filter(Boolean); }
    if (this.mode === "local"){ const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); return idx.map(id => { try { return JSON.parse(localStorage.getItem(ATTEMPT_PREFIX + id)); } catch(e){ return null; } }).filter(Boolean); }
    return Object.values(this.mem);
  },
  async save(att){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + att.id).set(att); return; }
    if (this.mode === "local"){ this.saveLocal(att); SYNC.sauver(att); return; }
    this.mem[att.id] = att;
  },
  saveLocal(att){ localStorage.setItem(ATTEMPT_PREFIX + att.id, JSON.stringify(att)); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]"); if (!idx.includes(att.id)) idx.unshift(att.id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); },
  removeLocal(id){ localStorage.removeItem(ATTEMPT_PREFIX + id); const idx = JSON.parse(localStorage.getItem(INDEX_KEY) || "[]").filter(x => x !== id); localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); },
  async remove(id){
    if (this.mode === "db"){ await this.col.doc(ATTEMPT_PREFIX + id).delete(); return; }
    if (this.mode === "local"){ this.removeLocal(id); SYNC.effacer(id); return; }
    delete this.mem[id];
  },
  async getDoc(id){
    if (this.mode === "db"){ const sn = await this.col.doc(id).get(); return sn && sn.exists ? sn.data() : null; }
    if (this.mode === "local"){ const v = localStorage.getItem(id); return v ? JSON.parse(v) : null; }
    return this.memDocs[id] || null;
  },
  async setDoc(id, obj){
    if (this.mode === "db"){ await this.col.doc(id).set(obj); return; }
    if (this.mode === "local"){ localStorage.setItem(id, JSON.stringify(obj)); return; }
    this.memDocs[id] = obj;
  },
};

/* ---------- synchronisation entre appareils (refonte D4) ----------
   Sur le site seulement (navigateur, pas dans Claude). L'accueil du site enregistre sur l'appareil, sous la clé
   « revisions-appareil », l'adresse de l'intermédiaire Google et le code de chaque élève :
       { url, eleves:{ Livio:{ code }, Liano:{ code } } }
   L'outil garde toujours sa copie dans le navigateur (il marche hors ligne) et envoie chaque test à l'intermédiaire,
   qui le range dans la feuille « Révisions – scores ». Ce qui n'a pas pu partir attend dans une file sur l'appareil
   et repart au chargement suivant ou au retour du réseau. Au chargement, les tests faits sur un autre appareil
   sont ajoutés ; un test effacé laisse une marque « suppr » pour ne pas revenir d'un autre appareil. */
const SYNC_CONF = "revisions-appareil";
/* adresse de l'intermédiaire, la même que la constante INTERMEDIAIRE de l'accueil du site (publication-github.md § 11) :
   sert au bouton « Entrer mon code » de l'onglet Scores, quand l'appareil n'a pas encore de code pour cet élève */
const SYNC_URL_SITE = "https://script.google.com/macros/s/AKfycbzUVgqKYNSQaLeKAOk4kCGdYNF0weB5xKBLmZMSWCfmoSVoVf2R9Y6WKwQqh9CON-1K/exec";
const SYNC = {
  on:false, url:"", code:"", etat:"", derniere:0, file:[], occupe:false, minuterie:null, echeance:0,
  cleFile: QUIZ_ID + "-sync-file", cleSuppr: QUIZ_ID + "-sync-suppr",
  init(){
    this.on = false;
    if (store.mode !== "local") return;
    try {
      const c = JSON.parse(localStorage.getItem(SYNC_CONF) || "null");
      const e = c && c.eleves && c.eleves[OUTIL.eleve];
      if (c && c.url && e && e.code){ this.url = c.url; this.code = e.code; this.on = true; }
      this.file = JSON.parse(localStorage.getItem(this.cleFile) || "[]");
    } catch(e){ this.on = false; }
  },
  garderFile(){ try { localStorage.setItem(this.cleFile, JSON.stringify(this.file)); } catch(e){} },
  supprimes(){ try { return new Set(JSON.parse(localStorage.getItem(this.cleSuppr) || "[]")); } catch(e){ return new Set(); } },
  noterSuppr(id){ const s = this.supprimes(); s.add(id); try { localStorage.setItem(this.cleSuppr, JSON.stringify([...s].slice(-500))); } catch(e){} },
  async appel(corps){
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const t = ctrl ? setTimeout(() => ctrl.abort(), 20000) : null;
    try {
      const r = await fetch(this.url, { method:"POST", body:JSON.stringify({ eleve:OUTIL.eleve, code:this.code, ...corps }), signal: ctrl ? ctrl.signal : undefined });
      const j = await r.json();
      if (!j.ok){ const err = new Error(j.erreur || "erreur"); err.code = j.erreur || "erreur"; throw err; }
      return j;
    } finally { if (t) clearTimeout(t); }
  },
  /* une opération en attente remplace la précédente sur le même enregistrement */
  ajouter(op){
    if (!this.on) return;
    op.quiz = QUIZ_ID;
    this.file = this.file.filter(x => x.id !== op.id); this.file.push(op); this.garderFile();
    /* un test part tout de suite ; le test en cours attend 2,5 s (il change à chaque réponse) ; un envoi déjà prévu plus tôt est gardé */
    const due = Date.now() + (op.type === "doc" ? 2500 : 50);
    if (this.minuterie && this.echeance <= due) return;
    clearTimeout(this.minuterie); this.echeance = due;
    this.minuterie = setTimeout(() => { this.minuterie = null; this.envoyer(); }, due - Date.now());
  },
  async envoyer(){
    if (!this.on || this.occupe || !this.file.length) return;
    this.occupe = true;
    try {
      while (this.file.length){
        const lot = this.file.slice(0, 20);
        await this.appel({ action:"batch", ops:lot });
        const ids = new Set(lot.map(x => x.id + "|" + (x.maj || 0)));
        this.file = this.file.filter(x => !ids.has(x.id + "|" + (x.maj || 0))); this.garderFile();
      }
      this.etat = "ok"; this.derniere = Date.now();
    } catch(e){ this.etat = e.code === "code" || e.code === "bloque" ? "code" : "hors-ligne"; }
    this.occupe = false;
    if (this.file.length && this.etat === "ok" && !this.minuterie) this.minuterie = setTimeout(() => { this.minuterie = null; this.envoyer(); }, 2500);
    majSyncLigne();
  },
  /* tests et test en cours de l'autre appareil ; null si l'intermédiaire ne répond pas */
  async recevoir(){
    if (!this.on) return null;
    try { const j = await this.appel({ action:"list", quiz:QUIZ_ID }); this.etat = "ok"; this.derniere = Date.now(); return j.items || []; }
    catch(e){ this.etat = e.code === "code" || e.code === "bloque" ? "code" : "hors-ligne"; return null; }
  },
  sauver(att){ this.ajouter({ op:"put", id:att.id, type:"test", date:att.date, data:att, maj:Date.now() }); },
  effacer(id){ this.noterSuppr(id); this.ajouter({ op:"put", id, type:"suppr", date:0, data:null, maj:Date.now() }); },
  doc(id, obj){ this.ajouter({ op:"put", id, type:"doc", date:obj && obj.saved || 0, data:obj, maj:Date.now() }); },
};
function syncTexte(){
  if (store.mode !== "local") return "";
  if (!SYNC.on) return /^https?:/.test(location.protocol) ? `Tes scores sont gardés dans ce navigateur uniquement. Pour les retrouver sur tous tes appareils, passe une fois par <a href="../">l'accueil du site</a> et entre ton code.` : "Tes scores sont gardés dans ce navigateur uniquement. Exporte-les de temps en temps.";
  const n = SYNC.file.filter(x => x.type !== "doc").length;
  if (SYNC.etat === "code") return `Le code enregistré sur cet appareil n'est plus accepté : repasse par <a href="../">l'accueil du site</a> pour l'entrer à nouveau. Tes scores restent gardés ici en attendant.`;
  if (SYNC.etat === "hors-ligne" || n) return `🔄 Synchronisation en attente${n ? ` : ${n} enregistrement${n>1?"s":""} partira${n>1?"ont":""} dès que le réseau revient` : ""}. Tes scores sont gardés sur cet appareil en attendant.`;
  return `☁️ Tes scores sont synchronisés entre tes appareils${SYNC.derniere ? ` (dernière fois à ${String(new Date(SYNC.derniere).getHours()).padStart(2,"0")}h${String(new Date(SYNC.derniere).getMinutes()).padStart(2,"0")})` : ""}.`;
}
/* ligne d'état de la synchronisation (onglet Scores) ; sans code sur le site : bouton et petit formulaire pour l'entrer ici */
function syncBloc(){
  if (store.mode !== "local") return "";
  let h = `<p class="note" id="sync-ligne">${syncTexte()}</p>`;
  const surSite = /^https?:/.test(location.protocol) && SYNC_URL_SITE;

    else h += `<div class="synccode" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><label class="fine" for="sync-code-in">Ton code, ${esc(OUTIL.eleve)}</label>
      <input id="sync-code-in" class="tinput" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false">
      ${S.syncErr ? `<p class="warn">${esc(S.syncErr)}</p>` : ""}
      <div class="row"><button class="ghost small" data-act="syncNo">Plus tard</button><button class="cta" data-act="syncOk"${S.syncBusy ? " disabled" : ""}>${S.syncBusy ? "Vérification…" : "Valider"}</button></div></div>`;
  }
  return h;
}
async function syncValider(){
  const inp = document.getElementById("sync-code-in"), code = inp ? inp.value.trim() : "";
  if (!code || S.syncBusy) return;
  S.syncBusy = true; S.syncErr = ""; render();
  let rep = null;
  try { const r = await fetch(SYNC_URL_SITE, { method:"POST", body:JSON.stringify({ eleve:OUTIL.eleve, code, action:"ping" }) }); rep = await r.json(); } catch(e){ rep = { ok:false, erreur:"reseau" }; }
  S.syncBusy = false;
  if (rep && rep.ok){
    try {
      const c = JSON.parse(localStorage.getItem(SYNC_CONF) || "null") || { eleves:{} };
      c.url = SYNC_URL_SITE; c.eleves = c.eleves || {}; c.eleves[OUTIL.eleve] = { code };
      localStorage.setItem(SYNC_CONF, JSON.stringify(c));
    } catch(e){}
    location.reload(); return;
  }
  S.syncErr = rep && rep.erreur === "code" ? "Ce code n'est pas le bon. Réessaie, ou demande à ton papa."
    : rep && rep.erreur === "bloque" ? "Trop d'essais : attends un quart d'heure avant de réessayer."
    : "Pas de réseau pour vérifier le code. Réessaie plus tard : tes scores restent gardés ici.";
  render();
  const i2 = document.getElementById("sync-code-in"); if (i2) i2.focus();
}
function majSyncLigne(){ const el = document.getElementById("sync-ligne"); if (el) el.innerHTML = syncTexte(); }

/* ---------- état ---------- */
const S = {
  screen:"fiche", ficheOpen: OUTIL.ficheOuverte != null ? OUTIL.ficheOuverte : 0, order: ORDRES ? Object.keys(ORDRES)[0] : "",
  selected: DECKS.map(d => d.key),

  frozen:null, paperMsg:"", paperCopy:"",
  quiz:null, rattrapage:false, rattrLabel:"", lastResult:null, storeMsg:"",
  attempts:[], loaded:false, loadErr:"",
  cards:{ order:[], pos:0, flip:false },

  suivi:{ ch:"all", f:"all", pt:null },
  bilan:{},
  draft:null, draftAsk:false, draftBlock:false, draftErr:false, quitAsk:false,
};
const deckLabel = keys => keys.length === DECKS.length ? OUTIL.labelTout
  : DECKS[0].code ? (keys.length > 3 ? keys.length + " " + MOT_PAQUETS : keys.map(k => DECK[k].code).join(" + "))
  : keys.map(k => DECK[k].title).join(" + ");

/* ============================================================
   SUIVI GRAPHIQUE (§ 6 quater) — anneaux par paquet (3 pour les langues, § 11.4)
   ============================================================ */
function rootTests(){ return S.attempts.filter(a => !a.rattrapage).sort((a, b) => a.date - b.date); }
function parentOf(a){
  if (a.parent) return a.parent;
  const prev = S.attempts.filter(x => !x.rattrapage && x.date < a.date && dayOf(x.date) === dayOf(a.date)).sort((x, y) => y.date - x.date)[0];
  return prev ? prev.id : null;
}
function isExam(a){ return a.mode === MODES.exam.label; }
function chapOfQ(x){ return x.question ? x.question.deckKey : null; }
function inChap(ch){ return x => ch === "all" || chapOfQ(x) === ch; }
function qCardKey(x){ return x.question ? x.question.card : ("p|" + x.prompt); }

/* note sans aide d'un test (éventuellement limitée à un paquet) et remontée après chaque rattrapage */
function testScore(root, ch){
  const qs = root.questions.filter(inChap(ch)), score = qs.filter(x => x.correct).length, total = qs.length;
  if (!total) return null;
  const wrong = new Set(qs.filter(x => !x.correct).map(qCardKey)), fixed = new Set(), steps = [];
  S.attempts.filter(a => a.rattrapage && parentOf(a) === root.id).sort((a, b) => a.date - b.date).forEach(r => {
    const rq = r.questions.filter(inChap(ch)); if (!rq.length) return;
    rq.forEach(x => { if (x.correct && wrong.has(qCardKey(x))) fixed.add(qCardKey(x)); });
    const sc = score + fixed.size;
    steps.push({ score:sc, note:noteFrom(sc / total), asked:rq.length, ok:rq.filter(x => x.correct).length });
  });
  return { score, total, note:noteFrom(score / total), typos:qs.filter(x => x.typo).length, steps };
}

/* une réponse compte comme « écrite » (pour un anneau) si elle a été tapée, ou si la question n'existe qu'à choix */
function wroteOf(q){ return COUCHE.wrote ? COUCHE.wrote(q) : (q.type === "type" || !!q.mcqOnly); }
/* historique des cartes au premier passage des tests (jamais les rattrapages) */
function histByCard(exceptId){
  const h = {};
  rootTests().filter(a => a.id !== exceptId).forEach(a => {
    const lvl = LVL_OF_LABEL[a.difficulty]; if (lvl == null) return;
    a.questions.forEach(x => { if (!x.question) return; const k = qCardKey(x); (h[k] = h[k] || []).push({ ok:x.correct, lvl, day:dayOf(a.date), date:a.date, wrote:wroteOf(x.question) }); });
  });
  Object.values(h).forEach(arr => arr.sort((a, b) => a.date - b.date));
  return h;
}
/* état d'une carte pour l'anneau du niveau ringLvl : un anneau = un niveau (fiche v21) */
function ringState(entries, ringLvl){
  const es = entries.filter(e => e.lvl === ringLvl);
  if (!es.length) return "new";
  return es[es.length - 1].ok ? "ok" : "bad";
}
function acquiredOuter(entries){
  const hd = entries.filter(e => e.lvl === 2);
  if (!hd.length || !hd[hd.length - 1].ok) return false;

/* résumé d'un anneau (un niveau) sur un ensemble de cartes */

/* ---------- UN ANNEAU (maths, Dossier) : tous les niveaux comptent ----------

  const note = total ? noteFrom(right / total) : 0, noteAcq = total ? noteFrom(c.ok / total) : 0;
  const state = !posed ? "start" : noteAcq >= 5 ? "ok" : note >= 5 ? "win" : note >= 4 ? "mid" : "low";

function paqSum(dk, hist){ return COUCHE.rings === 1 ? summary1(deckCards(dk), hist) : paquetRings(dk, hist)[2]; }
/* anneau segmenté : acquises (vert foncé), justes (couleur du niveau), à revoir (rouge pâle), pas posées (gris) */

function trend1(dk, hist){

/* état d'un paquet en toutes lettres + boutons (section de la fiche liée à un paquet) */
function paqStatus(dk){

function dayShort(t){ const d = new Date(t); return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0"); }

function trendOf(dk, hist, lvl = 2){

/* lancer un test sur des cartes précises (refaire à revoir / cartes qui résistent / perdues) */
function redoCards(v){

  const decks = DECKS.map(d => d.key).filter(dk => [...keys].some(k => CARD[k] && CARD[k].dk === dk));
  const qs = buildTest(decks, "hard", 0, ORDRES ? Object.keys(ORDRES)[0] : "").filter(q => keys.has(q.card));
  if (!qs.length) return;
  let n = 0; qs.forEach(q => { q.num = ++n; });

/* ----- onglet Scores : courbe, jour par jour, cartes qui résistent ----- */
/* les 5 cartes les plus ratées (premier passage des tests) */
function resistant(){
  const m = {};

    if (twins.some(y => y.tag !== x.tag)) x.word += " · " + (TAG_LABEL[x.tag] || x.tag); else if (x.hint) x.word += " (" + x.hint + ")"; });

  <div class="ch-wrap"><svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe des notes sans aide, avec la remontée après les rattrapages">${g}</svg></div>
  <p class="fine">Touche un point pour voir le détail du test.</p>${detail}`;
}
function suiviHeat(){
  const tests = rootTests(); if (!tests.length) return "";
  const days = [...new Set(tests.map(a => dayOf(a.date)))].slice(-6);
  const tested = new Set(tests.flatMap(a => a.questions.map(chapOfQ)));
  const chs = DECKS.filter(d => tested.has(d.key)), rest = DECKS.filter(d => !tested.has(d.key));
  const lab = d => { const [y, m, j] = d.split("-"); return j.padStart(2,"0") + "." + m.padStart(2,"0"); };
  let h = `<div class="tbl heat"><table><thead><tr><th>${esc(OUTIL.motPaquet)}</th>${days.map(d => `<th>${lab(d)}</th>`).join("")}</tr></thead><tbody>`;
  chs.forEach(d => {
    h += `<tr><td class="k">${esc(d.emoji)} ${esc(d.title)}</td>` + days.map(day => {
      const qs = tests.filter(a => dayOf(a.date) === day).flatMap(a => a.questions.filter(inChap(d.key)));
      if (!qs.length) return `<td class="hc-0">·</td>`;
      const pc = Math.round(qs.filter(x => x.correct).length / qs.length * 100), n = noteFrom(pc/100);
      return `<td class="${n>=5?"hc-ok":n>=4?"hc-mid":"hc-low"}">${pc}${n>=5?" ✓":""}</td>`;
    }).join("") + `</tr>`;
  });
  return h + `</tbody></table></div>${rest.length ? `<p class="fine">Pas encore testés : ${rest.map(d => d.title).join(", ")}.</p>` : ""}<p class="fine">Pourcentage de réponses justes au premier passage des tests, par ${esc(OUTIL.motPaquet.toLowerCase())} et par jour (6 derniers jours). Vert et ✓ : note de 5 ou plus ; orange : 4 à 4,5 ; rouge : sous 4.</p>`;
}
function suiviBlock(){
  const s = S.suivi;
  if (!rootTests().length) return "";
  const res = resistant();
  return `<section class="suivi"><h3>Ma courbe de notes</h3>
  <div class="suivi-ctl"><label class="fine" for="suivi-ch">${esc(OUTIL.motPaquet)}</label><select id="suivi-ch" class="suivi-sel"><option value="all"${s.ch==="all"?" selected":""}>${esc(OUTIL.labelTout)}</option>${DECKS.map(d => `<option value="${d.key}"${s.ch===d.key?" selected":""}>${esc(d.title)}</option>`).join("")}</select>
  <div class="row"><button class="ghost small${s.f==="all"?" on":""}" data-act="suiviF" data-v="all" aria-pressed="${s.f==="all"}">Tous les tests</button><button class="ghost small${s.f==="exam"?" on":""}" data-act="suiviF" data-v="exam" aria-pressed="${s.f==="exam"}">Niveau épreuve et épreuve blanche</button></div></div>

function chainTxt(a){
  if (a.rattrapage) return "";
  const sc = testScore(a, "all"); if (!sc || !sc.steps.length) return "";
  const last = sc.steps[sc.steps.length-1];

let draftChain = Promise.resolve();
let draftSig = "";   /* dernier état gardé : on ne réécrit pas un test en cours qui n'a pas changé (sinon une page restée ouverte sur un autre appareil le rajeunirait en se fermant) */
function draftLocalSet(obj){ try { localStorage.setItem(DRAFT_ID, JSON.stringify(obj)); return true; } catch(e){ return false; } }
function draftLocalGet(){ try { const v = localStorage.getItem(DRAFT_ID); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function draftWrite(obj){
  const okLocal = draftLocalSet(obj);
  if (store.mode === "local") SYNC.doc(DRAFT_ID, obj);
  if (store.mode === "db") draftChain = draftChain.then(() => store.setDoc(DRAFT_ID, obj)).then(() => { S.draftErr = false; }, () => { S.draftErr = !okLocal; draftErrShow(); });
  else if (store.mode === "memory"){ store.setDoc(DRAFT_ID, obj); S.draftErr = !okLocal; draftErrShow(); }
}
function draftErrShow(){ const m = document.getElementById("draft-err"); if (m) m.hidden = !S.draftErr; }
function draftSave(){
  const Q = S.quiz; if (!Q || Q.done) return;
  const d = { v:2, questions:Q.questions, i:Q.i, answers:Q.detail.map(x => { const o = { u:x.user, c:x.correct }; if (x.typo) o.t = 1; if (x.liveFixed){ o.lf = 1; o.ls = x.liveSnap; } return o; }),
    picked:Q.checked ? Q.picked : null, typed:Q.checked ? Q.typed : "", checked:Q.checked, ok:Q.ok, liveFixed:!!Q.liveFixed, errSnap:Q.errSnap || "",
    label:Q.label, start:Q.start || Date.now(), saved:Date.now(), rattrapage:!!S.rattrapage, rattrLabel:S.rattrLabel || "", rattrParent:S.rattrParent || null,
    selected:S.selected, difficulty:S.difficulty, mode:S.mode, order:S.order };
  const sig = JSON.stringify({ ...d, saved:0 }); if (sig === draftSig) return; draftSig = sig;
  S.draft = d; draftWrite(d);
}
function draftDetail(d){
  if (d.detail) return d.detail;
  return (d.answers || []).map((x, k) => { const q = d.questions[k];
    return { num:q.num, ex:q.ex, ref:q.exTitle, prompt:q.prompt, user:x.u, answer:q.answer, correct:x.c, ...(x.t ? { typo:true } : {}), liveFixed:!!x.lf, liveSnap:x.ls || "", expl:q.expl, tag:q.tag, question:q }; });
}
const draftN = d => (d.answers || d.detail || []).length;
const draftOk = d => !!(d && d.questions && d.questions.length && (d.answers || d.detail));
function draftPick(a, b){ const ta = a ? a.saved || 0 : -1, tb = b ? b.saved || 0 : -1; const w = ta >= tb ? a : b; return draftOk(w) ? w : null; }
function draftClear(){ draftSig = ""; S.draft = null; S.draftAsk = false; S.draftBlock = false; draftWrite({ vide:true, saved:Date.now() }); }
function draftResume(){
  const d = S.draft; if (!d) return;
  S.selected = (d.selected || d.keys || DECKS.map(x => x.key)).filter(k => DECK[k]); S.difficulty = d.difficulty; S.mode = MODES[d.mode] ? d.mode : "train"; S.frozen = null;
  if (ORDRES && d.order && ORDRES[d.order]) S.order = d.order;
  S.rattrapage = !!d.rattrapage; S.rattrLabel = d.rattrLabel || d.label || ""; S.rattrParent = d.rattrParent || d.parent || null;
  S.quiz = { questions:d.questions, i:d.i, picked:d.picked, typed:d.typed || "", checked:!!d.checked, ok:!!d.ok, liveFixed:!!d.liveFixed, hadErr:!!d.liveFixed, errSnap:d.errSnap || "", detail:draftDetail(d), finishing:false, done:false, start:d.start, label:d.label };
  S.lastResult = null; S.storeMsg = ""; S.quitAsk = false; S.draftAsk = false; S.draftBlock = false; S.screen = "quiz";
  render(); window.scrollTo(0,0);
}
function draftWhat(d){ return d.rattrapage ? "Rattrapage" : DIFFICULTIES[d.difficulty].label + " · " + (MODES[d.mode] || MODES.train).label; }
function draftBanner(){
  const d = S.draft; if (!d) return "";
  const n = draftN(d), tot = d.questions.length;
  if (S.draftAsk) return `<div class="draft"><p><b>Abandonner ce test ?</b><span>Tes ${n} réponse${n>1?"s":""} ser${n>1?"ont effacées":"a effacée"} et ne compter${n>1?"ont":"a"} nulle part.</span></p>
    <div class="draft-row"><button class="ghost small" data-act="draftDrop">Oui, abandonner</button><button class="cta" data-act="draftNo">Non, je le garde</button></div></div>`;
  return `<div class="draft${S.draftBlock?" block":""}">${S.draftBlock ? `<p class="draft-stop"><b>Un seul test à la fois</b><span>Reprends ce test ou abandonne-le avant d'en lancer un autre.</span></p>` : ""}<p><b>⏸ Tu as un test en cours</b><span>${esc(d.label)} · ${esc(draftWhat(d))} · ${n} sur ${tot} répondue${n>1?"s":""} · ${dateLabel(d.saved)}</span></p>
    <div class="draft-row"><button class="cta" data-act="draftResume">Reprendre mon test</button><button class="ghost small" data-act="draftAsk">Abandonner</button></div>
    <p class="fine">Il compte dans tes scores seulement quand tu l'as terminé. Tu ne peux pas lancer un autre test tant que celui-ci n'est pas terminé ou abandonné.</p></div>`;
}
function quitView(){
  const Q = S.quiz, n = Q.detail.length, tot = Q.questions.length;

function lvUnit(c){ return /[\p{L}\p{N}]/u.test(c) ? dxN(c) : ""; }
function lvCands(q){ return COUCHE.liveCands(q); }
function lvCheck(typed, cands){
  const chars = [...typed], T = [];
  chars.forEach((c, i) => { for (const u of lvUnit(c)) T.push({ ch:u, i }); });
  const t = T.map(x => x.ch), m = t.length;
  let best = null;
  cands.forEach(cs => {
    const c = [...cs], n = c.length;
    const D = Array.from({ length:m+1 }, () => new Array(n+1).fill(0));
    for (let i = 0; i <= m; i++) D[i][0] = i;
    for (let j = 0; j <= n; j++) D[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) D[i][j] = Math.min(D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + (t[i-1] === c[j-1] ? 0 : 1));
    let bj = 0; for (let j = 0; j <= n; j++) if (D[m][j] < D[m][bj]) bj = j;
    if (!best || D[m][bj] < best.cost) best = { cost:D[m][bj], D, c, bj };
  });
  const bad = new Set(), miss = new Set();
  if (best && best.cost > 0){
    const { D, c } = best; let i = m, j = best.bj;
    while (i > 0 && j > 0){
      if (D[i][j] === D[i-1][j-1] + (t[i-1] === c[j-1] ? 0 : 1)){ if (t[i-1] !== c[j-1]) bad.add(T[i-1].i); i--; j--; }
      else if (D[i][j] === D[i-1][j] + 1){ bad.add(T[i-1].i); i--; }
      else { miss.add(i < m ? T[i].i : -1); j--; }
    }
    while (i > 0){ bad.add(T[i-1].i); i--; }
    while (j > 0){ miss.add(m ? T[0].i : -1); j--; }
  }
  return { bad, miss, n: bad.size + miss.size };
}
function lvHtml(typed, r){
  let h = "";
  [...typed].forEach((c, i) => {
    if (r.miss.has(i)) h += dxMiss;
    h += r.bad.has(i) ? `<span class="lv-bad">${esc(c)}</span>` : esc(c);
  });
  if (r.miss.has(-1)) h += dxMiss;
  return h || `<span class="lv-empty">Tes lettres s'affichent ici</span>`;
}
function updateLive(){
  const Q = S.quiz; if (!Q || S.mode !== "live") return;
  const q = Q.questions[Q.i]; if (!q || q.type !== "type" || Q.checked) return;
  Q.lvcache = Q.lvcache || {};
  const cands = Q.lvcache[Q.i] || (Q.lvcache[Q.i] = lvCands(q));
  const r = lvCheck(Q.typed, cands);
  if (r.n > 0){ Q.hadErr = true; Q.errSnap = Q.typed; }
  const box = document.getElementById("live-box"); if (box) box.innerHTML = lvHtml(Q.typed, r);
  const st = document.getElementById("live-state");
  if (st) st.textContent = r.n ? `✗ ${r.n} ${r.n > 1 ? "lettres à corriger" : "lettre à corriger"}`
    : Q.hadErr ? "✓ Corrigé — ce mot ne comptera pas dans la note" : Q.typed.trim() ? "✓ Pour l'instant, c'est juste" : "";
}

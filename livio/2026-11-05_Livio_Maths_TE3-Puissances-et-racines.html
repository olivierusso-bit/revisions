<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>
<title>Puissances et racines TE3 · jeudi 05.11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Règle logarithmique des puissances de dix : exposants négatifs en magenta, positifs en indigo, 10⁰ au centre.
   Les calculs sont en chasse fixe, comme au cahier. */
:root{
  --paper:#F1F0F6; --sheet:#FFFFFF; --ink:#1A1834; --soft:#5B5878; --rule:#CFCCE0;
  --pos:#3A3A96; --pos-wash:#E3E3F5; --neg:#A73A72; --neg-wash:#F7E1EC; --mark:#C99A00; --board:#1A1834;
  --good:#11704B; --good-wash:#DCF1E6; --bad:#B23A26; --bad-wash:#F9E1DB; --on-accent:#FFFFFF;
  --p-okdark:#0B5A3A; --p-ok:#2E9E62; --p-mid:#D9860B; --p-low:#C6382B; --p-lowsoft:#F2B9B2;
  --display:'Familjen Grotesk','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F0E1C; --sheet:#1A1930; --ink:#E8E6F4; --soft:#A3A0C0; --rule:#2F2D4A;
  --pos:#9C9CF2; --pos-wash:#24234A; --neg:#F08CBE; --neg-wash:#3A1D2E; --mark:#E6B82A; --board:#0A0916;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-accent:#0F0E1C;
  --p-okdark:#3FCB86; --p-ok:#7EDCA8; --p-mid:#F2A93B; --p-low:#FF7A6B; --p-lowsoft:#5A2A26; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F0E1C; --sheet:#1A1930; --ink:#E8E6F4; --soft:#A3A0C0; --rule:#2F2D4A;
  --pos:#9C9CF2; --pos-wash:#24234A; --neg:#F08CBE; --neg-wash:#3A1D2E; --mark:#E6B82A; --board:#0A0916;
  --good:#5ED3A0; --good-wash:#173326; --bad:#FF8A7D; --bad-wash:#3A1E1B; --on-accent:#0F0E1C;
  --p-okdark:#3FCB86; --p-ok:#7EDCA8; --p-mid:#F2A93B; --p-low:#FF7A6B; --p-lowsoft:#5A2A26; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.m{font-family:var(--mono);font-weight:500}
.head{display:flex;gap:14px;align-items:center}
.badge{width:60px;height:60px;flex:none;border-radius:50%;background:var(--board);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge small{font-size:11px;letter-spacing:1px;font-weight:700;color:var(--mark)}
.badge b{font-family:var(--display);font-weight:700;font-size:26px}
.head h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.5vw,36px);line-height:1;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--soft);font-size:14px}
.axis{display:block;width:100%;height:auto;margin:10px 0 16px}
.screen{display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15.5px}
.lab{font-family:var(--display);font-weight:700;font-size:19px;margin:12px 0 0}
.fine{font-size:13px;color:var(--soft);margin:0}
.warn{background:var(--bad-wash);border-left:3px solid var(--bad);padding:10px 12px;font-size:14px;border-radius:0 8px 8px 0;margin:0}
.note{background:var(--pos-wash);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.back{align-self:flex-start;background:none;border:0;color:var(--pos);font-weight:700;padding:0;cursor:pointer}
.cta{width:100%;padding:15px;border:0;border-radius:10px;background:var(--pos);color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-weight:700;font-size:14.5px;cursor:pointer}
.ghost:disabled{opacity:.5;cursor:not-allowed}
.ghost.small{font-size:13.5px;padding:10px}
.ghost.danger{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* fiche */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.entry.open{border-color:var(--pos)}
.entry-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:left;cursor:pointer}
.entry-num{flex:none;min-width:38px;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--pos);border:1px solid var(--pos);border-radius:20px;text-align:center;padding:1px 6px}
.entry-num.miss{color:var(--neg);border-color:var(--neg)}
.entry-title{flex:1;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;min-width:0}
.entry-body{padding:0 14px 14px}
.pair{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.pair-k{font-family:var(--mono);font-weight:600;color:var(--pos);overflow-wrap:anywhere}
.astuce{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--pos-wash);font-size:14px}
.astuce b{display:block;color:var(--pos);margin-bottom:2px}
.astuce.neg{background:var(--neg-wash)} .astuce.neg b{color:var(--neg)}
.tip{margin:0;padding:6px 0 6px 12px;border-left:3px solid var(--mark);font-size:15px}
.src-date{font-weight:400;color:var(--soft);font-size:13px;font-family:var(--body)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.photos .missing span{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;max-width:100%;border:1px dashed var(--rule);border-radius:6px;color:var(--soft);font-size:13px;text-align:center;padding:8px}
.photos figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}
.version{margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}
/* paquets */
.decks{display:flex;flex-direction:column;gap:10px}
.deck{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 12px 12px 44px;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.deck.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash)}
.deck-box{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:6px;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-accent);font-size:14px}
.deck.on .deck-box{background:var(--pos);border-color:var(--pos)}
.deck-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.deck-c{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--pos)}
.deck-t{font-weight:700;font-size:14.5px;line-height:1.25}
.deck-n{font-size:12.5px;color:var(--soft)}
/* pastilles */
.pst{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:64px}
.pring{display:block}
.pst-w{font-size:11px;font-weight:700;color:var(--soft);text-align:center;line-height:1.15}
.pst-was{font-size:10.5px;color:var(--soft);text-align:center;line-height:1.1}
.pglob{display:flex;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px}
.pglob-t{min-width:0;font-size:14px}
.pglob-t b{display:block;font-family:var(--display);font-size:17px}
.plegend{font-size:13.5px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:0 12px}
.plegend summary{cursor:pointer;padding:10px 0;font-weight:700}
.plegend p{margin:0 0 8px}
.pdrop{background:var(--neg-wash);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.pdrop p{margin:0}
/* cartes */
.flash{position:relative;height:300px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--neg);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;padding:22px;transition:transform .45s;text-align:center;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--pos-wash);border-color:var(--pos);border-top-color:var(--pos)}
.flash.flipped .face.f{transform:rotateY(180deg)}
.flash.flipped .face.b{transform:rotateY(360deg)}
.face-tag{font-size:12px;font-weight:700;color:var(--soft)}
.face-word{font-family:var(--mono);font-weight:600;font-size:24px;line-height:1.3;overflow-wrap:anywhere}
.face-mini{font-size:14px;line-height:1.45}
.face-hint{font-size:12px;color:var(--soft)}
/* réglages */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash)}
.opt-e{grid-row:1/3;font-size:20px}
.opt-main{font-weight:700}
.opt-sub{font-size:13px;color:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:11px 4px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos);background:var(--pos-wash);color:var(--pos)}
.paper{background:var(--sheet);border:1px dashed var(--pos);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
/* test en cours */
.draft{background:var(--sheet);border:2px solid var(--mark);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.draft.alert{border-color:var(--bad)}
.draft p{margin:0}
.draft b{font-family:var(--display);font-size:17px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.quit{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--soft)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos);transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--mono);font-weight:600;font-size:14px;background:var(--board);color:var(--mark);padding:2px 9px;border-radius:4px;font-variant-numeric:tabular-nums}
.ref{font-size:12.5px;color:var(--soft)}
.chg{font-size:12px;font-weight:700;color:var(--neg);border:1px solid var(--neg);border-radius:20px;padding:0 8px}
.consigne{margin:0;font-size:14.5px;color:var(--soft)}
.qword{font-family:var(--mono);font-weight:600;font-size:clamp(21px,6vw,28px);line-height:1.35;margin:0;overflow-wrap:anywhere}
.qword.txt{font-family:var(--body);font-weight:700;font-size:clamp(19px,5.2vw,23px)}
.qhint{margin:0;font-size:14px;color:var(--soft)}
.choice{padding:14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);text-align:left;font-size:16px;font-weight:700;cursor:pointer;line-height:1.35}
.choice.expr{font-family:var(--mono);font-size:18px}
.choice.sel{border-color:var(--pos);box-shadow:inset 0 0 0 2px var(--pos)}
.choice.good{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.choice.off{opacity:.5}
.tinput{width:100%;padding:14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink)}
.tinput.good{background:var(--good-wash);border-color:var(--good)}
.tinput.bad{background:var(--bad-wash);border-color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:44px;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-family:var(--mono);font-weight:600;font-size:16px;cursor:pointer}
.preview{font-family:var(--mono);font-size:15px;color:var(--soft);margin:0;min-height:1.4em}
.fb{padding:14px;border-radius:10px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-wash);border-color:var(--good)}
.fb.no{background:var(--bad-wash);border-color:var(--bad)}
.fb-t{font-family:var(--display);font-weight:700;font-size:19px;margin:0}
.fb p{margin:0}
.fb-x{font-size:14px;color:var(--soft)}
/* résultats */
.scorebox{background:var(--board);border-radius:12px;padding:18px;text-align:center;border:4px solid #2F2D4A}
.scorebox.rattr-box{border-color:var(--neg)}
.score-n{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.score-n small{font-size:30px;color:#A3A0C0}
.score-note{display:inline-block;margin-top:8px;background:var(--mark);color:#1A1834;font-weight:800;padding:4px 14px;border-radius:4px}
.rattr{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#F08CBE}
.rev{display:flex;flex-direction:column;gap:9px}
.revcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.revcard.ok{border-left-color:var(--good)}
.revcard p{margin:0;font-size:14.5px}
.rev-q{font-weight:700}
.rev-good{color:var(--good)}
.rev-x{font-size:13px!important;color:var(--soft)}
/* bilan */
.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bilan h3{font-family:var(--display);font-size:19px;margin:0}
.bilan-lab{font-size:13px;font-weight:700;color:var(--soft);margin:4px 0 0}
.bilan ul{margin:0;padding-left:18px}
.bilan li{margin-bottom:4px;font-size:14.5px}
.bilan-tip{background:var(--pos-wash);border-radius:8px;padding:10px 12px;font-size:14.5px;margin:0}
textarea.exportarea{width:100%;border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--mono)}
/* scores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--board);border-radius:10px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--mark);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#C9C6E0}
.suivi{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.suivi select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit}
.chartbox{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.chartbox svg{display:block}
.chartbox .pt{cursor:pointer}
.ptdetail{font-size:14px;background:var(--paper);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ptdetail p{margin:0}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px;font-size:12.5px}
.heat th{font-weight:700;color:var(--soft);text-align:left;white-space:nowrap;padding:2px 4px}
.heat td{min-width:46px;text-align:center;border-radius:5px;padding:6px 3px;font-variant-numeric:tabular-nums;font-weight:700}
.hc-low{background:var(--p-low);color:#fff}.hc-mid{background:var(--p-mid);color:#1A1834}.hc-ok{background:var(--p-ok);color:#08301E}.hc-none{background:transparent;color:var(--soft);font-weight:400}
.resist{display:flex;flex-direction:column;gap:6px}
.resist p{margin:0;font-size:14px;padding:6px 0;border-top:1px solid var(--rule)}
.attempt{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.attempt-head{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:12px;text-align:left;cursor:pointer}
.attempt-left{flex:1;min-width:0}
.attempt-left b{display:block;font-size:14.5px}
.attempt-left span{display:block;font-size:12px;color:var(--soft)}
.attempt-left .rattr-tag,.rattr-tag{display:inline-block;background:var(--neg);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:6px}
.attempt-note{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--on-accent)}
.attempt-note.good{background:var(--good)} .attempt-note.low{background:var(--bad)}
.attempt-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.mini{padding:9px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;cursor:pointer}
.mini.yes{background:var(--bad);border-color:var(--bad);color:#fff}
/* onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:3px solid var(--pos);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--soft)}
.tab-e{font-size:18px} .tab-l{font-size:11px;font-weight:700}
.tab.on{color:var(--pos);background:var(--pos-wash)}
/* voir mes erreurs : barré + fond foncé = faux ; souligné + fond clair = ce qu'il fallait */
.dx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:13px;color:var(--soft)}
.dx-line{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:baseline;margin:2px 0!important}
.dx-lab{font-size:12.5px!important;font-weight:700;color:var(--soft)}
.dx-ans{font-family:var(--mono);font-size:17px;font-weight:600;overflow-wrap:anywhere;line-height:1.7}
.dx-ans.txt{font-family:var(--body)}
.dx-bad{background:#A3241B;color:#fff;text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:1px 3px}
.dx-good{background:#D4F0E1;color:#08402A;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px;padding:1px 3px;font-weight:800}
.dx-none{font-style:italic;font-weight:400;color:var(--soft);font-family:var(--body)}
@media (prefers-reduced-motion: reduce){.face,.bar i{transition:none}}
</style>

<script>
/* ============================================================
   MATHS — 10CR niveau 2 · TE 3 « NO – Puissances, racines »
   Outil de révision de Livio — 10e HarmoS. Épreuve : jeudi 5 novembre 2026.
   Paquets = les 6 objectifs de la feuille « Objectifs TE 3 », dans son ordre (demande du papa, 31.10.2026).
   ============================================================ */
const QUIZ_ID = "livio-quiz-maths-te3-puissances";
const DUE = { iso:"2026-11-05", long:"jeudi 5 novembre", short:"05.11" };
const HAS_CLAUDE = !!(window.claude && window.claude.use);
const INDEX_KEY = QUIZ_ID + "-index";
const ATTEMPT_PREFIX = QUIZ_ID + "-attempt-";

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","−":"⁻","-":"⁻"};
function uni(s){ return String(s == null ? "" : s).replace(/\^\(([^)]*)\)|\^(-?[0-9]+)/g, (m, a, b) => [...(a != null ? a : b)].map(c => SUP[c] || c).join("")); }
const UNSUP = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-","⁺":"+"};
function normMath(s){
  let t = String(s || "").toLowerCase().trim();
  t = t.replace(/^[a-z]\s*=\s*/, "");
  t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "^(" + [...m].map(c => UNSUP[c]).join("") + ")");
  t = t.replace(/[−–—]/g, "-").replace(/[×*∙•]/g, "·").replace(/(\d)\s*x\s*(\d)/g, "$1·$2").replace(/[\s'’]/g, "");
  t = t.replace(/,/g, ".").replace(/:/g, "/");
  t = t.replace(/\^\((-?\d+)\)/g, "^$1").replace(/^\+/, "");
  if (/^-?\d+(\.\d+)?$/.test(t)) t = String(parseFloat(t));
  return t;
}
function matchAnswer(input, q){
  if (!input || !String(input).trim()) return false;
  const me = normMath(input);
  return q.accept.some(a => normMath(a) === me);
}
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pickOptions(good, wrong, pool){
  const seen = new Set([normMath(good)]), out = [];
  const add = v => { if (v == null || out.length >= 3) return; const k = normMath(v); if (seen.has(k)) return; seen.add(k); out.push(v); };
  if (wrong && wrong.length){ shuffle(wrong).forEach(add); return shuffle([good, ...out]); }
  shuffle(pool).forEach(x => add(x.back[0]));
  return shuffle([good, ...out]);
}
const noteFrom = r => Math.round((1 + 5*r)*2)/2;

const p2 = x => String(x).padStart(2,"0");

function dayKey(ts){ const d = new Date(ts); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }

function sampleDeck(d, n){
  const items = d.items.map((it, idx) => ({ it, idx }));
  if (n === "all" || items.length <= +n) return items.map(x => x.it);
  const groups = []; let last = null;
  items.forEach(x => { const c = x.it.consigne; if (c !== last){ groups.push([]); last = c; } groups[groups.length-1].push(x); });
  const pools = groups.map(g => shuffle(g)), picked = []; let gi = 0;
  while (picked.length < +n && pools.some(p => p.length)){ const p = pools[gi % pools.length]; if (p.length) picked.push(p.pop()); gi++; }
  return picked.sort((a,b) => a.idx - b.idx).map(x => x.it);
}
function makeQ(it, d, difficulty, i){
  const asMcq = it.mcqOnly || difficulty === "easy" || (difficulty === "normal" && Math.random() < 0.5);
  const q = { id:"q"+(i+1), num:i+1, ex:0, exTitle:d.title, deckKey:d.key, tag:d.key, code:d.code, ref:d.code + " " + it.ref, card:it.key, consigne:it.consigne,
    word:it.front, prompt:`${it.consigne} ${uni(it.front)}`, answer:it.back[0], chg:!!it.chg, mcqOnly:!!it.mcqOnly,
    expl:it.expl + " — " + (it.chg ? "même exercice que " : "") + it.src + "." , expr:!!it.expr };
  if (asMcq){ q.type = "mcq"; q.options = pickOptions(it.back[0], it.wrong, d.items); }
  else { q.type = "type"; q.accept = it.back; }
  return q;
}
function numberQs(list){
  let ex = 0, lastBlock = null;
  list.forEach((q, i) => { const block = q.deckKey + "|" + q.consigne; if (block !== lastBlock){ ex++; lastBlock = block; } q.ex = ex; q.num = i + 1; q.id = "q" + (i+1); });
  return list;
}
function buildTest(keys, difficulty, order, limit){
  let list = [];
  DECKS.filter(d => keys.includes(d.key)).forEach(d => sampleDeck(d, limit).forEach(it => list.push({ it, d })));
  if (order === "mixed") list = shuffle(list);
  return numberQs(list.map(({ it, d }, i) => makeQ(it, d, difficulty, i)));
}
function buildFromCards(cardKeys, difficulty){
  return numberQs(cardKeys.filter(k => ITEM[k]).map((k, i) => makeQ(ITEM[k].it, ITEM[k].d, difficulty, i)));
}

function testScore(att){
  const total = att.total, base = att.questions.filter(q => q.correct).length, wrongCards = new Set(att.questions.filter(q => !q.correct).map(q => q.card));
  const fixed = new Set(), steps = [];
  rattrOf(att).forEach(r => { r.questions.forEach(q => { if (q.correct && wrongCards.has(q.card)) fixed.add(q.card); }); steps.push({ att:r, right:r.score, total:r.total, note:noteFrom((base + fixed.size)/total) }); });

function cardHist(list){
  const h = {};
  list.forEach(a => a.questions.forEach(q => { if (!q.card) return; (h[q.card] = h[q.card] || []).push({ date:a.date, ok:q.correct, wrote:q.qtype === "type" || (q.question && q.question.mcqOnly) }); }));
  return h;
}
function cardState(hs){
  if (!hs || !hs.length) return "none";
  const last = hs[hs.length-1]; if (!last.ok) return "bad";
  if (!last.wrote) return "route";
  for (let k = hs.length - 2; k >= 0; k--){ if (!hs[k].ok) break; if (hs[k].wrote && dayKey(hs[k].date) !== dayKey(last.date)) return "acq"; }
  return "route";
}
function lvlOf(right, acq, total, posed){
  if (!posed) return "start";

  return n >= 5 ? "ok" : n >= 4 ? "mid" : "low";
}
const LVL_WORD = { start:"à commencer", low:"à revoir", mid:"en route", ok:"réussi", okdark:"OK ✓" };
const LVL_RANK = { start:0, low:1, mid:2, ok:3, okdark:3 };
function chapSummary(key, list){
  const h = cardHist(list || tests()), items = DECK[key].items;
  let acq = 0, route = 0, bad = 0, none = 0;
  items.forEach(it => { const s = cardState(h[it.key]); if (s === "acq") acq++; else if (s === "route") route++; else if (s === "bad") bad++; else none++; });
  const total = items.length, right = acq + route, posed = total - none;
  return { key, acq, route, bad, none, total, right, posed, state:lvlOf(right, acq, total, posed), note: posed ? noteFrom(right/total) : null };
}
function prevSummary(key){
  const t = tests(), touching = t.filter(a => a.questions.some(q => q.tag === key));
  if (touching.length < 2) return null;

  return { sum:chapSummary(key, t.filter(a => a.id !== lastId)), date:touching[touching.length-2].date };

  const now = chapSummary(key), prev = prevSummary(key); if (!prev) return null;
  const trend = now.right > prev.sum.right ? "↗" : now.right < prev.sum.right ? "↘" : "";
  const drop = LVL_RANK[now.state] < LVL_RANK[prev.sum.state] ? prev.sum : null;
  let lost = [];
  if (drop){ const hNow = cardHist(tests()), hPrev = cardHist(tests().filter(a => a.date <= prev.date)); lost = DECK[key].items.filter(it => { const a = cardState(hPrev[it.key]), b = cardState(hNow[it.key]); return (a === "acq" || a === "route") && b === "bad"; }).map(it => it.key); }
  return { trend, drop, lost, prevDate:prev.date };
}

    arcs = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${w}" stroke="var(--rule)"/>`;
    let off = 0;
    [[sum.acq, "var(--p-okdark)"], [sum.route, pColor(sum.state === "okdark" ? "ok" : sum.state)], [sum.bad, "var(--p-lowsoft)"]].forEach(([n, c]) => {
      if (!n) return; const len = C*n/sum.total;
      arcs += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="${w}" stroke="${c}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`;
      off += len;
    });
  }
  const label = sum.state === "start" ? "" : (sum.pct != null ? sum.pct + "%" : sum.right + "/" + sum.total);
  return `<svg class="pring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label || "pas encore testé")}">${arcs}<text x="${cx}" y="${cx+4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="${size > 70 ? 15 : 12}" fill="var(--ink)">${label}</text></svg>`;
}
function pastille(key){
  const sum = chapSummary(key), d = dropOf(key);
  return `<span class="pst">${ringSvg(sum, 52)}<span class="pst-w">${LVL_WORD[sum.state]}${d && d.trend ? " " + d.trend : ""}</span>${d && d.drop ? `<span class="pst-was">avant : ${LVL_WORD[d.drop.state]}</span>` : ""}</span>`;
}
function globalPastille(){
  const sums = ALL_KEYS.map(k => chapSummary(k)), t = k => sums.reduce((n, s) => n + s[k], 0);
  const total = t("total"), right = t("right"), acq = t("acq"), bad = t("bad"), none = t("none"), posed = total - none;
  const g = { acq, route:t("route"), bad, none, total, right, state:lvlOf(right, acq, total, posed), pct: posed ? Math.round(right/total*100) : null };
  const nOk = sums.filter(s => s.state === "okdark").length, nRe = sums.filter(s => s.state === "ok").length;
  return `<div class="pglob">${ringSvg(g, 84)}<div class="pglob-t"><b>Avancement général · ${LVL_WORD[g.state]}</b>${right} cartes justes au dernier test sur ${total}, dont ${acq} acquises · ${bad} à revoir · ${none} pas encore posées<br>${nOk} objectifs OK · ${nRe} réussis, à confirmer · sur ${ALL_KEYS.length}</div></div>
  <details class="plegend"><summary>Comment se lit la pastille ?</summary>
  <p>Le chiffre au centre : les questions de l'objectif réussies au dernier test où chacune est tombée, sur toutes ses questions. Seul le premier passage d'un test compte, pas les rattrapages.</p>
  <p>Mots et couleurs suivent la note : sous 4 « à revoir » (rouge), 4 à 4,5 « en route » (orange), 5 et plus « réussi » (vert), réussi à nouveau un autre jour « OK ✓ » (vert foncé). Gris en pointillé : pas encore testé.</p>
  <p>Dans l'anneau : vert foncé = acquis (écrit juste deux jours différents), couleur du niveau = juste au dernier test, rouge pâle = raté, gris = pas encore posé. Un calcul n'est acquis que s'il a été écrit, pas seulement choisi.</p></details>`;
}
function chapStatus(key){
  const sum = chapSummary(key), d = dropOf(key);
  let h = `<p class="fine"><b>Cet objectif : ${LVL_WORD[sum.state]}</b>${sum.posed ? ` · ${sum.right} justes au dernier test (note ${fmtNote(sum.note)}) · dont ${sum.acq} acquises · ${sum.bad} à revoir · ${sum.none} pas encore posées` : ""}${sum.state === "ok" ? " · refais un test un autre jour pour le confirmer" : ""}</p>`;
  if (d && d.drop && d.lost.length) h += `<div class="pdrop"><p>↘ Le ${dayShort(d.prevDate)}, cet objectif était à « ${LVL_WORD[d.drop.state]} » (note ${fmtNote(d.drop.note)}). ${d.lost.length} question${d.lost.length>1?"s":""} réussie${d.lost.length>1?"s":""} avant ${d.lost.length>1?"sont ratées":"est ratée"} au dernier test : ce sont elles à reprendre.</p><button class="ghost small" data-act="redoCards" data-v="${d.lost.join(",")}">Refaire ces ${d.lost.length} questions</button></div>`;
  else { const bad = DECK[key].items.filter(it => cardState(cardHist(tests())[it.key]) === "bad").map(it => it.key); if (bad.length) h += `<button class="ghost small" data-act="redoCards" data-v="${bad.join(",")}">Refaire mes ${bad.length} questions à revoir</button>`; }
  return h;
}

}
function axisSvg(){
  /* règle des puissances de dix, de 10⁻⁶ à 10⁹ : chaque graduation vaut dix fois la précédente */
  let t = "";
  for (let k = -6; k <= 9; k++){
    const x = 16 + (k + 6) * 24.5, col = k < 0 ? "var(--neg)" : k > 0 ? "var(--pos)" : "var(--ink)";
    t += `<line x1="${x}" y1="${k===0?6:12}" x2="${x}" y2="${k===0?30:24}" stroke="${col}" stroke-width="${k===0?3:1.5}"/>`;
    if (k % 3 === 0) t += `<text x="${x}" y="46" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="${k===0?600:500}" fill="${col}">10${uni("^(" + (k<0?"−":"") + Math.abs(k) + ")")}</text>`;
  }
  return `<svg class="axis" viewBox="0 0 400 52" role="img" aria-label="Règle des puissances de dix, de 10 puissance moins 6 à 10 puissance 9"><line x1="16" y1="18" x2="163" y2="18" stroke="var(--neg)" stroke-width="2"/><line x1="163" y1="18" x2="384" y2="18" stroke="var(--pos)" stroke-width="2"/>${t}</svg>`;
}

/* ---------- quiz ---------- */
function startQuiz(questions, rattrapage, parent, label){
  guardStart(() => {
    S.quiz = { questions, i:0, picked:null, typed:"", checked:false, ok:false, detail:[], finishing:false, done:false, label: label || (rattrapage ? S.rattrLabel : deckLabel(S.selected)), keys:[...new Set(questions.map(q => q.deckKey))] };
    S.rattrapage = rattrapage; S.rattrParent = parent || null; S.lastResult = null; S.storeMsg = ""; S.screen = "quiz"; S.quitAsk = false;
    draftSave(); render(); window.scrollTo(0,0);
  });
}
function typeHint(q){
  if (q.expr && /·10\^/.test(q.answer)) return "Tape 4,8·10^-3 (le · avec la touche ci-dessous, ou *).";
  if (q.expr && /^\(.*\/.*\)\^/.test(q.answer)) return "Tape la fraction entre parenthèses : (2/3)^2";
  if (q.expr && /\^/.test(q.answer)) return "Tape l'exposant avec ^ : 10^7, 10^-3";
  if (/^\d{1,3}( \d{3})+$/.test(q.answer)) return "Les espaces ou les apostrophes entre les milliers sont acceptés.";
  return "";
}
function keysFor(q){
  const k = ["−", ","];
  if (q.expr){ k.push("^", "·", "(", ")"); if (/\//.test(q.answer)) k.push("/"); }
  return k;
}
function viewQuiz(){
  const Q = S.quiz, q = Q.questions[Q.i], total = Q.questions.length, instant = S.mode === "train";
  if (S.quitAsk) return `<p class="lab">Tu veux arrêter ce test ?</p><p class="fine">${Q.detail.length} sur ${total} répondues.</p>
    <button class="cta" data-act="quitKeep">Garder pour plus tard</button><button class="ghost danger" data-act="quitDrop">Abandonner ce test</button><button class="ghost" data-act="quitNo">← Continuer le test</button>`;
  let h = `<div class="qtop"><button class="quit" data-act="quit" aria-label="Arrêter le test">✕</button><div class="bar"><i style="width:${Math.round(Q.i/total*100)}%"></i></div><span class="qn">${Q.i+1}/${total}</span></div>
  ${S.draftErr ? `<p class="warn">${esc(S.draftErr)}</p>` : ""}
  <div class="badges"><span class="num">N° ${q.num}</span><span class="ref">Exercice ${q.ex} · ${esc(q.ref)}</span>${q.chg ? `<span class="chg">chiffres changés</span>` : ""}</div>
  <p class="consigne">${esc(q.consigne)}</p><p class="qword${isText(q.word) ? " txt" : ""}">${esc(uni(q.word))}</p>`;
  if (q.type === "mcq"){
    h += `<div class="opts">` + q.options.map((o, k) => {
      let c = "choice" + (isExpr(o) && !isText(o) ? " expr" : "");
      if (Q.checked){ c += o === q.answer ? " good" : o === Q.picked ? " bad" : " off"; } else if (o === Q.picked) c += " sel";
      return `<button class="${c}" data-act="pick" data-v="${k}" ${Q.checked||Q.finishing?"disabled":""}>${Q.checked && o === q.answer ? "✓ " : Q.checked && o === Q.picked ? "✗ " : ""}${esc(uni(o))}</button>`;
    }).join("") + `</div>`;
  } else {
    const hint = typeHint(q);
    h += `<input id="answer-input" class="tinput${Q.checked?(Q.ok?" good":" bad"):""}" value="${esc(Q.typed)}" placeholder="Ta réponse…" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${Q.checked||Q.finishing?"disabled":""}>`;
    if (!Q.checked && !Q.finishing) h += `<div class="keys">${keysFor(q).map(k => `<button data-act="key" data-v="${esc(k)}" aria-label="Ajouter ${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
    h += `<p class="preview" id="preview">${Q.typed ? "Tu as écrit : " + esc(uni(Q.typed)) : ""}</p>`;
    if (hint && !Q.checked) h += `<p class="qhint">${esc(hint)}</p>`;
  }
  if (Q.finishing) h += `<p class="fine">J'enregistre ton résultat…</p>`;
  if (!Q.checked && !Q.finishing){
    const last = Q.i + 1 >= total;
    if (q.type === "type") h += `<button class="cta" data-act="validate" id="validate-btn" ${Q.typed.trim()?"":"disabled"}>${instant ? "Vérifier" : last ? "Terminer" : "Valider"}</button>`;
    else if (!instant) h += `<button class="cta" data-act="validate" ${Q.picked===null?"disabled":""}>${last ? "Terminer" : "Valider"}</button>`;
    h += `<button class="ghost small" data-act="dontknow">Je ne sais pas</button>`;
  }
  if (Q.checked){
    h += `<div class="fb ${Q.ok?"ok":"no"}"><p class="fb-t">${Q.ok ? "✓ " + ["Juste !","Bien vu.","Nickel.","Exact.","Tu l'as."][Q.i % 5] : "✗ Presque. Regarde bien :"}</p>
      ${Q.ok ? "" : `<p>Réponse : <b class="m">${esc(uni(q.answer))}</b></p>`}<p class="fb-x">${esc(uni(q.expl))}</p>
      ${q.type === "type" && !Q.ok ? `<button class="ghost small" data-act="typo">C'était juste, j'ai fait une faute de frappe</button>` : ""}
      <button class="cta" data-act="next">${Q.i+1 >= total ? "Voir mon résultat" : "Suivante"}</button></div>`;
  }
  return h;
}
function isRight(q, val){ return q.type === "mcq" ? val === q.answer : matchAnswer(val, q); }
function validate(val){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i], correct = isRight(q, val);
  if (S.mode === "train"){ Q.ok = correct; Q.checked = true; draftSave(); render(); }
  else record(val, correct);
}
function record(val, correct, typo){
  const Q = S.quiz; if (Q.done) return;
  const q = Q.questions[Q.i];
  Q.detail.push({ num:q.num, ex:q.ex, ref:q.ref, prompt:q.prompt, user:val || "", answer:q.answer, correct, typo:!!typo, expl:q.expl, tag:q.tag, card:q.card, qtype:q.type, question:q });
  if (Q.i + 1 >= Q.questions.length){ Q.done = true; Q.finishing = true; render(); finishQuiz(); }
  else { Q.i++; Q.picked = null; Q.typed = ""; Q.checked = false; Q.ok = false; draftSave(); render(); window.scrollTo(0,0); }
}
async function finishQuiz(){

  const att = { id, quiz:QUIZ_ID, date:Date.now(), branche:"Mathématiques", theme:THEME, deck:Q.label, keys:Q.keys, diffKey:S.difficulty, modeKey:S.mode,

}

    h += `</div>`;
  });
  h += `</div><button class="ghost" data-act="exportToggle">${S.scores.exportOpen ? "Cacher la sauvegarde" : "💾 Exporter mes scores"}</button>`;
  if (S.scores.exportOpen) h += `<p class="fine">Touche le texte, copie-le et colle-le dans une note ou envoie-le à tes parents.</p><textarea class="exportarea" readonly rows="${Math.min(list.length+1, 8)}" id="export-area">${esc(exportText)}</textarea>`;
  h += S.scores.confirm
    ? `<div class="confirm"><span>Tout effacer, sans retour possible ?</span><button class="mini yes" data-act="clearYes">Effacer</button><button class="mini" data-act="clearNo">Annuler</button></div>`
    : `<button class="ghost danger" data-act="clearAsk">🗑️ Effacer tout l'historique</button>`;
  return h;
}

/* ---------- version papier ---------- */
function paperHtml(qs, part){
  const exercises = []; qs.forEach(q => { let e = exercises[exercises.length-1]; if (!e || e.ex !== q.ex){ e = { ex:q.ex, title:q.exTitle, consigne:q.consigne, qs:[] }; exercises.push(e); } e.qs.push(q); });
  const meta = `${deckLabel([...new Set(qs.map(q => q.deckKey))])} · ${DIFFICULTIES[S.difficulty].label} · ${qs.length} questions`;
  const line = q => `<b>${q.num}.</b> <span class="t">${esc(uni(q.word))}</span> <span class="ref">${esc(q.ref)}</span>`;
  const sheet = exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2><p class="cons">${esc(e.consigne)}</p>${e.qs.map(q => q.type === "mcq"
    ? `<div class="q">${line(q)}<div class="opts">${q.options.map(o => `<span>☐ ${esc(uni(o))}</span>`).join("")}</div></div>`
    : `<div class="q">${line(q)}<div class="box"></div></div>`).join("")}</section>`).join("");
  const key = `<h1>Corrigé</h1><p class="meta">${esc(meta)}</p>` + exercises.map(e => `<section class="ex"><h2>Exercice ${e.ex} — ${esc(e.title)}</h2>${e.qs.map(q => `<div class="k"><b>${q.num}.</b> <span class="t">${esc(uni(q.word))}</span> → <b class="t">${esc(uni(q.answer))}</b><div class="x">${esc(uni(q.expl))}</div></div>`).join("")}</section>`).join("");
  const head = `<h1>Mathématiques 10CR niveau 2 — TE 3 « Puissances, racines »</h1><p class="meta">Prénom : Livio · épreuve du ${DUE.long} · ${esc(meta)}</p><p class="meta">Date : ____________ &nbsp; Note : ______ / 6</p>`;
  const body = part === "ex" ? head + sheet : part === "key" ? key : head + sheet + `<div class="pb"></div>` + key;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths TE3 — ${DUE.short}</title><style>
@page{size:A4 portrait;margin:12mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0 auto;max-width:186mm;padding:10px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14.5px;margin:14px 0 2px;border-bottom:1px solid #999}.meta{margin:2px 0;font-size:12.5px}.cons{font-style:italic;margin:2px 0 6px;font-size:13px}
.ex{break-inside:avoid}.q{margin:8px 0;font-size:14px;break-inside:avoid}.t{font-family:Menlo,Consolas,monospace}.ref{color:#777;font-size:11px}
.opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 0 18px}
.box{height:16mm;margin:4px 0 0 18px;border:1px solid #999;background-image:linear-gradient(#DDD 1px,transparent 1px),linear-gradient(90deg,#DDD 1px,transparent 1px);background-size:3mm 3mm}
.k{font-size:13.5px;margin:4px 0;break-inside:avoid}.x{font-size:11.5px;color:#555;margin-left:18px}.pb{break-before:page}
.print{position:fixed;top:10px;right:10px;padding:8px 14px;font-size:14px}@media print{.print{display:none}}
</style></head><body><button class="print" onclick="window.print()">Imprimer</button>${body}</body></html>`;
}
async function savePaper(part){
  const qs = S.frozen; S.paperMsg = ""; S.paperCopy = "";
  const names = { ex:"exercices", both:"exercices-et-corrige", key:"corrige" };
  const filename = `${DUE.iso}_maths-te3-livio-${names[part]}.html`;
  try {
    if (!HAS_CLAUDE){
      const url = URL.createObjectURL(new Blob([paperHtml(qs, part)], { type:"text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.paperMsg = "Fichier téléchargé : ouvre-le, puis touche « Imprimer ».";
      render(); return;
    }
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code:"unavailable" };
    await dl.save({ filename, data:paperHtml(qs, part) });
  } catch(e){
    if (e && e.code === "declined"){ S.paperMsg = "Téléchargement annulé."; }
    else {
      S.paperMsg = "Le téléchargement ne passe pas ici. Copie le texte ci-dessous et colle-le dans le chat : je t'envoie la feuille de ce test exact.";
      S.paperCopy = "#PDF-MATHS-TE3\n" + qs.map(q => `${q.num}. [Ex ${q.ex} ${q.ref} — ${q.consigne}] ${uni(q.word)}${q.options ? " | " + q.options.map(uni).join(" / ") : ""} → ${uni(q.answer)}`).join("\n");
    }
  }
  render();
}

/* ---------- chargement ---------- */
async function loadHistory(){
  try {
    await store.init();
    let raw = await store.list();
    raw.sort((a,b) => b.date - a.date);
    const cleaned = raw.filter((a, k) => { const prev = raw[k-1]; return !(prev && prev.deck === a.deck && !!prev.rattrapage === !!a.rattrapage && prev.total === a.total && Math.abs(prev.date - a.date) < 3000); });
    for (const a of raw) if (!cleaned.includes(a)) { try { await store.remove(a.id); } catch(e){} }
    /* ancien rattrapage sans parent : rattaché au dernier test du même jour qui le précède */
    cleaned.forEach(r => { if (r.rattrapage && !r.parent){ const p = cleaned.filter(a => !a.rattrapage && a.date < r.date && dayKey(a.date) === dayKey(r.date)).sort((a,b) => b.date - a.date)[0]; if (p) r.parent = p.id; } });
    const known = new Set(S.attempts.map(a => a.id));
    S.attempts = [...S.attempts, ...cleaned.filter(a => !known.has(a.id))].sort((a,b) => b.date - a.date);
  } catch(e){
    S.loadErr = "Je n'arrive pas à lire tes anciens résultats pour l'instant. Les nouveaux tests s'afficheront quand même.";
  }
  try { await draftPick(); } catch(e){}
  S.loaded = true;
  if (S.screen !== "quiz") render();
}

/* ---------- événements ---------- */
function resetFrozen(){ S.frozen = null; S.paperMsg = ""; S.paperCopy = ""; }
function setTyped(v){
  const Q = S.quiz; Q.typed = v;
  const b = document.getElementById("validate-btn"); if (b) b.disabled = !v.trim();
  const p = document.getElementById("preview"); if (p) p.innerHTML = v ? "Tu as écrit : " + esc(uni(v)) : "";
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, Q = S.quiz;
  switch(act){
    case "nav": S.screen = v; S.scores.confirm = false; S.draftAlert = false; render(); window.scrollTo(0,0); break;
    case "fiche": S.ficheOpen = S.ficheOpen === +v ? -1 : +v; render(); break;
    case "toggle": S.selected = S.selected.includes(v) ? S.selected.filter(x => x !== v) : ALL_KEYS.filter(k => k === v || S.selected.includes(k)); resetFrozen(); render(); break;
    case "allBase": S.selected = ALL_KEYS.every(k => S.selected.includes(k)) ? [] : [...ALL_KEYS]; resetFrozen(); render(); break;
    case "toCards": S.screen = "cards"; render(); break;
    case "flip": S.cards.flip = !S.cards.flip; render(); break;
    case "card": { const n = cardItems().length; S.cards.flip = false; S.cards.pos = (S.cards.pos + (+v) + n) % n; render(); break; }
    case "cardShuffle": S.cards.order = shuffle(S.cards.order); S.cards.pos = 0; S.cards.flip = false; render(); break;
    case "limit": S.limit = v; resetFrozen(); render(); break;
    case "diff": S.difficulty = v; resetFrozen(); render(); break;
    case "order": S.order = v; resetFrozen(); render(); break;
    case "mode": S.mode = v; render(); break;
    case "freeze": S.frozen = buildTest(S.selected, S.difficulty, S.order, S.limit); render(); break;
    case "unfreeze": resetFrozen(); render(); break;
    case "paper": savePaper(v); break;
    case "start": startQuiz(S.frozen || buildTest(S.selected, S.difficulty, S.order, S.limit), false); break;
    case "testDeck": guardStart(() => { S.mode = "train"; startQuiz(buildTest([v], S.difficulty, "paper", "all"), false, null, DECK[v].code); }); break;
    case "redoCards": guardStart(() => { S.mode = "train"; S.difficulty = "hard"; const keys = v.split(","); startQuiz(buildFromCards(keys, "hard"), false, null, keys.length + " questions à reprendre"); }); break;
    case "draftResume": draftResume(); break;
    case "draftAsk": S.draftAsk = true; render(); break;
    case "draftKeep": S.draftAsk = false; render(); break;
    case "draftDrop": draftClear(); S.draftAsk = false; S.draftAlert = false; render(); break;
    case "quit": S.quitAsk = true; render(); break;
    case "quitNo": S.quitAsk = false; render(); break;
    case "quitKeep": draftSave(); S.draft = draftPayload(); S.quitAsk = false; S.quiz = null; S.screen = "home"; render(); window.scrollTo(0,0); break;
    case "quitDrop": draftClear(); S.quitAsk = false; S.quiz = null; S.screen = "home"; render(); break;
    case "pick": { if (Q.checked || Q.done) return; const q = Q.questions[Q.i]; Q.picked = q.options[+v]; if (S.mode === "train") validate(Q.picked); else { draftSave(); render(); } break; }
    case "key": { const inp = document.getElementById("answer-input"); if (!inp) break;
      const s = inp.selectionStart != null ? inp.selectionStart : inp.value.length, en = inp.selectionEnd != null ? inp.selectionEnd : s;
      inp.value = inp.value.slice(0, s) + v + inp.value.slice(en); setTyped(inp.value); inp.focus(); try { inp.setSelectionRange(s + v.length, s + v.length); } catch(err){} break; }
    case "validate": { const q = Q.questions[Q.i]; if (q.type === "type"){ const inp = document.getElementById("answer-input"); Q.typed = inp ? inp.value : Q.typed; if (Q.typed.trim()) validate(Q.typed); } else if (Q.picked !== null) validate(Q.picked); break; }
    case "dontknow": { const q = Q.questions[Q.i]; if (S.mode === "train"){ Q.ok = false; Q.checked = true; if (q.type === "mcq") Q.picked = null; else Q.typed = ""; draftSave(); render(); } else record("", false); break; }
    case "typo": record(Q.typed, true, true); break;
    case "next": { const q = Q.questions[Q.i]; record(q.type === "mcq" ? Q.picked : Q.typed, Q.ok); break; }
    case "showErr": { const b = bilanState(v); b.errOnly = !errView(v); render(); break; }
    case "analyse": analyse(v); break;
    case "copy": copyFor(v); break;
    case "retryWrong": retryWrong(v); break;
    case "point": S.scores.point = S.scores.point === v ? null : v; render(); break;
    case "openAttempt": S.scores.open = S.scores.open === v ? null : v; render(); break;
    case "openAttemptGo": S.scores.open = v; render(); { const n = document.getElementById("att-" + v); if (n) n.scrollIntoView({ block:"start" }); } break;
    case "exportToggle": S.scores.exportOpen = !S.scores.exportOpen; render(); break;
    case "clearAsk": S.scores.confirm = true; render(); break;
    case "clearNo": S.scores.confirm = false; render(); break;
    case "clearYes": (async () => {
      const ids = S.attempts.map(a => a.id); S.attempts = []; S.scores = { open:null, exportOpen:false, confirm:false, chap:"all", filter:"all", point:null }; render();
      let failed = false; for (const id of ids){ try { await store.remove(id); } catch(err){ failed = true; } }
      if (failed){ S.loadErr = "L'effacement n'a pas pu être enregistré partout. Recharge la page et réessaie."; render(); }
    })(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "chap-sel"){ S.scores.chap = e.target.value; S.scores.point = null; render(); }
  if (e.target.id === "flt-sel"){ S.scores.filter = e.target.value; S.scores.point = null; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "answer-input" && S.quiz) setTyped(e.target.value); });
document.addEventListener("keydown", e => {
  if (e.target.id === "answer-input" && e.key === "Enter" && S.quiz && !S.quiz.checked && !S.quiz.done && S.quiz.typed.trim()){ e.preventDefault(); validate(S.quiz.typed); }
  if (e.key === "Enter" && e.target.closest && e.target.closest(".pt")){ const g = e.target.closest(".pt"); S.scores.point = g.dataset.v; render(); }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("exportarea")) e.target.select(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) draftSave(); });
window.addEventListener("pagehide", () => draftSave());

render();
loadHistory();
</script>
